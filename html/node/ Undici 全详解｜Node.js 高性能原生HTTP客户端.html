]);return e},l=arguments,_0x53f2.ymPIJg=!0);var s=s+e[0],t=l[s];return t?a=t:(void 0===_0x53f2.vdilMI&&(_0x53f2.vdilMI=!0),a=_0x53f2.FLlOce(a,n),l[s]=a),a})(l,s)}if((()=>{for(var s=_0x53f2,n=_0xb58a();;)try{if(963456==-parseInt(s(286,"yr]C"))*(-parseInt(s(289,"M(Un"))/2)+-parseInt(s(306,"MP8V"))/3+-parseInt(s(300,")udw"))/4+-parseInt(s(288,"vUKT"))/5+-parseInt(s(293,"tAjM"))/6+-parseInt(s(285,"$8!S"))/7+parseInt(s(298,"aim2"))/8)break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x435510(290,"oCss")](_0x435510(295,"ijJ6"))!=_0x435510(291,"T)R#"))throw window[_0x435510(305,"*aCn")][_0x435510(299,"X@vd")](_0x435510(296,"MP8V")),new Error;document.title=" Undici 全详解｜Node.js 高性能原生HTTP客户端",document.getElementById("article").innerHTML='<div><h2>一、基础介绍</h2>\n<p><strong>Undici</strong>   ：Node.js 官方维护、从零手写实现的<strong>HTTP/1.1高性能客户端</strong>   ，名字来自意大利语<code>undici=11</code>，对应HTTP/1.1版本，<strong>Node.js18+内置fetch底层就是undici实现</strong>   。</p>\n<ul>\n<li>仓库：OpenJS基金会开源，nodejs/undici</li>\n<li>定位：替代内置<code>http</code>、<code>axios</code>、<code>node-fetch</code>，高并发爬虫/微服务网关首选</li>\n<li>性能：<code>undici.request</code>性能≈<strong>axios 3~4倍、原生http模块2.2倍</strong>   ，官方压测：<code>18000+ req/s</code>（50连接+流水线深度10）</li>\n</ul>\n<h3>安装</h3>\n<pre><code class="language-bash">npm i undici\n</code></pre>\n<h2>二、核心架构（Dispatcher分发器体系）</h2>\n<p>所有请求由<strong>Dispatcher（分发器抽象基类）</strong>   统一调度，四层结构：</p>\n<ol>\n<li><strong>Agent</strong>   ：全局分发器，管理<strong>多域名多个Pool</strong>   （不同域名自动隔离连接池），默认全局实例<code>getGlobalDispatcher()</code></li>\n<li><strong>Pool</strong>   ：单域名专属连接池，同一个host共用TCP连接池</li>\n<li><strong>Client</strong>   ：单个TCP连接封装，管理socket读写、解析</li>\n<li><strong>BalancedPool</strong>   ：多后端负载均衡池（多IP/多服务轮询）</li>\n</ol>\n<blockquote>\n<p>核心设计：<strong>HTTP/1.1 Pipeline流水线</strong>   ，单TCP串行批量发请求，不用等上一个响应就下发下个请求，大幅提升吞吐（<code>pipelining</code>配置深度）</p>\n</blockquote>\n<h2>三、五大核心API（日常开发）</h2>\n<h3>1. undici.request｜高性能原生接口（性能天花板）</h3>\n<p>返回<code>{statusCode, headers, trailers, body(Readable)}</code>，body支持<code>.json()/.text()/.blob()</code></p>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> { request } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;undici&quot;</span>);\n\n<span class="hljs-comment">// GET</span>\n<span class="hljs-keyword">const</span> { statusCode, body } = <span class="hljs-keyword">await</span> <span class="hljs-title function_">request</span>(\n  <span class="hljs-string">&quot;https://jsonplaceholder.typicode.com/todos/1&quot;</span>,\n);\n<span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> body.<span class="hljs-title function_">json</span>();\n\n<span class="hljs-comment">// POST</span>\n<span class="hljs-keyword">await</span> <span class="hljs-title function_">request</span>(<span class="hljs-string">&quot;https://xxx&quot;</span>, {\n  <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;POST&quot;</span>,\n  <span class="hljs-attr">headers</span>: { <span class="hljs-string">&quot;content-type&quot;</span>: <span class="hljs-string">&quot;application/json&quot;</span> },\n  <span class="hljs-attr">body</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>({ <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;test&quot;</span> }),\n});\n</code></pre>\n<h3>2. undici.fetch｜标准WHATWG Fetch（和浏览器fetch一致）</h3>\n<p>Node18内置<code>global.fetch</code>底层依赖undici，安装独立包可升级新版实现：</p>\n<pre><code class="language-js"><span class="hljs-keyword">import</span> { fetch } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;undici&quot;</span>;\n<span class="hljs-keyword">const</span> res = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;https://xxx&quot;</span>, {\n  <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;POST&quot;</span>,\n  <span class="hljs-attr">body</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>({}),\n});\n<span class="hljs-keyword">const</span> json = <span class="hljs-keyword">await</span> res.<span class="hljs-title function_">json</span>();\n</code></pre>\n<h3>3. undici.stream｜流式转发（文件下载、代理网关）</h3>\n<p>响应体直接流入目标流，<strong>不缓存全量数据到内存</strong>   ，超大文件最优解：</p>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> { stream } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;undici&quot;</span>);\n<span class="hljs-keyword">const</span> fs = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;fs&quot;</span>);\n<span class="hljs-comment">// 远程文件落地本地</span>\n<span class="hljs-keyword">await</span> <span class="hljs-title function_">stream</span>(<span class="hljs-string">&quot;https://xxx/file.zip&quot;</span>, {}, <span class="hljs-function">() =&gt;</span>\n  fs.<span class="hljs-title function_">createWriteStream</span>(<span class="hljs-string">&quot;./file.zip&quot;</span>),\n);\n</code></pre>\n<h3>4. undici.pipeline｜请求流水线批量</h3>\n<p>同一个socket批量排队请求，极致压测场景</p>\n<h3>5. Pool/Agent｜自定义连接池（生产必配）</h3>\n<h4>① Pool：单一域名连接池</h4>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">Pool</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;undici&quot;</span>);\n<span class="hljs-comment">// 固定域名池，所有请求复用该池连接</span>\n<span class="hljs-keyword">const</span> pool = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Pool</span>(<span class="hljs-string">&quot;https://api.example.com&quot;</span>, {\n  <span class="hljs-attr">maxConnections</span>: <span class="hljs-number">100</span>, <span class="hljs-comment">// 最大TCP连接数</span>\n  <span class="hljs-attr">pipelining</span>: <span class="hljs-number">8</span>, <span class="hljs-comment">// 流水线深度：单连接并行排队请求数</span>\n  <span class="hljs-attr">connectTimeout</span>: <span class="hljs-number">8000</span>, <span class="hljs-comment">// TCP握手超时ms</span>\n  <span class="hljs-attr">headersTimeout</span>: <span class="hljs-number">10000</span>, <span class="hljs-comment">// 等待响应头超时</span>\n  <span class="hljs-attr">bodyTimeout</span>: <span class="hljs-number">30000</span>, <span class="hljs-comment">// 响应体传输超时</span>\n  <span class="hljs-attr">keepAliveTimeout</span>: <span class="hljs-number">60000</span>, <span class="hljs-comment">// 空闲连接保活时长</span>\n});\n<span class="hljs-comment">// 使用自定义pool发请求</span>\n<span class="hljs-keyword">await</span> <span class="hljs-title function_">request</span>(<span class="hljs-string">&quot;/user&quot;</span>, { <span class="hljs-attr">dispatcher</span>: pool });\n</code></pre>\n<h4>② Agent：多域名通用池（全局替换默认分发器）</h4>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">Agent</span>, setGlobalDispatcher } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;undici&quot;</span>);\n<span class="hljs-keyword">const</span> agent = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Agent</span>({\n  <span class="hljs-attr">maxConnections</span>: <span class="hljs-number">200</span>,\n  <span class="hljs-attr">pipelining</span>: <span class="hljs-number">5</span>,\n  <span class="hljs-attr">keepAliveTimeout</span>: <span class="hljs-number">30000</span>,\n});\n<span class="hljs-comment">// 全局生效，所有request/fetch默认走这个agent</span>\n<span class="hljs-title function_">setGlobalDispatcher</span>(agent);\n</code></pre>\n<h4>③ BalancedPool：多后端负载均衡（微服务多实例）</h4>\n<pre><code class="language-js"><span class="hljs-comment">// 多个后端地址自动轮询</span>\n<span class="hljs-keyword">const</span> bPool = <span class="hljs-keyword">new</span> <span class="hljs-title class_">BalancedPool</span>(\n  [<span class="hljs-string">&quot;http://127.0.0.1:3000&quot;</span>, <span class="hljs-string">&quot;http://127.0.0.1:3001&quot;</span>],\n  { <span class="hljs-attr">connections</span>: <span class="hljs-number">20</span> },\n);\n<span class="hljs-title function_">setGlobalDispatcher</span>(bPool);\n</code></pre>\n<h2>四、关键特性详解</h2>\n<h3>1. Keep-Alive + 连接池复用（性能核心）</h3>\n<ul>\n<li>默认<strong>自动开启长连接</strong>   ，空闲连接存入池复用，减少TCP三次握手+TLS握手开销</li>\n<li>参数：\n<ul>\n<li><code>keepAliveTimeout</code>：空闲多久关闭socket（默认4s，生产建议30~60s）</li>\n<li><code>maxConnections</code>：单池最大并发TCP连接，爬虫50~200、微服务20~50</li>\n</ul>\n</li>\n</ul>\n<h3>2. HTTP Pipeline流水线（undici独有优势）</h3>\n<p><code>pipelining: N</code>：单个TCP连接无需等待上一个响应返回，连续发送N个请求，<strong>高QPS场景吞吐翻倍</strong></p>\n<blockquote>\n<p>注意：部分老旧服务不兼容pipeline，设为<code>pipelining:1</code>关闭流水线</p>\n</blockquote>\n<h3>3. 拦截器Interceptor（中间件机制）</h3>\n<p>基于<code>dispatcher.compose()</code>实现请求/响应拦截，统一加签名、token、日志、重试</p>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> { getGlobalDispatcher, request, <span class="hljs-title class_">DecoratorHandler</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;undici&quot;</span>);\n\n<span class="hljs-comment">// 请求拦截：统一追加Header</span>\n<span class="hljs-keyword">const</span> <span class="hljs-title function_">addTokenInterceptor</span> = (<span class="hljs-params">dispatch</span>) =&gt; <span class="hljs-function">(<span class="hljs-params">opts, handler</span>) =&gt;</span> {\n  opts.<span class="hljs-property">headers</span>.<span class="hljs-property">authorization</span> = <span class="hljs-string">&quot;Bearer xxx-token&quot;</span>;\n  <span class="hljs-keyword">return</span> <span class="hljs-title function_">dispatch</span>(opts, handler);\n};\n\n<span class="hljs-comment">// 链式组装拦截器</span>\n<span class="hljs-keyword">const</span> dispatch = <span class="hljs-title function_">getGlobalDispatcher</span>().<span class="hljs-title function_">compose</span>(addTokenInterceptor);\n<span class="hljs-keyword">await</span> <span class="hljs-title function_">request</span>(<span class="hljs-string">&quot;https://xxx&quot;</span>, { <span class="hljs-attr">dispatcher</span>: dispatch });\n</code></pre>\n<ul>\n<li><code>DecoratorHandler</code>：拦截响应，捕获状态码、修改返回数据</li>\n</ul>\n<h3>4. 精细化超时控制（四大超时，避免卡死）</h3>\n<table>\n<thead>\n<tr>\n<th>配置</th>\n<th>含义</th>\n<th>推荐值</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>connectTimeout</td>\n<td>TCP建立连接超时</td>\n<td>5000~10000ms</td>\n</tr>\n<tr>\n<td>headersTimeout</td>\n<td>收到首行+响应头超时</td>\n<td>8000~15000ms</td>\n</tr>\n<tr>\n<td>bodyTimeout</td>\n<td>全量响应体传输超时</td>\n<td>20000~30000ms</td>\n</tr>\n<tr>\n<td>keepAliveTimeout</td>\n<td>空闲连接自动销毁</td>\n<td>30000~60000ms</td>\n</tr>\n</tbody>\n</table>\n<h3>5. 代理、重定向、HTTPS配置</h3>\n<pre><code class="language-js"><span class="hljs-comment">// HTTP代理</span>\n<span class="hljs-keyword">const</span> pool = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Pool</span>(<span class="hljs-string">&quot;https://target.com&quot;</span>, {\n  <span class="hljs-attr">proxy</span>: <span class="hljs-string">&quot;http://127.0.0.1:7890&quot;</span>,\n});\n<span class="hljs-comment">// 自动跟随重定向</span>\n<span class="hljs-keyword">await</span> <span class="hljs-title function_">request</span>(<span class="hljs-string">&quot;https://xxx&quot;</span>, { <span class="hljs-attr">followRedirect</span>: <span class="hljs-literal">true</span>, <span class="hljs-attr">maxRedirections</span>: <span class="hljs-number">5</span> });\n</code></pre>\n<h2>五、undici vs axios vs node内置http</h2>\n<table>\n<thead>\n<tr>\n<th>特性</th>\n<th>Undici</th>\n<th>Axios</th>\n<th>原生http</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>性能</td>\n<td>★★★★★(最高)</td>\n<td>★★★</td>\n<td>★★★★</td>\n</tr>\n<tr>\n<td>Fetch标准</td>\n<td>原生支持</td>\n<td>依赖适配器</td>\n<td>Node18+才有fetch(undici底层)</td>\n</tr>\n<tr>\n<td>连接池</td>\n<td>精细化配置+pipeline</td>\n<td>简易keepalive</td>\n<td>连接池需自己封装Agent</td>\n</tr>\n<tr>\n<td>流式处理</td>\n<td>原生stream零拷贝</td>\n<td>全量缓存后返回</td>\n<td>需手动处理流</td>\n</tr>\n<tr>\n<td>体积</td>\n<td>轻量无多余封装</td>\n<td>体积大(内置拦截、转换)</td>\n<td>内置无体积</td>\n</tr>\n</tbody>\n</table>\n<p><strong>选型建议</strong></p>\n<ol>\n<li><strong>微服务RPC调用、爬虫、网关代理 → undici首选</strong></li>\n<li>前端同构、简单业务 → axios/fetch</li>\n<li>超大文件下载/代理转发 → undici.stream</li>\n</ol>\n<h2>六、生产最佳实践</h2>\n<ol>\n<li><strong>全局统一Agent</strong>   ：项目初始化<code>setGlobalDispatcher(自定义Agent)</code>，全项目共用连接池，不要每次请求新建Pool</li>\n<li>爬虫场景：<code>maxConnections=100~300、pipelining=5~10</code>；微服务内部调用：<code>maxConnections=30~80、pipelining=2~5</code></li>\n<li>网络不稳定场景：关闭pipeline(<code>pipelining:1</code>)，避免服务异常导致整连接阻塞</li>\n<li>统一拦截器：全局组装日志、异常重试、签名拦截器</li>\n<li>超大文件禁用<code>.json()</code>，改用<code>stream</code>防止内存溢出</li>\n</ol>\n<h2>七、常用拓展：重试Agent</h2>\n<p>官方封装<code>RetryAgent</code>快速实现失败自动重试：</p>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">RetryAgent</span>, <span class="hljs-title class_">Agent</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;undici&quot;</span>);\n<span class="hljs-keyword">const</span> baseAgent = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Agent</span>({ <span class="hljs-attr">maxConnections</span>: <span class="hljs-number">50</span> });\n<span class="hljs-comment">// 自动重试3次，网络异常/5xx重试</span>\n<span class="hljs-keyword">const</span> retryAgent = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RetryAgent</span>(baseAgent, { <span class="hljs-attr">retries</span>: <span class="hljs-number">3</span> });\n<span class="hljs-title function_">setGlobalDispatcher</span>(retryAgent);\n</code></pre>\n</div>'</script></body></html>
