w window[_0x1c751f(385,"K^nq")][_0x1c751f(380,"A*0r")](_0x1c751f(399,"^nm]")),new Error;function _0x2f3c(){var s=["ig8bfaRdMxFcIG","igL2B3lcK2RcTs9YdCoG","W64fFCorqmk9kmkcWRuFWPhdQq","WQ7cNColW6zPiqy","BaeNAWpdSCotzf4","W57dVH4wWOJcMW8UfLnbea","W4RcLb7cJmoGr8o9ACkWeW","W4hcRr3cHKtdICkiCWukWQLm","WOdcOZ0lWP4","W7T+W740WOe5wmkdWOq6ySoQrW","WQBdRSkMW75IpXxdGSkbWQlcGSkg","WQBdKCk5x1hdMZpdR18","W5VdVX0vWOxcKYORduTzgq","hqRcHY9sW6tdRLhcTSkmW74ZW4/cUZpdG8keF8kkWOTwW7FdJfm3wq","W5FdV8kdWRxdRxTB","W5NdTMnRW7pdMtme","WR3dPxvOqehcL2BcQCoV","W5lcQmocW6pcScmBWRddPSk6W6zXsW","jLKhWOvmW6/cI8oOcCogjSkOrq","WQRdVh/cHI/cRCkYaceCWQldPW","fYr6W5H3zCkHlq","W7RdVCoBWP4agI8","bCoMrCoPW6BcICks","W4hcNexdMSoKqSoPua","W4qKC8oID8kCWQyEWPBdSCo4WPzG","WRBcKhFcQ8oJWPlcPSoQW4eHzwi","W57dTX9KW7JdRaahdG","WOBcQu9hW4NdGHuh"];return(_0x2f3c=function(){return s})()}document.title="NestJS 自定义装饰器",document.getElementById("article").innerHTML='<div><p>在 NestJS 中，自定义装饰器是一个非常强大的特性。它允许你封装重复的逻辑，减少代码冗余，并以一种声明式的方式扩展框架的功能。NestJS 的装饰器底层高度依赖 RxJS 的 <code>mergeMap</code>，可以将多个装饰器串联起来使用。\n下面我将从<strong>创建方式、参数获取、元数据应用、组合装饰器以及最佳实践</strong>   几个方面对 NestJS 自定义装饰器进行详解。</p>\n<hr>\n<h3>一、 自定义装饰器的两大分类</h3>\n<p>在 NestJS 中，自定义装饰器主要分为两类：</p>\n<ol>\n<li><strong>参数装饰器</strong>   ：用于从 <code>Request</code> 对象中提取数据，替代 <code>@Req()</code> 的繁琐用法。</li>\n<li><strong>方法/类/属性装饰器</strong>   ：用于附加元数据，通常与拦截器、守卫、管道配合使用。</li>\n</ol>\n<hr>\n<h3>二、 参数装饰器</h3>\n<p>在实际开发中，我们经常需要获取当前请求的用户信息。如果每次都注入 <code>@Req()</code> 然后取 <code>req.user</code> 会很麻烦，且耦合度高。</p>\n<h4>1. 使用 <code>createParamDecorator</code> 创建</h4>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { createParamDecorator, <span class="hljs-title class_">ExecutionContext</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title class_">CurrentUser</span> = <span class="hljs-title function_">createParamDecorator</span>(\n  <span class="hljs-function">(<span class="hljs-params"><span class="hljs-attr">data</span>: <span class="hljs-built_in">unknown</span>, <span class="hljs-attr">ctx</span>: <span class="hljs-title class_">ExecutionContext</span></span>) =&gt;</span> {\n    <span class="hljs-keyword">const</span> request = ctx.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getRequest</span>();\n    <span class="hljs-keyword">return</span> request.<span class="hljs-property">user</span>; <span class="hljs-comment">// 假设有一个 AuthGuard 已经将 user 挂载到 request 上</span>\n  },\n);\n</code></pre>\n<h4>2. 在 Controller 中使用</h4>\n<pre><code class="language-typescript"><span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;profile&#x27;</span>)\n<span class="hljs-meta">@UseGuards</span>(<span class="hljs-title class_">JwtAuthGuard</span>)\n<span class="hljs-title function_">getProfile</span>(<span class="hljs-params"><span class="hljs-meta">@CurrentUser</span>() <span class="hljs-attr">user</span>: <span class="hljs-title class_">UserEntity</span></span>) {\n  <span class="hljs-keyword">return</span> user;\n}\n</code></pre>\n<h4>3. 传递参数给装饰器</h4>\n<p>有时候我们需要告诉装饰器只提取对象的某一部分。可以通过给装饰器传参来实现：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { createParamDecorator, <span class="hljs-title class_">ExecutionContext</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@nestjs/common&#x27;</span>;\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title class_">User</span> = <span class="hljs-title function_">createParamDecorator</span>(\n  <span class="hljs-function">(<span class="hljs-params"><span class="hljs-attr">data</span>: <span class="hljs-built_in">string</span> | <span class="hljs-literal">undefined</span>, <span class="hljs-attr">ctx</span>: <span class="hljs-title class_">ExecutionContext</span></span>) =&gt;</span> {\n    <span class="hljs-keyword">const</span> request = ctx.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getRequest</span>();\n    <span class="hljs-keyword">const</span> user = request.<span class="hljs-property">user</span>;\n\n    <span class="hljs-comment">// 如果传入了参数（如 @User(&#x27;id&#x27;)），则只返回该属性；否则返回整个 user</span>\n    <span class="hljs-keyword">return</span> data ? user?.[data] : user;\n  },\n);\n<span class="hljs-comment">// 使用方式：</span>\n<span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;id&#x27;</span>)\n <span class="hljs-title function_">getUserId</span>(<span class="hljs-params"><span class="hljs-meta">@User</span>(<span class="hljs-string">&#x27;id&#x27;</span>) <span class="hljs-attr">id</span>: <span class="hljs-built_in">number</span></span>) {\n   <span class="hljs-keyword">return</span> id;\n }\n</code></pre>\n<hr>\n<h3>三、 方法/类装饰器与元数据</h3>\n<p>如果你想要创建类似 <code>@Get()</code>、<code>@UseGuards()</code> 这样的装饰器，你需要使用 TypeScript 的 <code>reflect-metadata</code> 模块来附加和读取元数据。</p>\n<h4>场景：自定义角色校验装饰器 <code>@Roles()</code></h4>\n<p><strong>1. 定义元数据的 Key（常量）</strong></p>\n<pre><code class="language-typescript"><span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-variable constant_">ROLES_KEY</span> = <span class="hljs-string">&quot;roles&quot;</span>;\n</code></pre>\n<p><strong>2. 创建装饰器</strong><br>\n使用 <code>SetMetadata</code> 来存储元数据。</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">SetMetadata</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-variable constant_">ROLES_KEY</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./roles.constants&quot;</span>;\n<span class="hljs-comment">// roles.decorator.ts</span>\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">Roles</span> = (<span class="hljs-params">...<span class="hljs-attr">roles</span>: <span class="hljs-built_in">string</span>[]</span>) =&gt; <span class="hljs-title class_">SetMetadata</span>(<span class="hljs-variable constant_">ROLES_KEY</span>, roles);\n</code></pre>\n<p><strong>3. 在 Controller 中使用</strong></p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;admin-data&#x27;</span>)\n<span class="hljs-meta">@Roles</span>(<span class="hljs-string">&#x27;admin&#x27;</span>, <span class="hljs-string">&#x27;super-admin&#x27;</span>) <span class="hljs-comment">// 标记这个接口只能被 admin 或 super-admin 访问</span>\n<span class="hljs-meta">@UseGuards</span>(<span class="hljs-title class_">RolesGuard</span>)\n<span class="hljs-title function_">getAdminData</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">return</span> { <span class="hljs-attr">secret</span>: <span class="hljs-string">&#x27;data&#x27;</span> };\n}\n</code></pre>\n<p><strong>4. 在 Guard 中读取元数据</strong></p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Injectable</span>, <span class="hljs-title class_">CanActivate</span>, <span class="hljs-title class_">ExecutionContext</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Reflector</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/core&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-variable constant_">ROLES_KEY</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./roles.decorator&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RolesGuard</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">CanActivate</span> {\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">private</span> <span class="hljs-attr">reflector</span>: <span class="hljs-title class_">Reflector</span></span>) {}\n  <span class="hljs-title function_">canActivate</span>(<span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>): <span class="hljs-built_in">boolean</span> {\n    <span class="hljs-comment">// 通过 Reflector 读取被 @Roles 装饰器设置的元数据</span>\n    <span class="hljs-keyword">const</span> requiredRoles = <span class="hljs-variable language_">this</span>.<span class="hljs-property">reflector</span>.<span class="hljs-property">getAllAndOverride</span>&lt;<span class="hljs-built_in">string</span>[]&gt;(\n      <span class="hljs-variable constant_">ROLES_KEY</span>,\n      [\n        context.<span class="hljs-title function_">getHandler</span>(), <span class="hljs-comment">// 方法级别的元数据</span>\n        context.<span class="hljs-title function_">getClass</span>(), <span class="hljs-comment">// 类级别的元数据</span>\n      ],\n    );\n    <span class="hljs-keyword">if</span> (!requiredRoles) {\n      <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>; <span class="hljs-comment">// 没有设置角色要求，直接放行</span>\n    }\n    <span class="hljs-keyword">const</span> { user } = context.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getRequest</span>();\n\n    <span class="hljs-comment">// 判断用户的角色是否在允许的列表中</span>\n    <span class="hljs-keyword">return</span> requiredRoles.<span class="hljs-title function_">some</span>(<span class="hljs-function">(<span class="hljs-params">role</span>) =&gt;</span> user.<span class="hljs-property">roles</span>?.<span class="hljs-title function_">includes</span>(role));\n  }\n}\n</code></pre>\n<hr>\n<h3>四、 组合装饰器</h3>\n<p>NestJS 允许你将多个装饰器合并成一个，这在处理认证接口时非常有用。比如一个需要鉴权和角色控制的接口，每次都要写一堆 <code>@UseGuards</code> 和 <code>@Roles</code>。\n我们可以使用 <code>applyDecorators</code> 方法来组合它们。</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { applyDecorators, <span class="hljs-title class_">UseGuards</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Roles</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./roles.decorator&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">JwtAuthGuard</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./jwt-auth.guard&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">RolesGuard</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./roles.guard&quot;</span>;\n<span class="hljs-comment">// auth.decorator.ts</span>\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">Auth</span>(<span class="hljs-params">...<span class="hljs-attr">roles</span>: <span class="hljs-built_in">string</span>[]</span>) {\n  <span class="hljs-keyword">return</span> <span class="hljs-title function_">applyDecorators</span>(<span class="hljs-title class_">UseGuards</span>(<span class="hljs-title class_">JwtAuthGuard</span>, <span class="hljs-title class_">RolesGuard</span>), <span class="hljs-title class_">Roles</span>(...roles));\n}\n</code></pre>\n<p><strong>使用组合装饰器：</strong></p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;public&#x27;</span>)\n<span class="hljs-title function_">publicRoute</span>(<span class="hljs-params"></span>) { ... } <span class="hljs-comment">// 无需鉴权</span>\n<span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;profile&#x27;</span>)\n<span class="hljs-meta">@Auth</span>() <span class="hljs-comment">// 仅需登录</span>\n<span class="hljs-title function_">getProfile</span>(<span class="hljs-params"></span>) { ... }\n<span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;admin-panel&#x27;</span>)\n<span class="hljs-meta">@Auth</span>(<span class="hljs-string">&#x27;admin&#x27;</span>) <span class="hljs-comment">// 需要登录且是 admin</span>\n<span class="hljs-title function_">getAdminPanel</span>(<span class="hljs-params"></span>) { ... }\n</code></pre>\n<h2><em>代码瞬间变得非常清爽！</em></h2>\n<h3>五、 扩展：跨平台参数装饰器</h3>\n<p><code>ExecutionContext</code> 不仅仅用于 HTTP 请求，还支持 WebSocket 和 gRPC。如果你希望你的参数装饰器能在不同协议下工作，可以这样写：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { createParamDecorator, <span class="hljs-title class_">ExecutionContext</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title class_">CurrentClient</span> = <span class="hljs-title function_">createParamDecorator</span>(\n  <span class="hljs-function">(<span class="hljs-params"><span class="hljs-attr">data</span>: <span class="hljs-built_in">unknown</span>, <span class="hljs-attr">ctx</span>: <span class="hljs-title class_">ExecutionContext</span></span>) =&gt;</span> {\n    <span class="hljs-keyword">if</span> (ctx.<span class="hljs-title function_">getType</span>() === <span class="hljs-string">&quot;ws&quot;</span>) {\n      <span class="hljs-keyword">return</span> ctx.<span class="hljs-title function_">switchToWs</span>().<span class="hljs-title function_">getClient</span>();\n    } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (ctx.<span class="hljs-title function_">getType</span>() === <span class="hljs-string">&quot;rpc&quot;</span>) {\n      <span class="hljs-keyword">return</span> ctx.<span class="hljs-title function_">switchToRpc</span>().<span class="hljs-title function_">getData</span>();\n    } <span class="hljs-keyword">else</span> {\n      <span class="hljs-keyword">return</span> ctx.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getRequest</span>();\n    }\n  },\n);\n</code></pre>\n<hr>\n<h3>六、 最佳实践与注意事项</h3>\n<ol>\n<li><strong>不要在装饰器中执行耗时业务逻辑</strong>   ：\n自定义参数装饰器是在路由处理管道中同步执行的。不要在其中请求数据库或调用外部 API，这些逻辑应该放在 Guard、Interceptor 或 Provider 中。</li>\n<li><strong>解耦 Request 对象</strong>   ：\n尽量使用自定义参数装饰器（如 <code>@CurrentUser()</code>）代替直接注入 <code>@Req()</code>，这样你的 Controller 就不会强依赖底层的 Express 或 Fastify，未来切换底层框架时代码改动最小。</li>\n<li><strong>命名规范</strong>   ：\n<ul>\n<li>参数装饰器通常以 <code>@Current...</code> 或直接以名词命名，如 <code>@CurrentUser</code>, <code>@User</code>, <code>@Query</code>。</li>\n<li>方法/类装饰器以动作或属性命名，如 <code>@Roles</code>, <code>@Auth</code>, <code>@Public</code>。</li>\n</ul>\n</li>\n<li><strong>元数据 Key 管理</strong>   ：\n如果项目中大量使用 <code>SetMetadata</code>，建议将 Key 统一放在一个 <code>constants.ts</code> 文件中管理，避免拼写错误。</li>\n</ol>\n<h3>总结</h3>\n<p>NestJS 的自定义装饰器本质上是 <strong>TypeScript 装饰器语法</strong>   + <strong>Reflect-metadata</strong>   + <strong>NestJS 的执行上下文 (<code>ExecutionContext</code>)</strong>   的结合体。</p>\n</div>'</script></body></html>
