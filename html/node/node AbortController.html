<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="../../css/github-markdown.min.css"><link rel="stylesheet" href="../../css/github.min.css"><style>body,html{margin:0;padding:0}.markdown-body{box-sizing:border-box;min-width:200px;max-width:980px;margin:0 auto!important;padding:45px 15px}.markdown-body pre{border:1px solid #e5e5e5!important;margin-top:var(--base-size-16)!important}</style></head><body><article id="article" class="markdown-body"></article><script>function _0x4a40(l,s){var e=_0x2ed3();return(_0x4a40=function(s,n){var a=e[s-=400];void 0===_0x4a40.JlIdvk&&(_0x4a40.iMwMNP=function(s,n){var a,o=[],l=0,e="";for(s=(s=>{for(var n,a,o="",l="",e=0,t=0;a=s.charAt(t++);~a&&(n=e%4?64*n+a:a,e++%4)&&(o+=String.fromCharCode(255&n>>(-2*e&6))))a="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=".indexOf(a);for(var c=0,r=o.length;c<r;c++)l+="%"+("00"+o.charCodeAt(c).toString(16)).slice(-2);return decodeURIComponent(l)})(s),t=0;t<256;t++)o[t]=t;for(t=0;t<256;t++)l=(l+o[t]+n.charCodeAt(t%n.length))%256,a=o[t],o[t]=o[l],o[l]=a;for(var t=0,l=0,c=0;c<s.length;c++)a=o[t=(t+1)%256],o[t]=o[l=(l+o[t])%256],o[l]=a,e+=String.fromCharCode(s.charCodeAt(c)^o[(o[t]+o[l])%256]);return e},l=arguments,_0x4a40.JlIdvk=!0);var s=s+e[0],o=l[s];return o?a=o:(void 0===_0x4a40.mEzqWW&&(_0x4a40.mEzqWW=!0),a=_0x4a40.iMwMNP(a,n),l[s]=a),a})(l,s)}var _0x3933c6=_0x4a40;function _0x2ed3(){var s=["W6mkzSk6W5z1FY/dRdZdHG","D8k+iN7cMaxdLG","W617WQ7cLCkcW43cJa","rZ7cVmo9WRJcUSozk8oEc8oJzmky","m8oQh8kTpW","WPRcNMmKtSkNW4yovXXOW5BcTW","WOy9zdVcUmo3ha","WR1zASkwi8oPcq","W6NcVeH3omocW5TDWOrZFLW","W6e0q3CxWQHn","WQBcLNGWEJtcPSoB","WQOJW6hcPIHCW40","WOjvBHZcRSoNdCof","wXhcNmk1W6ddSmopW74Hhqa","WR3dPCkEvxH4W5lcU8kXWORdGLW","BJ9iWO/dLmombCkFxGJcOwa","WRtdPSkwuxH8WQRcOCk1WRhdLMyi","qxNdMSkJW7BdN8kG","BL3dGZhdJwfG","bSoHWP/cQ8oda8kkFSk7W6uAa8kU","eM7dLCo9i1f7WRO","WQGSASoAWRrHaG","WReYfCoUW7/dGL/cUZddOCk3dry","FsRdH8kXWO0MqwNcSq","W7NdO0RcVKiXWQ0","amobWR/cQmkGWQO5WOyOkmoH","WRnwW7VdRcaAWQJcVSoGW7r3","ESoxEG/dJNhdItD5W6JdRaO","C8ouCGVdJNxcSs19W5pdUdab","ht3dJhaBW5nPi8oYW6pdMSoOba5rW6hcVHldT0pcVqfXcmoEW44"];return(_0x2ed3=function(){return s})()}if((()=>{for(var s=_0x4a40,n=_0x2ed3();;)try{if(175596==-parseInt(s(427,"dR6n"))+parseInt(s(413,"*nxO"))/2*(-parseInt(s(417,"uErh"))/3)+parseInt(s(429,"T42V"))/4*(parseInt(s(408,"5Kld"))/5)+parseInt(s(402,"xQ4b"))/6*(parseInt(s(420,"8qCh"))/7)+-parseInt(s(426,"xnIy"))/8*(-parseInt(s(407,"k4F]"))/9)+-parseInt(s(400,"T42V"))/10+-parseInt(s(422,"a42r"))/11*(-parseInt(s(424,"IHZA"))/12))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x3933c6(423,"DFVs")](_0x3933c6(425,"M$dp"))!=_0x3933c6(406,"tIH!"))throw window[_0x3933c6(412,"unAB")][_0x3933c6(404,"oKMo")](_0x3933c6(401,"iR*Q")),new Error;document.title="node AbortController",document.getElementById("article").innerHTML='<div><p>在 Node.js（以及现代浏览器）中，<code>AbortController</code> 是处理异步流程控制的一次范式革命。\n在过去，Node.js 中的异步操作（如网络请求、文件读写）一旦发起，就像断线的风筝，你只能等待它完成或超时，<strong>无法从外部主动取消</strong>   。这导致了大量的资源浪费（如内存泄漏、无效的网络连接占用）。<code>AbortController</code> 的出现，就是为了解决“<strong>如何优雅地中止异步操作</strong>   ”这个问题。\n下面为你从底层原理、核心 API、实战场景到避坑指南进行全方位详解。</p>\n<hr>\n<h3>一、 核心概念与 API</h3>\n<p><code>AbortController</code> 的设计极其简单，包含两个核心部分：</p>\n<ol>\n<li><strong><code>AbortController</code> (控制器)</strong>   ：你可以把它想象成电视遥控器。\n<ul>\n<li><code>controller.signal</code>：遥控器发出的红外信号（一个 <code>AbortSignal</code> 对象）。</li>\n<li><code>controller.abort(reason?)</code>：按下遥控器上的“关闭”按钮，发出取消指令。<code>reason</code> 是可选的，可以传递取消的原因。</li>\n</ul>\n</li>\n<li><strong><code>AbortSignal</code> (信号对象)</strong>   ：你可以把它想象成电视上的接收器。\n<ul>\n<li>它是一个状态机，包含三个关键属性：</li>\n<li><code>signal.aborted</code>：布尔值，表示是否已经被取消（默认 <code>false</code>）。</li>\n<li><code>signal.reason</code>：取消的原因（如果没有传，默认是 <code>AbortError</code>）。</li>\n<li><code>signal.onabort</code>：监听取消事件的回调函数。\n<strong>工作流原理</strong>   ：\n你把 <code>signal</code> 传递给异步操作（如 <code>axios.get(url, { signal })</code>），异步操作内部会持续监听这个 <code>signal</code> 的状态。当你调用 <code>controller.abort()</code> 时，<code>signal.aborted</code> 变为 <code>true</code>，触发 <code>onabort</code> 事件，异步操作内部拦截到这个状态/事件后，立即停止正在执行的工作，并抛出一个名为 <code>AbortError</code> 的错误。</li>\n</ul>\n</li>\n</ol>\n<hr>\n<h3>二、 为什么它是革命性的？（对比旧方案）</h3>\n<p>在 <code>AbortController</code> 出现之前，我们是如何取消请求的？\n<strong>旧方案：CancelToken (Axios 早期版本)</strong></p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> <span class="hljs-title class_">CancelToken</span> = axios.<span class="hljs-property">CancelToken</span>;\n<span class="hljs-keyword">const</span> source = <span class="hljs-title class_">CancelToken</span>.<span class="hljs-title function_">source</span>();\naxios.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/user&quot;</span>, { <span class="hljs-attr">cancelToken</span>: source.<span class="hljs-property">token</span> });\n<span class="hljs-comment">// 取消</span>\nsource.<span class="hljs-title function_">cancel</span>(<span class="hljs-string">&quot;Operation canceled by the user.&quot;</span>);\n</code></pre>\n<p><strong>问题</strong>   ：<code>CancelToken</code> 是 Axios 自己实现的规范，只能用于 Axios。如果你同时用了 <code>fetch</code>、<code>node:fs</code>、<code>redis</code>，每种库可能都有自己的取消逻辑，无法统一。</p>\n<p><strong>新方案：AbortController (Web 标准)</strong><br>\n<code>AbortController</code> 是 ECMAScript 和 Web 标准的一部分。现在，<strong>Node.js 的内置模块（<code>fetch</code>, <code>fs</code>, <code>http</code>, <code>stream</code>）以及主流第三方库（<code>axios</code>, <code>ioredis</code> 等）全部统一支持 <code>AbortSignal</code></strong>   。\n一套控制器，可以同时取消跨库的多种异步操作！</p>\n<hr>\n<h3>三、 四大核心实战场景</h3>\n<h4>场景 1：取消 HTTP 请求（最常见）</h4>\n<p>这是防止组件卸载后继续请求、或接口超时的标准做法。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> axios = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;axios&quot;</span>);\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">fetchUserData</span>(<span class="hljs-params">userId</span>) {\n  <span class="hljs-keyword">const</span> controller = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();\n\n  <span class="hljs-comment">// 设置 2 秒超时自动取消</span>\n  <span class="hljs-keyword">const</span> timeoutId = <span class="hljs-built_in">setTimeout</span>(\n    <span class="hljs-function">() =&gt;</span> controller.<span class="hljs-title function_">abort</span>(<span class="hljs-string">&quot;Request timed out&quot;</span>),\n    <span class="hljs-number">2000</span>,\n  );\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-keyword">const</span> response = <span class="hljs-keyword">await</span> axios.<span class="hljs-title function_">get</span>(<span class="hljs-string">`/api/users/<span class="hljs-subst">${userId}</span>`</span>, {\n      <span class="hljs-attr">signal</span>: controller.<span class="hljs-property">signal</span>, <span class="hljs-comment">// 传入 signal</span>\n    });\n    <span class="hljs-keyword">return</span> response.<span class="hljs-property">data</span>;\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-comment">// 必须判断是否是取消导致的错误</span>\n    <span class="hljs-keyword">if</span> (axios.<span class="hljs-title function_">isCancel</span>(err) || err.<span class="hljs-property">name</span> === <span class="hljs-string">&quot;AbortError&quot;</span>) {\n      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`请求被取消: <span class="hljs-subst">${err.message}</span>`</span>);\n    } <span class="hljs-keyword">else</span> {\n      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;真实接口报错&quot;</span>, err);\n    }\n  } <span class="hljs-keyword">finally</span> {\n    <span class="hljs-built_in">clearTimeout</span>(timeoutId); <span class="hljs-comment">// 如果请求正常完成，清除定时器</span>\n  }\n}\n</code></pre>\n<h4>场景 2：竞速场景（Race Condition）</h4>\n<p>在 BFF 中，我们经常需要向多个下游发起请求，谁先返回就用谁，其他的必须取消以节省资源。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">getFastestData</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">const</span> controller = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-comment">// 将同一个 signal 传给多个请求</span>\n    <span class="hljs-keyword">const</span> promise1 = axios.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;http://service-a/data&quot;</span>, {\n      <span class="hljs-attr">signal</span>: controller.<span class="hljs-property">signal</span>,\n    });\n    <span class="hljs-keyword">const</span> promise2 = axios.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;http://service-b/data&quot;</span>, {\n      <span class="hljs-attr">signal</span>: controller.<span class="hljs-property">signal</span>,\n    });\n    <span class="hljs-comment">// 只要有一个成功返回</span>\n    <span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">any</span>([promise1, promise2]);\n    <span class="hljs-comment">// 立即按下取消键，中断还在排队的另一个请求！</span>\n    controller.<span class="hljs-title function_">abort</span>(<span class="hljs-string">&quot;We already got a winner&quot;</span>);\n    <span class="hljs-keyword">return</span> result.<span class="hljs-property">data</span>;\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-comment">// 处理 AggregateError (Promise.any 全部失败时抛出)</span>\n  }\n}\n</code></pre>\n<h4>场景 3：取消 Node.js 内置流操作（大文件处理）</h4>\n<p>在处理文件上传/下载时，如果客户端断开连接，BFF 必须停止磁盘读写，否则会造成严重性能损耗。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> fs = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;node:fs&quot;</span>);\n<span class="hljs-keyword">const</span> { pipeline } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;node:stream/promises&quot;</span>);\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">downloadLargeFile</span>(<span class="hljs-params">destPath, req</span>) {\n  <span class="hljs-keyword">const</span> controller = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();\n  <span class="hljs-comment">// 如果前端客户端断开了连接，取消文件写入</span>\n  req.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;close&quot;</span>, <span class="hljs-function">() =&gt;</span> {\n    controller.<span class="hljs-title function_">abort</span>(<span class="hljs-string">&quot;Client disconnected&quot;</span>);\n  });\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-keyword">await</span> <span class="hljs-title function_">pipeline</span>(\n      fs.<span class="hljs-title function_">createReadStream</span>(<span class="hljs-string">&quot;./huge-file.zip&quot;</span>),\n      fs.<span class="hljs-title function_">createWriteStream</span>(destPath),\n      <span class="hljs-comment">// 传入 signal，如果触发 abort，pipeline 会自动销毁流</span>\n      { <span class="hljs-attr">signal</span>: controller.<span class="hljs-property">signal</span> },\n    );\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;下载完成&quot;</span>);\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-keyword">if</span> (err.<span class="hljs-property">name</span> === <span class="hljs-string">&quot;AbortError&quot;</span>) {\n      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;客户端断开，停止写入&quot;</span>);\n      <span class="hljs-comment">// 清理已下载的残缺文件</span>\n      fs.<span class="hljs-title function_">unlinkSync</span>(destPath);\n    }\n  }\n}\n</code></pre>\n<h4>场景 4：BFF 请求上下文传递（高阶玩法）</h4>\n<p>结合上一问的健壮性，在 Koa/Express 中，将 <code>AbortController</code> 绑定到请求生命周期，实现<strong>前端断开 -&gt; BFF 立即取消所有下游调用</strong>   。</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// Koa 中间件</span>\napp.<span class="hljs-title function_">use</span>(<span class="hljs-title function_">async</span> (ctx, next) =&gt; {\n  <span class="hljs-keyword">const</span> controller = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();\n  ctx.<span class="hljs-property">abortSignal</span> = controller.<span class="hljs-property">signal</span>;\n  <span class="hljs-comment">// 当 Nginx/客户端关闭连接时，Node.js 的 req 会触发 close 事件</span>\n  ctx.<span class="hljs-property">req</span>.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;close&quot;</span>, <span class="hljs-function">() =&gt;</span> {\n    controller.<span class="hljs-title function_">abort</span>(<span class="hljs-string">&quot;Client aborted request&quot;</span>);\n  });\n  <span class="hljs-keyword">await</span> <span class="hljs-title function_">next</span>();\n});\n<span class="hljs-comment">// 在深层 Service 中</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">callPaymentService</span>(<span class="hljs-params">ctx</span>) {\n  <span class="hljs-comment">// 如果前端关闭了浏览器，这里的 signal 已经是 aborted 状态</span>\n  <span class="hljs-comment">// axios 发起请求前会检查 signal，如果已取消，直接抛出 AbortError，不发任何网络包！</span>\n  <span class="hljs-keyword">const</span> res = <span class="hljs-keyword">await</span> axios.<span class="hljs-title function_">post</span>(<span class="hljs-string">&quot;http://pay/pay&quot;</span>, payload, {\n    <span class="hljs-attr">signal</span>: ctx.<span class="hljs-property">abortSignal</span>,\n  });\n  <span class="hljs-keyword">return</span> res.<span class="hljs-property">data</span>;\n}\n</code></pre>\n<hr>\n<h3>四、 令人惊叹的特性：惰性检查</h3>\n<p><code>AbortController</code> 的实现非常聪明。当你在调用 <code>controller.abort()</code> 时，<strong>它不会主动去通知所有监听它的异步操作</strong>   （这样会有性能开销），而是仅仅把自身的 <code>signal.aborted</code> 改为 <code>true</code>。\n异步操作（如 axios 内部）在执行过程中，会在关键节点（如准备写入 socket 前）检查 <code>signal.aborted</code>。</p>\n<ul>\n<li>如果是 <code>true</code>，立即抛出错误并停止。</li>\n<li>如果是 <code>false</code>，继续执行。\n这意味着：即使你在一个异步操作<strong>还没开始</strong>   （比如在宏任务队列里排队）时就调用了 <code>abort()</code>，当这个异步操作开始执行时，它一检查 <code>aborted</code> 状态，也会直接自杀。这极大避免了竞态条件。</li>\n</ul>\n<hr>\n<h3>五、 避坑指南</h3>\n<h4>1. AbortController 是一次性的</h4>\n<p>一旦 <code>abort()</code> 被调用，这个 Controller 和 Signal 就废了，不能重置。如果一个函数可能被多次调用，<strong>每次调用都必须 <code>new AbortController()</code></strong>   ，否则第二次调用会直接报错取消。</p>\n<h4>2. 必须区分 AbortError 和 业务 Error</h4>\n<p>当捕获到异常时，<strong>必须判断</strong>   是否是 <code>AbortError</code>。如果是取消导致的，通常不需要作为严重错误上报给 APM 系统，因为这是你主动控制的行为。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">catch</span> (err) {\n  <span class="hljs-keyword">if</span> (err.<span class="hljs-property">name</span> === <span class="hljs-string">&#x27;AbortError&#x27;</span>) {\n    <span class="hljs-comment">// 正常取消，降级处理</span>\n  } <span class="hljs-keyword">else</span> {\n    <span class="hljs-comment">// 真实报错，报警！</span>\n  }\n}\n</code></pre>\n<h4>3. 注意 Node.js 版本</h4>\n<ul>\n<li>Node.js 14.17.0 开始实验性支持 <code>AbortController</code>。</li>\n<li>Node.js 15+ 正式内置全局 <code>AbortController</code>。</li>\n<li>请确保你的运行环境 Node &gt;= 16。</li>\n</ul>\n<h4>4. 旧版第三方库不支持</h4>\n<p>如果你用的库比较老，不支持 <code>signal</code> 参数，你需要手动监听 <code>signal</code> 的 <code>onabort</code> 事件来强行中断操作，但这通常很难做到干净利落（比如无法销毁底层的 socket）。建议升级库到支持 <code>AbortController</code> 的版本。</p>\n<h3>总结</h3>\n<p>在 Node.js BFF 开发中，<code>AbortController</code> 不再只是一个可选的工具，而是<strong>构建高可用、高性能应用的基石</strong>   。熟练使用它来管理请求超时、清理无效连接、防止竞态条件，是区分初级和高级 Node.js 工程师的重要分水岭。</p>\n</div>'</script></body></html>
