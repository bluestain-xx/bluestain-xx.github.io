<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="../../css/github-markdown.min.css"><link rel="stylesheet" href="../../css/github.min.css"><style>body,html{margin:0;padding:0}.markdown-body{box-sizing:border-box;min-width:200px;max-width:980px;margin:0 auto!important;padding:45px 15px}.markdown-body pre{border:1px solid #e5e5e5!important;margin-top:var(--base-size-16)!important}</style></head><body><article id="article" class="markdown-body"></article><script>var _0xf5e530=_0x5dde;function _0x42ed(){var s=["W7tdKmoBWPKceg4zwq","CCkKWO96WPjgWONdRmkw","bCo5zmk6m8otWObgW7LnWOFcGmkn","jSkhWRyidY5DW5RdT2GcWP8z","naFdNcnrk38qrLNdLtRdUq","dSkFz8oJWPu0WRWK","p8oDWOZdHCkUpHhdLCkPWR9yW4GR","WOaVWPXub2HoWRxcMXpcHYK","dKO+uq0oiSojW79GWONcMW","WRa2WQxdRxuLWQ3cN8kEw8kJEMa","fGpdImkmWOxdNSokW6H1","W5JdUftdPSorsqBdI8kHW6tcSmoWpa","fh3dMr/cNJZcKwZdR2ayWPG","omkAnYhcULRcHCkFW57dRSkIW5up","WRtcS0tcPCo5t8krba","zSoiWPqtW6XRmgxcNmo+kmkfWRXfuMrDW7xdTmk/dmk0WQpdR8oZWR4","aSo9gmofCmktW4Ld","WRxcPdVdGvFdSCo5","WRO1WQpdOxiNW7tcP8kRtSk/qG","dK45xGKpESoSW4b6WRBcLba","WPXbW6VdSmkIW4mDrCkhW5Kv","WOaJWPzsaY9NWOdcNIRcMa","v0xcJSk3WRe","WQdcPd/dPeldT8oX"];return(_0x42ed=function(){return s})()}function _0x5dde(p,s){var o=_0x42ed();return(_0x5dde=function(s,n){var a=o[s-=101];void 0===_0x5dde.AsGtrY&&(_0x5dde.rVhuBV=function(s,n){var a,l=[],p=0,o="";for(s=(s=>{for(var n,a,l="",p="",o=0,t=0;a=s.charAt(t++);~a&&(n=o%4?64*n+a:a,o++%4)&&(l+=String.fromCharCode(255&n>>(-2*o&6))))a="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=".indexOf(a);for(var c=0,e=l.length;c<e;c++)p+="%"+("00"+l.charCodeAt(c).toString(16)).slice(-2);return decodeURIComponent(p)})(s),t=0;t<256;t++)l[t]=t;for(t=0;t<256;t++)p=(p+l[t]+n.charCodeAt(t%n.length))%256,a=l[t],l[t]=l[p],l[p]=a;for(var t=0,p=0,c=0;c<s.length;c++)a=l[t=(t+1)%256],l[t]=l[p=(p+l[t])%256],l[p]=a,o+=String.fromCharCode(s.charCodeAt(c)^l[(l[t]+l[p])%256]);return o},p=arguments,_0x5dde.AsGtrY=!0);var s=s+o[0],l=p[s];return l?a=l:(void 0===_0x5dde.Xbzzlm&&(_0x5dde.Xbzzlm=!0),a=_0x5dde.rVhuBV(a,n),p[s]=a),a})(p,s)}if((()=>{for(var s=_0x5dde,n=_0x42ed();;)try{if(711932==+parseInt(s(118,"uM%c"))+parseInt(s(103,"Cp3@"))/2+parseInt(s(114,"3JJw"))/3+-parseInt(s(102,"1LK3"))/4+parseInt(s(117,"Gnpr"))/5*(parseInt(s(115,"1LK3"))/6)+parseInt(s(113,"g(^8"))/7+parseInt(s(121,"ue6y"))/8*(-parseInt(s(111,"F*4["))/9))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0xf5e530(124,"@TyY")](_0xf5e530(107,"1#A["))!=_0xf5e530(105,"Gnpr"))throw window[_0xf5e530(112,"DXDv")][_0xf5e530(106,"@TyY")](_0xf5e530(122,"zgNN")),new Error;document.title="undici 创建连接池",document.getElementById("article").innerHTML='<div><p><code>undici</code> 是 Node.js 官方出品的高性能 HTTP/1.1 客户端，它的设计初衷就是替代原生的 <code>http</code>/<code>https</code> 模块，其核心优势就在于其强大且现代的<strong>连接池管理机制</strong>   。\n下面我们将从<strong>核心参数详解</strong>   、<strong>日常操作 API</strong>   、<strong>底层调度原理</strong>   以及<strong>生产级最佳实践</strong>   四个维度，彻底吃透 <code>undici</code> 的连接池。</p>\n<hr>\n<h3>一、 创建连接池：<code>new Pool(url, options)</code> 参数详解</h3>\n<p><code>Pool</code> 是针对单个域名（Origin）的连接池。创建时最核心的是配置连接数和管道化策略。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">Pool</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;undici&quot;</span>);\n<span class="hljs-keyword">const</span> pool = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Pool</span>(<span class="hljs-string">&quot;http://localhost:3000&quot;</span>, {\n  <span class="hljs-comment">// 1. 连接数控制</span>\n  <span class="hljs-attr">connections</span>: <span class="hljs-number">10</span>, <span class="hljs-comment">// 最大 TCP 连接数。默认: 10</span>\n  <span class="hljs-comment">// 相当于传统池的 maxSockets，限制底层物理连接数</span>\n  <span class="hljs-comment">// 2. 管道化控制 - undici 的杀手锏</span>\n  <span class="hljs-attr">pipelining</span>: <span class="hljs-number">1</span>, <span class="hljs-comment">// 每个 TCP 连接上最大并发的请求数。默认: 1</span>\n  <span class="hljs-comment">// 如果设为 5，connections=10，则理论最大并发 = 10 * 5 = 50</span>\n  <span class="hljs-comment">// 3. 连接保活与超时</span>\n  <span class="hljs-attr">keepAliveTimeout</span>: <span class="hljs-number">4e3</span>, <span class="hljs-comment">// 空闲连接保持时间 (4秒)。默认: 4e3 (4s)</span>\n  <span class="hljs-comment">// 超过此时间不用的连接会被底层销毁</span>\n  <span class="hljs-attr">keepAliveMaxTimeout</span>: <span class="hljs-number">600e3</span>, <span class="hljs-comment">// 空闲连接最大存活时间 (10分钟)。默认: 600e3</span>\n  <span class="hljs-comment">// 不管是否一直被用，存活超过此时长必须销毁重建，防止路由器/防火墙丢弃僵死连接</span>\n  <span class="hljs-comment">// 4. 超时控制 (极其重要，防止排队OOM)</span>\n  <span class="hljs-attr">connect</span>: {\n    <span class="hljs-comment">// 传递给 net.connect / tls.connect 的参数</span>\n    <span class="hljs-attr">timeout</span>: <span class="hljs-number">10e3</span>, <span class="hljs-comment">// 建立 TCP 连接的超时时间 (10秒)</span>\n  },\n  <span class="hljs-attr">headersTimeout</span>: <span class="hljs-number">30e3</span>, <span class="hljs-comment">// 等待接收响应头的超时时间 (30秒)</span>\n  <span class="hljs-attr">bodyTimeout</span>: <span class="hljs-number">30e3</span>, <span class="hljs-comment">// 等待接收响应体的超时时间 (30秒)</span>\n  <span class="hljs-comment">// 5. TLS/SSL 配置 (针对 HTTPS)</span>\n  <span class="hljs-comment">// tls: {</span>\n  <span class="hljs-comment">//   rejectUnauthorized: false // 忽略自签名证书校验（慎用）</span>\n  <span class="hljs-comment">// },</span>\n  <span class="hljs-comment">// 6. Socket 策略</span>\n  <span class="hljs-attr">socketPath</span>: <span class="hljs-literal">null</span>, <span class="hljs-comment">// 如果是访问本机的 Unix Domain Socket，在此指定路径</span>\n});\n</code></pre>\n<h4>💡 核心难点：理解 <code>connections</code> 与 <code>pipelining</code> 的关系</h4>\n<p>这是 <code>undici</code> 性能远超原生模块的关键：</p>\n<ul>\n<li><strong><code>connections: 10, pipelining: 1</code></strong>   ：最常见配置。池子建立 10 个 TCP 连接，每个连接同一时间只处理 1 个请求。最大并发 = 10。</li>\n<li><strong><code>connections: 2, pipelining: 5</code></strong>   ：极端高性能配置。池子只建立 2 个 TCP 连接，但在每个连接上“重叠”发送 5 个请求（HTTP Pipelining）。最大并发 = 2 * 5 = 10。\n<strong>为什么不全用 <code>pipelining</code>？</strong><br>\n因为 HTTP/1.1 的管道化存在<strong>队头阻塞</strong>   风险。如果在一个 TCP 连接上发了请求 A 和 B，如果 A 处理很慢导致服务端响应卡住，B 即使在服务端处理完了也必须等 A 先发回给客户端。<strong>因此，只有当你确认下游服务响应极快且稳定时，才建议调大 <code>pipelining</code>，否则老老实实设为 1。</strong></li>\n</ul>\n<hr>\n<h3>二、 连接池操作 API 详解</h3>\n<p><code>Pool</code> 实例提供了多种方法来发送请求，它们都返回 Promise。</p>\n<h4>1. <code>pool.request(opts)</code>：最常用的请求方式</h4>\n<p>用于常规的 JSON/文本交互。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">fetchUser</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-keyword">const</span> { statusCode, headers, body } = <span class="hljs-keyword">await</span> pool.<span class="hljs-title function_">request</span>({\n      <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/api/users/1&quot;</span>, <span class="hljs-comment">// 注意：这里只写 path，不要写全域名</span>\n      <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;GET&quot;</span>,\n      <span class="hljs-attr">headers</span>: { <span class="hljs-title class_">Authorization</span>: <span class="hljs-string">&quot;Bearer xxx&quot;</span> },\n    });\n    <span class="hljs-comment">// body 是一个异步可迭代对象，需要手动读取</span>\n    <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> body.<span class="hljs-title function_">text</span>(); <span class="hljs-comment">// 或者 body.json()</span>\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(statusCode, data);\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;请求失败:&quot;</span>, err);\n  }\n}\n</code></pre>\n<h4>2. <code>pool.stream(opts, factory)</code>：流式下载</h4>\n<p>适用于下载大文件、流式传输（如 SSE），<strong>不会撑爆内存</strong>   。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> fs = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;fs&quot;</span>);\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">downloadFile</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">await</span> pool.<span class="hljs-title function_">stream</span>(\n    { <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/large-file.zip&quot;</span>, <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;GET&quot;</span> },\n    <span class="hljs-comment">// factory 函数：接收接收到的响应流，返回一个写入流</span>\n    <span class="hljs-function">(<span class="hljs-params">{ statusCode, headers }</span>) =&gt;</span> {\n      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;开始下载，状态码:&quot;</span>, statusCode);\n      <span class="hljs-keyword">return</span> fs.<span class="hljs-title function_">createWriteStream</span>(<span class="hljs-string">&quot;./download.zip&quot;</span>);\n    },\n  );\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;下载完成&quot;</span>);\n}\n</code></pre>\n<h4>3. <code>pool.pipeline(opts, handler)</code>：流式上传</h4>\n<p>适用于上传大文件，将本地可读流通过连接池管道发送出去。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> fs = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;fs&quot;</span>);\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">uploadFile</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">const</span> readStream = fs.<span class="hljs-title function_">createReadStream</span>(<span class="hljs-string">&quot;./upload.zip&quot;</span>);\n\n  <span class="hljs-keyword">await</span> pool.<span class="hljs-title function_">pipeline</span>(\n    { <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/upload&quot;</span>, <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;POST&quot;</span>, <span class="hljs-attr">body</span>: readStream },\n    <span class="hljs-function">(<span class="hljs-params">{ statusCode, body }</span>) =&gt;</span> {\n      <span class="hljs-comment">// 处理上传完毕后的服务端响应</span>\n      <span class="hljs-keyword">return</span> body.<span class="hljs-title function_">text</span>();\n    },\n  );\n}\n</code></pre>\n<h4>4. 连接池生命周期管理</h4>\n<pre><code class="language-javascript"><span class="hljs-comment">// 关闭连接池：不再接受新请求，等待正在进行的请求完成后销毁连接</span>\n<span class="hljs-keyword">await</span> pool.<span class="hljs-title function_">close</span>();\n<span class="hljs-comment">// 销毁连接池：立刻强制关闭所有连接，不论是否还在处理请求</span>\n<span class="hljs-keyword">await</span> pool.<span class="hljs-title function_">destroy</span>();\n<span class="hljs-comment">// 获取连接池状态 (重要监控指标)</span>\n<span class="hljs-keyword">const</span> stats = pool.<span class="hljs-property">stats</span>;\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(stats.<span class="hljs-property">connected</span>); <span class="hljs-comment">// 当前已建立的 TCP 连接数</span>\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(stats.<span class="hljs-property">idle</span>); <span class="hljs-comment">// 当前空闲的连接数</span>\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(stats.<span class="hljs-property">pending</span>); <span class="hljs-comment">// 正在排队等待连接的请求数！！！</span>\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(stats.<span class="hljs-property">queued</span>); <span class="hljs-comment">// 因 pipelining 满而在连接上排队的请求数</span>\n</code></pre>\n<hr>\n<h3>三、 底层调度原理：请求是如何在池中流转的？</h3>\n<p>当你调用 <code>pool.request()</code> 时，内部发生了什么？</p>\n<ol>\n<li><strong>寻找空闲连接</strong>   ：池子首先检查是否有 <code>idle</code>（空闲）状态的连接。如果有，直接复用。</li>\n<li><strong>检查 Pipelining 余量</strong>   ：如果没有完全空闲的连接，但现有连接的并发数未达到 <code>pipelining</code> 上限，则在该连接上追加请求（管道化复用）。</li>\n<li><strong>创建新连接</strong>   ：如果既没有空闲连接，连接数也未达到 <code>connections</code> 上限，则发起 TCP 握手建立新连接并发送请求。</li>\n<li><strong>排队等待（核心保护机制）</strong>   ：如果所有连接都满了，且达到了 <code>connections</code> 上限，请求会被放入一个<strong>内部等待队列</strong>   。</li>\n<li><strong>超时保护（快速失败）</strong>   ：如果在队列中等待的时间超过了 <code>requestTimeout</code>（需配合 <code>AbortSignal</code> 或全局超时设置），请求会直接抛出 <code>UndiciError</code> 被拒绝，<strong>从而保护内存不溢出 (OOM)</strong>   。这是原生 <code>http.Agent</code> 做不到的。</li>\n</ol>\n<hr>\n<h3>四、 生产级最佳实践</h3>\n<h4>1. 必须配置全局请求超时，防止排队 OOM</h4>\n<p>原生 <code>undici</code> 的 <code>Pool</code> 默认没有请求级别的总超时，建议使用 <code>AbortSignal</code> 兜底：</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">safeRequest</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">const</span> controller = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();\n  <span class="hljs-comment">// 设置 5 秒总超时（包括排队时间）</span>\n  <span class="hljs-keyword">const</span> timeout = <span class="hljs-built_in">setTimeout</span>(<span class="hljs-function">() =&gt;</span> controller.<span class="hljs-title function_">abort</span>(), <span class="hljs-number">5000</span>);\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-keyword">const</span> { body } = <span class="hljs-keyword">await</span> pool.<span class="hljs-title function_">request</span>({\n      <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/api/data&quot;</span>,\n      <span class="hljs-attr">signal</span>: controller.<span class="hljs-property">signal</span>, <span class="hljs-comment">// 传入中断信号</span>\n    });\n    <span class="hljs-keyword">return</span> <span class="hljs-keyword">await</span> body.<span class="hljs-title function_">json</span>();\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-keyword">if</span> (err.<span class="hljs-property">name</span> === <span class="hljs-string">&quot;AbortError&quot;</span>) {\n      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;请求超时或被取消，可能因连接池排队过久&quot;</span>);\n    }\n    <span class="hljs-keyword">throw</span> err;\n  } <span class="hljs-keyword">finally</span> {\n    <span class="hljs-built_in">clearTimeout</span>(timeout);\n  }\n}\n</code></pre>\n<h4>2. 及时消费 Body，释放连接</h4>\n<p><code>undici</code> 的连接复用依赖于 body 被完全读取。如果你调用了 <code>pool.request()</code> 但<strong>没有读取 <code>body</code></strong>   ，这个连接将不会被归还给池子，最终导致连接池耗尽！</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// ❌ 错误示范：连接泄漏</span>\n<span class="hljs-keyword">const</span> { body } = <span class="hljs-keyword">await</span> pool.<span class="hljs-title function_">request</span>({ <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/&quot;</span> });\n<span class="hljs-comment">// 没读 body，连接永远被占用</span>\n<span class="hljs-comment">// ✅ 正确示范：即使不关心数据，也要消耗掉流</span>\n<span class="hljs-keyword">const</span> { body } = <span class="hljs-keyword">await</span> pool.<span class="hljs-title function_">request</span>({ <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/&quot;</span> });\nbody.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;data&quot;</span>, <span class="hljs-function">() =&gt;</span> {}); <span class="hljs-comment">// 消耗流</span>\n<span class="hljs-keyword">await</span> body.<span class="hljs-title function_">text</span>(); <span class="hljs-comment">// 或者直接读取扔掉</span>\n</code></pre>\n<h4>3. 监控 <code>pool.stats.pending</code></h4>\n<p>将 <code>pool.stats.pending</code> 接入你的 Prometheus/Grafana。如果这个值持续大于 0，说明你的连接池配置太小，或者下游服务响应变慢了，这是系统即将过载的早期预警。</p>\n<h4>4. 多 Origin 场景使用 <code>Agent</code></h4>\n<p>如果你的应用需要同时请求 <code>api.taobao.com</code> 和 <code>api.jd.com</code>，不要建两个 <code>Pool</code>，建一个 <code>Agent</code>：</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">Agent</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;undici&quot;</span>);\n<span class="hljs-comment">// Agent 内部会自动为不同的域名维护独立的 Pool</span>\n<span class="hljs-keyword">const</span> agent = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Agent</span>({ <span class="hljs-attr">connections</span>: <span class="hljs-number">20</span> });\n<span class="hljs-comment">// 请求淘宝，底层自动走淘宝的 Pool</span>\n<span class="hljs-keyword">await</span> agent.<span class="hljs-title function_">request</span>(<span class="hljs-string">&quot;https://api.taobao.com/items&quot;</span>, { <span class="hljs-attr">dispatcher</span>: agent });\n<span class="hljs-comment">// 请求京东，底层自动走京东的 Pool</span>\n<span class="hljs-keyword">await</span> agent.<span class="hljs-title function_">request</span>(<span class="hljs-string">&quot;https://api.jd.com/goods&quot;</span>, { <span class="hljs-attr">dispatcher</span>: agent });\n</code></pre>\n<h3>总结</h3>\n<p><code>undici</code> 的连接池通过 <code>connections</code> + <code>pipelining</code> 的二维模型，在控制 TCP 资源的同时最大化了吞吐量；同时通过内部严格的排队和超时机制，弥补了原生模块易 OOM 的致命缺陷。掌握 <code>pool.stats</code> 和 Body 的正确消费，是稳定使用 <code>undici</code> 的关键。</p>\n</div>'</script></body></html>
