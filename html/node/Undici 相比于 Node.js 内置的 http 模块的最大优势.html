strong>289.51%</strong>   。即使在开启了 keep-alive 的情况下，Undici 的性能依然显著优于内置模块。</p>\n<h3>🔧 2. 高效连接池与流水线：高并发的基石</h3>\n<p>Undici 内置了高效的连接池管理，支持 <strong>HTTP/1.1 流水线</strong>   技术。流水线允许在单个连接上<strong>连续发送多个请求而无需等待响应</strong>   ，这大幅减少了网络延迟和连接建立开销。\n<strong>对比内置模块的痛点</strong>   ：Node.js 内置的 <code>http</code> 模块虽然也支持连接复用，但其连接管理较为基础，在高并发场景下易成为瓶颈，且难以针对不同下游服务进行精细配置。\n<strong>Undici 的解决方案</strong>   ：你可以为<strong>每一个下游微服务创建一个独立的 <code>Agent</code> 实例</strong>   ，并为其配置专属的连接池参数（如最大连接数、流水线深度、超时时间等）。这意味着你可以为核心服务分配更大的连接池，为非核心服务设置更严格的超时和限流，彻底避免“一个下游服务慢拖垮整个应用”的问题。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Agent</span>, request } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;undici&quot;</span>;\n<span class="hljs-comment">// 为核心微服务创建专属连接池</span>\n<span class="hljs-keyword">const</span> coreServiceAgent = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Agent</span>({\n  <span class="hljs-attr">connections</span>: <span class="hljs-number">100</span>, <span class="hljs-comment">// 最大并发连接数</span>\n  <span class="hljs-attr">pipelining</span>: <span class="hljs-number">10</span>, <span class="hljs-comment">// HTTP/1.1 流水线深度</span>\n  <span class="hljs-attr">keepAliveTimeout</span>: <span class="hljs-number">10000</span>, <span class="hljs-comment">// 保持连接超时时间</span>\n  <span class="hljs-attr">headersTimeout</span>: <span class="hljs-number">3000</span>, <span class="hljs-comment">// 等待响应头超时</span>\n  <span class="hljs-attr">bodyTimeout</span>: <span class="hljs-number">5000</span>, <span class="hljs-comment">// 等待响应体超时</span>\n});\n<span class="hljs-comment">// 使用自定义代理发送请求</span>\n<span class="hljs-keyword">const</span> { body } = <span class="hljs-keyword">await</span> <span class="hljs-title function_">request</span>(<span class="hljs-string">&quot;https://api.example.com/data&quot;</span>, {\n  <span class="hljs-attr">dispatcher</span>: coreServiceAgent,\n});\n</code></pre>\n<h3>⚡ 3. 精细的超时控制：守护系统稳定性</h3>\n<p>Undici 提供了极其细粒度的超时控制，包括 <code>headersTimeout</code>（等待响应头的超时时间）和 <code>bodyTimeout</code>（等待响应体的超时时间）。一旦超时，底层 Socket 会被<strong>强硬地销毁</strong>   ，请求绝不会无限期挂起，从而保护应用的资源不被耗尽。\n<strong>内置模块的潜在风险</strong>   ：内置 <code>http</code> 模块的超时控制相对粗粒度，且在某些情况下（如 DNS 解析或 Socket 建立阶段卡住）可能无法可靠地中断请求，可能导致请求挂起，最终耗尽连接池资源。</p>\n<h3>🛡️ 4. 官方维护与零依赖：安全与可靠</h3>\n<ul>\n<li><strong>官方背书</strong>   ：Undici 是 <strong>Node.js 官方维护的项目</strong>   ，是 Node.js 18+ 内置 <code>fetch</code> 的底层实现。这意味着它紧跟 Node.js 版本迭代，能第一时间获得性能优化和漏洞修复，是生态中的“一等公民”。</li>\n<li><strong>零外部依赖</strong>   ：Undici 是纯 JavaScript 实现，<strong>零外部依赖</strong>   。这不仅安装快速、体积小，还极大降低了供应链攻击的风险。内置 <code>http</code> 模块作为 Node.js 核心，本身是稳定的，但 Undici 作为独立模块可以更快速地迭代和修复问题。</li>\n</ul>\n<h3>📊 综合对比：何时选择 Undici？</h3>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">特性</th>\n<th style="text-align:left"><strong>Undici</strong></th>\n<th style="text-align:left"><strong>Node.js 内置 <code>http</code> 模块</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>性能</strong></td>\n<td style="text-align:left">★★★★★ (极致，基准测试领先数倍)</td>\n<td style="text-align:left">★★★☆☆ (基础性能，高并发下开销大)</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>连接管理</strong></td>\n<td style="text-align:left">★★★★★ (独立连接池，支持流水线)</td>\n<td style="text-align:left">★★☆☆☆ (全局连接池，难以精细控制)</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>超时控制</strong></td>\n<td style="text-align:left">★★★★★ (精准到 headers/body，强硬销毁)</td>\n<td style="text-align:left">★★★☆☆ (整体超时，可能不可靠)</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>API设计</strong></td>\n<td style="text-align:left">★★★★☆ (现代化Promise API，多种风格)</td>\n<td style="text-align:left">★★★☆☆ (传统回调模式，需手动封装)</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>维护与安全</strong></td>\n<td style="text-align:left">★★★★★ (官方维护，零依赖)</td>\n<td style="text-align:left">★★★★☆ (核心模块，极度稳定)</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>最佳场景</strong></td>\n<td style="text-align:left"><strong>Node.js 高性能服务、BFF、微服务、高并发爬虫</strong></td>\n<td style="text-align:left"><strong>简单脚本、兼容性要求高、无需极致性能的场景</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>💎 总结：最大优势的根源</h3>\n<p>总而言之，Undici 相比于 Node.js 内置 <code>http</code> 模块的<strong>最大优势根源在于其“为 Node.js 原生而生”的底层架构</strong>   。这种架构带来了：</p>\n<ol>\n<li><strong>无与伦比的性能</strong>   ：原生实现和零拷贝使其吞吐量远超内置模块。</li>\n<li><strong>极致的并发控制</strong>   ：独立连接池和流水线技术是处理高并发的关键。</li>\n<li><strong>坚如磐石的稳定性</strong>   ：精细的超时和官方维护保障了生产环境的安全可靠。\n<blockquote>\n<p>💡 <strong>选型建议</strong>   ：</p>\n<ul>\n<li><strong>如果你的应用是 Node.js 原生服务，追求极致性能和高并发稳定性（如 BFF 层、API 网关、微服务通信、高并发爬虫），Undici 是不二之选。</strong></li>\n<li><strong>对于简单的脚本、工具或对性能要求不极端的场景，Node.js 内置的 <code>http</code> 模块（或基于它的 <code>axios</code>）完全足够，且无需额外安装依赖。</strong></li>\n<li><strong>对于新的 Node.js 项目，优先考虑直接使用 <code>undici</code> 包或 Node.js 18+ 内置的 <code>fetch</code>，以获得最佳性能和官方支持。</strong></li>\n</ul>\n</blockquote>\n</li>\n</ol>\n</div>'</script></body></html>
