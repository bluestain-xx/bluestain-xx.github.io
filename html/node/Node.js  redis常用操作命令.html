>(<span class="hljs-string">&quot;name&quot;</span>); <span class="hljs-comment">// &#x27;xiaoming&#x27;</span>\n<span class="hljs-comment">// 3. 删除键 (可以传一个或多个)</span>\n<span class="hljs-keyword">const</span> delCount = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">del</span>(<span class="hljs-string">&quot;name&quot;</span>, <span class="hljs-string">&quot;age&quot;</span>); <span class="hljs-comment">// 返回删除的个数</span>\n<span class="hljs-comment">// 4. 检查键是否存在</span>\n<span class="hljs-keyword">const</span> exists = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">exists</span>(<span class="hljs-string">&quot;name&quot;</span>); <span class="hljs-comment">// 存在返回 1，不存在返回 0</span>\n<span class="hljs-comment">// 5. 设置过期时间 (单位：秒)</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">expire</span>(<span class="hljs-string">&quot;name&quot;</span>, <span class="hljs-number">120</span>);\n<span class="hljs-comment">// 6. 查看剩余生存时间</span>\n<span class="hljs-keyword">const</span> ttl = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">ttl</span>(<span class="hljs-string">&quot;name&quot;</span>); <span class="hljs-comment">// 返回秒数，-1表示永不过期，-2表示键不存在</span>\n<span class="hljs-comment">// 7. 查找匹配的键 (生产环境慎用，数据量大容易阻塞)</span>\n<span class="hljs-keyword">const</span> keys = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">keys</span>(<span class="hljs-string">&quot;user:*&quot;</span>);\n</code></pre>\n<h2>⚠️ <strong>避坑指南</strong>   ：线上环境<strong>严禁使用 <code>keys</code> 命令</strong>   ！如果需要模糊查找，请使用 <code>scan</code> 流式遍历。</h2>\n<h3>二、分布式锁常用 (SETNX 语义)</h3>\n<p>这是 BFF 层最常用的防重/限流操作，ioredis 提供了极其方便的语法糖：</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// SET key value NX EX seconds</span>\n<span class="hljs-comment">// NX: 只有键不存在时才设置; EX: 设置过期时间(秒)</span>\n<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">set</span>(\n  <span class="hljs-string">&quot;lock:order:123&quot;</span>,\n  <span class="hljs-string">&quot;uuid-xxx&quot;</span>,\n  <span class="hljs-string">&quot;EX&quot;</span>,\n  <span class="hljs-number">10</span>,\n  <span class="hljs-string">&quot;NX&quot;</span>,\n);\n<span class="hljs-keyword">if</span> (result === <span class="hljs-string">&quot;OK&quot;</span>) {\n  <span class="hljs-comment">// 加锁成功</span>\n} <span class="hljs-keyword">else</span> {\n  <span class="hljs-comment">// 加锁失败（锁已被占用）</span>\n}\n</code></pre>\n<p>有了才设置的修饰符是 <strong><code>XX</code></strong>  。\n它的全称是 &quot;eXists&quot;（存在），作用与 <code>NX</code> 恰好相反。</p>\n<ul>\n<li><strong><code>NX</code> (Not eXists)</strong>  ：<strong>不存在</strong>  时才设置。常用于<strong>加锁</strong>  、防重。</li>\n<li><strong><code>XX</code> (eXists)</strong>  ：<strong>存在</strong>  时才设置。常用于<strong>更新</strong>  、防误创。</li>\n</ul>\n<h3>实际应用场景：为什么需要 XX？</h3>\n<p><code>XX</code> 最典型的应用场景是<strong>安全更新</strong>  ：你只想修改一个已经存在的数据，<strong>绝对不想意外创建一个新的 Key</strong>  。</p>\n<h4>场景模拟：用户资料更新</h4>\n<p>假设你有一个用户资料缓存，Key 是 <code>user:1001</code>。</p>\n<ol>\n<li>\n<p><strong>不用修饰符（危险）</strong>  ：</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// 如果 user:1001 不存在，Redis 会直接创建这个 Key！</span>\n<span class="hljs-comment">// 这可能导致脏数据或逻辑漏洞（比如绕过了初始化逻辑）</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">set</span>(<span class="hljs-string">&quot;user:1001&quot;</span>, <span class="hljs-string">&#x27;{&quot;name&quot;:&quot;小明&quot;}&#x27;</span>);\n</code></pre>\n</li>\n<li>\n<p><strong>使用 <code>XX</code>（安全）</strong>  ：</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// 只有当 user:1001 已经存在时，才把值更新为小明</span>\n<span class="hljs-comment">// 如果不存在，Redis 直接返回 null，什么都不做</span>\n<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">set</span>(<span class="hljs-string">&quot;user:1001&quot;</span>, <span class="hljs-string">&#x27;{&quot;name&quot;:&quot;小明&quot;}&#x27;</span>, <span class="hljs-string">&quot;XX&quot;</span>);\n\n<span class="hljs-keyword">if</span> (result === <span class="hljs-string">&quot;OK&quot;</span>) {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;更新成功&quot;</span>);\n} <span class="hljs-keyword">else</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Key不存在，更新失败（也没有误创建新Key）&quot;</span>);\n}\n</code></pre>\n</li>\n</ol>\n<h3>总结对比</h3>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">修饰符</th>\n<th style="text-align:left">全称</th>\n<th style="text-align:left">含义</th>\n<th style="text-align:left">成功返回</th>\n<th style="text-align:left">失败返回</th>\n<th style="text-align:left">典型场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong><code>NX</code></strong></td>\n<td style="text-align:left">Not eXists</td>\n<td style="text-align:left">只有Key<strong>不存在</strong>  时才设置</td>\n<td style="text-align:left"><code>OK</code></td>\n<td style="text-align:left"><code>null</code></td>\n<td style="text-align:left">分布式锁、防重复提交</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong><code>XX</code></strong></td>\n<td style="text-align:left">eXists</td>\n<td style="text-align:left">只有Key<strong>存在</strong>  时才设置</td>\n<td style="text-align:left"><code>OK</code></td>\n<td style="text-align:left"><code>null</code></td>\n<td style="text-align:left">安全更新缓存、防止误创建</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h3>三、Hash 操作 (适合存对象)</h3>\n<p>比如存储用户信息 <code>user:101</code> -&gt; <code>{ name: \'xiaoming\', age: 20 }</code>，比用 JSON 字符串存 String 更灵活，可以单独修改某个字段。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> key = <span class="hljs-string">&quot;user:101&quot;</span>;\n<span class="hljs-comment">// 1. 设置单个字段</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">hset</span>(key, <span class="hljs-string">&quot;name&quot;</span>, <span class="hljs-string">&quot;xiaoming&quot;</span>);\n<span class="hljs-comment">// 2. 设置多个字段</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">hset</span>(key, <span class="hljs-string">&quot;age&quot;</span>, <span class="hljs-number">20</span>, <span class="hljs-string">&quot;gender&quot;</span>, <span class="hljs-string">&quot;male&quot;</span>);\n<span class="hljs-comment">// 3. 获取单个字段</span>\n<span class="hljs-keyword">const</span> name = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">hget</span>(key, <span class="hljs-string">&quot;name&quot;</span>); <span class="hljs-comment">// &#x27;xiaoming&#x27;</span>\n<span class="hljs-comment">// 4. 获取所有字段和值</span>\n<span class="hljs-keyword">const</span> user = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">hgetall</span>(key); <span class="hljs-comment">// { name: &#x27;xiaoming&#x27;, age: &#x27;20&#x27;, gender: &#x27;male&#x27; }</span>\n<span class="hljs-comment">// ⚠️ 注意：hgetall 返回的值全部是 String 类型，age 需要自己转数字</span>\n<span class="hljs-comment">// 5. 删除单个或多个字段</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">hdel</span>(key, <span class="hljs-string">&quot;gender&quot;</span>);\n<span class="hljs-comment">// 6. 判断字段是否存在</span>\n<span class="hljs-keyword">const</span> exists = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">hexists</span>(key, <span class="hljs-string">&quot;name&quot;</span>); <span class="hljs-comment">// 1</span>\n</code></pre>\n<hr>\n<h3>四、List 操作 (队列/栈)</h3>\n<p>常用于消息队列、最新列表等。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> key = <span class="hljs-string">&quot;task_queue&quot;</span>;\n<span class="hljs-comment">// 1. 从左侧压入 (先进先出队列的入队)</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">lpush</span>(key, <span class="hljs-string">&quot;task1&quot;</span>, <span class="hljs-string">&quot;task2&quot;</span>);\n<span class="hljs-comment">// 2. 从右侧弹出 (先进先出队列的出队)</span>\n<span class="hljs-keyword">const</span> task = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">rpop</span>(key); <span class="hljs-comment">// &#x27;task1&#x27;</span>\n<span class="hljs-comment">// 3. 阻塞式弹出 (常用于长轮询消费队列，0表示无限等待)</span>\n<span class="hljs-comment">// 注意：brpop 返回一个数组 [key, value]</span>\n<span class="hljs-keyword">const</span> [queueName, value] = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">brpop</span>(key, <span class="hljs-number">0</span>);\n<span class="hljs-comment">// 4. 获取列表指定范围的元素 (0到-1代表全部)</span>\n<span class="hljs-keyword">const</span> tasks = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">lrange</span>(key, <span class="hljs-number">0</span>, -<span class="hljs-number">1</span>);\n<span class="hljs-comment">// 5. 获取列表长度</span>\n<span class="hljs-keyword">const</span> len = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">llen</span>(key);\n</code></pre>\n<hr>\n<h3>五、Set 操作 (去重/交集/并集)</h3>\n<p>常用于标签、点赞、共同好友等需要去重的场景。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> key = <span class="hljs-string">&quot;article:100:likes&quot;</span>;\n<span class="hljs-comment">// 1. 添加元素 (自动去重)</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">sadd</span>(key, <span class="hljs-string">&quot;user1&quot;</span>, <span class="hljs-string">&quot;user2&quot;</span>, <span class="hljs-string">&quot;user1&quot;</span>); <span class="hljs-comment">// 实际只加入2个</span>\n<span class="hljs-comment">// 2. 移除元素</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">srem</span>(key, <span class="hljs-string">&quot;user2&quot;</span>);\n<span class="hljs-comment">// 3. 判断元素是否存在 (常用于判断是否已点赞/已关注)</span>\n<span class="hljs-keyword">const</span> isLiked = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">sismember</span>(key, <span class="hljs-string">&quot;user1&quot;</span>); <span class="hljs-comment">// 1 存在，0 不存在</span>\n<span class="hljs-comment">// 4. 获取集合所有成员</span>\n<span class="hljs-keyword">const</span> members = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">smembers</span>(key);\n<span class="hljs-comment">// 5. 获取集合成员数量</span>\n<span class="hljs-keyword">const</span> count = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">scard</span>(key);\n<span class="hljs-comment">// 6. 求交集 (例如求共同关注)</span>\n<span class="hljs-keyword">const</span> commonFriends = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">sinter</span>(<span class="hljs-string">&quot;friends:A&quot;</span>, <span class="hljs-string">&quot;friends:B&quot;</span>);\n</code></pre>\n<hr>\n<h3>六、ZSet (Sorted Set 有序集合)</h3>\n<p>排行榜必备，每个元素关联一个分数(score)用于排序。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> key = <span class="hljs-string">&quot;rank:score&quot;</span>;\n<span class="hljs-comment">// 1. 添加成员及其分数</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">zadd</span>(key, <span class="hljs-number">100</span>, <span class="hljs-string">&quot;player1&quot;</span>);\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">zadd</span>(key, <span class="hljs-number">200</span>, <span class="hljs-string">&quot;player2&quot;</span>);\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">zadd</span>(key, <span class="hljs-number">150</span>, <span class="hljs-string">&quot;player3&quot;</span>);\n<span class="hljs-comment">// 2. 获取排行榜 (按分数从低到高，withscores连带着分数一起返回)</span>\n<span class="hljs-keyword">const</span> lowToHigh = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">zrange</span>(key, <span class="hljs-number">0</span>, -<span class="hljs-number">1</span>, <span class="hljs-string">&quot;WITHSCORES&quot;</span>);\n<span class="hljs-comment">// 3. 获取排行榜 (按分数从高到低，真实排行榜常用)</span>\n<span class="hljs-keyword">const</span> highToLow = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">zrevrange</span>(key, <span class="hljs-number">0</span>, -<span class="hljs-number">1</span>, <span class="hljs-string">&quot;WITHSCORES&quot;</span>);\n<span class="hljs-comment">// 4. 获取某个成员的排名 (从0开始，降序)</span>\n<span class="hljs-keyword">const</span> rank = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">zrevrank</span>(key, <span class="hljs-string">&quot;player2&quot;</span>); <span class="hljs-comment">// 0 (第一名)</span>\n<span class="hljs-comment">// 5. 给某个成员加分 (增量)</span>\n<span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">zincrby</span>(key, <span class="hljs-number">50</span>, <span class="hljs-string">&quot;player1&quot;</span>); <span class="hljs-comment">// player1 变成 150 分</span>\n</code></pre>\n<hr>\n<h3>七、管道与事务</h3>\n<p>当需要一次性执行多个命令时，避免网络往返带来的延迟。</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// 1. Pipeline (管道)：把命令打包一次性发给 Redis，但不保证原子性</span>\n<span class="hljs-keyword">const</span> pipeline = <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">pipeline</span>();\npipeline.<span class="hljs-title function_">set</span>(<span class="hljs-string">&quot;key1&quot;</span>, <span class="hljs-string">&quot;val1&quot;</span>);\npipeline.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;key2&quot;</span>);\npipeline.<span class="hljs-title function_">incr</span>(<span class="hljs-string">&quot;counter&quot;</span>);\n<span class="hljs-keyword">const</span> results = <span class="hljs-keyword">await</span> pipeline.<span class="hljs-title function_">exec</span>(); <span class="hljs-comment">// 返回每个命令的执行结果数组</span>\n<span class="hljs-comment">// 2. Transaction (事务)：使用 MULTI，保证命令按顺序执行，且不会被插队（原子性）</span>\n<span class="hljs-comment">// 如果某个命令失败，不会回滚之前成功的命令（Redis 事务不支持回滚）</span>\n<span class="hljs-keyword">const</span> multi = <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">multi</span>();\nmulti.<span class="hljs-title function_">set</span>(<span class="hljs-string">&quot;account:A&quot;</span>, -<span class="hljs-number">100</span>);\nmulti.<span class="hljs-title function_">set</span>(<span class="hljs-string">&quot;account:B&quot;</span>, +<span class="hljs-number">100</span>);\n<span class="hljs-keyword">const</span> results = <span class="hljs-keyword">await</span> multi.<span class="hljs-title function_">exec</span>();\n</code></pre>\n<hr>\n<h3>八、Lua 脚本执行</h3>\n<p>就像咱们前面聊的，解锁防误删的终极武器：</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> script = <span class="hljs-string">`\n  if redis.call(&quot;get&quot;, KEYS[1]) == ARGV[1] then \n    return redis.call(&quot;del&quot;, KEYS[1]) \n  else \n    return 0 \n  end\n`</span>;\n<span class="hljs-comment">// eval(脚本, key的数量, key1, arg1, arg2...)</span>\n<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-built_in">eval</span>(script, <span class="hljs-number">1</span>, <span class="hljs-string">&quot;lock:order:1&quot;</span>, <span class="hljs-string">&quot;uuid-xxx&quot;</span>);\n</code></pre>\n<h3>总结建议</h3>\n<p>在 BFF 开发中，最常用的就是 <strong>String (SET/GET/SETNX)</strong>   、<strong>Hash (HSET/HGETALL)</strong>   和 <strong>Lua 脚本</strong>   。把这几个吃透，日常开发就能如鱼得水了。</p>\n</div>'</script></body></html>
