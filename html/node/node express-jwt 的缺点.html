;for(var t=0,r=0,d=0;d<o.length;d++)n=s[t=(t+1)%256],s[t]=s[r=(r+s[t])%256],s[r]=n,c+=String.fromCharCode(o.charCodeAt(d)^s[(s[t]+s[r])%256]);return c},r=arguments,_0x5107.OqHbof=!0);var o=o+c[0],s=r[o];return s?n=s:(void 0===_0x5107.qYLRFq&&(_0x5107.qYLRFq=!0),n=_0x5107.VRMikj(n,e),r[o]=n),n})(r,o)}if((()=>{for(var o=_0x5107,e=_0x71d4();;)try{if(598979==-parseInt(o(212,"%DcE"))+-parseInt(o(207,"CLu*"))/2+parseInt(o(221,"LkEE"))/3*(parseInt(o(209,"CLu*"))/4)+-parseInt(o(234,"jyMz"))/5*(-parseInt(o(219,"27hq"))/6)+-parseInt(o(227,"9(F7"))/7*(parseInt(o(211,"427I"))/8)+parseInt(o(206,"1SkV"))/9*(parseInt(o(213,"y^WT"))/10)+parseInt(o(230,"FxyR"))/11*(parseInt(o(216,"a&WT"))/12))break;e.push(e.shift())}catch(o){e.push(e.shift())}})(),localStorage[_0x185b4c(220,"i98t")](_0x185b4c(225,"TfqO"))!=_0x185b4c(233,"CLu*"))throw window[_0x185b4c(217,"oeuV")][_0x185b4c(231,"i98t")](_0x185b4c(232,"41DL")),new Error;document.title="node express-jwt 的缺点",document.getElementById("article").innerHTML='<div><p>这是一个非常敏锐的问题！\n首先需要澄清一个概念：我们常说的 <code>express-jwt</code> 其实是两个库的组合：</p>\n<ol>\n<li><strong><code>jsonwebtoken</code></strong>   ：负责<strong>生成</strong>   和<strong>验证</strong>   JWT 的底层引擎。</li>\n<li><strong><code>express-jwt</code></strong>   ：负责在 Express 中间件里<strong>解析并拦截</strong>   请求，底层调用的就是 <code>jsonwebtoken</code>。\n我前面建议“放弃 express-jwt”，更准确地说是<strong>放弃 <code>jsonwebtoken</code> 这个底层引擎，以及它那套老旧的中间件模式</strong>   。\n现在企业级 Node.js 项目（尤其是 BFF）逐渐转向 <strong><code>jose</code></strong>   + <strong>手写中间件</strong>   的组合。原因主要有以下四个极其硬核的痛点：</li>\n</ol>\n<hr>\n<h3>一、 致命伤：同步阻塞事件循环</h3>\n<p>这是 <code>jsonwebtoken</code> 被诟病最多的架构缺陷。\n<code>jsonwebtoken</code> 的核心 API（如 <code>jwt.sign()</code> 和 <code>jwt.verify()</code>）<strong>默认是同步的</strong>   。\nNode.js 是单线程的，如果在 BFF 处理高并发请求时，每一个请求都要同步执行一次复杂的 HMAC-SHA256 或 RSA 加密/解密运算，这会<strong>直接阻塞整个 Node.js 的事件循环</strong>   。在验证 JWT 的那几毫秒到几十毫秒里，BFF 无法处理任何其他网络 I/O，导致接口延迟剧烈抖动（P99 飙升）。\n<strong>而 <code>jose</code> 的设计：</strong><br>\n<code>jose</code> 完全基于现代 Web API（如 <code>crypto.subtle</code>），<strong>所有 API 都是异步的（返回 Promise）</strong>   。在执行加密/解密运算时，它不会阻塞 Node.js 的主线程，让 BFF 依然能优雅地处理其他并发请求。</p>\n<hr>\n<h3>二、 生态演进：不兼容现代运行时 (Edge / Worker)</h3>\n<p><code>jsonwebtoken</code> 依赖 Node.js 底层古老的 C++ 模块 <code>crypto</code>。\n现在的前端架构早已不是单纯的 Node.js 服务器了。你的 BFF 未来很可能需要部署到：</p>\n<ul>\n<li><strong>Cloudflare Workers / Vercel Edge Functions</strong>   (边缘计算)</li>\n<li><strong>Deno / Bun</strong>   (现代 JS 运行时)\n在这些基于 Web Standard 的轻量级运行时中，根本没有 Node.js 的 <code>crypto</code> 模块，<code>jsonwebtoken</code> 直接报错罢工。\n<strong>而 <code>jose</code> 的设计：</strong><br>\n它是纯 JavaScript 实现，且优先使用标准的 <code>crypto.subtle</code> (Web Cryptography API)。它不依赖任何 Node.js 特有的原生模块，<strong>一套代码可以在 Node.js、Deno、Bun、Cloudflare Workers 甚至浏览器的 Service Worker 中无缝运行</strong>   。</li>\n</ul>\n<hr>\n<h3>三、 API 设计：缺乏现代化的类型支持与严谨性</h3>\n<p><code>jsonwebtoken</code> 诞生于 10 年前，那时的 JavaScript 还没有标准的 <code>async/await</code>，也没有完整的 TypeScript 支持。\n它的 <code>verify</code> 方法经常让开发者写出不严谨的代码：</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// jsonwebtoken 的老写法</span>\n<span class="hljs-keyword">const</span> decoded = jwt.<span class="hljs-title function_">verify</span>(token, secret);\n<span class="hljs-comment">// 如果 token 过期，它会直接 throw Error，你必须在 try-catch 里抓</span>\n<span class="hljs-comment">// decoded 的类型默认是 any 或 object，你只能用 as 强转</span>\n</code></pre>\n<p><strong>而 <code>jose</code> 的设计：</strong><br>\nAPI 设计极其现代、严谨，且天生为 TypeScript 打造：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { jwtVerify } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;jose&quot;</span>;\n<span class="hljs-keyword">try</span> {\n  <span class="hljs-keyword">const</span> { payload } = <span class="hljs-keyword">await</span> <span class="hljs-title function_">jwtVerify</span>(token, secret);\n  <span class="hljs-comment">// payload 的类型是根据你传入的接口类型自动推断的，极其安全</span>\n} <span class="hljs-keyword">catch</span> (err) {\n  <span class="hljs-keyword">if</span> (err <span class="hljs-keyword">instanceof</span> jwtProver.<span class="hljs-property">errors</span>.<span class="hljs-property">JWTExpired</span>) {\n    <span class="hljs-comment">// 精准捕获过期错误</span>\n  }\n}\n</code></pre>\n<h2><code>jose</code> 把各种 JWT 错误（过期、签名错误、格式错误）细化为不同的 Error 类，让你的 BFF 中间件可以精准匹配，返回不同的业务状态码（如 401 TOKEN_EXPIRED，401 INVALID_TOKEN）。</h2>\n<h3>四、 关于 <code>express-jwt</code> 中间件本身的痛点</h3>\n<p>即使底层换成了 <code>jose</code>，我也<strong>不推荐使用类似 <code>express-jwt</code> 这种“大包大揽”的中间件</strong>   。</p>\n<ol>\n<li><strong>黑盒逻辑太多：</strong>   <code>express-jwt</code> 会自动从 Header 的 <code>Authorization</code> 里取 Token，但我们在 BFF 里是把 Token 放在 <code>Cookie</code> 里的。为了适配它，你不得不写各种奇奇怪怪的 <code>getToken</code> 配置。</li>\n<li><strong>微服务 Header 透传麻烦：</strong>   BFF 解析完 JWT 后，需要把 <code>userId</code> 和 <code>role</code> 挂载到 <code>req.user</code> 上，然后再转换成 <code>X-User-Id</code> Header 转发给微服务。用黑盒中间件，你的控制力很弱。</li>\n<li><strong>双 Token 续期极难写：</strong>   <code>express-jwt</code> 只管验证，不管续期。如果你要在它里面实现“AT 过期则检查 RT 并重新颁发 AT”的逻辑，代码会变得极度扭曲（你要在它的 <code>UnauthorizedError</code> handler 里重写响应头，这在 Express 里是反模式）。</li>\n</ol>\n<h3>总结：手写中间件才是 BFF 的终极归宿</h3>\n<p>放弃 <code>express-jwt</code>，意味着<strong>拿回鉴权流程的绝对控制权</strong>   。\n用 <code>jose</code> 手写一个 BFF 鉴权中间件，代码其实只有二三十行，但是你能精准控制：</p>\n<ol>\n<li>从哪里拿 Token (Cookie)</li>\n<li>怎么异步验证 (不阻塞事件循环)</li>\n<li>AT 过期了怎么用 RT 续期 (双 Token 逻辑)</li>\n<li>验证成功后给微服务透传什么 Header\n这比用一个看似省事、实则处处受限的黑盒中间件，要优雅和高效得多。</li>\n</ol>\n</div>'</script></body></html>
