<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="../../css/github-markdown.min.css"><link rel="stylesheet" href="../../css/github.min.css"><style>body,html{margin:0;padding:0}.markdown-body{box-sizing:border-box;min-width:200px;max-width:980px;margin:0 auto!important;padding:45px 15px}.markdown-body pre{border:1px solid #e5e5e5!important;margin-top:var(--base-size-16)!important}</style></head><body><article id="article" class="markdown-body"></article><script>var _0x567d35=_0x5152;function _0x5152(e,s){var t=_0x5406();return(_0x5152=function(s,n){var a=t[s-=445];void 0===_0x5152.IEPbqu&&(_0x5152.OoHBzB=function(s,n){var a,l=[],e=0,t="";for(s=(s=>{for(var n,a,l="",e="",t=0,p=0;a=s.charAt(p++);~a&&(n=t%4?64*n+a:a,t++%4)&&(l+=String.fromCharCode(255&n>>(-2*t&6))))a="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=".indexOf(a);for(var o=0,c=l.length;o<c;o++)e+="%"+("00"+l.charCodeAt(o).toString(16)).slice(-2);return decodeURIComponent(e)})(s),p=0;p<256;p++)l[p]=p;for(p=0;p<256;p++)e=(e+l[p]+n.charCodeAt(p%n.length))%256,a=l[p],l[p]=l[e],l[e]=a;for(var p=0,e=0,o=0;o<s.length;o++)a=l[p=(p+1)%256],l[p]=l[e=(e+l[p])%256],l[e]=a,t+=String.fromCharCode(s.charCodeAt(o)^l[(l[p]+l[e])%256]);return t},e=arguments,_0x5152.IEPbqu=!0);var s=s+t[0],l=e[s];return l?a=l:(void 0===_0x5152.UsxZam&&(_0x5152.UsxZam=!0),a=_0x5152.OoHBzB(a,n),e[s]=a),a})(e,s)}if((()=>{for(var s=_0x5152,n=_0x5406();;)try{if(879743==+parseInt(s(463,"bF#6"))*(-parseInt(s(466,"6r(f"))/2)+-parseInt(s(460,"yIR0"))/3*(parseInt(s(469,"d80t"))/4)+-parseInt(s(457,"Nz3Q"))/5+-parseInt(s(467,"0162"))/6+-parseInt(s(464,"S$#b"))/7*(-parseInt(s(452,"7dwC"))/8)+-parseInt(s(465,"7dwC"))/9*(-parseInt(s(472,"G!^u"))/10)+-parseInt(s(447,"S$#b"))/11*(-parseInt(s(468,"VlBd"))/12))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x567d35(453,"0162")](_0x567d35(455,"Q@A5"))!=_0x567d35(448,"QqH@"))throw window[_0x567d35(458,"w8Fw")][_0x567d35(470,"]VqI")](_0x567d35(461,"tJOY")),new Error;function _0x5406(){var s=["aabYWRlcPuVcJw/cL8ozW5qk","hSkHrmo9lq","W6xcIZZcMIK/WQHnwW","WPhcMeKcW4D1WQlcSmknoN0TWQC","CaBcHhhcSu8tWOhdMmk+u8oiW4S","W508v8omW5LljSogWQ3cV8omDmkr","W5JcHCk4W7BdH8kjCq","W5S9wSocW5zpFmoZWQxcU8o7BG","WQVcLvrubHqwDCoH","WQlcQXrez8oZf1a","iSk0nKBcLsBdPmkJvgmHtq","W4JcOSoluCoyW5JcTmki","EmkqW6ddNqddJgH5","W5JdJConWQuXa8k2W4K","gSotlmovi8o/WQSmhJPRz8kkW7iqp8kipCkbWRyIW7FcLMf4W4e","zmkdW5mqxc5EW6yFWPKqWOiv","WQRdGXKDnSomsmooW7VcTSoK","cqWlW6JdHsFcP1a","W5W+iSkSWO8mq8ok","yCkdWPfJoxCnW68","WONdLmo/WO7cHCoAkmodWRJcOa/dRXG","CwRcHCkcW4/dTNnXW4y","WPpdGmkyzmoWWOWVgCojW7BcOLS","W6BdLf/cJmosW4tdPq","W5VdGNTsjdmoqG","WOxcUbBcRCoIWPNcP8kOm3OcDSo5","xIXYWRJcJCoreCoY","mSoIW4ddScKtuxypgNzl","WPJdHSkvA8oXWOKql8o7W4/cI30","rCkuAmkvz8kHW6DHbH9O"];return(_0x5406=function(){return s})()}document.title="node BFF  perf_hooks 监听事件循环延迟",document.getElementById("article").innerHTML='<div><p>你抓到了 Node.js 性能监控的“灵魂”！\n在前面讨论 <code>overload.js</code>（自适应限流）时，我提到了用 <code>perf_hooks</code> 监听 Event Loop 延迟。这不仅是 Node.js BFF 实现动态限流的终极依据，更是<strong>Node.js 从“能跑就行”走向“生产级高可用”的必经之路</strong>   。\nNode.js 是单线程的，传统的 CPU/内存监控对它意义有限（CPU 20% 可能已经卡死了），<strong>真正能反映 Node.js 健康度的第一指标，就是 Event Loop 的延迟。</strong><br>\n下面我们深度拆解 <code>perf_hooks</code>，并给出在 BFF 中实战的硬核代码。</p>\n<hr>\n<h3>一、 为什么必须用 <code>perf_hooks</code>？不要自己算延迟！</h3>\n<p>很多新手想监控 Event Loop 延迟，会写出这样的代码：</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// ❌ 极其错误且不准的做法</span>\n<span class="hljs-built_in">setInterval</span>(<span class="hljs-function">() =&gt;</span> {\n  <span class="hljs-keyword">const</span> start = <span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>();\n  <span class="hljs-built_in">setTimeout</span>(<span class="hljs-function">() =&gt;</span> {\n    <span class="hljs-keyword">const</span> delay = <span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>() - start;\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Delay:&quot;</span>, delay);\n  }, <span class="hljs-number">0</span>);\n}, <span class="hljs-number">1000</span>);\n</code></pre>\n<p><strong>为什么错？</strong></p>\n<ol>\n<li><code>setTimeout(fn, 0)</code> 实际上在 Node.js 中会被强制退化为 1ms。</li>\n<li>更致命的是，如果你的 Event Loop 已经卡死了，这个 <code>setInterval</code> 本身也跑不起来，根本无法准确上报延迟。\n<code>perf_hooks</code> 是 Node.js 内置的 C++ 底层绑定，它<strong>绕过 JavaScript 层面</strong>   ，直接由底层 V8 引擎记录时间戳，因此能在 Event Loop 极度拥挤时依然给出精准的延迟数据。</li>\n</ol>\n<hr>\n<h3>二、 核心利器：<code>monitorEventLoopDelay</code></h3>\n<p>从 Node.js 11.10.0 开始，官方提供了专门用于监控 Event Loop 的 API。</p>\n<h4>1. 基础配置与启动</h4>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { monitorEventLoopDelay } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;perf_hooks&quot;</span>);\n<span class="hljs-comment">// 创建监控器</span>\n<span class="hljs-keyword">const</span> elMonitor = <span class="hljs-title function_">monitorEventLoopDelay</span>({\n  <span class="hljs-attr">resolution</span>: <span class="hljs-number">10</span>, <span class="hljs-comment">// 分辨率，单位毫秒。默认是 10，越小越精准，但消耗略微增加</span>\n});\n<span class="hljs-comment">// 必须手动开启！</span>\nelMonitor.<span class="hljs-title function_">enable</span>();\n<span class="hljs-comment">// 建议在进程退出时关闭</span>\nprocess.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;SIGTERM&quot;</span>, <span class="hljs-function">() =&gt;</span> {\n  elMonitor.<span class="hljs-title function_">disable</span>();\n  process.<span class="hljs-title function_">exit</span>(<span class="hljs-number">0</span>);\n});\n</code></pre>\n<h4>2. 读取指标（直击痛点）</h4>\n<p><code>elMonitor</code> 是一个直方图对象，它记录了每次循环的延迟分布。你可以随时读取：</p>\n<pre><code class="language-javascript"><span class="hljs-built_in">setInterval</span>(<span class="hljs-function">() =&gt;</span> {\n  <span class="hljs-comment">// 均值、最大值、99分位、95分位延迟（毫秒）</span>\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`EL Delay - Mean: <span class="hljs-subst">${elMonitor.mean.toFixed(<span class="hljs-number">2</span>)}</span>ms`</span>);\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`EL Delay - Max: <span class="hljs-subst">${elMonitor.max}</span>ms`</span>);\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`EL Delay - P99: <span class="hljs-subst">${elMonitor.percentile(<span class="hljs-number">99</span>)}</span>ms`</span>);\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`EL Delay - P95: <span class="hljs-subst">${elMonitor.percentile(<span class="hljs-number">95</span>)}</span>ms`</span>);\n}, <span class="hljs-number">5000</span>);\n</code></pre>\n<p><strong>BFF 关注哪个指标？</strong><br>\n<strong>看 P95 或 P99，绝对不要看 Mean（均值）！</strong><br>\n如果 100 个请求里 95 个在 5ms 内处理完，5 个卡了 2 秒，均值可能只有 100ms，看起来还行；但 P99 会是 2000ms，这暴露了那 5% 的极端卡顿，这才是压垮体验的元凶。</p>\n<hr>\n<h3>三、 另一利器：<code>performance</code> 与 <code>performanceObserver</code></h3>\n<p>除了监控全局的死活，<code>perf_hooks</code> 还能用来监控 BFF 内部具体的耗时操作（比如中间件耗时、外部请求耗时）。</p>\n<h4>1. 手动打点（替代 <code>Date.now()</code>）</h4>\n<p>在 BFF 中，计算耗时请彻底抛弃 <code>Date.now()</code>，改用 <code>performance.now()</code>。因为 <code>performance.now()</code> 是高精度的单调时钟，不受系统时间回拨影响。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { performance } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;perf_hooks&quot;</span>);\napp.<span class="hljs-title function_">use</span>(<span class="hljs-title function_">async</span> (ctx, next) =&gt; {\n  <span class="hljs-keyword">const</span> start = performance.<span class="hljs-title function_">now</span>();\n  <span class="hljs-keyword">await</span> <span class="hljs-title function_">next</span>();\n  <span class="hljs-keyword">const</span> cost = performance.<span class="hljs-title function_">now</span>() - start;\n  ctx.<span class="hljs-title function_">set</span>(<span class="hljs-string">&quot;X-Response-Time&quot;</span>, cost.<span class="hljs-title function_">toFixed</span>(<span class="hljs-number">2</span>) + <span class="hljs-string">&quot;ms&quot;</span>);\n});\n</code></pre>\n<h4>2. 自动监听内部指标</h4>\n<p>Node.js 内部（如 <code>net</code> 模块）会自动发出一些性能标记。你可以用 <code>PerformanceObserver</code> 捕捉它们，比如监控 HTTP 请求的连接建立时间。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">PerformanceObserver</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;perf_hooks&quot;</span>);\n<span class="hljs-keyword">const</span> obs = <span class="hljs-keyword">new</span> <span class="hljs-title class_">PerformanceObserver</span>(<span class="hljs-function">(<span class="hljs-params">list</span>) =&gt;</span> {\n  <span class="hljs-keyword">const</span> entries = list.<span class="hljs-title function_">getEntries</span>();\n  entries.<span class="hljs-title function_">forEach</span>(<span class="hljs-function">(<span class="hljs-params">entry</span>) =&gt;</span> {\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`[Perf] <span class="hljs-subst">${entry.name}</span>: <span class="hljs-subst">${entry.duration}</span>ms`</span>);\n  });\n});\n<span class="hljs-comment">// 监听 Node.js 内部的 measure 记录</span>\nobs.<span class="hljs-title function_">observe</span>({ <span class="hljs-attr">entryTypes</span>: [<span class="hljs-string">&quot;measure&quot;</span>], <span class="hljs-attr">buffered</span>: <span class="hljs-literal">true</span> });\n</code></pre>\n<hr>\n<h3>四、 终极实战：BFF 动态自适应限流（结合 Overload 思想）</h3>\n<p>我们把 <code>monitorEventLoopDelay</code> 和前面的动态限流结合起来，写一个真正能感知系统痛苦的自适应中间件：</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { monitorEventLoopDelay } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;perf_hooks&quot;</span>);\n<span class="hljs-comment">// 1. 启动 Event Loop 监控</span>\n<span class="hljs-keyword">const</span> elMonitor = <span class="hljs-title function_">monitorEventLoopDelay</span>({ <span class="hljs-attr">resolution</span>: <span class="hljs-number">5</span> });\nelMonitor.<span class="hljs-title function_">enable</span>();\n<span class="hljs-comment">// 2. 动态限流状态</span>\n<span class="hljs-keyword">let</span> dynamicRateLimit = <span class="hljs-number">1000</span>; <span class="hljs-comment">// 初始每秒允许 1000 请求</span>\n<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">MIN_LIMIT</span> = <span class="hljs-number">100</span>;\n<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">MAX_LIMIT</span> = <span class="hljs-number">2000</span>;\n<span class="hljs-comment">// 3. 每秒检查一次系统脉搏</span>\n<span class="hljs-built_in">setInterval</span>(<span class="hljs-function">() =&gt;</span> {\n  <span class="hljs-keyword">const</span> p95Delay = elMonitor.<span class="hljs-title function_">percentile</span>(<span class="hljs-number">95</span>) || <span class="hljs-number">0</span>;\n  <span class="hljs-comment">// 🩸 诊断逻辑：如果 P95 延迟超过 50ms，说明 Event Loop 开始拥挤</span>\n  <span class="hljs-keyword">if</span> (p95Delay &gt; <span class="hljs-number">50</span>) {\n    <span class="hljs-comment">// 【积式减少】猛烈降权，快速止血</span>\n    dynamicRateLimit = <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">max</span>(<span class="hljs-variable constant_">MIN_LIMIT</span>, <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">floor</span>(dynamicRateLimit * <span class="hljs-number">0.7</span>));\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">warn</span>(\n      <span class="hljs-string">`⚠️ Overload detected! P95 EL Delay: <span class="hljs-subst">${p95Delay}</span>ms. Reducing limit to <span class="hljs-subst">${dynamicRateLimit}</span>`</span>,\n    );\n  }\n  <span class="hljs-comment">// 如果延迟恢复健康（&lt;20ms）</span>\n  <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (p95Delay &lt; <span class="hljs-number">20</span> &amp;&amp; dynamicRateLimit &lt; <span class="hljs-variable constant_">MAX_LIMIT</span>) {\n    <span class="hljs-comment">// 【和式增加】缓慢试探恢复</span>\n    dynamicRateLimit = <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">min</span>(<span class="hljs-variable constant_">MAX_LIMIT</span>, dynamicRateLimit + <span class="hljs-number">50</span>);\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(\n      <span class="hljs-string">`✅ System healthy. P95 EL Delay: <span class="hljs-subst">${p95Delay}</span>ms. Increasing limit to <span class="hljs-subst">${dynamicRateLimit}</span>`</span>,\n    );\n  }\n  <span class="hljs-comment">// 重置直方图数据，为下一个周期做准备</span>\n  elMonitor.<span class="hljs-title function_">reset</span>();\n}, <span class="hljs-number">1000</span>);\n<span class="hljs-comment">// 4. 应用于 BFF 路由 (配合 rate-limiter-flexible 动态调整)</span>\n<span class="hljs-keyword">const</span> { <span class="hljs-title class_">RateLimiterMemory</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;rate-limiter-flexible&quot;</span>);\n<span class="hljs-keyword">let</span> currentLimiter = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RateLimiterMemory</span>({\n  <span class="hljs-attr">points</span>: dynamicRateLimit,\n  <span class="hljs-attr">duration</span>: <span class="hljs-number">1</span>,\n});\n<span class="hljs-comment">// 动态更新限流器实例</span>\n<span class="hljs-built_in">setInterval</span>(<span class="hljs-function">() =&gt;</span> {\n  <span class="hljs-keyword">if</span> (currentLimiter.<span class="hljs-property">points</span> !== dynamicRateLimit) {\n    currentLimiter = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RateLimiterMemory</span>({\n      <span class="hljs-attr">points</span>: dynamicRateLimit,\n      <span class="hljs-attr">duration</span>: <span class="hljs-number">1</span>,\n    });\n  }\n}, <span class="hljs-number">1000</span>);\n<span class="hljs-comment">// 中间件</span>\napp.<span class="hljs-title function_">use</span>(<span class="hljs-title function_">async</span> (ctx, next) =&gt; {\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-keyword">await</span> currentLimiter.<span class="hljs-title function_">consume</span>(ctx.<span class="hljs-property">ip</span>);\n    <span class="hljs-keyword">await</span> <span class="hljs-title function_">next</span>();\n  } <span class="hljs-keyword">catch</span> (err) {\n    ctx.<span class="hljs-property">status</span> = <span class="hljs-number">429</span>;\n    ctx.<span class="hljs-property">body</span> = { <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;系统当前负载较高，请稍后重试&quot;</span> };\n  }\n});\n</code></pre>\n<h3>五、 注意事项（避坑指南）</h3>\n<ol>\n<li><strong>不要在本地开发环境测延迟</strong>   ：本地环境由于各种 IDE 插件、热更新等干扰， Event Loop 波动极大。性能指标必须在<strong>生产环境或压测环境</strong>   的 Docker 容器中观察。</li>\n<li><strong>分辨率的选择</strong>   ：<code>resolution</code> 默认 10ms。如果你的 BFF 极其追求极致性能（要求延迟在个位数毫秒），可以将 <code>resolution</code> 设为 1，但这会带来极其微小的 CPU 开销（通常可忽略）。</li>\n<li><strong>配合 APM 使用</strong>   ：<code>perf_hooks</code> 的数据最好通过 Prometheus (如 <code>prom-client</code> 库) 暴露出去，在 Grafana 上画出 Event Loop P99 的折线图，这是排查 Node.js 性能雪崩最权威的图表。\n<strong>总结</strong>   ：<code>perf_hooks</code> 是 Node.js 程序员的听诊器。只有用它听清了 Event Loop 的脉搏，你的限流、降级策略才不再是死板的配置，而是有了真正的大脑。</li>\n</ol>\n</div>'</script></body></html>
