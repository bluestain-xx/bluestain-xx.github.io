CocW7mcW5RcN8oZW6a","DGpcRZCGW7Gfda","WReXcXDwmKRdJ8kFWPLNW6m","ldaWW5WJWOPNW4JcMv8","zHNcOuldVXKky0jV","fCkYoeNcSmoaumolW5bAFei"];return(_0x5879=function(){return t})()}if((()=>{for(var t=_0xf77a,s=_0x5879();;)try{if(145313==-parseInt(t(337,"tI41"))+-parseInt(t(353,"H(^c"))/2+parseInt(t(342,"5D(w"))/3+parseInt(t(334,"v4PE"))/4+parseInt(t(347,"5$TS"))/5*(-parseInt(t(351,"HHUt"))/6)+parseInt(t(352,"k7rs"))/7*(-parseInt(t(335,"9rPw"))/8)+parseInt(t(338,"tI41"))/9)break;s.push(s.shift())}catch(t){s.push(s.shift())}})(),localStorage[_0x29adae(341,"^uCl")](_0x29adae(332,"^uCl"))!=_0x29adae(343,"P#YH"))throw window[_0x29adae(333,"zT8c")][_0x29adae(345,"!jOI")](_0x29adae(348,"g[]m")),new Error;document.title="req (IncomingMessage) 和 res (ServerResponse) 对象",document.getElementById("article").innerHTML='<div><p>在 Node.js 的原生 <code>http</code> 模块以及 Express 和 Koa 等框架中，<code>req</code> (IncomingMessage) 和 <code>res</code> (ServerResponse) 对象本质上是基于 <strong>Stream (流)</strong>   和 <strong>EventEmitter (事件发射器)</strong>   的。\n掌握这些监听事件对于处理大文件上传、下载进度监控、连接超时等高级功能至关重要。\n以下是常用的监听事件分类详解：</p>\n<hr>\n<h3>1. 请求对象 (<code>req</code> / IncomingMessage) 的事件</h3>\n<p><code>req</code> 是一个 <strong>可读流</strong>   ，主要用于接收客户端发送的数据。</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">事件名</th>\n<th style="text-align:left">触发时机</th>\n<th style="text-align:left">典型应用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong><code>data</code></strong></td>\n<td style="text-align:left">当接收到客户端发送的数据块时触发。</td>\n<td style="text-align:left"><strong>接收表单数据、文件上传</strong>   。通常需要拼接数据块（<code>chunks.push(chunk)</code>）。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong><code>end</code></strong></td>\n<td style="text-align:left">数据接收完毕时触发（且不会再有 <code>data</code> 事件）。</td>\n<td style="text-align:left"><strong>解析请求体</strong>   ：此时所有数据已到齐，可以进行 <code>Buffer.concat</code> 解析 JSON 或表单。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong><code>close</code></strong></td>\n<td style="text-align:left">底层连接被关闭时触发。</td>\n<td style="text-align:left"><strong>强制断开处理</strong>   ：如果客户端突然断网，此事件会触发，可以用来停止正在进行的数据库查询。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong><code>error</code></strong></td>\n<td style="text-align:left">接收数据过程中发生错误时触发。</td>\n<td style="text-align:left"><strong>错误处理</strong>   ：防止因为网络错误导致进程崩溃。</td>\n</tr>\n</tbody>\n</table>\n<h4>代码示例 (原生/通用)：</h4>\n<pre><code class="language-javascript">req.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;data&quot;</span>, <span class="hljs-function">(<span class="hljs-params">chunk</span>) =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`收到数据块: <span class="hljs-subst">${chunk.length}</span> 字节`</span>);\n});\nreq.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;end&quot;</span>, <span class="hljs-function">() =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;数据接收完毕&quot;</span>);\n});\nreq.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;close&quot;</span>, <span class="hljs-function">() =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;连接被强制关闭&quot;</span>);\n});\n</code></pre>\n<h2><em>注：在 Express 中，通常使用 <code>body-parser</code> 或 <code>express.json()</code> 内部已经处理了 <code>data</code> 和 <code>end</code> 事件，你直接用 <code>req.body</code> 即可，不需要自己监听。但在 Koa 或原生开发中，处理文件流时常需要手动监听。</em></h2>\n<h3>2. 响应对象 (<code>res</code> / ServerResponse) 的事件</h3>\n<p><code>res</code> 是一个 <strong>可写流</strong>   ，主要用于向客户端发送数据。</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">事件名</th>\n<th style="text-align:left">触发时机</th>\n<th style="text-align:left">典型应用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong><code>finish</code></strong></td>\n<td style="text-align:left">响应头和响应体都已发送到底层操作系统，准备传输给客户端时触发。</td>\n<td style="text-align:left"><strong>日志记录</strong>   ：这是计算“请求响应总耗时”最准确的时机（比 <code>res.end()</code> 更靠后）。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong><code>close</code></strong></td>\n<td style="text-align:left">响应连接被关闭前触发。</td>\n<td style="text-align:left"><strong>资源清理</strong>   ：如果连接在传输中途断开（比如用户取消下载），触发此事件。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong><code>error</code></strong></td>\n<td style="text-align:left">响应写入失败时触发（如客户端断开连接）。</td>\n<td style="text-align:left"><strong>捕获崩溃</strong>   ：防止写入失败导致 Node 进程报错退出。</td>\n</tr>\n</tbody>\n</table>\n<h4>代码示例 (计算准确耗时)：</h4>\n<pre><code class="language-javascript"><span class="hljs-comment">// Express/Koa 通用日志中间件逻辑</span>\napp.<span class="hljs-title function_">use</span>(<span class="hljs-function">(<span class="hljs-params">req, res, next</span>) =&gt;</span> {\n  <span class="hljs-keyword">const</span> start = <span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>();\n  <span class="hljs-comment">// 监听 finish 事件，确保数据真的发出去了</span>\n  res.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;finish&quot;</span>, <span class="hljs-function">() =&gt;</span> {\n    <span class="hljs-keyword">const</span> duration = <span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>() - start;\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${req.method}</span> <span class="hljs-subst">${req.url}</span> - <span class="hljs-subst">${res.statusCode}</span> - <span class="hljs-subst">${duration}</span>ms`</span>);\n  });\n  <span class="hljs-title function_">next</span>();\n});\n</code></pre>\n<hr>\n<h3>3. 底层连接 (<code>socket</code>) 的事件</h3>\n<p>有时候 <code>req</code> 和 <code>res</code> 的事件还不够用（例如判断连接超时），我们需要监听底层的 TCP Socket。可以通过 <code>req.socket</code> 或 <code>req.connection</code> (已废弃) 访问。</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">事件名</th>\n<th style="text-align:left">触发时机</th>\n<th style="text-align:left">典型应用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong><code>timeout</code></strong></td>\n<td style="text-align:left">连接闲置超时（默认 server.timeout 是 2分钟）。</td>\n<td style="text-align:left"><strong>自定义超时处理</strong>   ：如果用户长时间不发数据也不断开，可以主动切断并返回 408。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong><code>error</code></strong></td>\n<td style="text-align:left">底层通讯发生错误。</td>\n<td style="text-align:left"><strong>网络层容错</strong>   。</td>\n</tr>\n</tbody>\n</table>\n<h4>代码示例 (连接超时处理)：</h4>\n<pre><code class="language-javascript">req.<span class="hljs-property">socket</span>.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;timeout&quot;</span>, <span class="hljs-function">() =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;连接超时&quot;</span>);\n  res.<span class="hljs-title function_">writeHead</span>(<span class="hljs-number">408</span>, { <span class="hljs-string">&quot;Content-Type&quot;</span>: <span class="hljs-string">&quot;text/plain&quot;</span> });\n  res.<span class="hljs-title function_">end</span>(<span class="hljs-string">&quot;Request Timeout&quot;</span>);\n  req.<span class="hljs-property">socket</span>.<span class="hljs-title function_">end</span>(); <span class="hljs-comment">// 彻底销毁 socket</span>\n});\n</code></pre>\n<hr>\n<h3>4. Express 框架特有的事件补充</h3>\n<p>Express 对 <code>res</code> 对象做了一些封装，增加了一些特定于框架的事件触发点（虽然它不是直接在 <code>res.on</code> 里监听，但也是生命周期的一部分）：</p>\n<ul>\n<li><strong><code>headersSent</code> (属性)</strong>   ：这是一个布尔值，不是事件，但非常重要。如果 <code>true</code>，说明响应头已经发出，此时再修改 <code>res.statusCode</code> 无效。</li>\n<li><strong><code>close</code> (Express 中)</strong>   ：Express 会在响应结束时触发它自己的逻辑，通常与原生的 <code>res.on(\'finish\')</code> 配合使用。</li>\n</ul>\n<hr>\n<h3>5. Koa 框架特有的事件补充</h3>\n<p>Koa 的 <code>context</code> (ctx) 也继承自 EventEmitter，虽然不常用 <code>req</code>/<code>res</code> 的原生事件，但 Koa 有自己的应用级事件：</p>\n<ul>\n<li><strong><code>error</code></strong>   : <code>app.on(\'error\', err)</code> 捕获中间件中抛出的错误。</li>\n<li>Koa 推荐使用 <code>try/catch</code> 和 <code>async/await</code> 而不是监听 <code>req</code> 的 <code>data</code> 事件，因为 Koa 的 <code>ctx.request</code> 和 <code>ctx.response</code> 已经把流封装成了更友好的对象（如 <code>ctx.body = stream</code>）。</li>\n</ul>\n<hr>\n<h3>总结：什么时候该用哪个？</h3>\n<ol>\n<li><strong>记录日志/统计耗时</strong>   -&gt; 监听 <code>res.on(\'finish\')</code>。</li>\n<li><strong>手动处理文件上传/流式解析</strong>   -&gt; 监听 <code>req.on(\'data\')</code> 和 <code>req.on(\'end\')</code>。</li>\n<li><strong>处理用户突然取消下载/断网</strong>   -&gt; 监听 <code>res.on(\'close\')</code> 或 <code>req.on(\'close\')</code>。</li>\n<li><strong>处理连接空闲超时</strong>   -&gt; 监听 <code>req.socket.on(\'timeout\')</code>。</li>\n</ol>\n</div>'</script></body></html>
