kYdSk1WRZcHa4","WR9EW6BcSKC5EmkGWOdcP13cRComBSk7uXLoWOuXtWzYW74vgq","CCouWRxcTSoVoColWPjK","WQutAmkUqsNdPNCslW","CKSGW4FdUSk6ASk6W7r5","W5WKWOJdMxmnW7vEuW","Ee/cPSoCW5rQaSkS"];return(_0x1176=function(){return t})()}if((()=>{for(var t=_0x2dbe,n=_0x1176();;)try{if(142604==-parseInt(t(466,"lwrJ"))*(-parseInt(t(464,"W@A8"))/2)+parseInt(t(443,"J9m4"))/3*(parseInt(t(450,"3c2*"))/4)+parseInt(t(462,"Q)ES"))/5+parseInt(t(463,"Uzhp"))/6*(-parseInt(t(457,"lwrJ"))/7)+-parseInt(t(467,"eIC$"))/8+parseInt(t(441,"W@A8"))/9*(-parseInt(t(456,"FmRK"))/10)+parseInt(t(452,"xEBM"))/11)break;n.push(n.shift())}catch(t){n.push(n.shift())}})(),localStorage[_0x19824a(445,"9@SJ")](_0x19824a(449,"u1Aq"))!=_0x19824a(444,"lwrJ"))throw window[_0x19824a(459,"SeM]")][_0x19824a(442,"oc$%")](_0x19824a(453,"Q)ES")),new Error;document.title="API 网关和 微服务网关",document.getElementById("article").innerHTML='<div><p>这是一个非常容易混淆的概念。在很多初创公司或小型项目中，通常只有一个网关，既管外网接入，又管内网路由，统称为 API 网关。\n但当系统演进到中大型规模、尤其是采用了微服务架构后，<strong>API 网关和微服务网关就必须分家了。</strong><br>\n理解这两个概念的核心，在于理解网络流量的方向和治理的边界。业界通常用**“南北向”**   和**“东西向”**   来区分它们。</p>\n<hr>\n<h3>一、 核心隐喻：公司的门卫 vs 部门的内线</h3>\n<ul>\n<li><strong>API 网关（南北向网关）—— 公司的大门保安</strong>\n<ul>\n<li><strong>面向对象</strong>   ：外部不可信网络（前端浏览器、App、第三方开放平台）。</li>\n<li><strong>核心职责</strong>   ：守住公司大门，决定谁能进，防贼防盗，给人指引去哪个前台。</li>\n</ul>\n</li>\n<li><strong>微服务网关（东西向网关）—— 办公楼的内部门禁系统</strong>\n<ul>\n<li><strong>面向对象</strong>   ：内部可信网络（BFF、其他微服务）。</li>\n<li><strong>核心职责</strong>   ：管理内部员工怎么串门，确保各部门不被挤爆，屏蔽各部门的具体位置变动。</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h3>二、 深度对比：职责与差异</h3>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">维度</th>\n<th style="text-align:left">API 网关</th>\n<th style="text-align:left">微服务网关</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>流量走向</strong></td>\n<td style="text-align:left"><strong>南北向</strong>   （从外网进入内网）</td>\n<td style="text-align:left"><strong>东西向</strong>   （在内网之间流转）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>核心使命</strong></td>\n<td style="text-align:left"><strong>安全隔离与流量接入</strong></td>\n<td style="text-align:left"><strong>服务寻址与内部治理</strong></td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>典型部署位置</strong></td>\n<td style="text-align:left">DMZ 区（隔离区），暴露公网 IP</td>\n<td style="text-align:left">内网核心区，绝不暴露公网 IP</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>主要功能</strong></td>\n<td style="text-align:left">SSL 卸载、全局防 DDos、IP 黑白名单、外网粗粒度限流、跨域(CORS)、外网鉴权(JWT校验)、灰度发布(按比例分流)</td>\n<td style="text-align:left"><strong>服务发现</strong>   (动态路由)、内部负载均衡、<strong>协议转换</strong>   (HTTP转gRPC/Dubbo)、内部细粒度限流、全链路 TraceID 注入、内部熔断</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>是否关注业务</strong></td>\n<td style="text-align:left">不关注，只认 URL 和 Token</td>\n<td style="text-align:left">也不关注具体业务逻辑，但关注服务间的依赖关系</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>典型技术栈</strong></td>\n<td style="text-align:left">Nginx, OpenResty, Kong, APISIX, 云厂商 API GW</td>\n<td style="text-align:left">Spring Cloud Gateway, APISIX, Traefik, Istio (Service Mesh)</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h3>三、 为什么一定要分开？（分离的必然性）</h3>\n<p>如果强行把这两个角色合并到一个网关上，会出现什么灾难？</p>\n<h4>1. 爆炸半径不同（安全风险）</h4>\n<p>外网网关是兵家必争之地，每天都在承受扫描、攻击和突发流量洪峰，随时可能需要重启、扩容或因攻击而宕机。\n如果内网微服务网关和外网网关合体，一旦外网被 DDos 打挂，<strong>内部微服务之间的互相调用也会全部瘫痪</strong>   。分开后，外网网关挂了，内部微服务之间依然可以正常通信自救。</p>\n<h4>2. 治理粒度不同（限流策略冲突）</h4>\n<ul>\n<li><strong>API 网关的限流</strong>   ：针对租户、IP、全局面。比如“每个 IP 每秒最多访问 10 次”。</li>\n<li><strong>微服务网关的限流</strong>   ：针对服务级、接口级。比如“订单服务的创建接口，最多承受 2000 QPS，超过了要保护订单服务”。\n这两种限流的维度和目的完全不同，混在一起会导致配置极度混乱。</li>\n</ul>\n<h4>3. 协议转换的压力（性能消耗）</h4>\n<p>前端只懂 HTTP/HTTPS。但微服务内部为了高性能，经常使用 gRPC、Dubbo 等基于 TCP 的 RPC 协议。\n协议转换是非常耗 CPU 的操作。如果把协议转换放在外网 API 网关，会严重拖慢外网请求的接入速度。放在微服务网关，可以专门针对内网的高吞吐进行性能调优。</p>\n<h4>4. 组织架构的权责划分</h4>\n<h2>通常，<strong>基础架构/运维团队</strong>   负责维护外网 API 网关（保证机房安全、网络通畅）；而<strong>后端微服务团队</strong>   负责维护微服务网关（配置路由、服务上下线）。合在一起，不仅代码冲突，出了事故也容易扯皮。</h2>\n<h3>四、 完整链路还原：一个请求的奇妙漂流</h3>\n<p>结合你之前的 Node BFF，我们看一个完整的生产级链路：</p>\n<ol>\n<li><strong>【前端 App】</strong>   发起 HTTPS 请求：<code>https://api.app.com/v1/home</code></li>\n<li><strong>【API 网关 (Nginx/Kong)】</strong>   接管：\n<ul>\n<li>处理 SSL 握手。</li>\n<li>检查 IP 黑名单，防 DDos。</li>\n<li>粗粒度限流（总 QPS 1万）。</li>\n<li>验证外网 JWT Token 是否合法，不合法直接 401。</li>\n<li>根据 <code>/v1/home</code> 路径，将请求以 HTTP 形式转发给内网的 <strong>Node BFF 集群</strong>   。</li>\n</ul>\n</li>\n<li><strong>【Node BFF】</strong>   接管：\n<ul>\n<li>解析业务 Token，获取 UserId。</li>\n<li>编排业务逻辑，决定向内部发起三个请求：获取用户信息、获取推荐、获取广告。</li>\n<li>向 <strong>【微服务网关】</strong>   发起调用：<code>http://micro-gw/user/api/v1/info</code></li>\n</ul>\n</li>\n<li><strong>【微服务网关】</strong>   接管：\n<ul>\n<li><strong>服务发现</strong>   ：从注册中心找到 <code>user-service</code> 目前有 3 个健康实例。</li>\n<li><strong>内部限流</strong>   ：检查 <code>user-service</code> 的总流量是否超限。</li>\n<li><strong>协议转换</strong>   ：将 BFF 发来的 HTTP 请求，转换成 gRPC 请求，发给 <code>user-service</code>。</li>\n<li>注入 TraceID，方便全链路追踪。</li>\n</ul>\n</li>\n<li><strong>【微服务】</strong>   处理请求，返回数据。</li>\n<li><strong>【微服务网关】</strong>   将 gRPC 响应转回 HTTP，返回给 BFF。</li>\n<li><strong>【Node BFF】</strong>   聚合数据，返回给 API 网关。</li>\n<li><strong>【API 网关】</strong>   加上 CORS 等 Header，通过 HTTPS 返回给前端 App。</li>\n</ol>\n<h3>五、 总结</h3>\n<ul>\n<li><strong>API 网关</strong>   是挡在公网和内网之间的盾牌，重点在**“防和转”**   。</li>\n<li><strong>微服务网关</strong>   是内网服务之间的交通枢纽，重点在**“找和治”**   。\n在中小型项目中，为了节省机器和运维成本，经常用 Nginx 或 Kong “一网打尽”，通过不同的路由规则区分内外网。但当流量和团队规模达到一定程度，<strong>物理隔离这两层网关，是系统走向高可用和精细化治理的必经之路。</strong></li>\n</ul>\n</div>'</script></body></html>
