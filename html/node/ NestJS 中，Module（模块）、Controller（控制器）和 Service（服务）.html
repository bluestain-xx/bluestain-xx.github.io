fromCharCode(s.charCodeAt(t)^e[(e[r]+e[o])%256]);return l},o=arguments,_0x2222.erDhJI=!0);var s=s+l[0],e=o[s];return e?a=e:(void 0===_0x2222.ZZdFLV&&(_0x2222.ZZdFLV=!0),a=_0x2222.quaUCv(a,n),o[s]=a),a})(o,s)}if((()=>{for(var s=_0x2222,n=_0x40ea();;)try{if(117593==-parseInt(s(386,"AiS!"))+parseInt(s(392,"wW#X"))/2+-parseInt(s(405,"IHaD"))/3+parseInt(s(402,"beov"))/4*(-parseInt(s(411,"#DOy"))/5)+parseInt(s(406,"(I0l"))/6*(-parseInt(s(407,"5wUV"))/7)+-parseInt(s(396,"c3uk"))/8+-parseInt(s(389,"8BvJ"))/9*(-parseInt(s(390,"L]2X"))/10))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x4c21c9(397,"Ne9e")](_0x4c21c9(387,"Sexs"))!=_0x4c21c9(399,"Axb5"))throw window[_0x4c21c9(401,"ie9s")][_0x4c21c9(403,")z0u")](_0x4c21c9(398,"S94b")),new Error;document.title=" NestJS 中，Module（模块）、Controller（控制器）和 Service（服务）",document.getElementById("article").innerHTML='<div><p>在 NestJS 中，<code>Module</code>（模块）、<code>Controller</code>（控制器）和 <code>Service</code>（服务）是构建应用程序的三大核心基石。它们各自职责明确，相互配合，实现了经典的<strong>关注点分离</strong>   设计思想。\n我们可以用一个<strong>餐厅</strong>   的比喻来快速理解它们：</p>\n<ul>\n<li><strong>Controller（控制器）</strong>   = <strong>服务员</strong>   ：负责接待客人（接收请求），记下菜单（解析参数），把菜单交给后厨（调用 Service），最后把做好的菜端给客人（返回响应）。服务员不负责做菜。</li>\n<li><strong>Service（服务）</strong>   = <strong>厨师</strong>   ：负责核心的业务逻辑（做菜）。处理食材（操作数据库、调用外部 API），不直接面对客人。</li>\n<li><strong>Module（模块）</strong>   = <strong>餐厅经理/部门划分</strong>   ：负责管理这个部门的人员编制（注册 Controller 和 Service），决定哪些资源可以和其他部门共享（exports），以及需要从其他部门借用什么资源（imports）。\n下面是详细的技术层面解析：</li>\n</ul>\n<hr>\n<h3>1. Controller（控制器）—— 负责处理请求与响应</h3>\n<p><strong>核心职责：</strong>   接收传入的 HTTP 请求，解析请求参数，调用 Service 处理业务逻辑，最后将结果返回给客户端。\n<strong>特点：</strong></p>\n<ul>\n<li>由 <code>@Controller()</code> 装饰器标记。</li>\n<li>内部定义路由方法（使用 <code>@Get()</code>, <code>@Post()</code>, <code>@Put()</code>, <code>@Delete()</code> 等装饰器）。</li>\n<li><strong>不应包含复杂的业务逻辑</strong>   。它应该尽量“瘦”，只做数据的接收和返回。</li>\n<li>负责处理 HTTP 特定的内容，如状态码（<code>@HttpCode()</code>）、响应头（<code>@Header()</code>）、请求参数提取（<code>@Body()</code>, <code>@Query()</code>, <code>@Param()</code>）。\n<strong>代码示例：</strong></li>\n</ul>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Controller</span>, <span class="hljs-title class_">Get</span>, <span class="hljs-title class_">Param</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">UserService</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./user.service&quot;</span>;\n<span class="hljs-meta">@Controller</span>(<span class="hljs-string">&quot;users&quot;</span>)\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UserController</span> {\n  <span class="hljs-comment">// 依赖注入：把 Service 像参数一样传进来</span>\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> <span class="hljs-attr">userService</span>: <span class="hljs-title class_">UserService</span></span>) {}\n  <span class="hljs-meta">@Get</span>(<span class="hljs-string">&quot;:id&quot;</span>)\n  <span class="hljs-title function_">getUserById</span>(<span class="hljs-params"><span class="hljs-meta">@Param</span>(<span class="hljs-string">&quot;id&quot;</span>) <span class="hljs-attr">id</span>: <span class="hljs-built_in">string</span></span>) {\n    <span class="hljs-comment">// 调用 Service 处理逻辑，自己不处理业务</span>\n    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">userService</span>.<span class="hljs-title function_">findUserById</span>(id);\n  }\n}\n</code></pre>\n<hr>\n<h3>2. Service（服务/Provider）—— 负责核心业务逻辑</h3>\n<p><strong>核心职责：</strong>   封装和处理具体的业务逻辑，如操作数据库、调用第三方 API、数据计算与转换等。\n<strong>特点：</strong></p>\n<ul>\n<li>通常由 <code>@Injectable()</code> 装饰器标记，表示它是一个可以被依赖注入系统管理的 Provider。</li>\n<li>它是纯逻辑层面的，<strong>不关心 HTTP 请求的细节</strong>   （它不处理 <code>req</code> 或 <code>res</code> 对象，它只接收普通的数据参数，返回普通的数据结果）。</li>\n<li>一个 Controller 通常对应一个 Service，但 Service 也可以被其他 Service 或 Controller 共享。\n<strong>代码示例：</strong></li>\n</ul>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Injectable</span>, <span class="hljs-title class_">NotFoundException</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UserService</span> {\n  <span class="hljs-comment">// 模拟数据库</span>\n  <span class="hljs-keyword">private</span> users = [{ <span class="hljs-attr">id</span>: <span class="hljs-string">&quot;1&quot;</span>, <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Alice&quot;</span> }];\n  <span class="hljs-title function_">findUserById</span>(<span class="hljs-params"><span class="hljs-attr">id</span>: <span class="hljs-built_in">string</span></span>) {\n    <span class="hljs-keyword">const</span> user = <span class="hljs-variable language_">this</span>.<span class="hljs-property">users</span>.<span class="hljs-title function_">find</span>(<span class="hljs-function">(<span class="hljs-params">u</span>) =&gt;</span> u.<span class="hljs-property">id</span> === id);\n    <span class="hljs-keyword">if</span> (!user) {\n      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">NotFoundException</span>(<span class="hljs-string">&quot;用户不存在&quot;</span>); <span class="hljs-comment">// 抛出业务异常</span>\n    }\n    <span class="hljs-keyword">return</span> user; <span class="hljs-comment">// 返回业务数据</span>\n  }\n}\n</code></pre>\n<hr>\n<h3>3. Module（模块）—— 负责组织与装配</h3>\n<p><strong>核心职责：</strong>   将相关的 Controller、Service 等组件组织在一起，形成一个内聚的业务领域。它相当于一个“装箱清单”。\n<strong>特点：</strong></p>\n<ul>\n<li>由 <code>@Module()</code> 装饰器标记。</li>\n<li>NestJS 应用至少有一个根模块 <code>AppModule</code>。</li>\n<li><strong>控制作用域</strong>   ：默认情况下，Service 是单例模式，但在模块内生效。如果其他模块想用这个 Service，必须在 <code>exports</code> 中导出，并且其他模块要在 <code>imports</code> 中引入该模块。</li>\n<li><strong>属性解析</strong>   ：\n_ <code>providers</code>: 注册本模块需要用到的服务（如 Service）。\n_ <code>controllers</code>: 注册本模块的控制器。\n_ <code>imports</code>: 引入其他模块（以使用其他模块导出的服务）。\n_ <code>exports</code>: 导出本模块的服务，供其他模块使用。\n<strong>代码示例：</strong></li>\n</ul>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Module</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">UserController</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./user.controller&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">UserService</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./user.service&quot;</span>;\n<span class="hljs-comment">// import { DatabaseModule } from &#x27;../database/database.module&#x27;; // 假设需要引入其他模块</span>\n<span class="hljs-meta">@Module</span>({\n  <span class="hljs-comment">// imports: [DatabaseModule], // 依赖的其他模块</span>\n  <span class="hljs-attr">controllers</span>: [<span class="hljs-title class_">UserController</span>], <span class="hljs-comment">// 装配控制器</span>\n  <span class="hljs-attr">providers</span>: [<span class="hljs-title class_">UserService</span>], <span class="hljs-comment">// 装配服务</span>\n  <span class="hljs-comment">// exports: [UserService],     // 如果别的模块需要用 UserService，则在这里导出</span>\n})\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UserModule</span> {}\n</code></pre>\n<hr>\n<h3>总结：数据流动的完整闭环</h3>\n<p>当客户端发起一个请求 <code>GET /users/1</code> 时，NestJS 内部的处理流程如下：</p>\n<ol>\n<li><strong>NestJS 核心</strong>   接收到请求，根据路由找到 <code>UserController</code> 的 <code>getUserById</code> 方法。</li>\n<li><strong>Controller</strong>   提取参数 <code>id=&quot;1&quot;</code>。</li>\n<li><strong>Controller</strong>   调用注入的 <code>UserService.findUserById(&quot;1&quot;)</code>。</li>\n<li><strong>Service</strong>   去数据库查询 <code>id=1</code> 的用户。</li>\n<li><strong>Service</strong>   将查到的用户数据 <code>{ id: \'1\', name: \'Alice\' }</code> 返回给 Controller。</li>\n<li><strong>Controller</strong>   将该数据返回给前端（NestJS 会自动序列化为 JSON）。\n<strong>为什么要这样分？</strong></li>\n</ol>\n<ul>\n<li><strong>可维护性</strong>   ：如果数据库从 MySQL 换成 MongoDB，你只需要修改 <code>UserService</code>，<code>Controller</code> 完全不用动。</li>\n<li><strong>可测试性</strong>   ：你可以轻易地 Mock（模拟）一个 <code>UserService</code> 来单独测试 <code>UserController</code> 的路由逻辑，而不需要连真实的数据库。</li>\n</ul>\n</div>'</script></body></html>
