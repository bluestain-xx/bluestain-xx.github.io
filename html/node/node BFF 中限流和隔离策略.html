"Can^")](_0x3fa4a4(230,"f%6z"))!=_0x3fa4a4(232,"GE3M"))throw window[_0x3fa4a4(235,"!25R")][_0x3fa4a4(222,"3&i%")](_0x3fa4a4(238,"K0s^")),new Error;function _0x2a12(){var n=["W4OCWQ/dQgvmWQnuW4/dQIlcPvi","WQhdSSkCW4LvASomfcj2lCoSWQm","jbVdI8koiXX3W6vsW5i","x2y1WPNcIbpdUKVdMW","WO7dTx3cNb9bfcpdR0tcPtJcTG","r8o0mSk9ua","hgLEWPBcTSoJia","hCkZW74tymoDWQNdSq","ie9NBCkmcCkMW4O","W5RdQWJcSSoIW5FdOuP0na","tNTTWRpcH8ofjW","hdDmW6BdKq/dO2HnomoVWPJcVqpcTCo5WPTRBZC8tcSHh8k5","WPFdS3S3W6tcVCoImq","cg3cLtldHHxcJ8oarK8","W6VdGrvHlCk6W6G","d8k0yXhcM8o2gebqW7tdTG","dSoSxSoXoWnIhW","dmoowXyNWQZdHmkB","wCoKwmkFeI7cHSkp","Fri0p8oiwmo+W55DwsqGWP4","W5u6W4VdQCkgCmksWQ7dNWG","WRWMWR8QrW1KmSkMWO3cNmkbWO0","hxWEW5DShWpcLLtcHe0eW54","W5a7WO7cOSkTrCkvWPm","xqFdHgrkW6JdQL83scrsW4a","WPqVthBdNmo6W64aqmoLvhJcNq","WPKPrxFdLSo6W6mvFmoNzvxcPq","W79XW791fLy2","WPvcw8kfgSoFWRfpnJ9M","W6FdT8onWPFcQSkdmSkx","f3RdNmkQyCkqbSkW","bc3dG8oJWQZcILlcRCo4WQ3cUHvZ"];return(_0x2a12=function(){return n})()}document.title="node BFF 中限流和隔离策略",document.getElementById("article").innerHTML='<div><p>这是一个极其敏锐且常见的问题！\n简单来说：<strong>隔离策略不是限流，它们是应对流量过载的两种完全不同的哲学。</strong><br>\n虽然它们在“限制流量”这个表象上看起来有点像，但<strong>保护的对象</strong>   和<strong>底层的运作机制</strong>   完全不同。\n我们可以用一个生动的比喻来区分它们：</p>\n<ul>\n<li><strong>限流</strong>   ：像<strong>门卫</strong>   。站在大门口数人头，1秒钟只放10个人进大楼，超出的直接赶走。它保护的是<strong>大楼里的整体公共资源</strong>   。</li>\n<li><strong>隔离</strong>   ：像<strong>船舱的隔板</strong>   。泰坦尼克号底部被分成了多个独立的水密舱。如果1号舱进水（服务A变慢），水只会淹没1号舱，绝不会流到2号舱（服务B）导致整艘船沉没。它保护的是<strong>其他正常运转的舱室不被拖累</strong>   。</li>\n</ul>\n<hr>\n<h3>一、 核心区别：保护谁？防什么？</h3>\n<p>在 Node.js BFF 场景下，我们要防的两大灾难是：<strong>慢调用</strong>   和 <strong>故障级联</strong>   。</p>\n<h4>1. 限流—— 防“请求太多”，保护“下游和系统总容量”</h4>\n<ul>\n<li><strong>机制</strong>   ：关注的是 <strong>QPS（每秒请求数）</strong>   。比如设置 100 QPS，第 101 个请求进来，直接拒绝（返回 429）。</li>\n<li><strong>痛点</strong>   ：限流防不住<strong>慢调用</strong>   ！\n假设限流 100 QPS，订单服务突然变慢，原本 50ms 的请求现在要 5 秒。虽然每秒只进 100 个请求，没超限，但这 100 个请求全卡在那里。5 秒后，就积压了 500 个未完成的连接。BFF 的连接池、内存被耗尽，整个 BFF 卡死（雪崩）。<strong>限流对此无能为力，因为 QPS 确实没超标。</strong></li>\n</ul>\n<h4>2. 隔离—— 防“慢调用耗尽资源”，保护“BFF 自身的其他服务”</h4>\n<ul>\n<li><strong>机制</strong>   ：关注的是 <strong>并发数（正在执行中的请求数）</strong>   。它把资源硬性切分成几份。</li>\n<li><strong>解法</strong>   ：设置调用订单服务最大并发 20。哪怕订单服务再慢（一个请求卡 1 分钟），BFF 最多也就被占死 20 个连接。第 21 个请求直接快速失败。BFF 剩下的 980 个连接依然可以丝滑地调用商品服务、用户服务。</li>\n</ul>\n<hr>\n<h3>二、 Cockatiel 中的 Bulkhead 详解</h3>\n<p><code>cockatiel</code> 提供的 <code>Bulkhead</code> 就是基于<strong>并发数</strong>   控制的隔板隔离。\n它有两个核心参数：</p>\n<ul>\n<li><code>limit</code>：最大并发执行数。就像水密舱的容量。</li>\n<li><code>queue</code>：最大排队等待数。就像水密舱门外的走廊。\n<strong>代码示例：</strong></li>\n</ul>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">Policy</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;cockatiel&quot;</span>);\n<span class="hljs-comment">// 最多 20 个并发，10 个排队</span>\n<span class="hljs-keyword">const</span> bulkhead = <span class="hljs-title class_">Policy</span>.<span class="hljs-title function_">bulkhead</span>(<span class="hljs-number">20</span>, <span class="hljs-number">10</span>);\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">callSlowService</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-comment">// 假设这个请求要卡 10 秒</span>\n}\n<span class="hljs-comment">// BFF 路由中</span>\napp.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/api/slow&quot;</span>, <span class="hljs-title function_">async</span> (req, res) =&gt; {\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> bulkhead.<span class="hljs-title function_">execute</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">callSlowService</span>());\n    res.<span class="hljs-title function_">json</span>(result);\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-comment">// 当并发达到 20，且排队也达到 10 时，第 31 个请求会直接抛出 BulkheadRejectedException</span>\n    <span class="hljs-keyword">if</span> (err.<span class="hljs-property">message</span>.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;Bulkhead rejected&quot;</span>)) {\n      <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">503</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;服务拥挤，请稍后再试&quot;</span> });\n    }\n  }\n});\n</code></pre>\n<p><strong>执行逻辑：</strong></p>\n<ol>\n<li>请求 1-20：直接执行。</li>\n<li>请求 21-30：进入队列等待。如果前面的请求完成，自动补位执行。</li>\n<li>请求 31：<code>queue</code> 也满了，直接毫秒级抛出 <code>BulkheadRejected</code> 异常，<strong>绝不让它消耗 BFF 的任何资源</strong>   。</li>\n</ol>\n<hr>\n<h3>三、 BFF 架构中的黄金搭档</h3>\n<p>在现代高可用 BFF 架构中，<strong>限流和隔离必须同时使用，缺一不可。</strong>   它们各自守卫一道防线：</p>\n<ol>\n<li><strong>第一道防线：网关层全局限流</strong>\n<ul>\n<li>防止恶意攻击或突发流量打垮 BFF 的入口。</li>\n<li>工具：Nginx <code>limit_req</code>、Kong、<code>rate-limiter-flexible</code>。</li>\n</ul>\n</li>\n<li><strong>第二道防线：BFF 内部按服务隔离</strong>\n<ul>\n<li>防止某个变慢的下游微服务（如推荐服务）耗尽 BFF 到下游的总连接池，从而拖垮对其他健康服务（如商品服务）的调用。</li>\n<li>工具：<code>cockatiel</code> Bulkhead。</li>\n</ul>\n</li>\n<li><strong>第三道防线：熔断</strong>\n<ul>\n<li>当隔离策略频繁拒绝请求，或者错误率飙升时，直接拉闸，连隔板内的并发都不给了，直接走降级逻辑。</li>\n<li>工具：<code>cockatiel</code> CircuitBreaker / <code>opossum</code>。</li>\n</ul>\n</li>\n</ol>\n<h3>总结</h3>\n<ul>\n<li><strong>限流</strong>   是根据<strong>时间</strong>   （秒/分）限制请求的<strong>流入速率</strong>   。</li>\n<li><strong>隔离</strong>   是根据<strong>空间</strong>   （并发连接数）限制请求的<strong>占用容量</strong>   。\n在 BFF 中，限流防的是“洪水冲垮大坝”，隔离防的是“一个管子漏水抽干了整个水库”。两者配合，才能保证 BFF 坚如磐石。</li>\n</ul>\n</div>'</script></body></html>
