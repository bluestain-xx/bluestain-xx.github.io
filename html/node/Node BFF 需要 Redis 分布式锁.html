[s];return l?a=l:(void 0===_0x1735.AjEibB&&(_0x1735.AjEibB=!0),a=_0x1735.itBFKl(a,n),t[s]=a),a})(t,s)}if((()=>{for(var s=_0x1735,n=_0x3d02();;)try{if(365937==-parseInt(s(243,"72W!"))+-parseInt(s(242,"2MrH"))/2+parseInt(s(244,"Du^%"))/3+parseInt(s(245,"im%E"))/4+parseInt(s(249,"IU^r"))/5+parseInt(s(241,"aQ@!"))/6+parseInt(s(251,"LZxh"))/7)break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x51893e(240,"L^sF")](_0x51893e(237,"dC)w"))!=_0x51893e(250,"HhkI"))throw window[_0x51893e(236,"FOWi")][_0x51893e(253,"aQ@!")](_0x51893e(246,"dC)w")),new Error;document.title="Node BFF 需要 Redis 分布式锁",document.getElementById("article").innerHTML='<div><p>这是一个非常敏锐的架构问题！\n简单来说：<strong>Node BFF 需要 Redis 分布式锁，但它锁的“资产”和后端微服务完全不同，使用频率也低得多。</strong><br>\n后端微服务用分布式锁，是为了保护<strong>数据的一致性</strong>   （防超卖、防并发改脏数据）；\nNode BFF 用分布式锁，是为了保护<strong>外部请求的幂等性</strong>   和<strong>避免无意义的重复劳动</strong>   。\n下面我们来看看 BFF 在哪些真实场景下必须用到分布式锁，以及它与微服务锁的区别。</p>\n<hr>\n<h3>一、 BFF 必须用分布式锁的 3 个场景</h3>\n<h4>场景 1：防重复提交（前端防抖的最后一道防线）</h4>\n<p>这是 BFF 最常见的需求。</p>\n<ul>\n<li><strong>痛点：</strong>   用户点击“提交订单”按钮，因为手抖或网络慢，连击了 3 次。虽然前端可以用 JS 做防抖，但拦截不了抓包工具的直接调用。</li>\n<li><strong>如果不加锁：</strong>   BFF 收到 3 个并发请求，都会去调用后端创建订单，导致生成 3 笔重复订单。</li>\n<li><strong>BFF 加锁姿势：</strong><br>\n以 <code>请求指纹（如 UserID + 请求特征Hash）</code> 为 Key 加锁。<pre><code class="language-javascript"><span class="hljs-keyword">const</span> lockKey = <span class="hljs-string">`lock:submit:<span class="hljs-subst">${userId}</span>:<span class="hljs-subst">${apiPath}</span>`</span>;\n<span class="hljs-comment">// 尝试获取锁，过期时间 5 秒</span>\n<span class="hljs-keyword">const</span> acquired = <span class="hljs-keyword">await</span> redis.<span class="hljs-title function_">set</span>(lockKey, <span class="hljs-number">1</span>, <span class="hljs-string">&quot;EX&quot;</span>, <span class="hljs-number">5</span>, <span class="hljs-string">&quot;NX&quot;</span>);\n<span class="hljs-keyword">if</span> (!acquired) {\n  <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">429</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;操作过于频繁，请勿重复提交&quot;</span> });\n}\n<span class="hljs-keyword">try</span> {\n  <span class="hljs-comment">// 调用后端微服务...</span>\n} <span class="hljs-keyword">finally</span> {\n  <span class="hljs-comment">// 注意：这里可以释放锁，也可以不释放，利用 TTL 自动过期即可</span>\n}\n</code></pre>\n</li>\n</ul>\n<h4>场景 2：缓存击穿保护（避免惊群效应）</h4>\n<p>这在 BFF 聚合接口中非常典型。</p>\n<ul>\n<li><strong>痛点：</strong>   BFF 有一个极高频的接口，依赖 Redis 缓存。突然缓存过期了（或被误删），瞬间涌来 1000 个并发请求。如果这 1000 个请求都发现缓存为空，全部去请求后端微服务，后端瞬间被打爆。</li>\n<li><strong>BFF 加锁姿势：</strong>   只允许一个请求去后端拉数据并重建缓存，其他请求等待或返回旧数据。<pre><code class="language-javascript"><span class="hljs-keyword">const</span> cacheData = <span class="hljs-keyword">await</span> redis.<span class="hljs-title function_">get</span>(cacheKey);\n<span class="hljs-keyword">if</span> (!cacheData) {\n  <span class="hljs-keyword">const</span> lockKey = <span class="hljs-string">`lock:cache:<span class="hljs-subst">${cacheKey}</span>`</span>;\n  <span class="hljs-keyword">const</span> acquired = <span class="hljs-keyword">await</span> redis.<span class="hljs-title function_">set</span>(lockKey, <span class="hljs-number">1</span>, <span class="hljs-string">&quot;EX&quot;</span>, <span class="hljs-number">10</span>, <span class="hljs-string">&quot;NX&quot;</span>);\n\n  <span class="hljs-keyword">if</span> (acquired) {\n    <span class="hljs-comment">// 抢到锁的“幸运儿”，去后端拉数据</span>\n    <span class="hljs-keyword">const</span> dbData = <span class="hljs-keyword">await</span> <span class="hljs-title function_">callBackendService</span>();\n    <span class="hljs-keyword">await</span> redis.<span class="hljs-title function_">set</span>(cacheKey, <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(dbData), <span class="hljs-string">&quot;EX&quot;</span>, <span class="hljs-number">3600</span>);\n    <span class="hljs-keyword">await</span> redis.<span class="hljs-title function_">del</span>(lockKey); <span class="hljs-comment">// 重建完成，释放锁</span>\n    <span class="hljs-keyword">return</span> dbData;\n  } <span class="hljs-keyword">else</span> {\n    <span class="hljs-comment">// 没抢到锁的请求，可以选择稍等重试，或者直接返回兜底数据/提示</span>\n    <span class="hljs-keyword">return</span> fallbackData;\n  }\n}\n</code></pre>\n</li>\n</ul>\n<h4>场景 3：长耗时任务的防并发（如报表导出）</h4>\n<ul>\n<li><strong>痛点：</strong>   BFF 提供一个导出百万级 Excel 的接口。如果同一个用户同时发起两次导出，不仅服务器 CPU 会打满，还可能导致生成的文件损坏。</li>\n<li><strong>BFF 加锁姿势：</strong>   以 <code>UserID + 任务类型</code> 为 Key 加锁，执行期间拒绝同类型的重复任务。</li>\n</ul>\n<hr>\n<h3>二、 BFF 的分布式锁 vs 微服务的分布式锁</h3>\n<p>理解两者的区别，才能决定在 BFF 里如何实现锁。</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">维度</th>\n<th style="text-align:left">后端微服务锁</th>\n<th style="text-align:left">Node BFF 锁</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>保护对象</strong></td>\n<td style="text-align:left">数据库里的<strong>核心资产</strong>   （余额、库存）</td>\n<td style="text-align:left"><strong>网络请求/计算资源</strong>   （防重复调用、防惊群）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>锁的严谨性</strong></td>\n<td style="text-align:left"><strong>极度严谨</strong>   。必须保证原子性，锁到期但业务未完成必须续期（看门狗机制），否则会导致超卖。</td>\n<td style="text-align:left"><strong>相对宽容</strong>   。就算锁偶尔失效（比如 Redis 抖动），最坏结果是多发了一次请求或多查了一次库，不会导致资金损失。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>锁的粒度</strong></td>\n<td style="text-align:left">极细（如 <code>lock:order:1234</code>）</td>\n<td style="text-align:left">较粗（如 <code>lock:req:user:456</code> 或 <code>lock:cache:home</code>）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>是否需要续期</strong></td>\n<td style="text-align:left">通常需要（单次 DB 事务可能耗时较长）</td>\n<td style="text-align:left"><strong>绝不需要</strong>   。BFF 单次请求必须控制在几秒内，如果几秒都没返回，前端早就超时断了，锁应该自动过期释放。</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h3>三、 Node BFF 实现分布式锁的最佳实践</h3>\n<p>因为 BFF 的锁不需要极度严谨的“看门狗”续期机制，所以<strong>完全没必要引入沉重的 <code>Redlock</code> 算法或 <code>Redisson</code> 级别的复杂库</strong>   。\n<strong>在 Node BFF 中，推荐使用最简单的 <code>SET NX EX</code> 原子命令即可。</strong><br>\n可以使用 <code>ioredis</code> 手写一个极简的锁工具类：</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// RedisLock.js</span>\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">RedisLock</span> {\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params">redisClient</span>) {\n    <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span> = redisClient;\n  }\n  <span class="hljs-comment">// 获取锁</span>\n  <span class="hljs-keyword">async</span> <span class="hljs-title function_">acquire</span>(<span class="hljs-params">key, ttlSeconds = <span class="hljs-number">5</span></span>) {\n    <span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">set</span>(key, <span class="hljs-string">&quot;1&quot;</span>, <span class="hljs-string">&quot;EX&quot;</span>, ttlSeconds, <span class="hljs-string">&quot;NX&quot;</span>);\n    <span class="hljs-keyword">return</span> result === <span class="hljs-string">&quot;OK&quot;</span>; <span class="hljs-comment">// 返回 true 表示获取成功</span>\n  }\n  <span class="hljs-comment">// 释放锁 (为了防止误删别人的锁，最好用 Lua 脚本，但对于 BFF 的粗粒度锁，直接 DEL 通常也够用)</span>\n  <span class="hljs-keyword">async</span> <span class="hljs-title function_">release</span>(<span class="hljs-params">key</span>) {\n    <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">redis</span>.<span class="hljs-title function_">del</span>(key);\n  }\n}\n<span class="hljs-variable language_">module</span>.<span class="hljs-property">exports</span> = <span class="hljs-title class_">RedisLock</span>;\n</code></pre>\n<p><strong>在 BFF 路由中使用：</strong></p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> lock = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RedisLock</span>(redisClient);\napp.<span class="hljs-title function_">post</span>(<span class="hljs-string">&quot;/api/order/create&quot;</span>, <span class="hljs-title function_">async</span> (req, res) =&gt; {\n  <span class="hljs-keyword">const</span> { userId } = req.<span class="hljs-property">user</span>;\n  <span class="hljs-keyword">const</span> lockKey = <span class="hljs-string">`lock:create_order:<span class="hljs-subst">${userId}</span>`</span>;\n  <span class="hljs-comment">// 尝试获取锁，5秒过期</span>\n  <span class="hljs-keyword">if</span> (!(<span class="hljs-keyword">await</span> lock.<span class="hljs-title function_">acquire</span>(lockKey, <span class="hljs-number">5</span>))) {\n    <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">429</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;正在处理中，请勿重复点击&quot;</span> });\n  }\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-comment">// 执行 BFF 业务逻辑，调用后端...</span>\n    <span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> backendService.<span class="hljs-title function_">createOrder</span>();\n    res.<span class="hljs-title function_">json</span>(result);\n  } <span class="hljs-keyword">finally</span> {\n    <span class="hljs-comment">// 业务执行完立刻释放锁，不用等 TTL 到期</span>\n    <span class="hljs-keyword">await</span> lock.<span class="hljs-title function_">release</span>(lockKey);\n  }\n});\n</code></pre>\n<h3>四、 总结</h3>\n<ol>\n<li><strong>BFF 需要分布式锁，但不是用来保护数据库的，而是用来“防手抖”和“防惊群”的。</strong></li>\n<li>BFF 的锁是<strong>粗粒度、短生命周期</strong>   的，不需要复杂的续期机制。</li>\n<li>在 Node.js 中，使用 <code>SET NX EX</code> 就足以应对 99% 的 BFF 锁场景，不要过度设计引入复杂的 Redlock 算法。</li>\n<li>如果你要保护的是数据库里的库存不超卖，<strong>那把锁加在后端微服务里，不要加在 BFF 里</strong>   （BFF 挡不住并发，只会把请求序列化拖慢）。</li>\n</ol>\n</div>'</script></body></html>
