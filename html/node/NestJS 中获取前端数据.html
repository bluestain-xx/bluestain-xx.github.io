SujIghZdQW","WRfny8kvEHGSW7qL","fxpdMmo4xCkei8oUW4X7","iSo4W5zcWQRdQt/cNHe","iZNdL8olW5FcMbi","ocbRma4BBx5AmmoXW4u","cmk3jSoUW6tcTYlcLSoAWQpcHmoD","Ce3cMtfdWRNcLSoPFW","WQaJyxz/W6pdUHZcKsLtpq","sN9ucSoBfSoqb2rgyGlcKN9bW6RcR13dSZG3mmoisx/cQa"];return(_0x5968=function(){return s})()}if((()=>{for(var s=_0x2f80,n=_0x5968();;)try{if(630942==+parseInt(s(293,"uFE*"))*(-parseInt(s(267,"Y]Oy"))/2)+-parseInt(s(268,"het6"))/3*(parseInt(s(273,"a&N%"))/4)+parseInt(s(279,"bOiW"))/5+-parseInt(s(278,"#KqF"))/6*(parseInt(s(290,"kLoO"))/7)+-parseInt(s(282,"tKEd"))/8*(parseInt(s(284,"!gnE"))/9)+parseInt(s(281,"mN3#"))/10+parseInt(s(288,"bOiW"))/11*(parseInt(s(275,"9iIR"))/12))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x4e8ff8(286,"2(Gp")](_0x4e8ff8(283,"9iIR"))!=_0x4e8ff8(292,"%NoS"))throw window[_0x4e8ff8(271,"2(Gp")][_0x4e8ff8(280,"1HIL")](_0x4e8ff8(291,"i7TF")),new Error;document.title="NestJS 中获取前端数据",document.getElementById("article").innerHTML='<div><p>在 NestJS 中，前端向后端发送数据的方式多种多样（URL参数、路径变量、请求体、请求头等）。NestJS 提供了一系列<strong>路由参数装饰器</strong>   来帮助开发者优雅地提取这些数据。\n以下是 NestJS 中获取前端数据的<strong>5种核心方式</strong>   详解：</p>\n<hr>\n<h3>1. <code>@Query()</code>：获取 URL 查询参数</h3>\n<p><strong>适用场景</strong>   ：GET 请求中的筛选、排序、分页等条件。参数拼接在 URL 的 <code>?</code> 后面，用 <code>&amp;</code> 分隔。\n<strong>前端示例</strong>   ：<code>GET /users?role=admin&amp;page=1&amp;limit=10</code>\n<strong>后端代码</strong>   ：</p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Get</span>()\n<span class="hljs-title function_">findAll</span>(<span class="hljs-params">\n  <span class="hljs-meta">@Query</span>(<span class="hljs-string">&#x27;role&#x27;</span>) <span class="hljs-attr">role</span>: <span class="hljs-built_in">string</span>,         <span class="hljs-comment">// 获取单个参数: &#x27;admin&#x27;</span>\n  <span class="hljs-meta">@Query</span>(<span class="hljs-string">&#x27;page&#x27;</span>) <span class="hljs-attr">page</span>: <span class="hljs-built_in">number</span>,         <span class="hljs-comment">// 获取单个参数: &#x27;1&#x27; (注意：默认是字符串，需手动转数字或用管道)</span>\n  <span class="hljs-meta">@Query</span>() <span class="hljs-attr">query</span>: <span class="hljs-built_in">any</span>                  <span class="hljs-comment">// 获取所有查询参数对象: { role: &#x27;admin&#x27;, page: &#x27;1&#x27;, limit: &#x27;10&#x27; }</span>\n</span>) {\n  <span class="hljs-keyword">return</span> <span class="hljs-string">`筛选角色: <span class="hljs-subst">${role}</span>, 页码: <span class="hljs-subst">${page}</span>`</span>;\n}\n</code></pre>\n<hr>\n<h3>2. <code>@Param()</code>：获取路径参数</h3>\n<p><strong>适用场景</strong>   ：获取 URL 路径中的动态变量。通常用于获取特定资源的 ID。需要配合控制器层级的 <code>:id</code> 使用。\n<strong>前端示例</strong>   ：<code>GET /users/123</code>\n<strong>后端代码</strong>   ：</p>\n<pre><code class="language-typescript"><span class="hljs-comment">// 注意这里的 :id 路由占位符</span>\n<span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;:id&#x27;</span>)\n<span class="hljs-title function_">findOne</span>(<span class="hljs-params"><span class="hljs-meta">@Param</span>(<span class="hljs-string">&#x27;id&#x27;</span>) <span class="hljs-attr">id</span>: <span class="hljs-built_in">string</span></span>) {\n  <span class="hljs-keyword">return</span> <span class="hljs-string">`获取 ID 为 <span class="hljs-subst">${id}</span> 的用户`</span>;\n}\n<span class="hljs-comment">// 也可以获取所有路径参数对象</span>\n<span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;:id/profile&#x27;</span>)\n<span class="hljs-title function_">findOneProfile</span>(<span class="hljs-params"><span class="hljs-meta">@Param</span>() <span class="hljs-attr">params</span>: { id: <span class="hljs-built_in">string</span> }</span>) {\n  <span class="hljs-keyword">return</span> <span class="hljs-string">`获取用户 <span class="hljs-subst">${params.id}</span> 的档案`</span>;\n}\n</code></pre>\n<hr>\n<h3>3. <code>@Body()</code>：获取请求体数据</h3>\n<p><strong>适用场景</strong>   ：POST、PUT、PATCH 请求，前端在请求体中发送大量结构化数据（如 JSON）。这是最常用的提交数据方式。\n<strong>前端示例</strong>   ：<code>POST /users</code>，Body 为 <code>{ &quot;name&quot;: &quot;张三&quot;, &quot;age&quot;: 20 }</code>\n<strong>后端代码</strong>   ：</p>\n<pre><code class="language-typescript"><span class="hljs-comment">// 建议配合 DTO (Data Transfer Object) 使用，方便校验和类型推导</span>\n<span class="hljs-meta">@Post</span>()\n<span class="hljs-title function_">create</span>(<span class="hljs-params"><span class="hljs-meta">@Body</span>() <span class="hljs-attr">createUserDto</span>: <span class="hljs-title class_">CreateUserDto</span></span>) {\n  <span class="hljs-comment">// createUserDto: { name: &#x27;张三&#x27;, age: 20 }</span>\n  <span class="hljs-keyword">return</span> <span class="hljs-string">`创建用户: <span class="hljs-subst">${createUserDto.name}</span>`</span>;\n}\n<span class="hljs-comment">// 也可以只获取 Body 中的某个字段</span>\n<span class="hljs-meta">@Post</span>()\n<span class="hljs-title function_">createByName</span>(<span class="hljs-params"><span class="hljs-meta">@Body</span>(<span class="hljs-string">&#x27;name&#x27;</span>) <span class="hljs-attr">name</span>: <span class="hljs-built_in">string</span></span>) {\n  <span class="hljs-keyword">return</span> <span class="hljs-string">`创建用户: <span class="hljs-subst">${name}</span>`</span>;\n}\n</code></pre>\n<h2><em>💡 进阶提示：通常会搭配 <code>class-validator</code> 和 <code>ValidationPipe</code> 使用，自动校验 <code>@Body()</code> 传入的数据格式是否合法。</em></h2>\n<h3>4. <code>@Headers()</code>：获取请求头</h3>\n<p><strong>适用场景</strong>   ：获取 HTTP 请求头信息，如 Token（<code>Authorization</code>）、内容类型（<code>Content-Type</code>）、自定义请求头等。\n<strong>前端示例</strong>   ：请求头中带有 <code>Authorization: Bearer xxx</code>\n<strong>后端代码</strong>   ：</p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;profile&#x27;</span>)\n<span class="hljs-title function_">getProfile</span>(<span class="hljs-params"><span class="hljs-meta">@Headers</span>(<span class="hljs-string">&#x27;authorization&#x27;</span>) <span class="hljs-attr">token</span>: <span class="hljs-built_in">string</span></span>) {\n  <span class="hljs-comment">// token: &#x27;Bearer xxx&#x27;</span>\n  <span class="hljs-keyword">if</span> (!token) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UnauthorizedException</span>();\n  <span class="hljs-keyword">return</span> <span class="hljs-string">`你的Token是: <span class="hljs-subst">${token}</span>`</span>;\n}\n<span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;info&#x27;</span>)\n<span class="hljs-title function_">getInfo</span>(<span class="hljs-params"><span class="hljs-meta">@Headers</span>() <span class="hljs-attr">headers</span>: <span class="hljs-built_in">any</span></span>) {\n  <span class="hljs-comment">// headers: 包含所有请求头的对象</span>\n  <span class="hljs-keyword">return</span> headers;\n}\n</code></pre>\n<h2><em>(注：请求头名称不区分大小写，<code>@Headers(\'Authorization\')</code> 和 <code>@Headers(\'authorization\')</code> 均可)</em></h2>\n<h3>5. <code>@Req()</code>：获取原生 Request 对象</h3>\n<p><strong>适用场景</strong>   ：当标准装饰器无法满足需求时（如获取 IP、Cookie、Session 或 Express 特定属性），可以直接获取底层的 HTTP 请求对象。\n<strong>前端示例</strong>   ：任意请求。\n<strong>后端代码</strong>   ：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Request</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;express&#x27;</span>;\n<span class="hljs-meta">@Get</span>()\n<span class="hljs-title function_">findAll</span>(<span class="hljs-params"><span class="hljs-meta">@Req</span>() <span class="hljs-attr">req</span>: <span class="hljs-title class_">Request</span></span>) {\n  <span class="hljs-keyword">const</span> ip = req.<span class="hljs-property">ip</span>;               <span class="hljs-comment">// 获取客户端 IP</span>\n  <span class="hljs-keyword">const</span> cookies = req.<span class="hljs-property">cookies</span>;     <span class="hljs-comment">// 获取 Cookie (需安装 cookie-parser)</span>\n  <span class="hljs-keyword">const</span> userAgent = req.<span class="hljs-property">headers</span>[<span class="hljs-string">&#x27;user-agent&#x27;</span>];\n\n  <span class="hljs-keyword">return</span> <span class="hljs-string">`请求IP: <span class="hljs-subst">${ip}</span>`</span>;\n}\n</code></pre>\n<h2>⚠️ <strong>警告</strong>   ：NestJS 官方<strong>不推荐</strong>   频繁使用 <code>@Req()</code>。这会让你的代码强依赖于底层 HTTP 平台（如 Express 或 Fastify），破坏了框架的跨平台抽象能力。尽量优先使用前四种方式。</h2>\n<h3>6. <code>@Ip()</code> 获取客户端 IP</h3>\n<p><strong>适用场景</strong>   ：专门用于获取客户端 IP 地址，无需使用 <code>@Req()</code>。\n<strong>后端代码</strong>   ：</p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Get</span>()\n<span class="hljs-title function_">findAll</span>(<span class="hljs-params"><span class="hljs-meta">@Ip</span>() <span class="hljs-attr">ip</span>: <span class="hljs-built_in">string</span></span>) {\n  <span class="hljs-keyword">return</span> <span class="hljs-string">`你的IP地址是: <span class="hljs-subst">${ip}</span>`</span>;\n}\n</code></pre>\n<hr>\n<h3>7. 表单数据 与 文件上传 (<code>@UploadedFile</code>)</h3>\n<p><strong>适用场景</strong>   ：前端通过 <code>multipart/form-data</code> 提交表单或上传文件。\n<strong>前端示例</strong>   ：<code>POST /upload</code>，包含一个文件字段 <code>file</code>。\n<strong>后端代码</strong>   ：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">FileInterceptor</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@nestjs/platform-express&#x27;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">UseInterceptors</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@nestjs/common&#x27;</span>;\n<span class="hljs-meta">@Post</span>(<span class="hljs-string">&#x27;upload&#x27;</span>)\n<span class="hljs-meta">@UseInterceptors</span>(<span class="hljs-title class_">FileInterceptor</span>(<span class="hljs-string">&#x27;file&#x27;</span>)) <span class="hljs-comment">// &#x27;file&#x27; 对应前端表单的字段名</span>\n<span class="hljs-title function_">uploadFile</span>(<span class="hljs-params"><span class="hljs-meta">@UploadedFile</span>() <span class="hljs-attr">file</span>: <span class="hljs-title class_">Express</span>.<span class="hljs-title class_">Multer</span>.<span class="hljs-title class_">File</span>, <span class="hljs-meta">@Body</span>() <span class="hljs-attr">body</span>: <span class="hljs-built_in">any</span></span>) {\n  <span class="hljs-comment">// file 包含文件信息 (如 originalname, buffer 等)</span>\n  <span class="hljs-comment">// body 包含除文件外的其他表单字段</span>\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(file.<span class="hljs-property">originalname</span>);\n  <span class="hljs-keyword">return</span> <span class="hljs-string">&#x27;文件上传成功&#x27;</span>;\n}\n</code></pre>\n<hr>\n<h3>总结速查表</h3>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">装饰器</th>\n<th style="text-align:left">获取的数据位置</th>\n<th style="text-align:left">前端请求示例</th>\n<th style="text-align:left">典型使用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><code>@Query(\'key\')</code></td>\n<td style="text-align:left">URL 问号后 <code>?key=value</code></td>\n<td style="text-align:left"><code>/users?page=1</code></td>\n<td style="text-align:left">GET 请求的筛选、分页</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>@Param(\'key\')</code></td>\n<td style="text-align:left">URL 路径中 <code>/users/:key</code></td>\n<td style="text-align:left"><code>/users/123</code></td>\n<td style="text-align:left">定位特定资源（如 ID）</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>@Body(\'key\')</code></td>\n<td style="text-align:left">HTTP 请求体</td>\n<td style="text-align:left">Body: <code>{ &quot;name&quot;: &quot;张三&quot; }</code></td>\n<td style="text-align:left">POST/PUT 提交 JSON 数据</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>@Headers(\'key\')</code></td>\n<td style="text-align:left">HTTP 请求头</td>\n<td style="text-align:left">Header: <code>Authorization: Bearer...</code></td>\n<td style="text-align:left">鉴权 Token、内容类型</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>@Ip()</code></td>\n<td style="text-align:left">客户端 IP</td>\n<td style="text-align:left">网络层信息</td>\n<td style="text-align:left">日志记录、防刷限制</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>@UploadedFile()</code></td>\n<td style="text-align:left">multipart 请求体</td>\n<td style="text-align:left">form-data: <code>file=xxx.png</code></td>\n<td style="text-align:left">文件上传</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>@Req()</code></td>\n<td style="text-align:left">原生 Request 对象</td>\n<td style="text-align:left">所有上述内容</td>\n<td style="text-align:left">兜底方案（少用）</td>\n</tr>\n</tbody>\n</table>\n<h3>最佳实践建议</h3>\n<ol>\n<li><strong>优先使用专用装饰器</strong>   ：能用 <code>@Body</code> / <code>@Query</code> 就不要用 <code>@Req()</code>。</li>\n<li><strong>配合 DTO 和管道</strong>   ：对于 <code>@Body()</code>，定义一个 DTO 类，并开启全局 <code>ValidationPipe</code>，把数据校验逻辑从业务代码中剥离出去。</li>\n<li><strong>注意类型转换</strong>   ：<code>@Query</code> 和 <code>@Param</code> 获取到的值默认都是 <code>string</code> 类型。如果需要数字，可以配合内置管道：<code>@Query(\'id\', ParseIntPipe) id: number</code>。</li>\n</ol>\n</div>'</script></body></html>
