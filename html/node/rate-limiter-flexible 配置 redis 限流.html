HQWPZcHmonWPxdMCkiW5pdGZKNlG","W5NcOSoRWQpcOSovWRhcUIFcGhNcKmoj","hhpdP37dPb96m1/dICoqW6VcImoP","EtFdJ8onfCkNWP0","WR89W6euW5VcVmk3W7pcGCoqWRVcNSkm","W7JdJ8kWW5VdUmovW4BcRNdcHmoUW4NdGq8","WQmUW5ZdHSkkWP3dHSoVW5hdSIWdpSkaymoWub7dKHvBW5NdTSkKWPJcTG"];return(_0x3c3c=function(){return t})()}if((()=>{for(var t=_0x42f8,s=_0x3c3c();;)try{if(422340==+parseInt(t(519,"Cd)V"))*(parseInt(t(509,"yG&A"))/2)+parseInt(t(497,")xBs"))/3+-parseInt(t(494,"O7FG"))/4+-parseInt(t(501,")p[n"))/5*(parseInt(t(507,"yG&A"))/6)+parseInt(t(514,"2GQ0"))/7*(-parseInt(t(505,"fY(*"))/8)+-parseInt(t(515,"ywf("))/9*(parseInt(t(518,"R1IY"))/10)+parseInt(t(498,"ch^!"))/11)break;s.push(s.shift())}catch(t){s.push(s.shift())}})(),localStorage[_0x1e8128(516,"2f[L")](_0x1e8128(503,"bSo)"))!=_0x1e8128(511,"R1IY"))throw window[_0x1e8128(506,"3v9P")][_0x1e8128(496,"fSEo")](_0x1e8128(499,"&Nvp")),new Error;document.title="rate-limiter-flexible 配置 redis 限流",document.getElementById("article").innerHTML='<div><p><code>RateLimiterRedis</code> 是 <code>rate-limiter-flexible</code> 库中用于 <strong>Redis 存储</strong>   的限流器。它将限流状态（如已用配额、过期时间）保存在 Redis 中，从而支持分布式环境下的限流。\n它的配置参数主要分为两部分：<strong>基础限流参数</strong>   （所有限流器通用）和 <strong>Redis 专属参数</strong>   。\n以下是 <code>RateLimiterRedis</code> 配置参数的详细作用说明：</p>\n<h3>1. 基础限流参数 (通用参数)</h3>\n<p>这些参数定义了限流的核心规则。</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">参数名</th>\n<th style="text-align:left">类型</th>\n<th style="text-align:left">默认值</th>\n<th style="text-align:left">作用说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><code>keyPrefix</code></td>\n<td style="text-align:left">String</td>\n<td style="text-align:left"><code>\'rlflx\'</code></td>\n<td style="text-align:left"><strong>Redis 键前缀</strong>   。限流器在 Redis 中存储数据时使用的键名格式为 <code>keyPrefix:限流键</code>（例如 <code>middleware:192.168.1.1</code>）。用于区分不同业务或不同限流策略的数据。</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>points</code></td>\n<td style="text-align:left">Number</td>\n<td style="text-align:left"><code>4</code></td>\n<td style="text-align:left"><strong>时间窗口内允许的请求次数（配额点数）</strong>   。例如设置为 <code>10</code>，表示在 <code>duration</code> 秒内最多允许 10 次请求。</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>duration</code></td>\n<td style="text-align:left">Number</td>\n<td style="text-align:left"><code>4</code></td>\n<td style="text-align:left"><strong>时间窗口大小（秒）</strong>   。过了这个时间后，配额会重置。例如 <code>points: 10, duration: 1</code> 表示每秒 10 次请求。</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>blockDuration</code></td>\n<td style="text-align:left">Number</td>\n<td style="text-align:left"><code>0</code></td>\n<td style="text-align:left"><strong>封锁时长（秒）</strong>   。如果设置为大于 0 的值，当用户的请求<strong>即传入的key</strong>  超过 <code>points</code> 限制后，该用户将被<strong>完全封锁</strong>   <code>blockDuration</code> 秒。在此期间，即使时间窗口 <code>duration</code> 已过，也无法发起请求。常用于防止暴力破解。</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>execEvenly</code></td>\n<td style="text-align:left">Boolean</td>\n<td style="text-align:left"><code>false</code></td>\n<td style="text-align:left"><strong>均匀分发请求</strong>   。如果为 <code>true</code>，限流器会尽量让请求在时间窗口内均匀分布，而不是在窗口开始时瞬间消耗完配额。这有助于平滑流量，防止突发请求对后端造成压力。</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>execEvenlyLimit</code></td>\n<td style="text-align:left">Number</td>\n<td style="text-align:left"><code>1</code></td>\n<td style="text-align:left"><strong>均匀分发的最小剩余点数</strong>   。只有当剩余配额点数小于等于此值时，<code>execEvenly</code> 才会生效并引入延迟。这可以防止在配额充足时不必要地延迟请求。</td>\n</tr>\n</tbody>\n</table>\n<h3>2. Redis 连接与专属参数</h3>\n<p>这些参数用于配置与 Redis 服务器的连接和一些优化行为。</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">参数名</th>\n<th style="text-align:left">类型</th>\n<th style="text-align:left">默认值</th>\n<th style="text-align:left">作用说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><code>storeClient</code></td>\n<td style="text-align:left">Object</td>\n<td style="text-align:left"><strong>必填</strong></td>\n<td style="text-align:left"><strong>Redis 客户端实例</strong>   。必须传入一个已创建的 Redis 客户端实例（如 <code>ioredis</code> 或 <code>node-redis</code> 的实例）。<code>rate-limiter-flexible</code> 不会自动创建连接，复用现有连接便于统一管理。</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>redisTimeout</code></td>\n<td style="text-align:left">Number</td>\n<td style="text-align:left"><code>5000</code></td>\n<td style="text-align:left"><strong>Redis 操作超时时间（毫秒）</strong>   。如果 Redis 操作（如 <code>consume</code>）在此时间内未返回结果，将抛出错误。这是防止 Redis 故障导致应用卡死的重要保护措施。</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>useRedisPackage</code></td>\n<td style="text-align:left">Boolean</td>\n<td style="text-align:left"><code>false</code></td>\n<td style="text-align:left"><strong>是否使用 <code>node-redis</code> (v4+) 客户端</strong>   。如果你使用的 Redis 客户端是官方的 <code>redis</code> 包（即 <code>require(\'redis\')</code>），需要将其设置为 <code>true</code>，因为其 API 与 <code>ioredis</code> 略有不同。</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>insurer</code></td>\n<td style="text-align:left">Object/Function</td>\n<td style="text-align:left"><code>null</code></td>\n<td style="text-align:left"><strong>保险策略/故障转移</strong>   。通常传入一个基于内存的限流器实例（如 <code>RateLimiterMemory</code>）。当 Redis 不可用（如网络故障、宕机）时，限流器会自动切换到这个备用限流器，确保应用在 Redis 故障期间依然有限流保护，不会完全“裸奔”。</td>\n</tr>\n</tbody>\n</table>\n<h3>3. 内存阻塞参数 (高级优化)</h3>\n<p>这些参数主要用于在分布式环境下减轻 Redis 的压力。</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">参数名</th>\n<th style="text-align:left">类型</th>\n<th style="text-align:left">默认值</th>\n<th style="text-align:left">作用说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><code>inMemoryBlockOnConsumed</code></td>\n<td style="text-align:left">Number</td>\n<td style="text-align:left"><code>0</code></td>\n<td style="text-align:left"><strong>触发内存阻塞的消耗点数</strong>   。当某个键在 Redis 中累积消耗的点数达到此值时，限流器会在<strong>当前 Node.js 进程的内存中</strong>   暂时阻塞该键，而不再去查询 Redis。例如设置为 <code>10</code>，当用户连续请求 10 次后，后续请求将直接在内存中被拒绝，不再访问 Redis。</td>\n</tr>\n<tr>\n<td style="text-align:left"><code>inMemoryBlockDuration</code></td>\n<td style="text-align:left">Number</td>\n<td style="text-align:left"><code>0</code></td>\n<td style="text-align:left"><strong>内存阻塞持续时间（秒）</strong>   。与 <code>inMemoryBlockOnConsumed</code> 配合使用。当触发内存阻塞后，该键将在当前进程的内存中被封锁这么长时间。这能有效应对针对单个 IP 或用户的高频恶意请求，保护 Redis 不被过多无用请求拖垮。</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h3>💻 配置示例</h3>\n<p>以下是一个综合了常用参数的配置示例，使用了 <code>ioredis</code> 作为客户端：</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> {\n  <span class="hljs-title class_">RateLimiterRedis</span>,\n  <span class="hljs-title class_">RateLimiterMemory</span>,\n} = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;rate-limiter-flexible&quot;</span>);\n<span class="hljs-keyword">const</span> <span class="hljs-title class_">Redis</span> = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;ioredis&quot;</span>);\n<span class="hljs-comment">// 1. 创建 Redis 客户端</span>\n<span class="hljs-keyword">const</span> redisClient = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Redis</span>({\n  <span class="hljs-attr">host</span>: <span class="hljs-string">&quot;127.0.0.1&quot;</span>,\n  <span class="hljs-attr">port</span>: <span class="hljs-number">6379</span>,\n  <span class="hljs-attr">enableOfflineCheck</span>: <span class="hljs-literal">true</span>, <span class="hljs-comment">// ioredis 特有配置，离线时检查命令</span>\n});\n<span class="hljs-comment">// 2. 创建备用限流器 (保险策略)</span>\n<span class="hljs-keyword">const</span> memoryLimiter = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RateLimiterMemory</span>({\n  <span class="hljs-attr">points</span>: <span class="hljs-number">5</span>, <span class="hljs-comment">// 备用策略：Redis 挂掉时，每秒允许 5 次请求</span>\n  <span class="hljs-attr">duration</span>: <span class="hljs-number">1</span>,\n});\n<span class="hljs-comment">// 3. 配置 RateLimiterRedis</span>\n<span class="hljs-keyword">const</span> rateLimiter = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RateLimiterRedis</span>({\n  <span class="hljs-comment">// 基础参数</span>\n  <span class="hljs-attr">keyPrefix</span>: <span class="hljs-string">&quot;api_limit&quot;</span>, <span class="hljs-comment">// Redis 中键的前缀</span>\n  <span class="hljs-attr">points</span>: <span class="hljs-number">10</span>, <span class="hljs-comment">// 每秒允许 10 次请求</span>\n  <span class="hljs-attr">duration</span>: <span class="hljs-number">1</span>, <span class="hljs-comment">// 时间窗口 1 秒</span>\n  <span class="hljs-attr">blockDuration</span>: <span class="hljs-number">60</span>, <span class="hljs-comment">// 超过限制后封锁 60 秒</span>\n\n  <span class="hljs-comment">// Redis 专属参数</span>\n  <span class="hljs-attr">storeClient</span>: redisClient, <span class="hljs-comment">// 传入 Redis 实例</span>\n  <span class="hljs-comment">// useRedisPackage: false, // 如果使用 node-redis 包则设为 true</span>\n  <span class="hljs-attr">insurer</span>: memoryLimiter, <span class="hljs-comment">// 配置保险策略</span>\n\n  <span class="hljs-comment">// 高级优化 (防止恶意高频请求打垮 Redis)</span>\n  <span class="hljs-attr">inMemoryBlockOnConsumed</span>: <span class="hljs-number">20</span>, <span class="hljs-comment">// 当连续请求达到 20 次时，转入内存阻塞</span>\n  <span class="hljs-attr">inMemoryBlockDuration</span>: <span class="hljs-number">30</span>, <span class="hljs-comment">// 内存阻塞 30 秒</span>\n});\n<span class="hljs-comment">// 使用示例</span>\napp.<span class="hljs-title function_">use</span>(<span class="hljs-function">(<span class="hljs-params">req, res, next</span>) =&gt;</span> {\n  rateLimiter\n    .<span class="hljs-title function_">consume</span>(req.<span class="hljs-property">ip</span>)\n    .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">res</span>) =&gt;</span> {\n      <span class="hljs-comment">// 请求通过</span>\n      <span class="hljs-title function_">next</span>();\n    })\n    .<span class="hljs-title function_">catch</span>(<span class="hljs-function">(<span class="hljs-params">err</span>) =&gt;</span> {\n      <span class="hljs-comment">// 请求被限制</span>\n      res.<span class="hljs-title function_">status</span>(<span class="hljs-number">429</span>).<span class="hljs-title function_">send</span>(<span class="hljs-string">&quot;Too Many Requests&quot;</span>);\n    });\n});\n</code></pre>\n<h3>📝 总结建议</h3>\n<ul>\n<li><strong>生产环境必须配置 <code>insurer</code></strong>   ：Redis 虽然稳定，但也会有故障，配置一个 <code>RateLimiterMemory</code> 作为兜底是高可用架构的最佳实践。</li>\n<li><strong>合理使用 <code>blockDuration</code></strong>   ：对于登录、短信验证码等敏感接口，配置 <code>blockDuration</code> 可以有效防刷。</li>\n<li><strong>谨慎使用 <code>inMemoryBlockOnConsumed</code></strong>   ：如果你的应用部署在多个 Node.js 实例上，内存阻塞只对当前实例有效，可能会导致限流不精确。但在面对极端恶意流量时，它能有效保护 Redis。</li>\n</ul>\n</div>'</script></body></html>
