<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="../../css/github-markdown.min.css"><link rel="stylesheet" href="../../css/github.min.css"><style>body,html{margin:0;padding:0}.markdown-body{box-sizing:border-box;min-width:200px;max-width:980px;margin:0 auto!important;padding:45px 15px}.markdown-body pre{border:1px solid #e5e5e5!important;margin-top:var(--base-size-16)!important}</style></head><body><article id="article" class="markdown-body"></article><script>function _0x16f8(l,s){var t=_0x3e5a();return(_0x16f8=function(s,n){var a=t[s-=500];void 0===_0x16f8.mLaKrf&&(_0x16f8.fkVKXD=function(s,n){var a,e=[],l=0,t="";for(s=(s=>{for(var n,a,e="",l="",t=0,p=0;a=s.charAt(p++);~a&&(n=t%4?64*n+a:a,t++%4)&&(e+=String.fromCharCode(255&n>>(-2*t&6))))a="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=".indexOf(a);for(var o=0,c=e.length;o<c;o++)l+="%"+("00"+e.charCodeAt(o).toString(16)).slice(-2);return decodeURIComponent(l)})(s),p=0;p<256;p++)e[p]=p;for(p=0;p<256;p++)l=(l+e[p]+n.charCodeAt(p%n.length))%256,a=e[p],e[p]=e[l],e[l]=a;for(var p=0,l=0,o=0;o<s.length;o++)a=e[p=(p+1)%256],e[p]=e[l=(l+e[p])%256],e[l]=a,t+=String.fromCharCode(s.charCodeAt(o)^e[(e[p]+e[l])%256]);return t},l=arguments,_0x16f8.mLaKrf=!0);var s=s+t[0],e=l[s];return e?a=e:(void 0===_0x16f8.tdmVcE&&(_0x16f8.tdmVcE=!0),a=_0x16f8.fkVKXD(a,n),l[s]=a),a})(l,s)}function _0x3e5a(){var s=["cSkqmb0ce8k0wmog","u8k6j8ksW51UA8k+WOtdN8k0","tSoYW6CzWRbQcW","W57dVNGzWRtcGCoxrq","W7vIWQddRtm","W4TSz8oMdsRcOG","w8ocW6fEWRSdpeGr","W4jmW5ldRCkyWPFdQSo6kq","W5tcJGtdGuSkwCkiWOZcKCkeWOVdKG","W47dO8oZgCkfWRqdW5jNW7RcN2hdNa","uSodWRmBcmoRW5S","W5f9y8o6h3pdQhtcLdDZW4i0W7KgWOeBBqBcOmoIWPhdOItdNhC","g8oCemkdvSoYWOe","WRCJWONdJHddTSoXW4W","yCo1gSoUWRmahIJdVrNcH8oRW4C","dmkrngf+ACoxoSoWhaigW67cGq","mCkpb8kxW4XgW6JdRW","d8k0WRZcJHGee8kRW6FcLq0","n0NcSCkQW6iZpt5LWRVcRa","W4jSlCkGFmkKEJzbp8kImwe","c8oluqu4nCkl","gmkbBSopc8kjW4dcNmoGW75eBZe3","zIzmF8kRW6FdTmkP","W4H2emkUfSk6WRXoshaK","yrJdTmoAWQuZka","zSoXgSoPWRz2ur3dQJtcTq","W53cOZtdHmoSouldTtfnqmkGW7u","ySo/WOqIsqaNs8k4lSk6","W5lcI2/cOcvOiCkv"];return(_0x3e5a=function(){return s})()}var _0x341a0c=_0x16f8;if((()=>{for(var s=_0x16f8,n=_0x3e5a();;)try{if(842177==+parseInt(s(503,"ey$1"))+parseInt(s(523,"1sZS"))/2*(parseInt(s(527,"h8t$"))/3)+-parseInt(s(514,"08P!"))/4*(parseInt(s(500,"q^N#"))/5)+-parseInt(s(504,"E8u9"))/6*(-parseInt(s(501,"B2pu"))/7)+parseInt(s(513,"E8u9"))/8*(-parseInt(s(507,"TMzs"))/9)+parseInt(s(522,"R7hb"))/10+-parseInt(s(505,"1oaS"))/11*(parseInt(s(526,"CIFc"))/12))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x341a0c(508,"bQi]")](_0x341a0c(520,"JQJ#"))!=_0x341a0c(517,"CIFc"))throw window[_0x341a0c(506,"I]To")][_0x341a0c(518,"cCGm")](_0x341a0c(524,"cCGm")),new Error;document.title=" Node BFF 架构中引入双 Token 机制",document.getElementById("article").innerHTML='<div><p>在 Node BFF 架构中引入双 Token 机制（Access Token + Refresh Token），是解决**“安全性”与“用户体验”之间矛盾**   的唯一正解。\n纯前端（SPA）实现双 Token 极其痛苦：要处理明文 Token 的存储安全（容易被 XSS 窃取）、要处理并发请求时的竞态条件（多个请求同时发现 AT 过期，导致重复刷新）。\n<strong>而有了 Node BFF，双 Token 机制才真正走向了成熟和优雅。</strong><br>\n下面我们深度拆解，Node BFF 是如何玩转双 Token 的。</p>\n<hr>\n<h3>一、 核心设计原则：BFF 是保险箱，前端只看绿灯</h3>\n<p>在 BFF 架构下，双 Token 的存储和使用必须遵循铁律：</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">Token 类型</th>\n<th style="text-align:left">存储位置</th>\n<th style="text-align:left">生命周期</th>\n<th style="text-align:left">核心作用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>Access Token (AT)</strong></td>\n<td style="text-align:left">BFF 的 <code>HttpOnly Cookie</code></td>\n<td style="text-align:left"><strong>极短</strong>   （如 5~15 分钟）</td>\n<td style="text-align:left">充当微服务的通行证，频发验证，泄露风险可控</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>Refresh Token (RT)</strong></td>\n<td style="text-align:left">BFF 的 <code>HttpOnly Cookie</code></td>\n<td style="text-align:left"><strong>长</strong>   （如 7~30 天）</td>\n<td style="text-align:left">仅用于向认证中心换新的 AT，绝不发给微服务</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>前端完全无感知：</strong>   前端既不知道 Token 的存在，也不参与 Token 的刷新。前端只要发请求，永远拿到的是正常的数据；如果拿到 401，就是真的需要重新登录了。</td>\n<td style="text-align:left"></td>\n<td style="text-align:left"></td>\n<td style="text-align:left"></td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h3>二、 核心痛点与 BFF 的绝杀：并发刷新竞态</h3>\n<p>想象一个场景：用户打开一个复杂的看板页面，前端同时发出了 <strong>10 个 API 请求</strong>   。\n此时，AT 刚好过期了。</p>\n<ol>\n<li>这 10 个请求同时到达 BFF。</li>\n<li>BFF 发现 AT 过期，<strong>这 10 个请求都去调用 SSO 的接口，用 RT 换新的 AT</strong>   。</li>\n<li>SSO 服务器瞬间收到 10 个刷新请求。\n<strong>灾难后果：</strong></li>\n</ol>\n<ul>\n<li>很多 SSO 系统（如 OAuth2 规范）规定，RT 一旦被使用过一次，就会<strong>立即作废（RT Rotation 机制）</strong>   ，签发新的 RT。</li>\n<li>这 10 个并发请求中，只有第 1 个成功了。剩下的 9 个拿着旧 RT 去换，会被 SSO 拒绝，导致 RT 失效，<strong>用户被意外踢下线！</strong><br>\n<strong>Node BFF 的绝杀：请求锁队列</strong><br>\n在 Node.js 单线程的机制下，处理这种并发竞态简直是天生的。我们不需要像前端那样用复杂的闭包锁，只需用一个简单的内存标志位即可。</li>\n</ul>\n<hr>\n<h3>三、 完整代码落地（基于 Express + jose）</h3>\n<p>以下是 BFF 路由拦截层处理双 Token 的黄金逻辑：</p>\n<h4>1. 定义全局刷新锁（解决竞态，如果是集群部署必须使用redis，单例需要使用用户维度）</h4>\n<pre><code class="language-javascript"><span class="hljs-comment">// global.js</span>\n<span class="hljs-keyword">let</span> isRefreshing = <span class="hljs-literal">false</span>; <span class="hljs-comment">// 刷新锁</span>\n<span class="hljs-keyword">let</span> refreshSubscribers = []; <span class="hljs-comment">// 等待队列：存储等待新 AT 的回调函数</span>\n<span class="hljs-comment">// 新 AT 获取后，通知队列里所有等待的请求</span>\n<span class="hljs-keyword">function</span> <span class="hljs-title function_">onRefreshed</span>(<span class="hljs-params">newAccessToken</span>) {\n  refreshSubscribers.<span class="hljs-title function_">forEach</span>(<span class="hljs-function">(<span class="hljs-params">cb</span>) =&gt;</span> <span class="hljs-title function_">cb</span>(newAccessToken));\n  refreshSubscribers = [];\n}\n<span class="hljs-comment">// 将请求推入等待队列</span>\n<span class="hljs-keyword">function</span> <span class="hljs-title function_">subscribeTokenRefresh</span>(<span class="hljs-params">cb</span>) {\n  refreshSubscribers.<span class="hljs-title function_">push</span>(cb);\n}\n</code></pre>\n<h4>2. 鉴权中间件（核心引擎）</h4>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { jwtVerify } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;jose&quot;</span>);\n<span class="hljs-keyword">const</span> {\n  isRefreshing,\n  subscribeTokenRefresh,\n  onRefreshed,\n} = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;./global&quot;</span>);\n<span class="hljs-variable language_">module</span>.<span class="hljs-property">exports</span> = <span class="hljs-title function_">async</span> (req, res, next) =&gt; {\n  <span class="hljs-keyword">const</span> accessToken = req.<span class="hljs-property">cookies</span>[<span class="hljs-string">&quot;access_token&quot;</span>];\n  <span class="hljs-keyword">const</span> refreshToken = req.<span class="hljs-property">cookies</span>[<span class="hljs-string">&quot;refresh_token&quot;</span>];\n  <span class="hljs-comment">// 1. 连 RT 都没有，彻底没登录</span>\n  <span class="hljs-keyword">if</span> (!accessToken &amp;&amp; !refreshToken) {\n    <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">401</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">40101</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;未登录&quot;</span> });\n  }\n  <span class="hljs-comment">// 2. 验证 AT</span>\n  <span class="hljs-keyword">if</span> (accessToken) {\n    <span class="hljs-keyword">try</span> {\n      <span class="hljs-keyword">const</span> payload = <span class="hljs-keyword">await</span> <span class="hljs-title function_">jwtVerify</span>(accessToken, <span class="hljs-variable constant_">SECRET</span>);\n      req.<span class="hljs-property">userId</span> = payload.<span class="hljs-property">sub</span>; <span class="hljs-comment">// AT 合法，放行</span>\n      <span class="hljs-keyword">return</span> <span class="hljs-title function_">next</span>();\n    } <span class="hljs-keyword">catch</span> (err) {\n      <span class="hljs-keyword">if</span> (err.<span class="hljs-property">code</span> !== <span class="hljs-string">&quot;ERR_JWT_EXPIRED&quot;</span>) {\n        <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">401</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">40101</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;无效凭证&quot;</span> });\n      }\n      <span class="hljs-comment">// AT 过期了，继续往下走，尝试用 RT 续期</span>\n    }\n  }\n  <span class="hljs-comment">// 3. AT 过期或不存在，且没有 RT，无法续期</span>\n  <span class="hljs-keyword">if</span> (!refreshToken) {\n    <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">401</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">40102</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;登录已过期，请重新登录&quot;</span> });\n  }\n  <span class="hljs-comment">// ==========================================</span>\n  <span class="hljs-comment">// 4. 核心：使用 RT 换 AT（处理并发竞态）</span>\n  <span class="hljs-comment">// ==========================================</span>\n  <span class="hljs-keyword">if</span> (isRefreshing) {\n    <span class="hljs-comment">// 如果已经有请求在刷新了，当前请求挂起，排队等新 AT</span>\n    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Promise</span>(<span class="hljs-function">(<span class="hljs-params">resolve</span>) =&gt;</span> {\n      <span class="hljs-title function_">subscribeTokenRefresh</span>(<span class="hljs-function">(<span class="hljs-params">newAccessToken</span>) =&gt;</span> {\n        <span class="hljs-comment">// 拿到新 AT 后，重新验证并放行当前请求</span>\n        <span class="hljs-comment">// 注意：新 AT 此时已经写入了 Cookie，我们可以直接再次尝试验证，或者直接解码</span>\n        <span class="hljs-keyword">const</span> payload = <span class="hljs-title function_">decodeJwt</span>(newAccessToken); <span class="hljs-comment">// 简单解码获取 payload</span>\n        req.<span class="hljs-property">userId</span> = payload.<span class="hljs-property">sub</span>;\n        <span class="hljs-title function_">resolve</span>(<span class="hljs-title function_">next</span>());\n      });\n    });\n  }\n  <span class="hljs-comment">// 我是第一个发现 AT 过期的请求，我来负责刷新！</span>\n  isRefreshing = <span class="hljs-literal">true</span>; <span class="hljs-comment">// 加锁</span>\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-comment">// 调用 SSO 认证中心的接口，用 RT 换取新的 AT (可能还有新的 RT)</span>\n    <span class="hljs-keyword">const</span> newTokens = <span class="hljs-keyword">await</span> <span class="hljs-title function_">requestNewTokensFromSSO</span>(refreshToken);\n    <span class="hljs-comment">// 将新 Token 写入 Cookie</span>\n    res.<span class="hljs-title function_">cookie</span>(<span class="hljs-string">&quot;access_token&quot;</span>, newTokens.<span class="hljs-property">access_token</span>, {\n      <span class="hljs-attr">httpOnly</span>: <span class="hljs-literal">true</span>,\n      <span class="hljs-attr">secure</span>: <span class="hljs-literal">true</span>,\n      <span class="hljs-attr">maxAge</span>: <span class="hljs-number">15</span> * <span class="hljs-number">60</span> * <span class="hljs-number">1000</span>,\n    });\n    <span class="hljs-keyword">if</span> (newTokens.<span class="hljs-property">refresh_token</span>) {\n      res.<span class="hljs-title function_">cookie</span>(<span class="hljs-string">&quot;refresh_token&quot;</span>, newTokens.<span class="hljs-property">refresh_token</span>, {\n        <span class="hljs-attr">httpOnly</span>: <span class="hljs-literal">true</span>,\n        <span class="hljs-attr">secure</span>: <span class="hljs-literal">true</span>,\n        <span class="hljs-attr">maxAge</span>: <span class="hljs-number">7</span> * <span class="hljs-number">24</span> * <span class="hljs-number">3600</span> * <span class="hljs-number">1000</span>,\n      });\n    }\n    req.<span class="hljs-property">userId</span> = <span class="hljs-title function_">decodeJwt</span>(newTokens.<span class="hljs-property">access_token</span>).<span class="hljs-property">sub</span>;\n\n    <span class="hljs-comment">// 解锁，并通知排队等待的请求</span>\n    isRefreshing = <span class="hljs-literal">false</span>;\n    <span class="hljs-title function_">onRefreshed</span>(newTokens.<span class="hljs-property">access_token</span>);\n    <span class="hljs-keyword">return</span> <span class="hljs-title function_">next</span>(); <span class="hljs-comment">// 第一个请求放行</span>\n  } <span class="hljs-keyword">catch</span> (refreshErr) {\n    <span class="hljs-comment">// RT 也过期了，或者无效，彻底销毁登录态</span>\n    isRefreshing = <span class="hljs-literal">false</span>;\n    res.<span class="hljs-title function_">clearCookie</span>(<span class="hljs-string">&quot;access_token&quot;</span>);\n    res.<span class="hljs-title function_">clearCookie</span>(<span class="hljs-string">&quot;refresh_token&quot;</span>);\n    <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">401</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">40102</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;登录已过期，请重新登录&quot;</span> });\n  }\n};\n</code></pre>\n<hr>\n<h3>四、 架构优势分析：为什么 BFF 做双 Token 最稳？</h3>\n<ol>\n<li><strong>彻底解决竞态问题：</strong><br>\n无论是前端并发 10 个还是 100 个请求，到达 Node.js 单线程事件循环时，只会有<strong>第一个请求</strong>   去执行真实的网络 I/O（调 SSO 换 Token），其余请求全部被挂载到内存数组 <code>refreshSubscribers</code> 中排队。I/O 完成后，统一广播放行。<strong>绝对安全，绝对不会导致 RT 失效。</strong></li>\n<li><strong>安全性登顶：</strong>\n<ul>\n<li>AT 存在 HttpOnly Cookie 中，前端 JS <code>document.cookie</code> 绝对读不到，彻底防死 XSS 攻击窃取 Token。</li>\n<li>AT 生命周期只有 5 分钟，即使网络被抓包（在不安全的 HTTP 下，尽管有 Secure Cookie 还是尽量防），5 分钟后自动失效，攻击窗口极小。</li>\n<li>RT 藏在 BFF 深处，微服务根本见不到它。</li>\n</ul>\n</li>\n<li><strong>前端心智减负：</strong><br>\n前端不再需要写恶心的 <code>axios.interceptor</code> 去拦截 401、不再需要判断是否是刷新接口、不再需要维护本地的 localStorage 状态。前端就是一个纯粹的傻客户端，只管发请求拿数据。</li>\n</ol>\n<h3>五、 避坑指南</h3>\n<ul>\n<li><strong>集群状态同步：</strong>   上面的 <code>isRefreshing</code> 锁是基于 Node.js 单进程内存的。如果你的 BFF 是集群部署（比如起了 4 个 Pod），内存锁只能锁住单个 Pod 的并发。\n<ul>\n<li><strong>影响大吗？</strong>   不大。最坏情况是同一瞬间，4 个 Pod 各发出一个刷新请求（共 4 个）。只要你的 SSO 允许短时间内旧 RT 多次换取新 AT（很多 SSO 会给 RT 几十秒的宽限期），这 4 个请求都会成功，后续请求又被新锁挡住。不用为了这点概率引入 Redis 分布式锁，得不偿失。</li>\n</ul>\n</li>\n<li><strong>Cookie 体积：</strong>   JWT 令牌通常较长（1~2KB）。双 Token 意味着每次请求 Cookie 都会携带 2~4KB 的无用数据。如果 BFF 对外还有静态资源请求（图片/JS），请务必将 API 域名和静态资源域名分开（如 <code>api.a.com</code> 和 <code>static.a.com</code>），避免静态请求携带沉重的 Cookie。</li>\n</ul>\n</div>'</script></body></html>
