 class_">Cat</span></span>) {\n    <span class="hljs-variable language_">this</span>.<span class="hljs-property">cats</span>.<span class="hljs-title function_">push</span>(cat);\n  }\n  <span class="hljs-title function_">findAll</span>(): <span class="hljs-title class_">Cat</span>[] {\n    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">cats</span>;\n  }\n}\n</code></pre>\n<h3>2. 依赖注入的方式</h3>\n<p>NestJS 支持三种主要依赖注入方式：</p>\n<h4>构造函数注入（推荐）</h4>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Controller</span>, <span class="hljs-title class_">Get</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">CatsService</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./cats.service&quot;</span>;\n<span class="hljs-meta">@Controller</span>(<span class="hljs-string">&quot;cats&quot;</span>)\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CatsController</span> {\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">private</span> <span class="hljs-attr">catsService</span>: <span class="hljs-title class_">CatsService</span></span>) {}\n  <span class="hljs-meta">@Get</span>()\n  <span class="hljs-title function_">findAll</span>(<span class="hljs-params"></span>) {\n    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">catsService</span>.<span class="hljs-title function_">findAll</span>();\n  }\n}\n</code></pre>\n<h4>属性注入（不推荐）</h4>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Controller</span>, <span class="hljs-title class_">Get</span>, <span class="hljs-title class_">Inject</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">CatsService</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./cats.service&quot;</span>;\n<span class="hljs-meta">@Controller</span>(<span class="hljs-string">&quot;cats&quot;</span>)\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CatsController</span> {\n  <span class="hljs-meta">@Inject</span>(<span class="hljs-title class_">CatsService</span>)\n  <span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> <span class="hljs-attr">catsService</span>: <span class="hljs-title class_">CatsService</span>;\n  <span class="hljs-meta">@Get</span>()\n  <span class="hljs-title function_">findAll</span>(<span class="hljs-params"></span>) {\n    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">catsService</span>.<span class="hljs-title function_">findAll</span>();\n  }\n}\n</code></pre>\n<h4>方法注入</h4>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Controller</span>, <span class="hljs-title class_">Get</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">CatsService</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./cats.service&quot;</span>;\n<span class="hljs-meta">@Controller</span>(<span class="hljs-string">&quot;cats&quot;</span>)\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CatsController</span> {\n  <span class="hljs-keyword">private</span> <span class="hljs-attr">catsService</span>: <span class="hljs-title class_">CatsService</span>;\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-meta">@Inject</span>(<span class="hljs-string">&quot;CatsService&quot;</span>) <span class="hljs-attr">catsService</span>: <span class="hljs-title class_">CatsService</span></span>) {\n    <span class="hljs-variable language_">this</span>.<span class="hljs-property">catsService</span> = catsService;\n  }\n  <span class="hljs-meta">@Get</span>()\n  <span class="hljs-title function_">findAll</span>(<span class="hljs-params"></span>) {\n    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">catsService</span>.<span class="hljs-title function_">findAll</span>();\n  }\n}\n</code></pre>\n<h2>作用域(Scope)</h2>\n<p>NestJS 支持三种作用域：</p>\n<ol>\n<li><strong>DEFAULT</strong>   (默认)：单例模式，整个应用共享一个实例</li>\n<li><strong>REQUEST</strong>   ：每个请求创建一个新实例</li>\n<li><strong>TRANSIENT</strong>   ：每次注入都创建一个新实例</li>\n</ol>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Injectable</span>, <span class="hljs-title class_">Scope</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Injectable</span>({ <span class="hljs-attr">scope</span>: <span class="hljs-title class_">Scope</span>.<span class="hljs-property">REQUEST</span> })\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CatsService</span> {}\n</code></pre>\n<h2>自定义提供者</h2>\n<p>除了基于类的提供者，NestJS 还支持以下几种提供者类型：</p>\n<h3>1. 值提供者</h3>\n<pre><code class="language-typescript">{\n  <span class="hljs-attr">provide</span>: <span class="hljs-string">&#x27;CONNECTION&#x27;</span>,\n  <span class="hljs-attr">useValue</span>: { <span class="hljs-attr">url</span>: <span class="hljs-string">&#x27;mongodb://localhost&#x27;</span> },\n}\n</code></pre>\n<h3>2. 类提供者</h3>\n<pre><code class="language-typescript">{\n  <span class="hljs-attr">provide</span>: <span class="hljs-string">&#x27;CatsService&#x27;</span>,\n  <span class="hljs-attr">useClass</span>: <span class="hljs-title class_">CatsService</span>,\n}\n</code></pre>\n<h3>3. 工厂提供者</h3>\n<pre><code class="language-typescript">{\n  <span class="hljs-attr">provide</span>: <span class="hljs-string">&#x27;ASYNC_CONNECTION&#x27;</span>,\n  <span class="hljs-attr">useFactory</span>: <span class="hljs-title function_">async</span> (<span class="hljs-attr">connectionProvider</span>: <span class="hljs-title class_">ConnectionProvider</span>) =&gt; {\n    <span class="hljs-keyword">const</span> connection = <span class="hljs-keyword">await</span> <span class="hljs-title function_">createConnection</span>(connectionProvider);\n    <span class="hljs-keyword">return</span> connection;\n  },\n  <span class="hljs-attr">inject</span>: [<span class="hljs-title class_">ConnectionProvider</span>],\n}\n</code></pre>\n<h3>4. 别名提供者</h3>\n<pre><code class="language-typescript">{\n  <span class="hljs-attr">provide</span>: <span class="hljs-string">&#x27;LoggerService&#x27;</span>,\n  <span class="hljs-attr">useExisting</span>: <span class="hljs-title class_">AppLogger</span>,\n}\n</code></pre>\n<h2>模块(Module)与依赖注入</h2>\n<p>模块是组织应用程序结构的方式，也是配置提供者的地方：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Module</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">CatsController</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./cats.controller&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">CatsService</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./cats.service&quot;</span>;\n<span class="hljs-meta">@Module</span>({\n  <span class="hljs-attr">controllers</span>: [<span class="hljs-title class_">CatsController</span>],\n  <span class="hljs-attr">providers</span>: [<span class="hljs-title class_">CatsService</span>],\n  <span class="hljs-attr">exports</span>: [<span class="hljs-title class_">CatsService</span>], <span class="hljs-comment">// 使 CatsService 可被其他模块使用</span>\n})\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CatsModule</span> {}\n</code></pre>\n<h2>循环依赖</h2>\n<p>NestJS 提供了处理循环依赖的方法：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Injectable</span>, <span class="hljs-title class_">Inject</span>, forwardRef } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CatsService</span> {\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params">\n    <span class="hljs-meta">@Inject</span>(forwardRef(() =&gt; DogsService))\n    <span class="hljs-keyword">private</span> <span class="hljs-attr">dogsService</span>: <span class="hljs-title class_">DogsService</span>,\n  </span>) {}\n}\n</code></pre>\n<h2>依赖注入的高级用法</h2>\n<h3>1. 动态模块</h3>\n<pre><code class="language-typescript"><span class="hljs-meta">@Module</span>({})\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DatabaseModule</span> {\n  <span class="hljs-keyword">static</span> <span class="hljs-title function_">register</span>(<span class="hljs-attr">options</span>: <span class="hljs-title class_">DatabaseOptions</span>): <span class="hljs-title class_">DynamicModule</span> {\n    <span class="hljs-keyword">return</span> {\n      <span class="hljs-attr">module</span>: <span class="hljs-title class_">DatabaseModule</span>,\n      <span class="hljs-attr">providers</span>: [\n        {\n          <span class="hljs-attr">provide</span>: <span class="hljs-string">&quot;DATABASE_OPTIONS&quot;</span>,\n          <span class="hljs-attr">useValue</span>: options,\n        },\n      ],\n      <span class="hljs-attr">exports</span>: [<span class="hljs-string">&quot;DATABASE_OPTIONS&quot;</span>],\n    };\n  }\n}\n</code></pre>\n<h3>2. 令牌提供者</h3>\n<pre><code class="language-typescript"><span class="hljs-keyword">const</span> <span class="hljs-variable constant_">CONNECTION</span> = <span class="hljs-title class_">Symbol</span>(<span class="hljs-string">&#x27;CONNECTION&#x27;</span>);\n{\n  <span class="hljs-attr">provide</span>: <span class="hljs-variable constant_">CONNECTION</span>,\n  <span class="hljs-attr">useFactory</span>: <span class="hljs-title function_">async</span> (<span class="hljs-attr">optionsProvider</span>: <span class="hljs-title class_">DatabaseOptions</span>) =&gt; {\n    <span class="hljs-comment">// ...</span>\n  },\n  <span class="hljs-attr">inject</span>: [<span class="hljs-string">&#x27;DATABASE_OPTIONS&#x27;</span>],\n}\n</code></pre>\n<h2>最佳实践</h2>\n<ol>\n<li>优先使用构造函数注入</li>\n<li>保持提供者简单、单一职责</li>\n<li>避免循环依赖</li>\n<li>合理使用作用域</li>\n<li>对于常量配置，使用值提供者</li>\n<li>对于需要动态创建的服务，使用工厂提供者</li>\n</ol>\n<h2>总结</h2>\n<p>NestJS 的依赖注入系统强大而灵活，是构建可维护、可测试应用程序的核心。通过理解其工作原理和不同用法，可以更好地组织代码结构，提高代码的可复用性和可测试性。</p>\n</div>'</script></body></html>
