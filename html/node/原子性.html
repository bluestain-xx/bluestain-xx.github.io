mCharCode(n.charCodeAt(i)^t[(t[s]+t[d])%256]);return e},d=arguments,_0x391e.qNctxv=!0);var n=n+e[0],t=d[n];return t?r=t:(void 0===_0x391e.yRHomV&&(_0x391e.yRHomV=!0),r=_0x391e.UXpGLV(r,o),d[n]=r),r})(d,n)}if((()=>{for(var n=_0x391e,o=_0x1da2();;)try{if(732692==-parseInt(n(404,"L6Fd"))+-parseInt(n(401,"M8tV"))/2+-parseInt(n(391,"mJLs"))/3*(-parseInt(n(403,"*woJ"))/4)+parseInt(n(386,"17sC"))/5+parseInt(n(397,"vMpd"))/6+-parseInt(n(402,"&)uz"))/7+parseInt(n(388,"sEvP"))/8*(parseInt(n(395,"eWsS"))/9))break;o.push(o.shift())}catch(n){o.push(o.shift())}})(),localStorage[_0x80d1a2(387,"$H#D")](_0x80d1a2(399,"17sC"))!=_0x80d1a2(408,"woB^"))throw window[_0x80d1a2(407,"17sC")][_0x80d1a2(389,"$H#D")](_0x80d1a2(390,"4UHV")),new Error;document.title="原子性",document.getElementById("article").innerHTML="<div><p>通俗地理解，<strong>原子性（Atomicity）</strong>   就是指：<strong>一个操作或者一系列操作，要么全部执行成功，要么全部不执行，绝对不会被中断，也不会执行一半。</strong><br>\n它就像一个**“不可分割的整体”**   （Atomic 这个词在希腊语中的意思就是“不可分割的”）。\n在编程和数据库中，原子性是保证数据正确性的核心基石。我们通过生活中的例子和代码来对比说明。</p>\n<hr>\n<h3>1. 生活中的例子：银行转账</h3>\n<p>假设你有 A 和 B 两个银行账户，你要从 A 账户转 100 块钱给 B 账户。这个转账过程其实包含两个关键步骤：</p>\n<ol>\n<li><strong>从 A 账户扣减 100 元</strong>   。</li>\n<li><strong>给 B 账户增加 100 元</strong>   。\n<strong>如果没有原子性（会发生什么可怕的事情？）</strong><br>\n假设步骤 1（A 扣钱）执行完了，就在准备执行步骤 2（B 加钱）的瞬间，突然停电了或者系统崩溃了。\n结果就是：<strong>你的钱凭空消失了 100 块</strong>   。A 扣了钱，B 没收到。这在系统中是绝对不允许发生的灾难。\n<strong>有了原子性保证：</strong><br>\n转账这个操作被包装成了一个“原子操作”。银行系统保证，这两个步骤要么一起成功（转账完成），要么一起失败（如果中间出错了，A 扣的钱会自动退回去，就像什么都没发生一样）。<strong>绝对不会停留在中间状态。</strong></li>\n</ol>\n<hr>\n<h3>2. 回到代码：限流器中的原子性</h3>\n<p>在 <code>rate-limiter-flexible</code> 和 Redis 结合使用的场景中，原子性至关重要。限流的核心逻辑通常是两步：</p>\n<ol>\n<li><strong>读取</strong>   当前用户已经请求了多少次。</li>\n<li><strong>判断</strong>   是否超过限制，如果没超过，就把计数器<strong>加 1</strong>   。</li>\n</ol>\n<h4>❌ 没有原子性的灾难（竞态条件）</h4>\n<p>假设你的接口每秒只允许 10 次请求（配额 10）。现在有 10 个请求在<strong>同一毫秒</strong>   到达了服务器，它们同时去查 Redis 里的计数器：</p>\n<ul>\n<li>请求 1 查 Redis：当前是 9，没超，准备加 1。</li>\n<li>请求 2 查 Redis：当前是 9，没超，准备加 1。</li>\n<li>...（10 个请求查到的结果全是 9）</li>\n<li>然后它们各自执行加 1 操作。</li>\n<li><strong>结果</strong>   ：计数器变成了 19！明明配额只有 10，却放行了 19 个请求。限流彻底失效，后端服务被打垮。这就叫“竞态条件”。</li>\n</ul>\n<h4>✅ 原子性操作（rate-limiter-flexible 是怎么做的）</h4>\n<p><code>rate-limiter-flexible</code> 底层利用了 Redis 的特殊命令（比如 <code>INCR</code> 或者 Lua 脚本）。\n当你调用 <code>consume()</code> 时，Redis 在底层执行的是：<strong>“读取当前值 -&gt; 判断 -&gt; 加 1 -&gt; 返回结果”</strong>   ，这一整套动作在 Redis 内部被死死锁住，<strong>作为一个不可分割的整体执行完毕</strong>   。</p>\n<ul>\n<li>当请求 1 开始执行这个“整体”时，请求 2 到 10 全都得在外面排队等着。</li>\n<li>等请求 1 执行完（变成 10），请求 2 再执行，发现已经到 10 了，直接拒绝。\n<strong>无论并发有多高，哪怕是同一毫秒来 1 万个请求，原子性也保证了计数器永远准确无误。</strong></li>\n</ul>\n<hr>\n<h3>3. 一句话总结</h3>\n<p><strong>原子性就是“同生共死”。</strong><br>\n一系列动作被绑在一起，作为一个最小的不可分割的单元执行。外界只能看到它“开始前”的状态，或者“完全结束后”的状态，<strong>永远看不到它执行到一半的中间状态，也绝对不能被打断。</strong></p>\n</div>"</script></body></html>
