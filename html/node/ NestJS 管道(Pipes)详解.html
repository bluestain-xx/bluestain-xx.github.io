pan class="hljs-title function_">findOne</span>(id);\n}\n</code></pre>\n<h3>2. 在控制器级别使用</h3>\n<pre><code class="language-typescript"><span class="hljs-meta">@UsePipes</span>(<span class="hljs-title class_">ValidationPipe</span>)\n<span class="hljs-meta">@Controller</span>(<span class="hljs-string">&quot;users&quot;</span>)\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UsersController</span> {}\n</code></pre>\n<h3>3. 在全局级别使用</h3>\n<pre><code class="language-typescript"><span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">bootstrap</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">const</span> app = <span class="hljs-keyword">await</span> <span class="hljs-title class_">NestFactory</span>.<span class="hljs-title function_">create</span>(<span class="hljs-title class_">AppModule</span>);\n  app.<span class="hljs-title function_">useGlobalPipes</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">ValidationPipe</span>());\n  <span class="hljs-keyword">await</span> app.<span class="hljs-title function_">listen</span>(<span class="hljs-number">3000</span>);\n}\n</code></pre>\n<h2>自定义管道</h2>\n<p>创建自定义管道：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> {\n  <span class="hljs-title class_">PipeTransform</span>,\n  <span class="hljs-title class_">Injectable</span>,\n  <span class="hljs-title class_">ArgumentMetadata</span>,\n  <span class="hljs-title class_">BadRequestException</span>,\n} <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CustomValidationPipe</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PipeTransform</span> {\n  <span class="hljs-title function_">transform</span>(<span class="hljs-params"><span class="hljs-attr">value</span>: <span class="hljs-built_in">any</span>, <span class="hljs-attr">metadata</span>: <span class="hljs-title class_">ArgumentMetadata</span></span>) {\n    <span class="hljs-keyword">if</span> (!value) {\n      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BadRequestException</span>(<span class="hljs-string">&quot;Validation failed&quot;</span>);\n    }\n    <span class="hljs-keyword">return</span> value;\n  }\n}\n</code></pre>\n<h2>使用ValidationPipe进行DTO验证</h2>\n<ol>\n<li>首先安装class-validator和class-transformer：</li>\n</ol>\n<pre><code class="language-bash">npm i --save class-validator class-transformer\n</code></pre>\n<ol start="2">\n<li>创建DTO类：</li>\n</ol>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">IsString</span>, <span class="hljs-title class_">IsInt</span>, <span class="hljs-title class_">MinLength</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;class-validator&quot;</span>;\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CreateUserDto</span> {\n  <span class="hljs-meta">@IsString</span>()\n  <span class="hljs-meta">@MinLength</span>(<span class="hljs-number">3</span>)\n  <span class="hljs-attr">username</span>: <span class="hljs-built_in">string</span>;\n  <span class="hljs-meta">@IsInt</span>()\n  <span class="hljs-attr">age</span>: <span class="hljs-built_in">number</span>;\n}\n</code></pre>\n<ol start="3">\n<li>在控制器中使用：</li>\n</ol>\n<pre><code class="language-typescript"><span class="hljs-meta">@Post</span>()\n<span class="hljs-title function_">create</span>(<span class="hljs-params"><span class="hljs-meta">@Body</span>(<span class="hljs-keyword">new</span> ValidationPipe()) <span class="hljs-attr">createUserDto</span>: <span class="hljs-title class_">CreateUserDto</span></span>) {\n  <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">usersService</span>.<span class="hljs-title function_">create</span>(createUserDto);\n}\n</code></pre>\n<h2>管道执行顺序</h2>\n<ol>\n<li>中间件</li>\n<li>守卫</li>\n<li>拦截器(之前)</li>\n<li>管道</li>\n<li>控制器方法</li>\n<li>拦截器(之后)</li>\n</ol>\n<h2>高级用法</h2>\n<h3>自定义错误消息</h3>\n<pre><code class="language-typescript"><span class="hljs-meta">@IsString</span>({ <span class="hljs-attr">message</span>: <span class="hljs-string">&#x27;用户名必须是字符串&#x27;</span> })\n<span class="hljs-attr">username</span>: <span class="hljs-built_in">string</span>;\n</code></pre>\n<h3>条件验证</h3>\n<pre><code class="language-typescript"><span class="hljs-meta">@ValidateIf</span>(<span class="hljs-function"><span class="hljs-params">o</span> =&gt;</span> o.<span class="hljs-property">type</span> === <span class="hljs-string">&#x27;user&#x27;</span>)\n<span class="hljs-meta">@IsString</span>()\n<span class="hljs-attr">username</span>: <span class="hljs-built_in">string</span>;\n</code></pre>\n<h3>异步验证</h3>\n<pre><code class="language-typescript"><span class="hljs-meta">@ValidatePromise</span>()\n<span class="hljs-meta">@IsString</span>()\n<span class="hljs-attr">asyncField</span>: <span class="hljs-title class_">Promise</span>&lt;<span class="hljs-built_in">string</span>&gt;;\n</code></pre>\n<p>管道是NestJS中强大的数据验证和转换工具，合理使用可以大大提高应用的健壮性和代码的可维护性。</p>\n</div>'</script></body></html>
