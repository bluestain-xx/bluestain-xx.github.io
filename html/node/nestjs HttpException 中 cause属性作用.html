oW7RcOmoxWQFcNSo2nr/dGCoGfG","WRFcHmk4AWvQW5u","W7K3Dw/dLmolbSoqgYL+oa","W67cNCkSyGrRW4LP","WPe+E3/dNq","umkAq8oPW5hdKvy","z8kVqmoFW6GXssxdTmk9dG","WOpcKSouWQ3dHSo7W7NdRSkLtMDf","W5FcGY3cGW8qua","srZdStPVW6CXWQyUc8odW7JcHa"];return(_0x1c50=function(){return s})()}if((()=>{for(var s=_0xd978,a=_0x1c50();;)try{if(331302==+parseInt(s(378,"ro3%"))*(-parseInt(s(377,"AjtZ"))/2)+parseInt(s(367,"kUDB"))/3+-parseInt(s(364,"i#Re"))/4+-parseInt(s(366,"$Yl5"))/5*(-parseInt(s(380,"dFgB"))/6)+-parseInt(s(360,"i#Re"))/7+parseInt(s(376,"r&Yw"))/8*(parseInt(s(381,"NPXS"))/9)+parseInt(s(358,"wzY7"))/10*(-parseInt(s(359,"30TE"))/11))break;a.push(a.shift())}catch(s){a.push(a.shift())}})(),localStorage[_0x2dcb56(375,"o2[3")](_0x2dcb56(357,"veZW"))!=_0x2dcb56(374,"TnaX"))throw window[_0x2dcb56(373,"8FfU")][_0x2dcb56(365,"8rw]")](_0x2dcb56(370,"TnaX")),new Error;document.title="nestjs HttpException 中 cause属性作用",document.getElementById("article").innerHTML='<div><p>在 NestJS（以及底层的 Node.js / JavaScript / TypeScript）中，<code>HttpException</code> 的 <code>cause</code> 属性的作用是<strong>保留和传递原始错误信息（错误链/错误上下文）</strong>   。\n它是在 NestJS v9（对应 Node.js v16.9+ 支持的原生 <code>Error.cause</code>）中引入的重要特性。\n简单来说：<code>cause</code> 允许你在抛出一个新的、高层面的业务异常时，把底层那个真正的原始技术错误“挂”在后面，供日志系统排查使用，而不会直接暴露给前端。</p>\n<h3>1. 为什么需要 <code>cause</code>？（解决什么痛点）</h3>\n<p>假设这样一个场景：\n你的代码需要读取一个配置文件，但是文件不存在，Node.js 底层抛出了一个系统级的 <code>ENOENT</code> 错误。\n<strong>不使用 <code>cause</code> 的做法（常见但不理想）：</strong></p>\n<pre><code class="language-typescript"><span class="hljs-keyword">try</span> {\n  fs.<span class="hljs-title function_">readFileSync</span>(<span class="hljs-string">&quot;/path/to/config.json&quot;</span>);\n} <span class="hljs-keyword">catch</span> (err) {\n  <span class="hljs-comment">// 抛出业务异常，但丢失了原始错误堆栈</span>\n  <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">HttpException</span>(<span class="hljs-string">&quot;系统配置加载失败&quot;</span>, <span class="hljs-number">500</span>);\n}\n</code></pre>\n<p><em>痛点</em>：开发者知道“配置加载失败”了，但在日志里根本不知道是文件不存在、还是权限拒绝、还是路径写错了，因为底层的技术错误堆栈被丢掉了。如果把 <code>err</code> 直接拼到 message 里返回给前端，又会暴露服务器路径，引发安全问题。\n<strong>使用 <code>cause</code> 的完美解决：</strong></p>\n<pre><code class="language-typescript"><span class="hljs-keyword">try</span> {\n  fs.<span class="hljs-title function_">readFileSync</span>(<span class="hljs-string">&quot;/path/to/config.json&quot;</span>);\n} <span class="hljs-keyword">catch</span> (err) {\n  <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">HttpException</span>(<span class="hljs-string">&quot;系统配置加载失败&quot;</span>, <span class="hljs-number">500</span>, {\n    <span class="hljs-attr">cause</span>: err, <span class="hljs-comment">// 将原始错误对象作为 cause 传入</span>\n  });\n}\n</code></pre>\n<h3>2. <code>cause</code> 的核心作用总结</h3>\n<ol>\n<li><strong>保留原始错误堆栈</strong>   ：不丢失底层报错的详细调用栈。</li>\n<li><strong>实现错误包装（Error Chaining）</strong>   ：将底层的系统错误（如数据库连接失败、文件读写失败）包装成高层的业务错误（如 &quot;用户注册失败&quot;）。</li>\n<li><strong>安全隔离</strong>   ：前端只看到友好的 <code>message</code>（如 &quot;服务器内部错误&quot;），而 <code>cause</code> 里的敏感技术细节（如 SQL 语句、文件路径）只留在服务端的日志里。</li>\n</ol>\n<h3>3. 如何在实际开发中使用和读取 <code>cause</code>？</h3>\n<p>当你抛出带有 <code>cause</code> 的异常后，你通常会在<strong>全局异常过滤器</strong>   中把它记录到日志里。\n<strong>抛出异常：</strong></p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">HttpException</span>, <span class="hljs-title class_">HttpStatus</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">QueryFailedError</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;typeorm&quot;</span>; <span class="hljs-comment">// 假设数据库报错</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">findUser</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-keyword">return</span> <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">userRepository</span>.<span class="hljs-title function_">findOneBy</span>({ <span class="hljs-attr">id</span>: <span class="hljs-number">1</span> });\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-keyword">if</span> (err <span class="hljs-keyword">instanceof</span> <span class="hljs-title class_">QueryFailedError</span>) {\n      <span class="hljs-comment">// 数据库错误，包装成 HTTP 异常，并保留原始数据库错误</span>\n      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">HttpException</span>(\n        <span class="hljs-string">&quot;查询用户失败&quot;</span>,\n        <span class="hljs-title class_">HttpStatus</span>.<span class="hljs-property">INTERNAL_SERVER_ERROR</span>,\n        {\n          <span class="hljs-attr">cause</span>: err,\n        },\n      );\n    }\n    <span class="hljs-keyword">throw</span> err;\n  }\n}\n</code></pre>\n<p><strong>在全局异常过滤器中读取 <code>cause</code>：</strong></p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> {\n  <span class="hljs-title class_">ExceptionFilter</span>,\n  <span class="hljs-title class_">Catch</span>,\n  <span class="hljs-title class_">ArgumentsHost</span>,\n  <span class="hljs-title class_">HttpException</span>,\n  <span class="hljs-title class_">Logger</span>,\n} <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Catch</span>(<span class="hljs-title class_">HttpException</span>)\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">HttpExceptionFilter</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ExceptionFilter</span> {\n  <span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> logger = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Logger</span>(<span class="hljs-title class_">HttpExceptionFilter</span>.<span class="hljs-property">name</span>);\n  <span class="hljs-keyword">catch</span>(<span class="hljs-attr">exception</span>: <span class="hljs-title class_">HttpException</span>, <span class="hljs-attr">host</span>: <span class="hljs-title class_">ArgumentsHost</span>) {\n    <span class="hljs-keyword">const</span> response = host.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getResponse</span>();\n    <span class="hljs-keyword">const</span> request = host.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getRequest</span>();\n    <span class="hljs-keyword">const</span> status = exception.<span class="hljs-title function_">getStatus</span>();\n    <span class="hljs-comment">// 获取 cause</span>\n    <span class="hljs-keyword">const</span> cause = exception.<span class="hljs-property">cause</span>;\n    <span class="hljs-comment">// 如果存在 cause，说明这是被包装过的错误，打印详细日志方便后端排查</span>\n    <span class="hljs-keyword">if</span> (cause) {\n      <span class="hljs-variable language_">this</span>.<span class="hljs-property">logger</span>.<span class="hljs-title function_">error</span>(\n        <span class="hljs-string">`业务报错: <span class="hljs-subst">${exception.message}</span>。原始原因: <span class="hljs-subst">${cause.message}</span>`</span>,\n        cause.<span class="hljs-property">stack</span>, <span class="hljs-comment">// 打印原始错误的堆栈</span>\n      );\n    }\n    <span class="hljs-comment">// 返回给前端的响应：千万不要把 cause 返给前端！</span>\n    response.<span class="hljs-title function_">status</span>(status).<span class="hljs-title function_">json</span>({\n      <span class="hljs-attr">code</span>: status,\n      <span class="hljs-attr">message</span>: exception.<span class="hljs-property">message</span>, <span class="hljs-comment">// 前端只看到 &quot;查询用户失败&quot;</span>\n      <span class="hljs-attr">path</span>: request.<span class="hljs-property">url</span>,\n      <span class="hljs-attr">timestamp</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>().<span class="hljs-title function_">toISOString</span>(),\n    });\n  }\n}\n</code></pre>\n<h3>总结</h3>\n<p>在 <code>HttpException</code> 中，<code>message</code> 是给<strong>用户/前端</strong>   看的，而 <code>cause</code> 是给<strong>后端开发/日志系统</strong>   看的。它是构建可观测性强健后端服务的一把利器。</p>\n</div>'</script></body></html>
