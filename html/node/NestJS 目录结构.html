│   │   ├── auth.controller.ts\n│   │   ├── auth.service.ts\n│   │   ├── strategies/         # Passport 策略 (jwt.strategy.ts, local.strategy.ts)\n│   │   └── dto/                # 数据传输对象\n│   │       ├── login.dto.ts\n│   │       └── register.dto.ts\n│   │\n│   └── users/                  # 用户模块\n│       ├── users.module.ts\n│       ├── users.controller.ts\n│       ├── users.service.ts\n│       ├── entities/           # 数据库实体 (TypeORM/Prisma schema)\n│       │   └── user.entity.ts\n│       └── dto/\n│           ├── create-user.dto.ts\n│           └── update-user.dto.ts\n│\n├── shared/                     # 跨模块共享内容\n│   ├── constants/              # 常量定义\n│   ├── enums/                  # 枚举\n│   ├── interfaces/             # TypeScript 接口或类型\n│   └── utils/                  # 工具函数\n│\n└── types/                      # 全局类型定义\n    └── express.d.ts            # 扩展 Express 的 Request 类型等\n</code></pre>\n<h3>📖 核心目录与文件详解</h3>\n<h4>1. <code>main.ts</code> (入口文件)</h4>\n<p>这是应用启动的地方。主要职责是创建应用实例，配置全局中间件、管道、拦截器、CORS、Swagger 文档等，并监听端口。</p>\n<h4>2. <code>app.module.ts</code> (根模块)</h4>\n<p>负责将整个应用拼接在一起。它导入所有的业务模块（<code>AuthModule</code>, <code>UsersModule</code>）、配置模块（<code>ConfigModule</code>）和数据库模块（<code>TypeOrmModule</code> 等）。</p>\n<h4>3. <code>common/</code> (通用层)</h4>\n<p>存放那些具有全局作用域的组件。这些组件通常会在 <code>app.module.ts</code> 中被注册为全局生效。</p>\n<ul>\n<li><strong>Filters</strong>   : 捕获抛出的异常并返回自定义响应。</li>\n<li><strong>Guards</strong>   : 决定请求是否应该被路由处理器处理（权限验证）。</li>\n<li><strong>Interceptors</strong>   : 绑定在路由处理前后执行逻辑（如统一响应格式 <code>{ code, message, data }</code>，缓存，日志）。</li>\n<li><strong>Pipes</strong>   : 数据转换或数据验证（如 <code>ValidationPipe</code>）。</li>\n</ul>\n<h4>4. <code>modules/</code> (业务模块区) <strong>【核心】</strong></h4>\n<p>NestJS 强烈建议按<strong>业务领域</strong>   组织代码。每个业务领域是一个独立的文件夹，包含该领域所需的所有内容：</p>\n<ul>\n<li><code>*.module.ts</code>: 定义该领域的模块，声明 providers, controllers, imports, exports。</li>\n<li><code>*.controller.ts</code>: 处理 HTTP 请求，调用 Service。</li>\n<li><code>*.service.ts</code>: 处理具体的业务逻辑和数据库交互。</li>\n<li><code>dto/</code>: 定义接收前端数据的结构，配合 <code>class-validator</code> 进行校验。</li>\n<li><code>entities/</code>: 数据库模型定义（如果使用 TypeORM 或 Sequelize）。</li>\n</ul>\n<h4>5. <code>config/</code> (配置区)</h4>\n<p>结合 <code>@nestjs/config</code> 模块使用。将不同环境的配置分文件管理，通过环境变量（<code>.env</code>）动态注入。</p>\n<h4>6. <code>shared/</code> (共享层)</h4>\n<p>与 <code>common/</code> 的区别：<code>common/</code> 通常是 NestJS 运行时的组件（类），而 <code>shared/</code> 通常是纯逻辑或类型定义（如工具函数 <code>helpers.ts</code>，枚举 <code>user-role.enum.ts</code>，纯接口 <code>pagination.interface.ts</code>）。</p>\n<h3>🛠️ 进阶规范建议</h3>\n<ol>\n<li><strong>单一职责原则 (SRC)</strong>   ：不要在 Controller 中写业务逻辑，Controller 只负责接收参数和返回响应；业务逻辑全部下沉到 Service。</li>\n<li><strong>合理使用 DTO</strong>   ：不要直接使用数据库实体作为接口返回值。定义专门的 Response DTO 来过滤敏感字段（如密码）。</li>\n<li><strong>模块解耦</strong>   ：模块之间的依赖应该尽量通过 <code>exports</code> 暴露 Service 来实现，而不是直接引用内部的 Repository。</li>\n<li><strong>使用 CLI 工具</strong>   ：熟练使用 <code>nest generate</code> (简写 <code>nest g</code>) 命令来生成标准目录结构。\n<ul>\n<li>生成模块：<code>nest g mo users</code></li>\n<li>生成控制器：<code>nest g co users</code></li>\n<li>生成服务：<code>nest g s users</code></li>\n</ul>\n</li>\n</ol>\n<h3>📦 扩展：DDD（领域驱动设计）结构</h3>\n<p>如果你的项目非常庞大，可以考虑向 DDD 架构演进，结构大致如下：</p>\n<pre><code class="language-text">src/\n└── modules/\n    └── users/\n        ├── domain/          # 领域层 (实体、值对象、领域服务接口)\n        ├── application/     # 应用层 (用例、应用服务、DTO)\n        ├── infrastructure/  # 基础设施层 (数据库实现、外部API调用)\n        └── presentation/    # 表现层 (Controllers, Resolvers)\n</code></pre>\n<p>对于大部分中小型项目，使用前面介绍的<strong>标准 Feature-based 目录结构</strong>   已经足够优秀且易于维护了。</p>\n</div>'</script></body></html>
