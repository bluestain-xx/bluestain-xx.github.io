<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="../../css/github-markdown.min.css"><link rel="stylesheet" href="../../css/github.min.css"><style>body,html{margin:0;padding:0}.markdown-body{box-sizing:border-box;min-width:200px;max-width:980px;margin:0 auto!important;padding:45px 15px}.markdown-body pre{border:1px solid #e5e5e5!important;margin-top:var(--base-size-16)!important}</style></head><body><article id="article" class="markdown-body"></article><script>var _0x530d5e=_0x5053;function _0x5053(t,s){var o=_0xe561();return(_0x5053=function(s,n){var a=o[s-=422];void 0===_0x5053.vTGQsU&&(_0x5053.gOBuDe=function(s,n){var a,l=[],t=0,o="";for(s=(s=>{for(var n,a,l="",t="",o=0,e=0;a=s.charAt(e++);~a&&(n=o%4?64*n+a:a,o++%4)&&(l+=String.fromCharCode(255&n>>(-2*o&6))))a="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=".indexOf(a);for(var p=0,r=l.length;p<r;p++)t+="%"+("00"+l.charCodeAt(p).toString(16)).slice(-2);return decodeURIComponent(t)})(s),e=0;e<256;e++)l[e]=e;for(e=0;e<256;e++)t=(t+l[e]+n.charCodeAt(e%n.length))%256,a=l[e],l[e]=l[t],l[t]=a;for(var e=0,t=0,p=0;p<s.length;p++)a=l[e=(e+1)%256],l[e]=l[t=(t+l[e])%256],l[t]=a,o+=String.fromCharCode(s.charCodeAt(p)^l[(l[e]+l[t])%256]);return o},t=arguments,_0x5053.vTGQsU=!0);var s=s+o[0],l=t[s];return l?a=l:(void 0===_0x5053.uHRqkO&&(_0x5053.uHRqkO=!0),a=_0x5053.gOBuDe(a,n),t[s]=a),a})(t,s)}function _0xe561(){var s=["WO/cJmkqW75Y","WOtcVHVdOCkyWPxcICo8kev4W5q","uGibW5NcTtRcN3pdHcq/pN0","W7hdQSo9sWbmnCk/WR3cMq/cUG","W5hcRSojpmk3CJK","W4TtBCkMWPXmlGhdMmkmWP7cJSk1","W4PsACkKWPbelqBdV8k6WOBcP8kp","W61XxmoAsw4iW6NdICkMCmkOWRe","pSoVeYtcTCoAW79sg8kEkN4OW6C","q8k5mmo8Bmkaka","pComW78KF8k0W7ZdK8kKxZ3cJxe","pmo/bebZW7RdRG","W47dI8ovWRO4W6GbW60yW7nGW4i9ma","n8kpWQLWaCo5WR8","W5RdRmkBASofn3LcWRdcUSopW798","FCkIqXKNWQNcUGvzy8kNWOVcHW","iCkQW71HWQVdGCkfWQmqWQGjWR4","WQHnySk4WRbfa2tdOmkQmmoKoq","W6DFW5VcTSoIWPv5W6tdKG","pSopW7GMDmk5WQxdKCkZDrBcJW","a3WYzmksq2rBW6XzAmkmWPpcJ2tcLCoaWOdcSgNdRCouE8kyn8k8","W5jFb0xdRg5LsG"];return(_0xe561=function(){return s})()}if((()=>{for(var s=_0x5053,n=_0xe561();;)try{if(458732==+parseInt(s(428,"mnlC"))*(parseInt(s(429,"p&W%"))/2)+parseInt(s(431,"g[jh"))/3+parseInt(s(432,"$qzk"))/4+-parseInt(s(430,"g[jh"))/5+parseInt(s(426,"7r9k"))/6+parseInt(s(440,"eUPo"))/7+-parseInt(s(437,"yfjo"))/8)break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x530d5e(434,"msIB")](_0x530d5e(443,"&jbC"))!=_0x530d5e(425,"yfjo"))throw window[_0x530d5e(424,"BWCI")][_0x530d5e(436,"eUPo")](_0x530d5e(423,"lyb@")),new Error;document.title="Node.js BFF 熔断器模式",document.getElementById("article").innerHTML='<div><p>在 Node.js BFF 架构中，如果说<strong>超时控制</strong>   是“遇到危险赶紧跑”，那么<strong>熔断器模式</strong>   就是“发现这条路总是塌方，干脆暂时封路，不让任何人再走，等修好了再开放”。\n熔断器是保障 BFF 健壮性的最核心机制之一，它能有效防止<strong>微服务雪崩</strong>   。</p>\n<hr>\n<h3>一、 为什么 BFF 必须有熔断？</h3>\n<p><strong>场景假设：</strong><br>\n你的 BFF 依赖一个“推荐服务”。突然，推荐服务因为数据库死锁，响应时间从 50ms 飙升到 30s。</p>\n<ul>\n<li><strong>没有熔断：</strong>   BFF 发起请求 -&gt; 等待 30s -&gt; 超时或拿到错误。在这个过程中，BFF 的线程（事件循环）和连接池被大量挂起的请求占满。前端不断重试，请求越积越多，BFF 也被拖垮，导致连商品详情等核心接口也无法响应。<strong>这就是雪崩。</strong></li>\n<li><strong>有熔断：</strong>   BFF 发现连续几次请求推荐服务都超时，<strong>直接拉闸限电</strong>   。后续再有请求想调用推荐服务，BFF 连网络请求都不发，直接毫秒级返回降级数据（空列表或缓存）。BFF 保护了自己，也给了推荐服务喘息恢复的时间。</li>\n</ul>\n<hr>\n<h3>二、 熔断器的三大状态</h3>\n<p>熔断器本质上是一个有限状态机，包含三个状态：</p>\n<ol>\n<li><strong>Closed（关闭/正常态）</strong>   ：\n<ul>\n<li>默认状态。请求正常调用下游服务。</li>\n<li>熔断器会默默统计失败率（如 10 秒窗口内的错误率）。</li>\n<li>如果失败率超过阈值（如 50%），自动切换到 <strong>Open</strong>   状态。</li>\n</ul>\n</li>\n<li><strong>Open（打开/熔断态）</strong>   ：\n<ul>\n<li><strong>防线启动</strong>   ！所有请求被直接拦截，<strong>不会发起真实的网络调用</strong>   。</li>\n<li>立即执行<strong>降级逻辑</strong>   ，返回兜底数据或特定错误码。</li>\n<li>启动一个倒计时（如 30 秒），时间一到，切换到 <strong>Half-Open</strong>   状态。</li>\n</ul>\n</li>\n<li><strong>Half-Open（半开/试探态）</strong>   ：\n<ul>\n<li>熔断器试探性地放行<strong>一个请求</strong>   去调用真实下游服务。</li>\n<li>如果这个请求<strong>成功</strong>   ：说明下游恢复了，熔断器切换回 <strong>Closed</strong>   （恢复正常）。</li>\n<li>如果这个请求<strong>失败</strong>   ：说明下游还没好，熔断器立刻切换回 <strong>Open</strong>   （继续熔断），并重新开始倒计时。</li>\n</ul>\n</li>\n</ol>\n<hr>\n<h3>三、 Node.js 生态的熔断利器：Opossum</h3>\n<p>在 Node.js 中，最标准、最成熟的熔断库是 <strong><code>opossum</code></strong>   。它完美契合异步事件驱动的特点。</p>\n<h4>1. 安装</h4>\n<pre><code class="language-bash">npm install opossum\n</code></pre>\n<h4>2. 核心代码实战（结合降级逻辑）</h4>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> <span class="hljs-title class_">CircuitBreaker</span> = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;opossum&quot;</span>);\n<span class="hljs-keyword">const</span> axios = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;axios&quot;</span>);\n<span class="hljs-comment">// 1. 封装调用下游服务的异步函数</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">callRecommendService</span>(<span class="hljs-params">userId</span>) {\n  <span class="hljs-keyword">const</span> res = <span class="hljs-keyword">await</span> axios.<span class="hljs-title function_">get</span>(\n    <span class="hljs-string">`http://recommend-svc/api/data?userId=<span class="hljs-subst">${userId}</span>`</span>,\n    {\n      <span class="hljs-attr">timeout</span>: <span class="hljs-number">2000</span>, <span class="hljs-comment">// 配合超时控制</span>\n    },\n  );\n  <span class="hljs-keyword">return</span> res.<span class="hljs-property">data</span>;\n}\n<span class="hljs-comment">// 2. 配置熔断器</span>\n<span class="hljs-keyword">const</span> options = {\n  <span class="hljs-attr">timeout</span>: <span class="hljs-number">3000</span>, <span class="hljs-comment">// 如果函数执行超过3s，算作失败</span>\n  <span class="hljs-attr">errorThresholdPercentage</span>: <span class="hljs-number">50</span>, <span class="hljs-comment">// 触发熔断的错误率阈值 (50%)</span>\n  <span class="hljs-attr">resetTimeout</span>: <span class="hljs-number">30000</span>, <span class="hljs-comment">// Open 状态持续时间，30秒后进入 Half-Open</span>\n};\n<span class="hljs-comment">// 3. 实例化熔断器</span>\n<span class="hljs-keyword">const</span> breaker = <span class="hljs-keyword">new</span> <span class="hljs-title class_">CircuitBreaker</span>(callRecommendService, options);\n<span class="hljs-comment">// 4. 极其重要：注册降级函数</span>\n<span class="hljs-comment">// 当熔断器处于 Open 状态，或者调用失败时，会走这里</span>\nbreaker.<span class="hljs-title function_">fallback</span>(<span class="hljs-function">(<span class="hljs-params">userId</span>) =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`[降级] 推荐服务不可用，返回兜底数据 for <span class="hljs-subst">${userId}</span>`</span>);\n  <span class="hljs-comment">// 这里可以返回缓存数据，或者空数组，绝不能抛出错误阻断主流程</span>\n  <span class="hljs-keyword">return</span> { <span class="hljs-attr">items</span>: [], <span class="hljs-attr">source</span>: <span class="hljs-string">&quot;fallback&quot;</span> };\n});\n<span class="hljs-comment">// 5. 监听事件（用于日志上报和监控）</span>\nbreaker.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;open&quot;</span>, <span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">warn</span>(<span class="hljs-string">&quot;[熔断开启] recommend-svc 服务熔断!&quot;</span>));\nbreaker.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;close&quot;</span>, <span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;[熔断关闭] recommend-svc 服务恢复!&quot;</span>));\nbreaker.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;halfOpen&quot;</span>, <span class="hljs-function">() =&gt;</span>\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;[半开试探] recommend-svc 正在试探恢复...&quot;</span>),\n);\nbreaker.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;fallback&quot;</span>, <span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;执行了降级逻辑&quot;</span>));\n<span class="hljs-comment">// ===================== 在 BFF 路由中使用 =====================</span>\napp.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/api/home&quot;</span>, <span class="hljs-title function_">async</span> (req, res) =&gt; {\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-comment">// 不再直接调用 callRecommendService，而是调用 breaker.fire</span>\n    <span class="hljs-keyword">const</span> recommendData = <span class="hljs-keyword">await</span> breaker.<span class="hljs-title function_">fire</span>(req.<span class="hljs-property">userId</span>);\n\n    res.<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">0</span>, <span class="hljs-attr">data</span>: recommendData });\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-comment">// 如果没有配置 fallback，或者 fallback 也抛出异常，会到这里</span>\n    res.<span class="hljs-title function_">status</span>(<span class="hljs-number">500</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: -<span class="hljs-number">1</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;服务异常&quot;</span> });\n  }\n});\n</code></pre>\n<h4>3. Opossum 的关键配置项解析</h4>\n<ul>\n<li><code>rollingCountTimeout</code>: 统计时间窗口（默认 10s）。只看这 10s 内的失败率。</li>\n<li><code>rollingCountBuckets</code>: 将时间窗口分桶（默认 10 个）。比如 10s 分 10 桶，每 1s 统计一次，使数据更平滑，避免毛刺。</li>\n<li><code>volumeThreshold</code>: <strong>请求数量阈值（极其重要！）</strong>   。默认 0。\n<ul>\n<li><em>坑点</em>：如果设为 0，只要前 2 个请求全失败，失败率就是 100%，立刻熔断。但这可能只是偶尔的网络抖动。</li>\n<li><em>最佳实践</em>：设置为 10 或 20。意思是：在时间窗口内，<strong>至少要有 10 个请求</strong>   ，才计算失败率。少于 10 个不熔断。</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h3>四、 BFF 熔断的架构进阶：分类与隔离</h3>\n<p>在 BFF 中，不能所有外部调用共用一个熔断器，必须<strong>按服务、按接口粒度进行隔离</strong>   。</p>\n<h4>1. 细粒度隔离</h4>\n<p>商品服务的“读详情”和“扣库存”接口，承受能力完全不同。如果“读详情”被打挂，你不希望熔断器把“扣库存”也拦截了。</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// 正确做法：为不同接口甚至不同操作创建独立熔断器</span>\n<span class="hljs-keyword">const</span> detailBreaker = <span class="hljs-keyword">new</span> <span class="hljs-title class_">CircuitBreaker</span>(getProductDetail, options);\n<span class="hljs-keyword">const</span> stockBreaker = <span class="hljs-keyword">new</span> <span class="hljs-title class_">CircuitBreaker</span>(deductStock, options);\n</code></pre>\n<h4>2. 核心与非核心的降级策略差异</h4>\n<p>熔断触发后，降级策略取决于接口的业务属性：</p>\n<ul>\n<li><strong>非核心链路（推荐、评论、头像）</strong>   ：熔断后返回空数据或缓存，前端不展示该模块即可，<strong>主流程不断</strong>   。</li>\n<li><strong>核心链路（订单创建、支付）</strong>   ：熔断后无法降级，必须直接向用户返回明确错误（如“系统繁忙请稍后重试”），<strong>不能悄悄吞掉错误</strong>   。</li>\n</ul>\n<hr>\n<h3>五、 熔断与缓存的黄金搭档</h3>\n<p>当熔断器打开时，最理想的降级数据来源是<strong>缓存</strong>   。\n<strong>高级架构设计：</strong></p>\n<ol>\n<li><strong>正常态</strong>   ：BFF 调用下游服务，拿到数据后，顺手存入 Redis（设置较短过期时间，如 5 分钟）。</li>\n<li><strong>熔断态</strong>   ：BFF 的降级逻辑去 Redis 里读取之前存好的数据返回给前端。</li>\n<li><strong>结果</strong>   ：虽然下游挂了，但用户看到的依然是几分钟前的真实数据，体验远好于空白页面。\n<strong>代码思路：</strong></li>\n</ol>\n<pre><code class="language-javascript">breaker.<span class="hljs-title function_">fallback</span>(<span class="hljs-title function_">async</span> (userId) =&gt; {\n  <span class="hljs-comment">// 熔断时，尝试读取 Redis 中的兜底数据</span>\n  <span class="hljs-keyword">const</span> cachedData = <span class="hljs-keyword">await</span> redis.<span class="hljs-title function_">get</span>(<span class="hljs-string">`recommend:cache:<span class="hljs-subst">${userId}</span>`</span>);\n  <span class="hljs-keyword">if</span> (cachedData) {\n    <span class="hljs-keyword">return</span> <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">parse</span>(cachedData);\n  }\n  <span class="hljs-comment">// 连缓存都没有，才返回绝对空数据</span>\n  <span class="hljs-keyword">return</span> { <span class="hljs-attr">items</span>: [], <span class="hljs-attr">source</span>: <span class="hljs-string">&quot;empty_fallback&quot;</span> };\n});\n</code></pre>\n<h3>六、 总结</h3>\n<p>Node.js BFF 面对脆弱的微服务环境，<strong>不带熔断器的调用等于裸奔</strong>   。</p>\n<ol>\n<li><strong>超时控制</strong>   是底线，防止单次请求卡死。</li>\n<li><strong>熔断器</strong>   是防线，防止持续性故障拖垮整个 BFF。</li>\n<li><strong>降级逻辑</strong>   是后路，保证用户体验不至于完全崩溃。</li>\n<li>使用 <code>opossum</code>，配置好 <code>volumeThreshold</code> 和 <code>errorThresholdPercentage</code>。</li>\n<li>区分核心/非核心接口，非核心结合缓存实现完美降级。</li>\n</ol>\n</div>'</script></body></html>
