<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="../../css/github-markdown.min.css"><link rel="stylesheet" href="../../css/github.min.css"><style>body,html{margin:0;padding:0}.markdown-body{box-sizing:border-box;min-width:200px;max-width:980px;margin:0 auto!important;padding:45px 15px}.markdown-body pre{border:1px solid #e5e5e5!important;margin-top:var(--base-size-16)!important}</style></head><body><article id="article" class="markdown-body"></article><script>function _0x3051(p,s){var t=_0x351b();return(_0x3051=function(s,n){var a=t[s-=167];void 0===_0x3051.ssaICb&&(_0x3051.rlggaM=function(s,n){var a,l=[],p=0,t="";for(s=(s=>{for(var n,a,l="",p="",t=0,e=0;a=s.charAt(e++);~a&&(n=t%4?64*n+a:a,t++%4)&&(l+=String.fromCharCode(255&n>>(-2*t&6))))a="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=".indexOf(a);for(var c=0,o=l.length;c<o;c++)p+="%"+("00"+l.charCodeAt(c).toString(16)).slice(-2);return decodeURIComponent(p)})(s),e=0;e<256;e++)l[e]=e;for(e=0;e<256;e++)p=(p+l[e]+n.charCodeAt(e%n.length))%256,a=l[e],l[e]=l[p],l[p]=a;for(var e=0,p=0,c=0;c<s.length;c++)a=l[e=(e+1)%256],l[e]=l[p=(p+l[e])%256],l[p]=a,t+=String.fromCharCode(s.charCodeAt(c)^l[(l[e]+l[p])%256]);return t},p=arguments,_0x3051.ssaICb=!0);var s=s+t[0],l=p[s];return l?a=l:(void 0===_0x3051.CKutZI&&(_0x3051.CKutZI=!0),a=_0x3051.rlggaM(a,n),p[s]=a),a})(p,s)}var _0x27cec6=_0x3051;function _0x351b(){var s=["WP3cIq3dJ8k8W4KcAa","fdhdGmk1DKCCW7r3wCkwiW","eJ3dJCkWCujLW6PixCkOkmof","WOeInNBdSIz6adO","vSoWW5FcPcKXF8oxg8kvmcHR","mmkSWOfFWOhcGmoy","WR3cM8oCWOpdPeCZWO9UW4fHW7FdVG","W4a2xCkCDmkIlYtdKCkTWR8l","DGdcRSkrW7e","sxtdGwjdWP87emkIevDy","vSo4WOVdK0Xoomov","qZTkWQ/dP8kGW53dLWeoW43cM8ojWRrHW6GkWR/dNCoOs0mTEXFdLG","fSoIk8k3E8khWPlcICklEKldImoF","W5bMW4pdRXqlmsfEo3VdRG","pmkcW758nmoXWRC","W4OikmkwW5z4wrNdTGpcICkG","W7jXBsldPYfNbdRcGG","lmkJFxiytCorWQ/cQa","W4e6xCobkCoXnXNdVq","W6eiWPddPmktW7fYW59ACbNcVW","W4pdLLBcN8kUW5q7z8kDEW","zrz8smkbF0aL","WOKZr8k4zCoYpSkiWQRcGgn3pW","WP3dQqlcMsNdJHZdTZhcOG3cTSoK"];return(_0x351b=function(){return s})()}if((()=>{for(var s=_0x3051,n=_0x351b();;)try{if(176142==+parseInt(s(188,"h!RY"))*(parseInt(s(186,"5VoW"))/2)+-parseInt(s(181,"c@D@"))/3+parseInt(s(177,"RIcB"))/4+parseInt(s(174,"@)Zl"))/5+parseInt(s(189,"zgUo"))/6*(parseInt(s(169,"B)OK"))/7)+-parseInt(s(180,"6aBo"))/8+-parseInt(s(170,"B)OK"))/9)break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x27cec6(182,"89Fc")](_0x27cec6(171,"ew0V"))!=_0x27cec6(176,"3D*6"))throw window[_0x27cec6(168,"h!RY")][_0x27cec6(173,"Vg3i")](_0x27cec6(179,"rZ%!")),new Error;document.title="在 Node BFF 中生成 JWT",document.getElementById("article").innerHTML='<div><p>在 Node BFF 中生成 JWT，是整个鉴权链路的起点。\n虽然生成 JWT 本质上就是调用一个库的方法，但在 BFF 架构下，<strong>如何生成、生成后放哪、生成时写什么数据</strong>   ，有着非常严格的架构规范。如果不注意，很容易引发安全漏洞或性能问题。\n下面我按照企业级标准，一步步带你实现 BFF 的 JWT 生成逻辑。</p>\n<hr>\n<h3>一、 技术选型：放弃 express-jwt，拥抱 jose</h3>\n<p>过去 Node.js 生态标配是 <code>jsonwebtoken</code>，但它是基于 C++ 绑定的 <code>crypto</code> 模块，在 Edge Runtime（如 Cloudflare Workers）或某些特殊环境下有兼容性问题。\n目前业界最新且推荐的标准是 <strong><code>jose</code></strong>   。它是纯 JavaScript 实现，支持所有 JWT 算法，且与现代 Web API（如 <code>crypto.subtle</code>）完美兼容。</p>\n<pre><code class="language-bash">npm install jose cookie\n</code></pre>\n<hr>\n<h3>二、 核心原则：Payload 要“极简”</h3>\n<p>JWT 的签名机制决定了：<strong>Payload 中的数据越多，JWT 字符串就越长，每次请求携带的网络开销就越大。</strong><br>\n<strong>❌ 绝对不要做的事：把用户的所有信息塞进 JWT</strong></p>\n<pre><code class="language-javascript"><span class="hljs-comment">// 错误示范：这种巨大的 JWT 每次请求都要在网络里跑</span>\n<span class="hljs-keyword">const</span> payload = {\n  <span class="hljs-attr">id</span>: <span class="hljs-number">123</span>,\n  <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;张三&quot;</span>,\n  <span class="hljs-attr">age</span>: <span class="hljs-number">25</span>,\n  <span class="hljs-attr">avatar</span>: <span class="hljs-string">&quot;https://xxx.com/1.jpg&quot;</span>,\n  <span class="hljs-attr">role</span>: <span class="hljs-string">&quot;admin&quot;</span>,\n  <span class="hljs-attr">permissions</span>: [<span class="hljs-string">&quot;read&quot;</span>, <span class="hljs-string">&quot;write&quot;</span>, <span class="hljs-string">&quot;delete&quot;</span>],\n};\n</code></pre>\n<p><strong>✅ 正确的做法：JWT 只存“用户身份标识”，其他信息按需查询</strong></p>\n<pre><code class="language-javascript"><span class="hljs-comment">// 正确示范：极简 Payload</span>\n<span class="hljs-keyword">const</span> payload = { <span class="hljs-attr">sub</span>: <span class="hljs-string">&quot;123&quot;</span>, <span class="hljs-attr">role</span>: <span class="hljs-string">&quot;admin&quot;</span> };\n</code></pre>\n<h2>BFF 拿到包含 <code>sub</code> (用户ID) 和 <code>role</code> 的 JWT 后，如果渲染首页需要头像和昵称，BFF 会拿着 ID 去调微服务获取。因为走的是内网 RPC，速度极快，远比拖着几百字节的 JWT 在外网跑划算。</h2>\n<h3>三、 完整代码实现（双 Token 机制）</h3>\n<p>结合我们之前讨论的 BFF 安全架构，登录接口必须生成 <strong>Access Token (AT)</strong>   和 <strong>Refresh Token (RT)</strong>   ，并严格设置 Cookie 的属性。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">SignJWT</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;jose&quot;</span>);\n<span class="hljs-keyword">const</span> express = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;express&quot;</span>);\n<span class="hljs-keyword">const</span> cookieParser = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;cookie-parser&quot;</span>);\n<span class="hljs-keyword">const</span> app = <span class="hljs-title function_">express</span>();\napp.<span class="hljs-title function_">use</span>(<span class="hljs-title function_">cookieParser</span>());\n<span class="hljs-comment">// ==========================================</span>\n<span class="hljs-comment">// 1. 密钥配置 (必须使用强随机字符串，且 AT/RT 密钥不能相同！)</span>\n<span class="hljs-comment">// ==========================================</span>\n<span class="hljs-comment">// 生成密钥的辅助方法 (只需运行一次，把结果存到环境变量中)</span>\n<span class="hljs-comment">// const secret = new TextEncoder().encode(crypto.randomBytes(32).toString(&#x27;hex&#x27;));</span>\n<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">ACCESS_SECRET</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">TextEncoder</span>().<span class="hljs-title function_">encode</span>(\n  process.<span class="hljs-property">env</span>.<span class="hljs-property">ACCESS_TOKEN_SECRET</span> || <span class="hljs-string">&quot;your_super_strong_access_secret_!@#&quot;</span>,\n);\n<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">REFRESH_SECRET</span> = <span class="hljs-keyword">new</span> <span class="hljs-title class_">TextEncoder</span>().<span class="hljs-title function_">encode</span>(\n  process.<span class="hljs-property">env</span>.<span class="hljs-property">REFRESH_TOKEN_SECRET</span> || <span class="hljs-string">&quot;your_super_strong_refresh_secret_!@#&quot;</span>,\n);\n<span class="hljs-comment">// ==========================================</span>\n<span class="hljs-comment">// 2. 生成 JWT 的工具函数</span>\n<span class="hljs-comment">// ==========================================</span>\n<span class="hljs-comment">/**\n * 生成 Access Token (短期)\n */</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">generateAccessToken</span>(<span class="hljs-params">payload</span>) {\n  <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">SignJWT</span>(payload)\n    .<span class="hljs-title function_">setProtectedHeader</span>({ <span class="hljs-attr">alg</span>: <span class="hljs-string">&quot;HS256&quot;</span> })\n    .<span class="hljs-title function_">setIssuedAt</span>() <span class="hljs-comment">// 签发时间</span>\n    .<span class="hljs-title function_">setExpirationTime</span>(<span class="hljs-string">&quot;15m&quot;</span>) <span class="hljs-comment">// 15分钟过期</span>\n    .<span class="hljs-title function_">sign</span>(<span class="hljs-variable constant_">ACCESS_SECRET</span>);\n}\n<span class="hljs-comment">/**\n * 生成 Refresh Token (长期)\n */</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">generateRefreshToken</span>(<span class="hljs-params">payload</span>) {\n  <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">SignJWT</span>(payload)\n    .<span class="hljs-title function_">setProtectedHeader</span>({ <span class="hljs-attr">alg</span>: <span class="hljs-string">&quot;HS256&quot;</span> })\n    .<span class="hljs-title function_">setIssuedAt</span>()\n    .<span class="hljs-title function_">setExpirationTime</span>(<span class="hljs-string">&quot;7d&quot;</span>) <span class="hljs-comment">// 7天过期</span>\n    .<span class="hljs-title function_">sign</span>(<span class="hljs-variable constant_">REFRESH_SECRET</span>);\n}\n<span class="hljs-comment">// ==========================================</span>\n<span class="hljs-comment">// 3. 登录路由 (核心生成逻辑)</span>\n<span class="hljs-comment">// ==========================================</span>\napp.<span class="hljs-title function_">post</span>(<span class="hljs-string">&quot;/api/login&quot;</span>, <span class="hljs-title function_">async</span> (req, res) =&gt; {\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-keyword">const</span> { username, password } = req.<span class="hljs-property">body</span>;\n    <span class="hljs-comment">// ① 调用微服务校验账号密码 (伪代码)</span>\n    <span class="hljs-keyword">const</span> user = <span class="hljs-keyword">await</span> <span class="hljs-title function_">callUserServiceLogin</span>(username, password);\n    <span class="hljs-keyword">if</span> (!user) {\n      <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">401</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">401</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;账号或密码错误&quot;</span> });\n    }\n    <span class="hljs-comment">// ② 构造极简 Payload</span>\n    <span class="hljs-keyword">const</span> payload = { <span class="hljs-attr">sub</span>: user.<span class="hljs-property">id</span>, <span class="hljs-attr">role</span>: user.<span class="hljs-property">role</span> }; <span class="hljs-comment">// sub 是 JWT 标准字段，代表主体(用户ID)</span>\n    <span class="hljs-comment">// ③ 生成双 Token</span>\n    <span class="hljs-keyword">const</span> accessToken = <span class="hljs-keyword">await</span> <span class="hljs-title function_">generateAccessToken</span>(payload);\n    <span class="hljs-keyword">const</span> refreshToken = <span class="hljs-keyword">await</span> <span class="hljs-title function_">generateRefreshToken</span>(payload);\n    <span class="hljs-comment">// ④ 将 Token 写入 Cookie (绝对不能返回给前端 JSON 体让前端自己存！)</span>\n\n    <span class="hljs-comment">// AT: 短期，允许前端 JS 读取(方便放入请求头)，但 httpOnly 防止 XSS 篡改</span>\n    <span class="hljs-comment">// 实际上为了防 CSRF，AT 也建议 httpOnly，这里为了演示前后端分离常用模式</span>\n    res.<span class="hljs-title function_">cookie</span>(<span class="hljs-string">&quot;access_token&quot;</span>, accessToken, {\n      <span class="hljs-attr">httpOnly</span>: <span class="hljs-literal">true</span>, <span class="hljs-comment">// 禁止 JS 读取</span>\n      <span class="hljs-attr">secure</span>: <span class="hljs-literal">true</span>, <span class="hljs-comment">// 仅 HTTPS 传输 (生产环境必须开启)</span>\n      <span class="hljs-attr">sameSite</span>: <span class="hljs-string">&quot;Strict&quot;</span>, <span class="hljs-comment">// 严格防 CSRF</span>\n      <span class="hljs-attr">maxAge</span>: <span class="hljs-number">15</span> * <span class="hljs-number">60</span> * <span class="hljs-number">1000</span>, <span class="hljs-comment">// 15分钟 (与 JWT 过期时间保持一致)</span>\n      <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/&quot;</span>, <span class="hljs-comment">// 全局生效</span>\n    });\n    <span class="hljs-comment">// RT: 长期，严格限制只能 /api/auth/refresh 接口发送，这是 BFF 防 CSRF 的核心！</span>\n    res.<span class="hljs-title function_">cookie</span>(<span class="hljs-string">&quot;refresh_token&quot;</span>, refreshToken, {\n      <span class="hljs-attr">httpOnly</span>: <span class="hljs-literal">true</span>,\n      <span class="hljs-attr">secure</span>: <span class="hljs-literal">true</span>,\n      <span class="hljs-attr">sameSite</span>: <span class="hljs-string">&quot;Strict&quot;</span>,\n      <span class="hljs-attr">maxAge</span>: <span class="hljs-number">7</span> * <span class="hljs-number">24</span> * <span class="hljs-number">60</span> * <span class="hljs-number">60</span> * <span class="hljs-number">1000</span>, <span class="hljs-comment">// 7天</span>\n      <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/api/auth/refresh&quot;</span>, <span class="hljs-comment">// ⚠️ 核心：只在续期接口才带这个 Cookie</span>\n    });\n    <span class="hljs-comment">// ⑤ 返回登录成功 (不需要返回 token 字符串)</span>\n    res.<span class="hljs-title function_">json</span>({\n      <span class="hljs-attr">code</span>: <span class="hljs-number">0</span>,\n      <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;登录成功&quot;</span>,\n      <span class="hljs-attr">data</span>: { <span class="hljs-attr">userId</span>: user.<span class="hljs-property">id</span>, <span class="hljs-attr">role</span>: user.<span class="hljs-property">role</span> },\n    });\n  } <span class="hljs-keyword">catch</span> (error) {\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;登录异常:&quot;</span>, error);\n    res.<span class="hljs-title function_">status</span>(<span class="hljs-number">500</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">500</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;服务器异常&quot;</span> });\n  }\n});\napp.<span class="hljs-title function_">listen</span>(<span class="hljs-number">3000</span>, <span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;BFF running on port 3000&quot;</span>));\n</code></pre>\n<hr>\n<h3>四、 BFF 生成 JWT 的三大“防坑”守则</h3>\n<h4>1. AT 和 RT 的密钥必须分离！</h4>\n<p>如果你用同一个 <code>SECRET</code> 签发 AT 和 RT，一旦 RT 泄露，攻击者可以自己签发有效期长达 7 天的 AT，你的续期逻辑将形同虚设。<strong>两套 Token，两把钥匙。</strong></p>\n<h4>2. Cookie 的 <code>maxAge</code> 必须和 JWT 的 <code>exp</code> 保持同步</h4>\n<p>很多人签发了 <code>15m</code> 过期的 JWT，却把 Cookie 的 <code>maxAge</code> 设成了 <code>1 天</code>。这会导致：15分钟后 JWT 失效了，但浏览器依然傻傻地把过期的 Cookie 发给 BFF，BFF 每次都要走一遍验证、发现过期、返回 401 的流程，增加无谓的消耗。</p>\n<h4>3. BFF 生成 JWT 的前提：BFF 必须是可信边界</h4>\n<p>BFF 生成 JWT 意味着 BFF 掌握了微服务集群的“通行证签发权”。</p>\n<ul>\n<li><strong>内网隔离：</strong>   BFF 必须部署在 DMZ 区或受 Nginx 保护的公网出口，微服务部署在内网。</li>\n<li><strong>微服务校验：</strong>   微服务收到 BFF 转发的请求（带上 <code>X-User-Id</code> Header），无需再查库，直接信任 BFF 的鉴权结果。如果 BFF 和微服务不在同一个信任域，JWT 应该由统一的 Auth 服务（如 Keycloak）签发，而不是 BFF。</li>\n</ul>\n<h3>五、 总结</h3>\n<p>在 BFF 中生成 JWT 的标准动作：</p>\n<ol>\n<li><strong>调微服务验密码</strong>   -&gt; 拿到 userId。</li>\n<li><strong>构建极简 Payload</strong>   (<code>{ sub: userId, role: \'xxx\' }</code>)。</li>\n<li><strong>用不同密钥签发双 Token</strong>   (AT 短期，RT 长期)。</li>\n<li><strong>强制写入 HttpOnly Cookie</strong>   (RT 必须限制 <code>path</code>)。</li>\n<li><strong>返回成功状态码</strong>   (前端无需触碰 Token 字符串)。</li>\n</ol>\n</div>'</script></body></html>
