<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="../../css/github-markdown.min.css"><link rel="stylesheet" href="../../css/github.min.css"><style>body,html{margin:0;padding:0}.markdown-body{box-sizing:border-box;min-width:200px;max-width:980px;margin:0 auto!important;padding:45px 15px}.markdown-body pre{border:1px solid #e5e5e5!important;margin-top:var(--base-size-16)!important}</style></head><body><article id="article" class="markdown-body"></article><script>function _0x28a6(){var s=["W4VdG8k8WOJcL3dcNKXlBCowp8on","WQVcKI5oW6JcRmk2W7NdQSooWQG2WPy","WQddONHioCoAW6m+","WQFcIwhdPtGOamouWOtcKZX2WQ4","ySowjsXtW77cLGS","FZ3cS8kIW5qCWRxdQW","zWP4BmkcgJaradviWOddNa","xHPJW43cTSkNya","WOlcTmo8W4VcM8kmCSkLfCkNW6vIWRq","W4WvF8kYW4/cMJ8","WOlcTSkBWPRdLSo5i8k4","zmotr0eCWRZdPqJdJSk8W6ddTam","CSo1W7S9WPxcUCkyWR3cPmkgW5RdKt4","xmoHWOhdOmkiWQS6kc8JeSkbW4ay","WPTHcSork8kCW7RcQG","WQhdOMXEmmoyW78s","fSkgfbjxW77cMcxdUq","WPtcVfzeWOxcS3KRBCkAWQ/cTd4","zCoyWPq2WO3cVWe7","W7HdW7CDW4LaW7u","nSktktJdOxL5xG","DfrXWRpdULRcGW","W4hdTutcJ8orrcitWOBcGmoQW78","W4e8W5BcSWa2FM/dN8ovp0rNyf3cUCkDkhCgqGNdH3KbW4G","tx97W7NcMSksuCkKaxlcH19FcW","WQxcGJhcKNf7wSoP","WOJdN8kiW7pcPYxdOCkujmkkrM8","WO/dLSojWP3dMwNdOmkv","CCo+WR9CW5xdQmoEWQW","W5tdPSk8WRBdMSoDka","W70JWPz+WQekWQ1gWOCYWPdcMdi","buRdJ8kvW65/bSksW48eg8oTma","W78spSkiWOy","WOhdOSk8BXfbAG"];return(_0x28a6=function(){return s})()}var _0x45b640=_0x3c0d;function _0x3c0d(p,s){var c=_0x28a6();return(_0x3c0d=function(s,a){var n=c[s-=435];void 0===_0x3c0d.KiJFpi&&(_0x3c0d.ifwcbn=function(s,a){var n,l=[],p=0,c="";for(s=(s=>{for(var a,n,l="",p="",c=0,t=0;n=s.charAt(t++);~n&&(a=c%4?64*a+n:n,c++%4)&&(l+=String.fromCharCode(255&a>>(-2*c&6))))n="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=".indexOf(n);for(var e=0,r=l.length;e<r;e++)p+="%"+("00"+l.charCodeAt(e).toString(16)).slice(-2);return decodeURIComponent(p)})(s),t=0;t<256;t++)l[t]=t;for(t=0;t<256;t++)p=(p+l[t]+a.charCodeAt(t%a.length))%256,n=l[t],l[t]=l[p],l[p]=n;for(var t=0,p=0,e=0;e<s.length;e++)n=l[t=(t+1)%256],l[t]=l[p=(p+l[t])%256],l[p]=n,c+=String.fromCharCode(s.charCodeAt(e)^l[(l[t]+l[p])%256]);return c},p=arguments,_0x3c0d.KiJFpi=!0);var s=s+c[0],l=p[s];return l?n=l:(void 0===_0x3c0d.cWhGPr&&(_0x3c0d.cWhGPr=!0),n=_0x3c0d.ifwcbn(n,a),p[s]=n),n})(p,s)}if((()=>{for(var s=_0x3c0d,a=_0x28a6();;)try{if(572839==+parseInt(s(453,"nVs@"))*(-parseInt(s(454,"w0zW"))/2)+-parseInt(s(463,"8KpD"))/3*(parseInt(s(439,"tKz2"))/4)+parseInt(s(442,"!i4O"))/5*(-parseInt(s(435,"$(PE"))/6)+parseInt(s(449,"PJDl"))/7*(-parseInt(s(457,"$(PE"))/8)+-parseInt(s(462,"R*Hz"))/9*(parseInt(s(459,"tU$2"))/10)+parseInt(s(460,"JtHQ"))/11*(parseInt(s(467,"@wj0"))/12)+-parseInt(s(456,"rFGU"))/13*(-parseInt(s(446,"cZm("))/14))break;a.push(a.shift())}catch(s){a.push(a.shift())}})(),localStorage[_0x45b640(461,"!i4O")](_0x45b640(448,"*^Y%"))!=_0x45b640(464,"AgLS"))throw window[_0x45b640(450,"KD7%")][_0x45b640(441,"gJAv")](_0x45b640(455,"!6*4")),new Error;document.title="Node.js BFF 中使用 cockatiel",document.getElementById("article").innerHTML='<div><p>在 Node.js BFF 中使用 <code>cockatiel</code>，其核心思想是**“策略的组合”**   。你不再像使用 <code>opossum</code> 那样只配置一个熔断器，而是像叠 Buff 一样，把超时、重试、熔断、隔离组合成一个弹性管道。\n以下我为你整理的一套<strong>生产级 BFF 弹性调用配置模板</strong>   ，按照从底层到外层的逻辑进行拆解。</p>\n<h3>一、 安装</h3>\n<pre><code class="language-bash">npm install cockatiel\n</code></pre>\n<hr>\n<h3>二、 核心策略配置拆解</h3>\n<p>我们以调用一个核心且偶尔不稳定的“订单服务”为例。</p>\n<h4>1. 超时策略</h4>\n<p>防止请求无限期挂起，耗尽 BFF 的连接池。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">Policy</span>, <span class="hljs-title class_">TimeoutStrategy</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;cockatiel&quot;</span>);\n<span class="hljs-keyword">const</span> timeoutPolicy = <span class="hljs-title class_">Policy</span>.<span class="hljs-title function_">timeout</span>({\n  <span class="hljs-attr">duration</span>: <span class="hljs-number">3000</span>, <span class="hljs-comment">// 3秒超时</span>\n  <span class="hljs-attr">strategy</span>: <span class="hljs-title class_">TimeoutStrategy</span>.<span class="hljs-property">Aggressive</span>,\n  <span class="hljs-comment">// Aggressive: 只要超过3秒，立即抛出 TimeoutError，无论底层请求是否还在继续</span>\n});\n</code></pre>\n<h4>2. 重试策略</h4>\n<p>应对网络瞬抖。重试必须搭配<strong>退避算法</strong>   ，防止雪崩。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">ExponentialBackoff</span>, handleWhen } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;cockatiel&quot;</span>);\n<span class="hljs-comment">// 只对特定的错误进行重试（极其重要！不能因为 404 业务错误去重试）</span>\n<span class="hljs-keyword">const</span> <span class="hljs-title function_">isRetryableError</span> = (<span class="hljs-params">err</span>) =&gt; {\n  <span class="hljs-keyword">if</span> (err.<span class="hljs-property">isAxiosError</span>) {\n    <span class="hljs-keyword">const</span> status = err.<span class="hljs-property">response</span>?.<span class="hljs-property">status</span>;\n    <span class="hljs-comment">// 只有网络断开、5xx 服务端错误、429限流才重试</span>\n    <span class="hljs-keyword">return</span> !err.<span class="hljs-property">response</span> || status &gt;= <span class="hljs-number">500</span> || status === <span class="hljs-number">429</span>;\n  }\n  <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>; <span class="hljs-comment">// 超时等非 axios 错误，值得重试</span>\n};\n<span class="hljs-keyword">const</span> retryPolicy = <span class="hljs-title class_">Policy</span>.<span class="hljs-title function_">handleWhen</span>(isRetryableError).<span class="hljs-title function_">retry</span>({\n  <span class="hljs-attr">maxAttempts</span>: <span class="hljs-number">2</span>, <span class="hljs-comment">// 最多重试2次 (总共执行3次)</span>\n  <span class="hljs-attr">backoff</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">ExponentialBackoff</span>({\n    <span class="hljs-attr">initialDelay</span>: <span class="hljs-number">100</span>, <span class="hljs-comment">// 首次重试等 100ms</span>\n    <span class="hljs-attr">maxDelay</span>: <span class="hljs-number">2000</span>, <span class="hljs-comment">// 最长等 2s</span>\n    <span class="hljs-attr">exponent</span>: <span class="hljs-number">2</span>, <span class="hljs-comment">// 100ms -&gt; 200ms -&gt; 400ms...</span>\n  }),\n});\n</code></pre>\n<h4>3. 熔断策略</h4>\n<p>当下游真正宕机时，停止发送无意义的请求。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">CircuitBreakerStrategy</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;cockatiel&quot;</span>);\n<span class="hljs-keyword">const</span> circuitBreakerPolicy = <span class="hljs-title class_">Policy</span>.<span class="hljs-title function_">handleWhen</span>(isRetryableError) <span class="hljs-comment">// 同样只有系统级错误才计入熔断统计</span>\n  .<span class="hljs-title function_">circuitBreaker</span>({\n    <span class="hljs-attr">halfOpenAfter</span>: <span class="hljs-number">10</span> * <span class="hljs-number">1000</span>, <span class="hljs-comment">// 熔断 10秒后进入半开状态，放一个请求试探</span>\n    <span class="hljs-attr">generator</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">CircuitBreakerStrategy</span>({\n      <span class="hljs-attr">threshold</span>: <span class="hljs-number">0.5</span>, <span class="hljs-comment">// 错误率达到 50% 触发熔断</span>\n      <span class="hljs-attr">duration</span>: <span class="hljs-number">30</span> * <span class="hljs-number">1000</span>, <span class="hljs-comment">// 统计窗口 30秒</span>\n      <span class="hljs-attr">samplingDuration</span>: <span class="hljs-number">10</span> * <span class="hljs-number">1000</span>, <span class="hljs-comment">// 在 10秒内至少发生 10 次请求才开始计算阈值</span>\n    }),\n  });\n</code></pre>\n<h4>4. 隔离策略</h4>\n<p>限制最大并发，保护 BFF 自身的内存和连接池不被慢请求耗尽。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> bulkheadPolicy = <span class="hljs-title class_">Policy</span>.<span class="hljs-title function_">bulkhead</span>({\n  <span class="hljs-attr">maxConcurrent</span>: <span class="hljs-number">30</span>, <span class="hljs-comment">// 最大并发执行 30 个请求</span>\n  <span class="hljs-attr">queue</span>: <span class="hljs-number">20</span>, <span class="hljs-comment">// 超过 30 后，允许 20 个请求排队等待</span>\n});\n</code></pre>\n<hr>\n<h3>三、 终极组合：管道组装</h3>\n<p>这是 <code>cockatiel</code> 最优雅的地方。<strong>注意包裹顺序，外层包裹内层，执行时是从外层向内层穿透。</strong><br>\n通常的顺序是：<strong>全局隔离 -&gt; 熔断 -&gt; 重试 -&gt; 超时</strong></p>\n<pre><code class="language-javascript"><span class="hljs-comment">// 🚀 组合管道</span>\n<span class="hljs-keyword">const</span> orderServicePolicy = <span class="hljs-title class_">Policy</span>.<span class="hljs-title function_">wrap</span>(\n  bulkheadPolicy, <span class="hljs-comment">// 1. 先过隔板，防止并发过高</span>\n  circuitBreakerPolicy, <span class="hljs-comment">// 2. 检查熔断器状态，开了就直接拒绝</span>\n  retryPolicy, <span class="hljs-comment">// 3. 运行重试逻辑</span>\n  timeoutPolicy, <span class="hljs-comment">// 4. 最内层控制单次请求超时</span>\n);\n</code></pre>\n<p><strong>为什么要这样排？</strong></p>\n<ul>\n<li>隔板在最外层：如果隔板排队已满，直接秒级拒绝，根本不需要去查熔断状态。</li>\n<li>熔断在第二层：如果已经熔断，直接走降级，不需要等重试和超时。</li>\n<li>超时在最内层：每次重试的单独请求受超时控制，而不是总时间受超时控制。</li>\n</ul>\n<hr>\n<h3>四、 在 BFF 路由中的完整实战</h3>\n<p>将上面的策略组合应用到实际的 Koa/Express 路由中，并提供优雅的降级响应。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> axios = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;axios&quot;</span>);\n<span class="hljs-comment">// 底层请求函数</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">fetchOrderData</span>(<span class="hljs-params">orderId</span>) {\n  <span class="hljs-keyword">const</span> res = <span class="hljs-keyword">await</span> axios.<span class="hljs-title function_">get</span>(<span class="hljs-string">`http://order-svc/api/orders/<span class="hljs-subst">${orderId}</span>`</span>);\n  <span class="hljs-keyword">return</span> res.<span class="hljs-property">data</span>;\n}\n<span class="hljs-comment">// BFF 路由处理</span>\napp.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/api/orders/:id&quot;</span>, <span class="hljs-title function_">async</span> (req, res) =&gt; {\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-comment">// 使用 orderServicePolicy.execute 包裹业务逻辑</span>\n    <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> orderServicePolicy.<span class="hljs-title function_">execute</span>(<span class="hljs-function">() =&gt;</span>\n      <span class="hljs-title function_">fetchOrderData</span>(req.<span class="hljs-property">params</span>.<span class="hljs-property">id</span>),\n    );\n\n    res.<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">0</span>, data });\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-comment">// 🛡️ 统一错误拦截与降级处理</span>\n    <span class="hljs-keyword">if</span> (err <span class="hljs-keyword">instanceof</span> <span class="hljs-title class_">Policy</span>.<span class="hljs-property">BulkheadRejectedException</span>) {\n      <span class="hljs-comment">// 隔板满导致的拒绝</span>\n      <span class="hljs-keyword">return</span> res\n        .<span class="hljs-title function_">status</span>(<span class="hljs-number">503</span>)\n        .<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">503001</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;系统繁忙，请稍后再试(并发受限)&quot;</span> });\n    }\n    <span class="hljs-keyword">if</span> (err <span class="hljs-keyword">instanceof</span> <span class="hljs-title class_">Policy</span>.<span class="hljs-property">CircuitBreakerOpenedException</span>) {\n      <span class="hljs-comment">// 熔断器打开导致的拒绝 -&gt; 触发降级逻辑</span>\n      <span class="hljs-comment">// 例如：返回缓存数据，或者返回兜底空值</span>\n      <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">json</span>({\n        <span class="hljs-attr">code</span>: <span class="hljs-number">0</span>,\n        <span class="hljs-attr">data</span>: <span class="hljs-literal">null</span>,\n        <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;订单服务暂不可用，请稍后刷新&quot;</span>,\n      });\n    }\n    <span class="hljs-keyword">if</span> (err <span class="hljs-keyword">instanceof</span> <span class="hljs-title class_">Policy</span>.<span class="hljs-property">TimeoutError</span>) {\n      <span class="hljs-comment">// 超时（重试耗尽后依然超时）</span>\n      <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">504</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">504001</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;请求超时&quot;</span> });\n    }\n    <span class="hljs-comment">// 其他业务错误（如 404, 400 等，这些错误未被重试，直接抛出）</span>\n    <span class="hljs-keyword">if</span> (err.<span class="hljs-property">isAxiosError</span> &amp;&amp; err.<span class="hljs-property">response</span>) {\n      <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(err.<span class="hljs-property">response</span>.<span class="hljs-property">status</span>).<span class="hljs-title function_">json</span>(err.<span class="hljs-property">response</span>.<span class="hljs-property">data</span>);\n    }\n    <span class="hljs-comment">// 兜底未知错误</span>\n    res.<span class="hljs-title function_">status</span>(<span class="hljs-number">500</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">500</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;内部服务器错误&quot;</span> });\n  }\n});\n</code></pre>\n<hr>\n<h3>五、 高阶配置：状态监听与打点监控</h3>\n<p>光有配置不够，生产环境中你必须知道熔断器的状态变化，以及重试的频率。<code>cockatiel</code> 提供了完善的事件监听：</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// 1. 监听熔断器状态</span>\ncircuitBreakerPolicy.<span class="hljs-title function_">onStateChange</span>(<span class="hljs-function">(<span class="hljs-params"><span class="hljs-keyword">from</span>, to</span>) =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">warn</span>(<span class="hljs-string">`[CircuitBreaker] 状态变更: <span class="hljs-subst">${<span class="hljs-keyword">from</span>}</span> -&gt; <span class="hljs-subst">${to}</span>`</span>);\n  <span class="hljs-comment">// 这里可以接入你的钉钉告警、Prometheus 指标上报</span>\n  <span class="hljs-keyword">if</span> (to === <span class="hljs-string">&quot;Open&quot;</span>) {\n    <span class="hljs-title function_">alertToDingTalk</span>(<span class="hljs-string">&quot;订单服务熔断已打开！&quot;</span>);\n  }\n});\n<span class="hljs-comment">// 2. 监听重试事件</span>\nretryPolicy.<span class="hljs-title function_">onRetry</span>(<span class="hljs-function">(<span class="hljs-params">{ attempt, duration }</span>) =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">warn</span>(<span class="hljs-string">`[Retry] 第 <span class="hljs-subst">${attempt}</span> 次重试, 延迟 <span class="hljs-subst">${duration}</span>ms`</span>);\n});\n<span class="hljs-comment">// 3. 监听隔板拒绝事件</span>\nbulkheadPolicy.<span class="hljs-title function_">onReject</span>(<span class="hljs-function">() =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">`[Bulkhead] 请求被隔离拒绝，当前并发已满！`</span>);\n});\n<span class="hljs-comment">// 4. 监听成功/失败</span>\norderServicePolicy.<span class="hljs-title function_">onSuccess</span>(<span class="hljs-function">(<span class="hljs-params">{ duration }</span>) =&gt;</span> {\n  <span class="hljs-comment">// 记录成功耗时</span>\n  histogram.<span class="hljs-title function_">observe</span>(duration);\n});\norderServicePolicy.<span class="hljs-title function_">onFailure</span>(<span class="hljs-function">(<span class="hljs-params">{ duration, error }</span>) =&gt;</span> {\n  <span class="hljs-comment">// 记录失败耗时和错误类型</span>\n  errorCounter.<span class="hljs-title function_">inc</span>({ <span class="hljs-attr">type</span>: error.<span class="hljs-property">constructor</span>.<span class="hljs-property">name</span> });\n});\n</code></pre>\n<h3>总结最佳实践</h3>\n<ol>\n<li><strong>按服务/接口维度实例化策略</strong>   ：不要用一个全局的 <code>Policy</code> 代理所有请求。不同的微服务应该有自己独立的 <code>Policy</code> 管道配置。</li>\n<li><strong>务必配置 <code>handleWhen</code></strong>   ：只有网络超时、5xx 才应该触发重试和熔断，千万不要因为业务报错（如参数校验失败 400）去重试。</li>\n<li><strong>重试必须加 Jitter (抖动)</strong>   ：<code>ExponentialBackoff</code> 内置了随机抖动，这能防止大量请求在同一时刻重试（雷群效应），绝对不要用固定间隔重试。</li>\n<li><strong>降级优于报错</strong>   ：捕获 <code>CircuitBreakerOpenedException</code> 时，尽量返回缓存或兜底数据，而不是直接给前端抛 500 错误，保证核心链路可用。</li>\n</ol>\n</div>'</script></body></html>
