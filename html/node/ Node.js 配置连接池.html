,o=0;o<s.length;o++)a=t[p=(p+1)%256],t[p]=t[l=(l+t[p])%256],t[l]=a,e+=String.fromCharCode(s.charCodeAt(o)^t[(t[p]+t[l])%256]);return e},l=arguments,_0x3f43.XzfEMX=!0);var s=s+e[0],t=l[s];return t?a=t:(void 0===_0x3f43.TRrxHp&&(_0x3f43.TRrxHp=!0),a=_0x3f43.llpmNC(a,n),l[s]=a),a})(l,s)}if((()=>{for(var s=_0x3f43,n=_0x3d01();;)try{if(349306==-parseInt(s(208,"9LZY"))*(parseInt(s(202,"pfld"))/2)+parseInt(s(222,"rsrC"))/3*(parseInt(s(223,"uSlM"))/4)+-parseInt(s(204,"oTeC"))/5*(-parseInt(s(201,"9aG%"))/6)+-parseInt(s(226,"De!t"))/7+parseInt(s(221,"1A^H"))/8*(parseInt(s(225,"$7v9"))/9)+-parseInt(s(203,"BAa!"))/10+-parseInt(s(206,"$7v9"))/11*(-parseInt(s(212,"K3vp"))/12))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x4b1213(219,"o]$G")](_0x4b1213(210,"R55z"))!=_0x4b1213(213,"$7v9"))throw window[_0x4b1213(218,"I%O5")][_0x4b1213(227,"vYC5")](_0x4b1213(207,"&@CN")),new Error;document.title=" Node.js 配置连接池",document.getElementById("article").innerHTML='<div><p>在 Node.js 中，原生的 <code>http</code> 和 <code>https</code> 模块<strong>本身并没有直接提供类似传统后端语言（如 Java 的 Druid，Python 的 SQLAlchemy）那样明确的“连接池”配置 API</strong>   。\nNode.js 的底层网络操作是基于 libuv 和事件驱动的，它通过 <code>http.Agent</code> 来管理连接的复用（Keep-Alive），这起到了类似连接池的作用。\n下面详细介绍如何使用原生模块实现类似连接池的效果，以及更推荐的第三方连接池方案。</p>\n<hr>\n<h3>一、 原生方案：使用 <code>http.Agent</code> / <code>https.Agent</code></h3>\n<p>Node.js 通过 <code>Agent</code> 类来管理 TCP 连接的持久化和复用。默认情况下，Node.js 自带一个全局的 <code>globalAgent</code>，它的默认配置是：</p>\n<ul>\n<li><code>keepAlive: false</code>（Node.js 14 之前默认 false，之后虽然底层建议开启，但为了兼容性 Agent 默认仍是 false，需要手动开启）</li>\n<li><code>maxSockets: Infinity</code>（对同一个 Host:Port 可以创建无限多个并发连接）</li>\n<li><code>maxTotalSockets: Infinity</code>\n为了实现“连接池”的效果（限制并发、复用连接），我们需要<strong>自定义 Agent</strong>   。</li>\n</ul>\n<h4>1. 配置自定义 Agent</h4>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> http = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;http&quot;</span>);\n<span class="hljs-keyword">const</span> https = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;https&quot;</span>);\n<span class="hljs-comment">// 创建 HTTP 连接池 Agent</span>\n<span class="hljs-keyword">const</span> httpAgent = <span class="hljs-keyword">new</span> http.<span class="hljs-title class_">Agent</span>({\n  <span class="hljs-attr">keepAlive</span>: <span class="hljs-literal">true</span>, <span class="hljs-comment">// 开启 Keep-Alive，复用 TCP 连接</span>\n  <span class="hljs-attr">maxSockets</span>: <span class="hljs-number">10</span>, <span class="hljs-comment">// 对同一个 Host:Port 最大并发连接数（核心池大小）</span>\n  <span class="hljs-attr">maxTotalSockets</span>: <span class="hljs-number">50</span>, <span class="hljs-comment">// 整个 Agent 最大连接数</span>\n  <span class="hljs-attr">keepAliveMsecs</span>: <span class="hljs-number">1000</span>, <span class="hljs-comment">// Keep-Alive 探测包发送间隔（毫秒）</span>\n  <span class="hljs-attr">timeout</span>: <span class="hljs-number">30000</span>, <span class="hljs-comment">// Socket 超时时间（毫秒）</span>\n  <span class="hljs-attr">scheduling</span>: <span class="hljs-string">&quot;lifo&quot;</span>, <span class="hljs-comment">// 调度算法：lifo (后进先出，有利于连接超时回收) 或 fifo</span>\n});\n<span class="hljs-comment">// 创建 HTTPS 连接池 Agent</span>\n<span class="hljs-keyword">const</span> httpsAgent = <span class="hljs-keyword">new</span> https.<span class="hljs-title class_">Agent</span>({\n  <span class="hljs-attr">keepAlive</span>: <span class="hljs-literal">true</span>,\n  <span class="hljs-attr">maxSockets</span>: <span class="hljs-number">10</span>,\n  <span class="hljs-attr">maxTotalSockets</span>: <span class="hljs-number">50</span>,\n  <span class="hljs-attr">timeout</span>: <span class="hljs-number">30000</span>,\n  <span class="hljs-attr">scheduling</span>: <span class="hljs-string">&quot;lifo&quot;</span>,\n  <span class="hljs-comment">// 如果需要忽略自签名证书等，可以在这里加 rejectUnauthorized: false</span>\n});\n<span class="hljs-comment">// 使用自定义 Agent 发起请求</span>\n<span class="hljs-keyword">const</span> options = {\n  <span class="hljs-attr">hostname</span>: <span class="hljs-string">&quot;jsonplaceholder.typicode.com&quot;</span>,\n  <span class="hljs-attr">port</span>: <span class="hljs-number">443</span>,\n  <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/todos/1&quot;</span>,\n  <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;GET&quot;</span>,\n  <span class="hljs-attr">agent</span>: httpsAgent, <span class="hljs-comment">// 指定使用我们的连接池 Agent</span>\n};\n<span class="hljs-keyword">const</span> req = https.<span class="hljs-title function_">request</span>(options, <span class="hljs-function">(<span class="hljs-params">res</span>) =&gt;</span> {\n  <span class="hljs-keyword">let</span> data = <span class="hljs-string">&quot;&quot;</span>;\n  res.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;data&quot;</span>, <span class="hljs-function">(<span class="hljs-params">chunk</span>) =&gt;</span> {\n    data += chunk;\n  });\n  res.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;end&quot;</span>, <span class="hljs-function">() =&gt;</span> {\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Response:&quot;</span>, data);\n  });\n});\nreq.<span class="hljs-title function_">on</span>(<span class="hljs-string">&quot;error&quot;</span>, <span class="hljs-function">(<span class="hljs-params">e</span>) =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">`Problem with request: <span class="hljs-subst">${e.message}</span>`</span>);\n});\nreq.<span class="hljs-title function_">end</span>();\n</code></pre>\n<h4>2. Node.js 原生 Agent 的局限性</h4>\n<p>虽然 <code>Agent</code> 实现了连接复用，但它<strong>不是一个完整的请求队列池</strong>   。\n<strong>痛点</strong>   ：如果当前对某个 Host 的并发请求数已经达到了 <code>maxSockets</code>（比如 10），第 11 个请求会怎样？</p>\n<ul>\n<li>在传统连接池中：第 11 个请求通常会在池子中<strong>排队等待</strong>   ，直到有连接释放。</li>\n<li>在 Node.js Agent 中：第 11 个请求会<strong>直接被挂起，并在内存中排队</strong>   ，且没有默认的超时机制。如果并发量极大，会导致内存溢出（OOM）。并且，原生的 Agent 缺少对池子状态的监控（如当前空闲连接数、等待请求数）。</li>\n</ul>\n<hr>\n<h3>二、 生产级方案：使用 <code>undici</code>（官方推荐）</h3>\n<p>由于原生 <code>http/https</code> 模块的历史包袱和性能瓶颈，Node.js 官方团队推出了新一代的 HTTP 客户端库 <strong><code>undici</code></strong>   。从 Node.js 18 开始，内部的 <code>fetch</code> API 就是通过 undici 实现的。\n<code>undici</code> 天生自带高性能的连接池管理，是当前 Node.js 环境下最推荐的 HTTP 客户端。</p>\n<h4>1. 安装 undici</h4>\n<pre><code class="language-bash">npm install undici\n</code></pre>\n<h4>2. 配置 undici 连接池</h4>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">Pool</span>, <span class="hljs-title class_">Client</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;undici&quot;</span>);\n<span class="hljs-comment">// 创建一个针对特定 Host 的连接池</span>\n<span class="hljs-keyword">const</span> pool = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Pool</span>(<span class="hljs-string">&quot;https://jsonplaceholder.typicode.com&quot;</span>, {\n  <span class="hljs-attr">connections</span>: <span class="hljs-number">10</span>, <span class="hljs-comment">// 连接池大小（最大并发连接数）</span>\n  <span class="hljs-attr">pipelining</span>: <span class="hljs-number">1</span>, <span class="hljs-comment">// HTTP 管道化复用连接数（通常设为 1，除非你确认服务端支持管道化）</span>\n  <span class="hljs-attr">keepAliveTimeout</span>: <span class="hljs-number">30e3</span>, <span class="hljs-comment">// 保持连接的超时时间 (30s)</span>\n  <span class="hljs-attr">keepAliveMaxTimeout</span>: <span class="hljs-number">60e3</span>, <span class="hljs-comment">// 最大保持连接时间</span>\n});\n<span class="hljs-comment">// 发起请求 (无需像原生那样写大量回调，支持 Promise)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">fetchData</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-keyword">const</span> { statusCode, headers, body } = <span class="hljs-keyword">await</span> pool.<span class="hljs-title function_">request</span>({\n      <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/todos/1&quot;</span>,\n      <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;GET&quot;</span>,\n    });\n\n    <span class="hljs-comment">// body 是一个异步迭代器，可以读取流，也可以直接转储</span>\n    <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> body.<span class="hljs-title function_">text</span>();\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Status:&quot;</span>, statusCode);\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Data:&quot;</span>, data);\n  } <span class="hljs-keyword">catch</span> (error) {\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;Request failed:&quot;</span>, error);\n  }\n}\n<span class="hljs-title function_">fetchData</span>();\n<span class="hljs-comment">// 关闭连接池（在程序退出时）</span>\n<span class="hljs-comment">// pool.close();</span>\n</code></pre>\n<p><strong>undici 的优势：</strong></p>\n<ol>\n<li><strong>真正的连接池</strong>   ：超出的请求会安全地排队，不会像原生那样无限堆积导致 OOM。</li>\n<li><strong>性能极高</strong>   ：不走 Node.js 传统的 JS/C++ 边界回调，直接基于 llhttp 解析，比原生 <code>http</code> 模块快很多。</li>\n<li><strong>API 现代化</strong>   ：基于 Promise，支持流式处理。</li>\n</ol>\n<hr>\n<h3>三、 第三方高级方案：使用 <code>axios</code> + <code>http-agent</code></h3>\n<p>如果你已经在项目中广泛使用 <code>axios</code>，不想重构为 <code>undici</code>，可以通过配置 <code>axios</code> 的 <code>httpAgent</code> / <code>httpsAgent</code> 来实现原生的连接复用。</p>\n<h4>1. 安装 axios</h4>\n<pre><code class="language-bash">npm install axios\n</code></pre>\n<h4>2. 在 axios 中配置 Agent</h4>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> axios = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;axios&quot;</span>);\n<span class="hljs-keyword">const</span> http = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;http&quot;</span>);\n<span class="hljs-keyword">const</span> https = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;https&quot;</span>);\n<span class="hljs-comment">// 复用前面的 Agent 配置</span>\n<span class="hljs-keyword">const</span> httpAgent = <span class="hljs-keyword">new</span> http.<span class="hljs-title class_">Agent</span>({ <span class="hljs-attr">keepAlive</span>: <span class="hljs-literal">true</span>, <span class="hljs-attr">maxSockets</span>: <span class="hljs-number">10</span> });\n<span class="hljs-keyword">const</span> httpsAgent = <span class="hljs-keyword">new</span> https.<span class="hljs-title class_">Agent</span>({ <span class="hljs-attr">keepAlive</span>: <span class="hljs-literal">true</span>, <span class="hljs-attr">maxSockets</span>: <span class="hljs-number">10</span> });\n<span class="hljs-comment">// 创建 axios 实例</span>\n<span class="hljs-keyword">const</span> apiClient = axios.<span class="hljs-title function_">create</span>({\n  <span class="hljs-attr">baseURL</span>: <span class="hljs-string">&quot;https://jsonplaceholder.typicode.com&quot;</span>,\n  <span class="hljs-attr">httpAgent</span>: httpAgent, <span class="hljs-comment">// 对 http 请求生效</span>\n  <span class="hljs-attr">httpsAgent</span>: httpsAgent, <span class="hljs-comment">// 对 https 请求生效</span>\n  <span class="hljs-attr">timeout</span>: <span class="hljs-number">5000</span>, <span class="hljs-comment">// 请求超时</span>\n});\n<span class="hljs-comment">// 使用</span>\napiClient\n  .<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/todos/1&quot;</span>)\n  .<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">res</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(res.<span class="hljs-property">data</span>))\n  .<span class="hljs-title function_">catch</span>(<span class="hljs-function">(<span class="hljs-params">err</span>) =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(err.<span class="hljs-property">message</span>));\n</code></pre>\n<h2><em>注意：axios 1.x 版本开始，默认在某些情况下也会复用连接，但显式指定 <code>keepAlive: true</code> 的 Agent 依然是控制连接上限的最佳实践。</em></h2>\n<h3>四、 总结与选型建议</h3>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">方案</th>\n<th style="text-align:left">优点</th>\n<th style="text-align:left">缺点</th>\n<th style="text-align:left">适用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>原生 <code>http.Agent</code></strong></td>\n<td style="text-align:left">无需安装第三方库</td>\n<td style="text-align:left">没有请求排队保护，容易 OOM；回调地狱；性能一般</td>\n<td style="text-align:left">简单脚本，极少量的 HTTP 请求</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong><code>axios</code> + Agent</strong></td>\n<td style="text-align:left">API 友好，生态丰富，支持拦截器</td>\n<td style="text-align:left">底层仍受原生 Agent 限制，高并发下需防范排队 OOM</td>\n<td style="text-align:left">传统 Node.js 业务系统，中等并发</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong><code>undici</code></strong></td>\n<td style="text-align:left">性能最高，真正的连接池保护，官方维护</td>\n<td style="text-align:left">API 较新，不兼容原生 <code>http</code> 模块的事件体系</td>\n<td style="text-align:left"><strong>微服务/高并发网关</strong>   ，对外部 API 有大量调用的场景</td>\n</tr>\n</tbody>\n</table>\n<p><strong>最终建议</strong>   ：</p>\n<ul>\n<li>如果是<strong>新项目</strong>   ，且需要频繁调用外部 HTTP API，<strong>强烈建议直接使用 <code>undici</code></strong>   。</li>\n<li>如果是<strong>老项目</strong>   ，且已经在用 <code>axios</code>，务必配置 <code>httpsAgent</code> 并设置合理的 <code>maxSockets</code>，防止高并发时底层建立过多 TCP 连接打垮服务器或自身 OOM。</li>\n</ul>\n</div>'</script></body></html>
