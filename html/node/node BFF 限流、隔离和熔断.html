.SAlbIs(r,n),l[t]=r),r})(l,t)}function _0x1195(){var t=["W4NdUCkZwtPwW6HyW7/cUvX9kW","W4rsWP7dQ8k/oSkRftfVW4FcRCo4","CvHRoufrWPK","iCkvWQNdJSo5","WRtcUSkqvSkOWOpcGqa","rCkQWRD6u8k1W5a","y15um8k3W5BdLhDhW4a","nSkDhmoVeSoHdSopomkE","E0pcOmk6F8o+tCoUoH7cS3tcTW","DmoiWRDWkh3dJqVcRCo0WQtcQCoE","BqFcL8kzW5dcL1D/WRpcSSktWPJdQG","uc0WW78iWRG7cCktCSoF","h8klxGZdLSkgWQygxa","W7W6W40bvqHxsCkdWO3dVr/dI8kKAsW2W65WWPpdO8kgfsFdMSoR","WPdcG8kjWP5XnJnlx1bO","W5mtW6FcKXWzWO/cQSk7W7G4vGS","h8oXW7TXASoszCoEu8ouW7BcSCky","W4imW4HIW6StW6e","nCkyaWNcMxhdIW","WO1qxCogh8kCWRldUCoIn8khW6L/","W7BdHCk9bCkwW4T3W6XzusrB","shFcJ0fkwCo1W7ddGCkhWOhdQuC","WPdcJ8knWPzWvbbHtuzaja","BGxcKCkAW5xcM1zKWPJcQmkAWQNdMa"];return(_0x1195=function(){return t})()}document.title="node BFF 限流、隔离和熔断",document.getElementById("article").innerHTML='<div><p>这三个词是高可用分布式系统中的“神圣三位一体”。很多开发者对它们似懂非懂，是因为它们看起来都在“拒绝请求”，但<strong>它们拒绝请求的触发条件、保护对象和核心哲学完全不同</strong>   。\n为了让你永远不忘，我们用一个极其生动的现实场景来类比：<strong>一家热门餐厅</strong>   。</p>\n<hr>\n<h3>一、 限流—— 门卫手里的计数器</h3>\n<ul>\n<li><strong>核心问句</strong>   ：“今天店里最多能接待多少人？”</li>\n<li><strong>关注指标</strong>   ：<strong>QPS / TPS</strong>   （每秒请求数）、时间窗口</li>\n<li><strong>保护对象</strong>   ：<strong>系统总容量</strong>   （防止系统被洪峰冲垮）</li>\n<li><strong>餐厅类比</strong>   ：\n餐厅的接待能力是有限的，最多只能容纳 200 人同时就餐。门卫手里有个计数器，进去一个加一，出来一个减一。当里面满 200 人时，门卫就会拉起警戒线，对后面排队的客人说：“抱歉，客满了，请下次再来。” 不管你是VIP还是普通顾客，只要达到阈值，一律拒绝。</li>\n<li><strong>技术场景：</strong><br>\n你的 BFF 平时 QPS 是 1000，突然因为一场营销活动，QPS 瞬间飙到 5000。如果不限流，BFF 瞬间崩溃，一个请求都处理不了。限流就是设定上限 1500 QPS，超出的 3500 个请求直接返回 429 (Too Many Requests)，保住那 1500 个请求能正常响应。</li>\n<li><strong>关键点：</strong>   被限流拒绝的请求，<strong>不一定是因为系统出了故障</strong>   ，仅仅是因为当前“人太多了”。</li>\n</ul>\n<hr>\n<h3>二、 隔离—— 餐厅的包厢 / 游轮的水密舱</h3>\n<ul>\n<li><strong>核心问句</strong>   ：“如果某个角落出事了，怎么保证不连累其他角落？”</li>\n<li><strong>关注指标</strong>   ：<strong>并发数</strong>   、资源池大小（信号量/线程池）</li>\n<li><strong>保护对象</strong>   ：<strong>系统自身的可用资源</strong>   （防止被慢调用耗尽）</li>\n<li><strong>餐厅类比：</strong><br>\n餐厅里有大堂和包厢。如果大堂里有一桌客人喝醉了，吵吵闹闹甚至吐了一地（<strong>慢调用/故障</strong>   ），服务员全部跑去大堂收拾残局。如果没有隔离，整个餐厅的服务都会瘫痪，连安静包厢里的客人也吃不上饭。\n有了隔离（包厢），大堂的问题只在大堂解决，分配 2 个服务员去处理，剩下的服务员依然在包厢提供优质服务。\n<ul>\n<li><strong>技术场景：</strong><br>\n你的 BFF 依赖服务 A（快，50ms）和服务 B（突然变慢，要 10s）。\n如果没有隔离，BFF 会不断发起对 B 的请求，由于 B 很慢，BFF 的连接池/线程池被对 B 的请求占满。此时想要调用服务 A 的请求拿不到连接，也超时了。<strong>这就是雪崩效应。</strong><br>\n加了隔离，给服务 B 最多分配 20 个并发连接。哪怕 B 慢到天际，最多也就占 20 个连接，BFF 剩下的 980 个连接依然可以丝滑地调用服务 A。</li>\n</ul>\n</li>\n<li><strong>关键点：</strong>   隔离应对的是**“慢调用”**   ，它不关心请求频率，只关心**“此时此刻占用了多少资源”**   。</li>\n</ul>\n<hr>\n<h3>三、 熔断—— 家里的保险丝 / 股市的涨跌停</h3>\n<ul>\n<li><strong>核心问句</strong>   ：“既然知道对方已经挂了，为什么还要白白去尝试？”</li>\n<li><strong>关注指标</strong>   ：<strong>错误率 / 超时率</strong>   、时间窗口</li>\n<li><strong>保护对象</strong>   ：<strong>下游系统</strong>   （给故障系统喘息时间），同时<strong>保护自身响应时间</strong>   （快速失败）</li>\n<li><strong>餐厅类比：</strong><br>\n餐厅后厨的烤箱坏了，每端进去一道菜都烤糊（报错）。服务员不知道烤箱坏了，还在源源不断地端菜进去，不仅浪费食材，还让客人等半天最后端上来一盘糊菜。\n熔断机制就是厨师长发现 10 道菜糊了 5 道（错误率达标），立刻大吼一声：“别往烤箱里放菜了！”（熔断打开）。此后服务员再点烤菜，直接秒回“今天没有烤菜”（走降级 Fallback），不再去折腾后厨。过了半小时，厨师长试着烤了一根香肠（半开状态），发现烤熟了，再宣布恢复供菜（熔断关闭）。</li>\n<li><strong>技术场景：</strong><br>\n推荐服务因为数据库死锁彻底宕机，所有请求都返回 500。\n如果没有熔断，BFF 每次依然会发起网络请求，等待超时，然后拿到 500 报错。这不仅毫无意义，还白白占用了 BFF 的网络带宽和 CPU。\n加了熔断，当 1 分钟内推荐服务的错误率超过 50%，BFF 直接拉闸。后续再有请求想调用推荐服务，<strong>在 BFF 内存中直接返回兜底数据（或报错）</strong>   ，连网络都不发。这叫 Fast Fail（快速失败）。等过了一段时间，BFF 放一个请求过去试试，如果成功，再慢慢恢复流量。</li>\n<li><strong>关键点：</strong>   熔断应对的是**“下游故障”**   ，核心思想是**“不给已经死掉的系统添乱，也不让自己白等”**   。</li>\n</ul>\n<hr>\n<h3>四、 终极对比与组合策略</h3>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">维度</th>\n<th style="text-align:left">限流</th>\n<th style="text-align:left">隔离</th>\n<th style="text-align:left">熔断</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>防什么？</strong></td>\n<td style="text-align:left">防洪峰（流量太大）</td>\n<td style="text-align:left">防耗尽（慢调用占资源）</td>\n<td style="text-align:left">防雪崩（下游彻底挂了）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>触发条件</strong></td>\n<td style="text-align:left">请求数达到设定阈值</td>\n<td style="text-align:left">并发数达到设定阈值</td>\n<td style="text-align:left">错误率/超时率达到设定阈值</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>状态变化</strong></td>\n<td style="text-align:left">无状态（永远按规则放行/拒绝）</td>\n<td style="text-align:left">无状态（满了就拒绝，空了就放行）</td>\n<td style="text-align:left"><strong>有状态</strong>   （Closed -&gt; Open -&gt; Half-Open）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>保护谁？</strong></td>\n<td style="text-align:left">保护自己（防总量过载）</td>\n<td style="text-align:left">保护自己（防局部资源耗尽）</td>\n<td style="text-align:left">保护别人（防雪崩），也保护自己（快速失败）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>Node.js 工具</strong></td>\n<td style="text-align:left"><code>rate-limiter-flexible</code></td>\n<td style="text-align:left"><code>cockatiel Bulkhead</code></td>\n<td style="text-align:left"><code>cockatiel CircuitBreaker</code> / <code>opossum</code></td>\n</tr>\n</tbody>\n</table>\n<h4>BFF 中的实战组合（俄罗斯套娃防御）</h4>\n<p>在真实的 BFF 架构中，这三个策略是层层递进的。假设一个请求打进来：</p>\n<ol>\n<li><strong>第一关：限流</strong>   。你是恶意爬虫吗？或者今天大促流量超载了吗？超了 1000 QPS，对不起，直接在门口返回 429。</li>\n<li><strong>第二关：隔离</strong>   。过了限流关，你想调用推荐服务。推荐服务的并发池（20个）满了吗？满了，说明前面有 20 个请求还在等推荐服务响应，对不起，返回降级数据，防止你把 BFF 卡死。</li>\n<li><strong>第三关：熔断</strong>   。隔离关放行了你，准备发网络请求。等等，推荐服务在过去的 1 分钟内错误率高达 80%，熔断器已经打开了！对不起，不发网络请求了，直接在内存返回降级数据。</li>\n<li><strong>第四关：超时/重试</strong>   。熔断器是半开状态，或者正常状态，放行！发网络请求。如果 2 秒没响应（超时），或者返回了 500，按照重试策略重试一次。\n<strong>总结：</strong><br>\n<strong>限流管总量，隔离管并发，熔断管故障。</strong>   只有这三者结合，你的 BFF 才能在微服务架构的血雨腥风中坚如磐石。</li>\n</ol>\n</div>'</script></body></html>
