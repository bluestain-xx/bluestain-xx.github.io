t[p]=t[l=(l+t[p])%256],t[l]=a,e+=String.fromCharCode(s.charCodeAt(c)^t[(t[p]+t[l])%256]);return e},l=arguments,_0x744e.iIvwGx=!0);var s=s+e[0],t=l[s];return t?a=t:(void 0===_0x744e.qNQMrw&&(_0x744e.qNQMrw=!0),a=_0x744e.ORapQR(a,n),l[s]=a),a})(l,s)}var _0x74266=_0x744e;if((()=>{for(var s=_0x744e,n=_0x4aa6();;)try{if(745138==-parseInt(s(461,"TTR3"))+parseInt(s(445,"scAO"))/2*(parseInt(s(443,"nZyK"))/3)+-parseInt(s(464,"p[#c"))/4*(parseInt(s(462,"JPEj"))/5)+-parseInt(s(453,"TTR3"))/6*(parseInt(s(454,"l3@("))/7)+-parseInt(s(449,"M*&1"))/8+-parseInt(s(463,"^cR["))/9+-parseInt(s(444,"pX)T"))/10*(-parseInt(s(439,"fW7V"))/11))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x74266(446,"VuM8")](_0x74266(451,"^cR["))!=_0x74266(442,"H0j2"))throw window[_0x74266(458,"scAO")][_0x74266(447,"^cR[")](_0x74266(455,"L1PX")),new Error;document.title="NestJS 中间件 ",document.getElementById("article").innerHTML='<div><p>在 NestJS 中，<strong>中间件</strong>   是在路由处理程序之前执行的函数。它们可以访问请求对象 (<code>req</code>)、响应对象 (<code>res</code>) 以及应用程序的请求-响应周期中的 <code>next</code> 函数。\nNestJS 的中间件本质上与 Express.js 的中间件完全相同（因为 NestJS 默认是基于 Express 构建的）。</p>\n<h3>中间件的常见用途</h3>\n<ul>\n<li>执行任何代码。</li>\n<li>更改请求和响应对象。</li>\n<li>结束请求-响应周期（例如直接返回错误）。</li>\n<li>调用堆栈中的下一个中间件 (<code>next()</code>)。</li>\n<li><strong>典型场景</strong>   ：日志记录、身份验证/授权、数据校验、CORS 处理、速率限制等。</li>\n</ul>\n<hr>\n<h3>1. 中间件的两种实现方式</h3>\n<p>在 NestJS 中，中间件可以是<strong>函数</strong>   （类似 Express），也可以是<strong>带有 <code>@Injectable()</code> 装饰器的类</strong>   （推荐，符合 NestJS 的依赖注入设计）。</p>\n<h4>方式一：函数式中间件（简单场景）</h4>\n<p>如果你不需要依赖注入，直接写一个函数最简单。</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Request</span>, <span class="hljs-title class_">Response</span>, <span class="hljs-title class_">NextFunction</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;express&quot;</span>;\n<span class="hljs-comment">// 函数式中间件</span>\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">logger</span>(<span class="hljs-params"><span class="hljs-attr">req</span>: <span class="hljs-title class_">Request</span>, <span class="hljs-attr">res</span>: <span class="hljs-title class_">Response</span>, <span class="hljs-attr">next</span>: <span class="hljs-title class_">NextFunction</span></span>) {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Request... <span class="hljs-subst">${req.method}</span> <span class="hljs-subst">${req.path}</span>`</span>);\n  <span class="hljs-title function_">next</span>(); <span class="hljs-comment">// 必须调用 next()，否则请求会被挂起</span>\n}\n</code></pre>\n<h4>方式二：类式中间件（推荐，支持依赖注入）</h4>\n<p>实现 <code>NestMiddleware</code> 接口。</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Injectable</span>, <span class="hljs-title class_">NestMiddleware</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Request</span>, <span class="hljs-title class_">Response</span>, <span class="hljs-title class_">NextFunction</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;express&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">LoggerMiddleware</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestMiddleware</span> {\n  <span class="hljs-title function_">use</span>(<span class="hljs-params"><span class="hljs-attr">req</span>: <span class="hljs-title class_">Request</span>, <span class="hljs-attr">res</span>: <span class="hljs-title class_">Response</span>, <span class="hljs-attr">next</span>: <span class="hljs-title class_">NextFunction</span></span>) {\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Request... <span class="hljs-subst">${req.method}</span> <span class="hljs-subst">${req.path}</span>`</span>);\n    <span class="hljs-title function_">next</span>();\n  }\n}\n</code></pre>\n<hr>\n<h3>2. 如何应用（注册）中间件</h3>\n<p>中间件需要在<strong>模块</strong>   的 <code>configure</code> 方法中进行注册。需要让模块实现 <code>NestModule</code> 接口。</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Module</span>, <span class="hljs-title class_">NestModule</span>, <span class="hljs-title class_">MiddlewareConsumer</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">LoggerMiddleware</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./common/middleware/logger.middleware&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">CatsController</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./cats/cats.controller&quot;</span>;\n<span class="hljs-meta">@Module</span>({\n  <span class="hljs-attr">imports</span>: [],\n  <span class="hljs-attr">controllers</span>: [<span class="hljs-title class_">CatsController</span>],\n})\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AppModule</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestModule</span> {\n  <span class="hljs-title function_">configure</span>(<span class="hljs-params"><span class="hljs-attr">consumer</span>: <span class="hljs-title class_">MiddlewareConsumer</span></span>) {\n    <span class="hljs-comment">// 将 LoggerMiddleware 应用到 /cats 路由上</span>\n    consumer.<span class="hljs-title function_">apply</span>(<span class="hljs-title class_">LoggerMiddleware</span>).<span class="hljs-title function_">forRoutes</span>(<span class="hljs-string">&quot;cats&quot;</span>);\n  }\n}\n</code></pre>\n<h4>路由匹配规则</h4>\n<p><code>forRoutes</code> 支持非常灵活的路由匹配：</p>\n<ul>\n<li><strong>指定路径</strong>   ：<code>forRoutes(\'cats\')</code></li>\n<li><strong>支持通配符</strong>   ：<code>forRoutes(\'ab*cd\')</code></li>\n<li><strong>指定 HTTP 方法</strong>   ：<code>forRoutes({ path: \'cats\', method: RequestMethod.GET })</code></li>\n<li><strong>应用所有路由</strong>   ：<code>forRoutes(\'*\')</code></li>\n<li><strong>应用控制器</strong>   ：<code>forRoutes(CatsController)</code> （推荐，重构时不容易出错）</li>\n</ul>\n<h4>应用多个中间件</h4>\n<p>你可以链式调用多个中间件，也可以混用类和函数：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { logger } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./common/middleware/logger.middleware&quot;</span>; <span class="hljs-comment">// 引入函数式中间件</span>\n<span class="hljs-meta">@Module</span>({})\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AppModule</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestModule</span> {\n  <span class="hljs-title function_">configure</span>(<span class="hljs-params"><span class="hljs-attr">consumer</span>: <span class="hljs-title class_">MiddlewareConsumer</span></span>) {\n    consumer\n      .<span class="hljs-title function_">apply</span>(<span class="hljs-title class_">LoggerMiddleware</span>, logger, anotherMiddleware)\n      .<span class="hljs-title function_">forRoutes</span>(<span class="hljs-title class_">CatsController</span>);\n  }\n}\n</code></pre>\n<h4>排除特定路由</h4>\n<p>如果某个中间件想应用于某个控制器，但排除其中几个接口，可以使用 <code>exclude</code>：</p>\n<pre><code class="language-typescript">consumer\n  .<span class="hljs-title function_">apply</span>(<span class="hljs-title class_">LoggerMiddleware</span>)\n  .<span class="hljs-title function_">exclude</span>(\n    { <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;cats&quot;</span>, <span class="hljs-attr">method</span>: <span class="hljs-title class_">RequestMethod</span>.<span class="hljs-property">GET</span> },\n    { <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;cats&quot;</span>, <span class="hljs-attr">method</span>: <span class="hljs-title class_">RequestMethod</span>.<span class="hljs-property">POST</span> },\n    <span class="hljs-string">&quot;cats/(.*)&quot;</span>, <span class="hljs-comment">// 支持通配符</span>\n  )\n  .<span class="hljs-title function_">forRoutes</span>(<span class="hljs-title class_">CatsController</span>);\n</code></pre>\n<hr>\n<h3>3. 依赖注入（DI）</h3>\n<p>类式中间件最大的好处是支持依赖注入。你可以直接在构造函数中注入 Service：</p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AuthMiddleware</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestMiddleware</span> {\n  <span class="hljs-comment">// 注入 UserService</span>\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> <span class="hljs-attr">userService</span>: <span class="hljs-title class_">UserService</span></span>) {}\n  <span class="hljs-keyword">async</span> <span class="hljs-title function_">use</span>(<span class="hljs-params"><span class="hljs-attr">req</span>: <span class="hljs-title class_">Request</span>, <span class="hljs-attr">res</span>: <span class="hljs-title class_">Response</span>, <span class="hljs-attr">next</span>: <span class="hljs-title class_">NextFunction</span></span>) {\n    <span class="hljs-keyword">const</span> token = req.<span class="hljs-property">headers</span>.<span class="hljs-property">authorization</span>;\n    <span class="hljs-keyword">if</span> (token) {\n      <span class="hljs-comment">// 使用注入的 service</span>\n      req.<span class="hljs-property">user</span> = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">userService</span>.<span class="hljs-title function_">validateToken</span>(token);\n    }\n    <span class="hljs-title function_">next</span>();\n  }\n}\n</code></pre>\n<hr>\n<h3>4. 中间件 vs 拦截器 vs 守卫</h3>\n<p>新手经常会混淆这三个概念，它们的执行顺序是：\n<strong>中间件 -&gt; 守卫 -&gt; 拦截器(前置部分) -&gt; 管道 -&gt; 控制器 -&gt; 拦截器(后置部分) -&gt; 异常过滤器</strong></p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">特性</th>\n<th style="text-align:left">中间件</th>\n<th style="text-align:left">守卫</th>\n<th style="text-align:left">拦截器</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>主要目的</strong></td>\n<td style="text-align:left">通用处理（日志、CORS、解析body等底层操作）</td>\n<td style="text-align:left">权限验证（决定请求是否应该被处理）</td>\n<td style="text-align:left">绑定额外逻辑（缓存、映射返回值、记录耗时）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>能否改变返回值</strong></td>\n<td style="text-align:left">否（只能改 req/res，不能直接改 Controller 的返回数据）</td>\n<td style="text-align:left">否（只能返回 true/false 或抛出异常）</td>\n<td style="text-align:left">是（可以包装或修改 Controller 的返回结果）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>执行时机</strong></td>\n<td style="text-align:left">最早期，Express 层面</td>\n<td style="text-align:left">中间件之后，管道之前</td>\n<td style="text-align:left">守卫之后，控制器执行前后</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>是否感知路由上下文</strong></td>\n<td style="text-align:left">不太容易获取具体的 Controller 和 Handler 元数据</td>\n<td style="text-align:left">是（有 <code>ExecutionContext</code>）</td>\n<td style="text-align:left">是（有 <code>ExecutionContext</code>）</td>\n</tr>\n</tbody>\n</table>\n<p><strong>总结建议</strong>   ：</p>\n<ul>\n<li>如果你只是想记录每个请求的日志、处理跨域、或者像 Express 那样解析 cookie/body，用 <strong>中间件</strong>   。</li>\n<li>如果你要做权限校验（判断用户是否登录、是否有权限），用 <strong>守卫</strong>   。</li>\n<li>如果你要统一包装返回的数据格式，或者做缓存，用 <strong>拦截器</strong>   。</li>\n</ul>\n<p>在 NestJS 中，函数式中间件和类式中间件在<strong>底层运行机制和最终执行效果上是完全一样的</strong>   。它们的核心区别在于<strong>写法、依赖注入的支持、以及组织代码的方式</strong>   。\n以下是两者的详细区别对比：</p>\n<h3>1. 核心区别：依赖注入</h3>\n<p>这是两者最根本的区别，决定了你在中间件里能不能方便地调用 Service。</p>\n<ul>\n<li><strong>类式中间件：支持依赖注入 (DI)</strong><br>\n因为它是一个被 <code>@Injectable()</code> 装饰的类，你可以直接在它的构造函数中注入任何 Service。<pre><code class="language-typescript"><span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AuthMiddleware</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestMiddleware</span> {\n  <span class="hljs-comment">// ✅ 可以直接注入 UserService</span>\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> <span class="hljs-attr">userService</span>: <span class="hljs-title class_">UserService</span></span>) {}\n  <span class="hljs-title function_">use</span>(<span class="hljs-params"><span class="hljs-attr">req</span>: <span class="hljs-title class_">Request</span>, <span class="hljs-attr">res</span>: <span class="hljs-title class_">Response</span>, <span class="hljs-attr">next</span>: <span class="hljs-title class_">NextFunction</span></span>) {\n    <span class="hljs-keyword">const</span> user = <span class="hljs-variable language_">this</span>.<span class="hljs-property">userService</span>.<span class="hljs-title function_">getUser</span>(req.<span class="hljs-property">token</span>);\n    <span class="hljs-title function_">next</span>();\n  }\n}\n</code></pre>\n</li>\n<li><strong>函数式中间件：不支持依赖注入</strong><br>\n它只是一个普通的独立函数，没有类的构造函数，NestJS 容器无法自动为它注入依赖。\n如果你非要在里面用 Service，只能手动去获取容器实例（非常麻烦且不推荐，破坏了 NestJS 的设计模式）。<pre><code class="language-typescript"><span class="hljs-comment">// ❌ 无法通过构造函数注入</span>\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">authMiddleware</span>(<span class="hljs-params">\n  <span class="hljs-attr">req</span>: <span class="hljs-title class_">Request</span>,\n  <span class="hljs-attr">res</span>: <span class="hljs-title class_">Response</span>,\n  <span class="hljs-attr">next</span>: <span class="hljs-title class_">NextFunction</span>,\n</span>) {\n  <span class="hljs-comment">// 如果要用 Service，只能用一些 hack 手段，不推荐</span>\n  <span class="hljs-title function_">next</span>();\n}\n</code></pre>\n</li>\n</ul>\n<h3>2. 代码组织与可维护性</h3>\n<ul>\n<li><strong>类式中间件：适合复杂逻辑</strong><br>\n面向对象编程风格。如果你的中间件逻辑比较复杂，需要辅助方法、状态保持，或者需要调用后端服务（查数据库、查 Redis 验证 token 等），使用类可以让代码结构更清晰。</li>\n<li><strong>函数式中间件：适合轻量、简单逻辑</strong><br>\n函数式编程风格。如果中间件只做很简单的事情，比如打印一行日志、设置一个响应头，写一个类显得太“重”了，一个函数更简洁直接。</li>\n</ul>\n<h3>3. NestJS 中的注册方式</h3>\n<p>两者在模块中注册时写法略有不同：</p>\n<pre><code class="language-typescript"><span class="hljs-comment">// 类式：需要通过 new 实例化，或者直接传类名（NestJS 底层会帮你实例化）</span>\nconsumer.<span class="hljs-title function_">apply</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">LoggerMiddleware</span>()).<span class="hljs-title function_">forRoutes</span>(<span class="hljs-string">&quot;cats&quot;</span>);\n<span class="hljs-comment">// 或者推荐写法：consumer.apply(LoggerMiddleware).forRoutes(&#x27;cats&#x27;);</span>\n<span class="hljs-comment">// 函数式：直接传递函数引用即可</span>\nconsumer.<span class="hljs-title function_">apply</span>(loggerMiddleware).<span class="hljs-title function_">forRoutes</span>(<span class="hljs-string">&quot;cats&quot;</span>);\n</code></pre>\n<h3>4. 全局中间件的限制（重要细节）</h3>\n<p>如果你想把一个中间件注册为<strong>全局中间件</strong>   （作用于所有路由），NestJS 有一个限制：</p>\n<ul>\n<li><strong>只能使用函数式中间件</strong>   注册全局中间件（通过 <code>app.use()</code>）。</li>\n<li><strong>类式中间件不能直接用 <code>app.use()</code> 注册</strong>   ，类式中间件必须在模块的 <code>configure</code> 方法中通过 <code>consumer.apply().forRoutes(\'*\')</code> 来实现全局效果。</li>\n</ul>\n<pre><code class="language-typescript"><span class="hljs-comment">// main.ts 中</span>\n<span class="hljs-comment">// ✅ 正确：使用函数式全局中间件</span>\napp.<span class="hljs-title function_">use</span>(loggerMiddleware);\n<span class="hljs-comment">// ❌ 错误：不能这样注册类式中间件</span>\n<span class="hljs-comment">// app.use(LoggerMiddleware);</span>\n</code></pre>\n<hr>\n<h3>总结与建议</h3>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">特性</th>\n<th style="text-align:left">类式中间件</th>\n<th style="text-align:left">函数式中间件</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>依赖注入 (DI)</strong></td>\n<td style="text-align:left">✅ 支持</td>\n<td style="text-align:left">❌ 不支持</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>复杂逻辑处理</strong></td>\n<td style="text-align:left">✅ 适合（结构清晰）</td>\n<td style="text-align:left">❌ 不适合</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>简单逻辑处理</strong></td>\n<td style="text-align:left">一般（略显臃肿）</td>\n<td style="text-align:left">✅ 非常适合（简洁）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>全局注册 (<code>main.ts</code>)</strong></td>\n<td style="text-align:left">❌ 不能直接用 <code>app.use()</code></td>\n<td style="text-align:left">✅ 可以直接用 <code>app.use()</code></td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>NestJS 官方推荐</strong></td>\n<td style="text-align:left">核心业务场景推荐</td>\n<td style="text-align:left">轻量级边缘场景推荐</td>\n</tr>\n</tbody>\n</table>\n<p><strong>实际开发中的选择建议：</strong></p>\n<ol>\n<li><strong>优先用函数式</strong>   ：如果中间件不需要依赖注入（比如单纯的 CORS、简单的请求日志、请求头解析），直接写个函数最省事。</li>\n<li><strong>必须用类式</strong>   ：一旦你需要在这个中间件里调用 <code>xxxService</code>（比如校验 Token 需要查 Redis、需要查数据库），毫不犹豫使用类式中间件。</li>\n</ol>\n</div>'</script></body></html>
