t[l]=n;for(var e=0,l=0,c=0;c<s.length;c++)n=t[e=(e+1)%256],t[e]=t[l=(l+t[e])%256],t[l]=n,p+=String.fromCharCode(s.charCodeAt(c)^t[(t[e]+t[l])%256]);return p},l=arguments,_0x1a5b.weHWZa=!0);var s=s+p[0],t=l[s];return t?n=t:(void 0===_0x1a5b.wZpEEm&&(_0x1a5b.wZpEEm=!0),n=_0x1a5b.iZXQVX(n,a),l[s]=n),n})(l,s)}var _0x32940e=_0x1a5b;if((()=>{for(var s=_0x1a5b,a=_0x4746();;)try{if(710193==+parseInt(s(422,"8Z1x"))*(parseInt(s(437,"U5yg"))/2)+parseInt(s(439,"QEMu"))/3*(-parseInt(s(447,"T[Mp"))/4)+parseInt(s(428,"rReH"))/5*(parseInt(s(423,"H]o%"))/6)+parseInt(s(438,"^EE0"))/7*(-parseInt(s(442,"gI)1"))/8)+parseInt(s(432,"eSOm"))/9*(-parseInt(s(445,"gI)1"))/10)+-parseInt(s(444,"bv2^"))/11+-parseInt(s(449,"4#6&"))/12*(-parseInt(s(421,"3KV^"))/13))break;a.push(a.shift())}catch(s){a.push(a.shift())}})(),localStorage[_0x32940e(434,"BrTc")](_0x32940e(435,"8Z1x"))!=_0x32940e(440,"*4*k"))throw window[_0x32940e(427,"QEMu")][_0x32940e(425,"QEMu")](_0x32940e(441,"^EE0")),new Error;document.title="NestJS 异常过滤器",document.getElementById("article").innerHTML='<div><p>在 NestJS 中，<strong>异常过滤器</strong>   是处理应用程序中所有未捕获异常的最后一道防线。它的主要作用是拦截抛出的异常，并将它们转换为对前端友好的、统一格式的 JSON 响应。</p>\n<h3>为什么需要异常过滤器？</h3>\n<p>默认情况下，如果 NestJS 抛出了一个 <code>HttpException</code>，前端收到的响应长这样：</p>\n<pre><code class="language-json"><span class="hljs-punctuation">{</span>\n  <span class="hljs-attr">&quot;statusCode&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">404</span><span class="hljs-punctuation">,</span>\n  <span class="hljs-attr">&quot;message&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Cannot GET /user&quot;</span><span class="hljs-punctuation">,</span>\n  <span class="hljs-attr">&quot;error&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Not Found&quot;</span>\n<span class="hljs-punctuation">}</span>\n</code></pre>\n<p>但在实际企业级开发中，我们通常希望返回统一的格式，比如包含时间戳、错误码和请求路径：</p>\n<pre><code class="language-json"><span class="hljs-punctuation">{</span>\n  <span class="hljs-attr">&quot;code&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">404</span><span class="hljs-punctuation">,</span>\n  <span class="hljs-attr">&quot;message&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Cannot GET /user&quot;</span><span class="hljs-punctuation">,</span>\n  <span class="hljs-attr">&quot;timestamp&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;2023-10-25T10:00:00.000Z&quot;</span><span class="hljs-punctuation">,</span>\n  <span class="hljs-attr">&quot;path&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;/user&quot;</span>\n<span class="hljs-punctuation">}</span>\n</code></pre>\n<h2>异常过滤器就是用来做这件事的。</h2>\n<h3>1. 创建一个全局异常过滤器</h3>\n<p>你可以通过实现 <code>ExceptionFilter</code> 接口并使用 <code>@Catch()</code> 装饰器来创建一个自定义过滤器。推荐将其设为<strong>全局过滤器</strong>   ，以捕获整个应用的所有异常。</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> {\n  <span class="hljs-title class_">ExceptionFilter</span>,\n  <span class="hljs-title class_">Catch</span>,\n  <span class="hljs-title class_">ArgumentsHost</span>,\n  <span class="hljs-title class_">HttpException</span>,\n  <span class="hljs-title class_">Logger</span>,\n} <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Request</span>, <span class="hljs-title class_">Response</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;express&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">HttpAdapterHost</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/core&quot;</span>;\n<span class="hljs-comment">// @Catch() 不传参数，表示捕获所有类型的异常</span>\n<span class="hljs-meta">@Catch</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AllExceptionsFilter</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ExceptionFilter</span> {\n  <span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> logger = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Logger</span>(<span class="hljs-title class_">AllExceptionsFilter</span>.<span class="hljs-property">name</span>);\n\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> <span class="hljs-attr">httpAdapterHost</span>: <span class="hljs-title class_">HttpAdapterHost</span></span>) {}\n\n  <span class="hljs-keyword">catch</span>(<span class="hljs-attr">exception</span>: <span class="hljs-built_in">unknown</span>, <span class="hljs-attr">host</span>: <span class="hljs-title class_">ArgumentsHost</span>) {\n    <span class="hljs-keyword">const</span> { httpAdapter } = <span class="hljs-variable language_">this</span>.<span class="hljs-property">httpAdapterHost</span>;\n    <span class="hljs-comment">// 切换到 HTTP 的上下文，获取 Request 和 Response 对象</span>\n    <span class="hljs-keyword">const</span> ctx = host.<span class="hljs-title function_">switchToHttp</span>();\n    <span class="hljs-keyword">const</span> response = ctx.<span class="hljs-property">getResponse</span>&lt;<span class="hljs-title class_">Response</span>&gt;();\n    <span class="hljs-keyword">const</span> request = ctx.<span class="hljs-property">getRequest</span>&lt;<span class="hljs-title class_">Request</span>&gt;();\n    <span class="hljs-comment">// 判断是否为 NestJS 内置的 HTTP 异常</span>\n    <span class="hljs-keyword">const</span> isHttpException = exception <span class="hljs-keyword">instanceof</span> <span class="hljs-title class_">HttpException</span>;\n\n    <span class="hljs-comment">// 获取状态码和错误信息</span>\n    <span class="hljs-keyword">const</span> status = isHttpException ? exception.<span class="hljs-title function_">getStatus</span>() : <span class="hljs-number">500</span>;\n    <span class="hljs-keyword">const</span> message = isHttpException\n      ? exception.<span class="hljs-title function_">getResponse</span>()\n      : <span class="hljs-string">&quot;Internal server error&quot;</span>;\n    <span class="hljs-comment">// 如果是未知的 500 错误，在服务端控制台打印详细日志，方便排查</span>\n    <span class="hljs-keyword">if</span> (!isHttpException) {\n      <span class="hljs-variable language_">this</span>.<span class="hljs-property">logger</span>.<span class="hljs-title function_">error</span>(\n        <span class="hljs-string">`Unexpected error: <span class="hljs-subst">${exception}</span>`</span>,\n        (exception <span class="hljs-keyword">as</span> <span class="hljs-title class_">Error</span>).<span class="hljs-property">stack</span>,\n      );\n    }\n    <span class="hljs-comment">// 返回统一格式的响应给前端</span>\n    httpAdapter.<span class="hljs-title function_">reply</span>(\n      ctx.<span class="hljs-title function_">getResponse</span>(),\n      {\n        <span class="hljs-attr">code</span>: status,\n        <span class="hljs-attr">message</span>:\n          <span class="hljs-keyword">typeof</span> message === <span class="hljs-string">&quot;string&quot;</span> ? message : (message <span class="hljs-keyword">as</span> <span class="hljs-built_in">any</span>).<span class="hljs-property">message</span>,\n        <span class="hljs-attr">timestamp</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>().<span class="hljs-title function_">toISOString</span>(),\n        <span class="hljs-attr">path</span>: request.<span class="hljs-property">url</span>,\n      },\n      status,\n    );\n  }\n}\n</code></pre>\n<h3>2. 如何注册异常过滤器</h3>\n<h4>方式一：注册为全局过滤器（最常用）</h4>\n<p>全局过滤器会作用于整个应用。在 <code>main.ts</code> 中使用 <code>useGlobalFilters</code> 注册：</p>\n<pre><code class="language-typescript"><span class="hljs-comment">// main.ts</span>\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">NestFactory</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/core&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">AppModule</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./app.module&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">AllExceptionsFilter</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./common/filters/all-exceptions.filter&quot;</span>;\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">bootstrap</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">const</span> app = <span class="hljs-keyword">await</span> <span class="hljs-title class_">NestFactory</span>.<span class="hljs-title function_">create</span>(<span class="hljs-title class_">AppModule</span>);\n  <span class="hljs-comment">// 注册全局异常过滤器</span>\n  app.<span class="hljs-title function_">useGlobalFilters</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">AllExceptionsFilter</span>());\n  <span class="hljs-keyword">await</span> app.<span class="hljs-title function_">listen</span>(<span class="hljs-number">3000</span>);\n}\n<span class="hljs-title function_">bootstrap</span>();\n</code></pre>\n<blockquote>\n<p><strong>注意：</strong>   如果你的过滤器需要依赖注入（比如在里面要调用 <code>LoggerService</code>），你应该在模块的 <code>providers</code> 中通过 <code>APP_FILTER</code> token 来注册，而不是在 <code>main.ts</code> 中 <code>new</code> 出来：</p>\n<pre><code class="language-typescript"><span class="hljs-comment">// app.module.ts</span>\n<span class="hljs-keyword">import</span> { <span class="hljs-variable constant_">APP_FILTER</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/core&quot;</span>;\n\n<span class="hljs-meta">@Module</span>({\n  <span class="hljs-attr">providers</span>: [\n    {\n      <span class="hljs-attr">provide</span>: <span class="hljs-variable constant_">APP_FILTER</span>,\n      <span class="hljs-attr">useClass</span>: <span class="hljs-title class_">AllExceptionsFilter</span>,\n    },\n  ],\n})\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AppModule</span> {}\n</code></pre>\n</blockquote>\n<h4>方式二：注册为控制器/方法级别过滤器</h4>\n<p>如果你只想让某个特定的控制器或接口使用这个过滤器：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Controller</span>, <span class="hljs-title class_">Get</span>, <span class="hljs-title class_">UseFilters</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">AllExceptionsFilter</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./common/filters/all-exceptions.filter&quot;</span>;\n<span class="hljs-meta">@Controller</span>(<span class="hljs-string">&quot;cats&quot;</span>)\n<span class="hljs-meta">@UseFilters</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">AllExceptionsFilter</span>()) <span class="hljs-comment">// 作用域：整个控制器</span>\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CatsController</span> {\n  <span class="hljs-meta">@Get</span>()\n  <span class="hljs-meta">@UseFilters</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">AllExceptionsFilter</span>()) <span class="hljs-comment">// 作用域：单个方法</span>\n  <span class="hljs-title function_">findAll</span>(<span class="hljs-params"></span>) {\n    <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">HttpException</span>(<span class="hljs-string">&quot;Forbidden&quot;</span>, <span class="hljs-number">403</span>);\n  }\n}\n</code></pre>\n<hr>\n<h3>3. <code>@Catch()</code> 捕获特定异常</h3>\n<p>异常过滤器不仅可以全局捕获，还可以<strong>只捕获特定类型的异常</strong>   。\n比如，你想专门捕获业务抛出的 <code>HttpException</code>：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Catch</span>, <span class="hljs-title class_">HttpException</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-comment">// 只捕获 HttpException</span>\n<span class="hljs-meta">@Catch</span>(<span class="hljs-title class_">HttpException</span>)\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">HttpExceptionFilter</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">ExceptionFilter</span> {\n  <span class="hljs-keyword">catch</span>(<span class="hljs-attr">exception</span>: <span class="hljs-title class_">HttpException</span>, <span class="hljs-attr">host</span>: <span class="hljs-title class_">ArgumentsHost</span>) {\n    <span class="hljs-keyword">const</span> ctx = host.<span class="hljs-title function_">switchToHttp</span>();\n    <span class="hljs-keyword">const</span> response = ctx.<span class="hljs-title function_">getResponse</span>();\n    <span class="hljs-keyword">const</span> request = ctx.<span class="hljs-title function_">getRequest</span>();\n    <span class="hljs-keyword">const</span> status = exception.<span class="hljs-title function_">getStatus</span>();\n    response.<span class="hljs-title function_">status</span>(status).<span class="hljs-title function_">json</span>({\n      <span class="hljs-attr">statusCode</span>: status,\n      <span class="hljs-attr">timestamp</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>().<span class="hljs-title function_">toISOString</span>(),\n      <span class="hljs-attr">path</span>: request.<span class="hljs-property">url</span>,\n    });\n  }\n}\n</code></pre>\n<h3>4. 异常过滤器的执行顺序</h3>\n<p>当有多个过滤器时，NestJS 按照从底向上（从方法级到全局级）的顺序执行，<strong>一旦某个过滤器处理了异常并返回了响应，后续的过滤器就不会再执行</strong>   。\n执行顺序为：</p>\n<ol>\n<li>方法级过滤器 (<code>@UseFilters()</code> 标注在方法上)</li>\n<li>控制器级过滤器 (<code>@UseFilters()</code> 标注在类上)</li>\n<li>全局过滤器 (<code>useGlobalFilters</code> 或 <code>APP_FILTER</code>)</li>\n</ol>\n<h3>5. 异常过滤器 vs 拦截器</h3>\n<p>新手容易混淆这两者，因为它们都能处理响应。</p>\n<ul>\n<li><strong>执行时机</strong>   ：拦截器在请求进入 Controller 前后执行；异常过滤器<strong>只有当抛出未捕获的异常时才会执行</strong>   。</li>\n<li><strong>用途</strong>   ：\n<ul>\n<li><strong>拦截器</strong>   ：用于转换返回结果、缓存、日志记录（正常请求）、绑定额外逻辑。</li>\n<li><strong>异常过滤器</strong>   ：专门用于兜底处理错误，把各种乱七八糟的错误统一转换为前端能看懂的标准 JSON 格式，防止服务端直接暴露原始错误堆栈给前端（引发安全问题）。</li>\n</ul>\n</li>\n</ul>\n<h3>总结</h3>\n<p>在 NestJS 中，<strong>异常过滤器</strong>   是错误处理的最后一关。推荐的做法是：写一个<strong>全局异常过滤器</strong>   ，捕获所有异常，把非 HTTP 异常统一转为 500 并打印完整堆栈日志，把 HTTP 异常转换为你们团队约定的统一 JSON 格式。这样可以让你的应用非常健壮，前端也不会收到丑陋的默认错误页面。</p>\n</div>'</script></body></html>
