W7S","t8k6WO/cKmops8klW5ldVSkA","WQ9UW6zti8oVk8kNWO5JW6CxW4RcVa","C8kpkmkpWOJdJmoOWQLVWOVdQSky","WRDLCmkucKC+tCkyW4ZdPcK","W7VcLX/cRZGQW48aW7a","rCkhWP7cJqjZW4jk"];return(_0x58d8=function(){return s})()}if((()=>{for(var s=_0x492d,n=_0x58d8();;)try{if(488031==+parseInt(s(294,"7TcC"))+parseInt(s(306,"WNb$"))/2*(-parseInt(s(302,"iw3$"))/3)+parseInt(s(308,"NPd7"))/4+parseInt(s(289,"S9$m"))/5+-parseInt(s(288,"Aasx"))/6*(-parseInt(s(307,"a1&^"))/7)+-parseInt(s(300,"pxa$"))/8*(-parseInt(s(290,"VHwl"))/9)+-parseInt(s(303,"hAxe"))/10)break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x428e17(301,"Fq6Q")](_0x428e17(286,"KB3#"))!=_0x428e17(291,"0^Kk"))throw window[_0x428e17(295,"Qf$*")][_0x428e17(309,"AKKC")](_0x428e17(310,"@2eK")),new Error;document.title="node BFF 架构下实现单点登录",document.getElementById("article").innerHTML='<div><p>在 BFF 架构下实现单点登录（SSO），是前端工程化中最经典、也是体验最好的架构设计之一。\n由于有了 Node BFF 这一层“服务端”，我们终于可以摆脱纯前端（SPA）实现 SSO 时那种狼狈的状态（比如要在前端用 iframe 偷 Cookie，或者前端手动拦截 401 跳转）。\n<strong>Node BFF 实现 SSO 的核心思想是：BFF 作为中间人，向下对接复杂的认证中心（SSO Server），向上对前端只暴露无感知的 Cookie 鉴权。</strong><br>\n目前企业级 BFF 实现 SSO 有两大主流流派：<strong>传统重定向模式（基于 CAS/OAuth2）</strong>   和 <strong>现代静默模式（基于双 Token + 隐藏 iframe）</strong>   。我们重点讲后者，因为它是目前大厂（如 Auth0、阿里、字节）BFF 架构下最主流、体验最丝滑的方案。</p>\n<hr>\n<h3>一、 核心架构与角色</h3>\n<ol>\n<li><strong>前端（Browser）：</strong>   只认 BFF 下发的 <code>HttpOnly Cookie</code>，完全不关心 Token。</li>\n<li><strong>Node BFF：</strong>   掌管两个 Cookie（<code>access_token</code> 短命，<code>refresh_token</code> 长命），负责与 SSO Server 交互。</li>\n<li><strong>SSO 认证中心（IdP）：</strong>   统一负责验证账号密码，签发 Token。</li>\n<li><strong>业务微服务：</strong>   只认 BFF 透传的 <code>X-User-Id</code>。</li>\n</ol>\n<hr>\n<h3>二、 现代静默 SSO 方案详解（双 Token + Silent Refresh）</h3>\n<p>这种方案可以实现：<strong>用户在 A 系统登录后，打开 B 系统，B 系统无需跳转页面，瞬间自动登录。</strong></p>\n<h4>核心机制：Silent Refresh（静默刷新）</h4>\n<p>当用户访问系统 B 时，BFF 发现用户没有登录态，不会直接 <code>302 重定向</code> 到 SSO 登录页（这会导致页面闪烁），而是发起一个<strong>静默授权请求</strong>   。</p>\n<h4>完整数据流转（用户跨系统登录系统 B）：</h4>\n<p><strong>Step 1：用户首次访问系统 B</strong></p>\n<ol>\n<li>用户访问 <code>b.com</code>，前端向后端 BFF 请求用户信息。</li>\n<li>BFF 检查 Cookie，发现既没有 <code>access_token</code> 也没有 <code>refresh_token</code>。</li>\n<li>BFF <strong>不返回 302</strong>   ，而是返回特殊业务状态码，例如：<code>{ code: 40103, msg: &quot;需要静默授权&quot; }</code>。\n<strong>Step 2：前端发起静默 iframe</strong></li>\n<li>前端收到 <code>40103</code>，知道需要尝试 SSO，于是创建一个<strong>隐藏的 iframe</strong>   ，指向 SSO 认证中心的授权地址，并带上 BFF 的回调地址。</li>\n</ol>\n<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">iframe</span>\n  <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://sso.com/authorize?client_id=B&amp;redirect_uri=https://b.com/api/auth/silent-callback&amp;prompt=none&quot;</span>\n  <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;display:none&quot;</span>\n&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">iframe</span>&gt;</span>\n</code></pre>\n<p><strong>Step 3：SSO 认证中心判断登录态（关键点）</strong></p>\n<ol>\n<li>浏览器请求 <code>sso.com</code>，会带上 SSO 域下的 Session/Cookie。</li>\n<li>因为用户在系统 A 已经登录过，SSO 发现<strong>有全局会话</strong>   。</li>\n<li>SSO 看到请求带了 <code>prompt=none</code>（表示不要弹登录页），于是直接签发一个一次性的 <code>authorization_code</code>。</li>\n<li>SSO 通过 <code>302 重定向</code>，将 iframe 指向 BFF 的回调地址：<code>https://b.com/api/auth/silent-callback?code=xxx</code>。\n<strong>Step 4：BFF 完成登录态写入</strong></li>\n<li>iframe 内部请求了 BFF 的回调接口。</li>\n<li>BFF 拿到 <code>code</code>，<strong>在服务端</strong>   向 SSO 发起请求，换取 <code>access_token</code> 和 <code>refresh_token</code>。</li>\n<li>BFF 将两个 Token 写入 <code>b.com</code> 域的 <code>HttpOnly Cookie</code>。</li>\n<li>BFF 返回一段 HTML/JS，<strong>通知顶层父页面（主应用）授权成功</strong>   。</li>\n</ol>\n<pre><code class="language-javascript"><span class="hljs-comment">// BFF 返回给 iframe 的脚本</span>\n&lt;script&gt;<span class="hljs-variable language_">window</span>.<span class="hljs-property">parent</span>.<span class="hljs-title function_">postMessage</span>({ <span class="hljs-attr">type</span>: <span class="hljs-string">&#x27;SSO_SUCCESS&#x27;</span> }, <span class="hljs-string">&#x27;https://b.com&#x27;</span>)&lt;/script&gt;\n</code></pre>\n<p><strong>Step 5：前端无感刷新</strong></p>\n<ol>\n<li>主应用监听到 <code>SSO_SUCCESS</code> 消息，销毁 iframe，重新发起之前失败的业务请求。</li>\n<li>此时请求带上刚写入的 Cookie，BFF 验证通过，顺利拿到数据。</li>\n<li><strong>用户全程无感知，没有页面跳转，瞬间完成 SSO 登录！</strong></li>\n</ol>\n<hr>\n<h3>三、 如果全局会话也过期了怎么办？（重新登录流转）</h3>\n<p>如果用户在系统 A 也很久没操作，SSO 的全局会话也过期了，上面的 Step 3 中，SSO 会发现没有全局 Session。</p>\n<ol>\n<li>SSO 看到 <code>prompt=none</code>，不能弹登录页，于是重定向回 BFF 回调，带上错误码：<code>?error=login_required</code>。</li>\n<li>BFF 收到错误码，通知 iframe。</li>\n<li>iframe 通知父页面：<code>{ type: \'SSO_LOGIN_REQUIRED\' }</code>。</li>\n<li>父页面收到消息后，此时才执行<strong>顶层重定向</strong>   ，跳转到 SSO 的统一登录页。</li>\n</ol>\n<hr>\n<h3>四、 BFF 核心代码架构设计</h3>\n<p>为了支撑这套逻辑，BFF 必须提供三个核心接口：</p>\n<h4>1. 统一鉴权中间件（拦截所有业务请求）</h4>\n<pre><code class="language-javascript"><span class="hljs-comment">// middleware/auth.js</span>\n<span class="hljs-variable language_">module</span>.<span class="hljs-property">exports</span> = <span class="hljs-title function_">async</span> (req, res, next) =&gt; {\n  <span class="hljs-keyword">const</span> accessToken = req.<span class="hljs-property">cookies</span>[<span class="hljs-string">&quot;access_token&quot;</span>];\n  <span class="hljs-keyword">const</span> refreshToken = req.<span class="hljs-property">cookies</span>[<span class="hljs-string">&quot;refresh_token&quot;</span>];\n  <span class="hljs-keyword">if</span> (!accessToken &amp;&amp; !refreshToken) {\n    <span class="hljs-comment">// 两个都没，告诉前端需要尝试静默 SSO</span>\n    <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">401</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">40103</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;Need silent SSO&quot;</span> });\n  }\n  <span class="hljs-keyword">if</span> (accessToken) {\n    <span class="hljs-keyword">try</span> {\n      <span class="hljs-keyword">const</span> payload = <span class="hljs-keyword">await</span> <span class="hljs-title function_">jwtVerify</span>(accessToken); <span class="hljs-comment">// jose 验证</span>\n      req.<span class="hljs-property">userId</span> = payload.<span class="hljs-property">sub</span>;\n      <span class="hljs-keyword">return</span> <span class="hljs-title function_">next</span>();\n    } <span class="hljs-keyword">catch</span> (err) {\n      <span class="hljs-keyword">if</span> (err.<span class="hljs-property">code</span> !== <span class="hljs-string">&quot;ERR_JWT_EXPIRED&quot;</span>) {\n        <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">401</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">40101</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;Invalid Token&quot;</span> });\n      }\n    }\n  }\n  <span class="hljs-comment">// AT 过期或没有，尝试用 RT 续期</span>\n  <span class="hljs-keyword">if</span> (refreshToken) {\n    <span class="hljs-keyword">try</span> {\n      <span class="hljs-keyword">const</span> newTokens = <span class="hljs-keyword">await</span> <span class="hljs-title function_">renewTokensFromSSO</span>(refreshToken); <span class="hljs-comment">// 调 SSO 续期接口</span>\n      <span class="hljs-title function_">setTokenCookies</span>(res, newTokens); <span class="hljs-comment">// 重新写入 Cookie</span>\n      req.<span class="hljs-property">userId</span> = <span class="hljs-title function_">decodeToken</span>(newTokens.<span class="hljs-property">access_token</span>).<span class="hljs-property">sub</span>;\n      <span class="hljs-keyword">return</span> <span class="hljs-title function_">next</span>();\n    } <span class="hljs-keyword">catch</span> (err) {\n      <span class="hljs-comment">// RT 也过期了（通常意味着 SSO 全局会话也凉了）</span>\n      <span class="hljs-title function_">clearTokenCookies</span>(res);\n      <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">401</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">40103</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;Need silent SSO&quot;</span> });\n    }\n  }\n};\n</code></pre>\n<h4>2. SSO 静默回调接口（处理 iframe 请求）</h4>\n<pre><code class="language-javascript"><span class="hljs-comment">// router/auth.js</span>\nrouter.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/api/auth/silent-callback&quot;</span>, <span class="hljs-title function_">async</span> (req, res) =&gt; {\n  <span class="hljs-keyword">const</span> { code, error } = req.<span class="hljs-property">query</span>;\n  <span class="hljs-keyword">if</span> (error === <span class="hljs-string">&quot;login_required&quot;</span>) {\n    <span class="hljs-comment">// SSO 要求必须重新登录，通知前端跳转</span>\n    <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">send</span>(\n      <span class="hljs-string">`&lt;script&gt;window.parent.postMessage({type: &#x27;SSO_LOGIN_REQUIRED&#x27;}, &#x27;*&#x27;)&lt;/script&gt;`</span>,\n    );\n  }\n  <span class="hljs-keyword">if</span> (code) {\n    <span class="hljs-comment">// 用 code 换 Token</span>\n    <span class="hljs-keyword">const</span> tokens = <span class="hljs-keyword">await</span> <span class="hljs-title function_">exchangeCodeForTokens</span>(code);\n    <span class="hljs-title function_">setTokenCookies</span>(res, tokens);\n    <span class="hljs-comment">// 通知前端静默授权成功</span>\n    <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">send</span>(\n      <span class="hljs-string">`&lt;script&gt;window.parent.postMessage({type: &#x27;SSO_SUCCESS&#x27;}, &#x27;*&#x27;)&lt;/script&gt;`</span>,\n    );\n  }\n});\n</code></pre>\n<h4>3. 主动登出接口（通知 SSO 销毁全局会话）</h4>\n<pre><code class="language-javascript">router.<span class="hljs-title function_">post</span>(<span class="hljs-string">&quot;/api/auth/logout&quot;</span>, <span class="hljs-title function_">async</span> (req, res) =&gt; {\n  <span class="hljs-keyword">const</span> refreshToken = req.<span class="hljs-property">cookies</span>[<span class="hljs-string">&quot;refresh_token&quot;</span>];\n  <span class="hljs-comment">// 1. 调用 SSO 的登出接口，销毁全局会话 (极其重要！否则只是 BFF 退出了，SSO 还在)</span>\n  <span class="hljs-keyword">await</span> <span class="hljs-title function_">revokeSessionAtSSO</span>(refreshToken);\n  <span class="hljs-comment">// 2. 清除 BFF 本地的 Cookie</span>\n  <span class="hljs-title function_">clearTokenCookies</span>(res);\n  res.<span class="hljs-title function_">json</span>({ <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;Logged out&quot;</span> });\n});\n</code></pre>\n<hr>\n<h3>五、 避坑指南（极易踩雷的 3 个点）</h3>\n<ol>\n<li><strong>SameSite Cookie 陷阱：</strong><br>\niframe 跨域请求时，如果 SSO 域名和 BFF 域名不同，现代浏览器（Chrome）默认会拦截第三方 Cookie。\n<ul>\n<li><strong>解法：</strong>   SSO 认证中心下发 Cookie 时，必须设置 <code>SameSite=None; Secure</code>。这也是为什么现代 SSO 强制要求 HTTPS 的原因之一。</li>\n</ul>\n</li>\n<li><strong>单点登出的全局性：</strong><br>\nSSO 的核心不仅是“单点登录”，更是“单点登出”。用户在 A 系统点登出，BFF 必须调用 SSO 的 API 销毁全局 Session，否则用户打开 B 系统又自动登录了。</li>\n<li><strong>CSRF 防御：</strong><br>\n因为使用了 Cookie 鉴权，BFF 必须防范 CSRF 攻击。通常的做法是在 BFF 登录成功时，在 Cookie 中同时塞入一个 <code>XSRF-TOKEN</code>（非 HttpOnly），前端每次请求把它取出来放到 Request Header 中，BFF 进行比对。</li>\n</ol>\n<h3>总结</h3>\n<p>Node BFF 架构下的 SSO，把前端的苦活累活（iframe 通信、Token 管理、重定向控制）全部揽到了服务端。前端只需要关注一个 <code>40103</code> 状态码和一个 <code>postMessage</code> 监听，实现了真正的**“登录态对前端透明，SSO 体验对用户无感”**   。</p>\n</div>'</script></body></html>
