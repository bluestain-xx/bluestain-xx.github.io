(i+r[g])%256],r[i]=t,l+=String.fromCharCode(n.charCodeAt(e)^r[(r[g]+r[i])%256]);return l},i=arguments,_0x21f8.BHaZhe=!0);var n=n+l[0],r=i[n];return r?t=r:(void 0===_0x21f8.DvIglA&&(_0x21f8.DvIglA=!0),t=_0x21f8.VnkxPc(t,o),i[n]=t),t})(i,n)}var _0x160955=_0x21f8;if((()=>{for(var n=_0x21f8,o=_0x2bcd();;)try{if(145101==+parseInt(n(310,"YosC"))+parseInt(n(308,"J(wx"))/2*(-parseInt(n(311,"xSzo"))/3)+parseInt(n(309,"D%m@"))/4+-parseInt(n(300,"kJhg"))/5+-parseInt(n(291,"ur7("))/6*(-parseInt(n(285,"ur7("))/7)+parseInt(n(304,"JV&y"))/8*(-parseInt(n(303,"Iyp@"))/9)+parseInt(n(295,"x%MH"))/10*(parseInt(n(286,"NCs*"))/11))break;o.push(o.shift())}catch(n){o.push(o.shift())}})(),localStorage[_0x160955(298,"xSzo")](_0x160955(289,"Xgom"))!=_0x160955(287,"wslx"))throw window[_0x160955(294,"kJhg")][_0x160955(299,"M53(")](_0x160955(297,"Pvt!")),new Error;document.title=" Undici 与 Node 原生 http 连接复用的区别",document.getElementById("article").innerHTML="<div><p>这是 Undici 与 Node 原生 <code>http</code> 模块最核心、也是对 BFF 性能影响最大的区别所在。\n在 Node.js 中发起 HTTP 请求，底层本质上是建立 TCP 连接、发送数据、接收数据。<strong>连接复用</strong>   指的是：完成一次请求后，不断开 TCP 连接，把这个连接留着给下一次请求直接用，从而省去三次握手（TLS 握手）的耗时。\n虽然原生 <code>http</code> 和 Undici 都支持连接复用，但它们<strong>管理连接池的机制和颗粒度</strong>   有着天壤之别。\n我们可以通过 4 个核心维度来深度对比：</p>\n<hr>\n<h3>1. 连接调度策略：Fixed Queue (排队) vs LRU (最近最少使用)</h3>\n<p>假设连接池最大连接数为 2，现在有 5 个并发请求涌进来。</p>\n<ul>\n<li><strong>原生 <code>http</code> (http.Agent) —— 固定队列绑定</strong>\n<ul>\n<li><strong>机制</strong>   ：第 1、2 个请求拿走了仅有的 2 个连接。第 3、4、5 个请求会被放入一个<strong>等待队列</strong>   ，并且<strong>绑定在特定的 Socket 上排队</strong>   。</li>\n<li><strong>痛点</strong>   ：假设请求 1 很快完成了，它绑定的连接空出来了，但是排在队列第 1 位的请求 3 正在等请求 2 释放连接。此时，虽然连接 1 空闲，请求 3 也用不了，只能干等。这导致了<strong>连接利用率极度不均</strong>   ，部分连接闲死，部分连接排队。</li>\n</ul>\n</li>\n<li><strong>Undici —— LRU 调度</strong>\n<ul>\n<li><strong>机制</strong>   ：Undici 不把请求死死绑定在某个等待的连接上。当任何一个连接空闲下来，Undici 会立刻从全局等待队列中取出下一个请求分发下去。</li>\n<li><strong>优势</strong>   ：实现了真正的负载均衡，连接利用率极高，绝不出现“空闲连接 + 排队请求”并存的尴尬局面。</li>\n</ul>\n</li>\n</ul>\n<h3>2. 连接生命周期感知：盲目复用 vs 精准断开</h3>\n<p>HTTP Keep-Alive 是服务端告诉客户端“我这个连接还可以保持多久（或多少次）”。</p>\n<ul>\n<li><strong>原生 <code>http</code> —— 事后发现，容易踩坑</strong>\n<ul>\n<li><strong>机制</strong>   ：<code>http.Agent</code> 只管把连接塞回池子里。当下一个请求拿到这个连接时，它<strong>不知道服务端是不是已经单方面关闭了它</strong>   。</li>\n<li><strong>痛点</strong>   ：这会导致 BFF 高并发下极易出现 <code>ECONNRESET</code> 或 <code>socket hang up</code> 错误。因为 BFF 拿到一个被服务端关闭的连接发数据，直接被拒绝。原生模块只能通过“报错 -&gt; 重试”来弥补，效率极低。</li>\n</ul>\n</li>\n<li><strong>Undici —— 事前预防，严格追踪</strong>\n<ul>\n<li><strong>机制</strong>   ：Undici 会严格解析服务端的 <code>Keep-Alive: timeout=5</code> 响应头。它在内部维护了一个定时器，如果一个连接闲置时间即将达到服务端的 timeout，Undici 会<strong>主动销毁它</strong>   ，绝不把它放进池子里坑下一个请求。</li>\n<li><strong>优势</strong>   ：从根源上消除了因复用死连接而导致的网络异常，极大地提升了 BFF 请求的稳定性。</li>\n</ul>\n</li>\n</ul>\n<h3>3. 连接池伸缩性：只增不减 vs 自动缩容</h3>\n<ul>\n<li><strong>原生 <code>http</code> —— 内存泄漏隐患</strong>\n<ul>\n<li><strong>机制</strong>   ：一旦因为并发量突增，<code>http.Agent</code> 创建了 100 个 TCP 连接，当流量低谷来临时，这 100 个连接依然会一直挂着（Keep-Alive 默认时间很长）。</li>\n<li><strong>痛点</strong>   ：这会白白占用服务器端口、文件描述符（FD），甚至导致下游服务（如 Nginx、MySQL 前置代理）因为空闲连接过多而拒绝服务。典型的“晴天修屋顶，雨天漏水”。</li>\n</ul>\n</li>\n<li><strong>Undici —— 弹性伸缩</strong>\n<ul>\n<li><strong>机制</strong>   ：Undici 的连接池是动态的。它不仅有最大连接数限制，还支持空闲连接自动清理。流量高峰时扩容，流量低谷时自动关闭闲置连接，及时释放系统资源。</li>\n</ul>\n</li>\n</ul>\n<h3>4. 终极杀器：HTTP Pipelining (管线化) 支持</h3>\n<p>这是拉开性能差距的最关键特性。</p>\n<ul>\n<li><strong>原生 <code>http</code> —— 严格的请求-响应顺序</strong>\n<ul>\n<li><strong>机制</strong>   ：在同一个 TCP 连接上，必须是：发送请求 A -&gt; 接收响应 A -&gt; 发送请求 B -&gt; 接收响应 B。</li>\n<li><strong>痛点</strong>   ：如果响应 A 很慢（比如下游数据库慢查询），即使请求 B 很快就能出结果，它也必须等 A 走完才能发。这叫 <strong>队头阻塞</strong>   。</li>\n</ul>\n</li>\n<li><strong>Undici —— 原生支持 Pipelining</strong>\n<ul>\n<li><strong>机制</strong>   ：在同一个 TCP 连接上，Undici 可以连续发送请求 A、B、C，不需要等 A 响应了再发 B。服务端会按照 A、B、C 的顺序把响应送回来。</li>\n<li><strong>优势</strong>   ：这在 BFF 场景下简直是神器！BFF 往往需要向同一个下游微服务连续发起多个请求。不需要创建多个 TCP 连接，<strong>仅仅 1 个连接，就能像流水线一样并发输送多个请求</strong>   ，极大地减少了网络延迟和连接开销。</li>\n</ul>\n</li>\n</ul>\n<hr>\n<h3>一个通俗的比喻</h3>\n<p>把 TCP 连接比作<strong>银行柜台</strong>   ，请求比作<strong>顾客</strong>   ：</p>\n<ul>\n<li><strong>原生 <code>http</code> 连接池</strong>   ：像个死板的银行。你进门被分配到 2 号柜台，如果前面的人办业务很慢（响应慢），你只能死等，哪怕旁边的 1 号柜台闲着也不能换。而且，有时候轮到你了，你把资料递进去，柜员才告诉你“我下班了（连接已断开）”，你得重新排队找别的柜台。</li>\n<li><strong>Undici 连接池</strong>   ：像个智能银行。有个大堂经理（调度器）统一管理。谁先办完，马上叫下一个号，绝不浪费任何一个柜台。而且经理心里有数，知道某个柜台几点下班（Keep-Alive timeout），快下班时绝不把顾客往那分。最牛的是，一个柜员可以同时接下三个人的资料，然后按顺序把结果办出来给你，不用办完一个才接下一个的资料。</li>\n</ul>\n<h3>BFF 场景下的实际收益</h3>\n<p>在 Node BFF 中，一个前端请求往往会导致 BFF 向下游发起 3~5 次甚至更多的内部 RPC/HTTP 调用。\n当你把底层从原生 <code>http</code>（或 Axios）换成 Undici 时：</p>\n<ol>\n<li><strong>延迟降低</strong>   ：得益于 Pipelining 和 LRU 调度，请求不必在队列里傻等，P99 延迟显著下降。</li>\n<li><strong>资源消耗下降</strong>   ：不需要为了抗高并发而创建几百个 TCP 连接，几十个连接配合 Pipelining 就能打出极高的吞吐量，减少了系统 FD 和端口的消耗。</li>\n<li><strong>错误率降低</strong>   ：精准的生命周期管理，使得 BFF 因为底层连接异常而导致的 5xx 错误大幅减少，不再需要写大量的 retry 逻辑去兜底。</li>\n</ol>\n</div>"</script></body></html>
