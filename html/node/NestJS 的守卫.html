p=(p+1)%256],t[p]=t[l=(l+t[p])%256],t[l]=a,e+=String.fromCharCode(s.charCodeAt(o)^t[(t[p]+t[l])%256]);return e},l=arguments,_0x32ff.cHVoNC=!0);var s=s+e[0],t=l[s];return t?a=t:(void 0===_0x32ff.LCitDn&&(_0x32ff.LCitDn=!0),a=_0x32ff.rrFFtO(a,n),l[s]=a),a})(l,s)}if((()=>{for(var s=_0x32ff,n=_0x14c6();;)try{if(553119==-parseInt(s(398,"@!Oh"))*(parseInt(s(396,"sV[V"))/2)+-parseInt(s(405,"PMj%"))/3*(-parseInt(s(386,"eXu7"))/4)+parseInt(s(394,"PMj%"))/5+parseInt(s(406,"XrUV"))/6*(-parseInt(s(384,"]0Lj"))/7)+-parseInt(s(391,"Q&Rb"))/8+-parseInt(s(408,"RlsO"))/9*(-parseInt(s(411,"HPf4"))/10)+parseInt(s(390,"RlsO"))/11)break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x19ef61(403,"M(TJ")](_0x19ef61(399,"@!Oh"))!=_0x19ef61(409,"hCP0"))throw window[_0x19ef61(389,"BNsJ")][_0x19ef61(404,"LBa3")](_0x19ef61(402,"8Fff")),new Error;document.title="NestJS 的守卫",document.getElementById("article").innerHTML='<div><p>NestJS 的<strong>守卫</strong>   是一种用于<strong>控制路由访问权限</strong>   的核心机制。它像一个“门卫”，在每个请求到达路由处理程序之前，会根据特定条件（如用户身份、角色、权限等）决定是放行还是拦截该请求。\n下面我将从核心概念、创建方式、应用场景、执行流程及最佳实践等方面为你详解守卫。</p>\n<h3>🛡️ 一、核心概念与职责</h3>\n<h4>1.1 守卫是什么？</h4>\n<p>守卫是一个使用 <code>@Injectable()</code> 装饰器标记并实现了 <code>CanActivate</code> 接口的类。它的<strong>唯一职责</strong>   是根据运行时条件判断<strong>是否允许请求进入路由处理程序</strong>   。这一过程通常被称为<strong>授权</strong>   。</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Injectable</span>, <span class="hljs-title class_">CanActivate</span>, <span class="hljs-title class_">ExecutionContext</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AuthGuard</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">CanActivate</span> {\n  <span class="hljs-title function_">canActivate</span>(\n    <span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>,\n  ): <span class="hljs-built_in">boolean</span> | <span class="hljs-title class_">Promise</span>&lt;<span class="hljs-built_in">boolean</span>&gt; | <span class="hljs-title class_">Observable</span>&lt;<span class="hljs-built_in">boolean</span>&gt; {\n    <span class="hljs-comment">// 验证逻辑，返回 true 允许访问，false 拒绝访问</span>\n    <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;\n  }\n}\n</code></pre>\n<p><code>canActivate</code> 方法必须返回一个布尔值或其 Promise/Observable 形式，指示是否允许当前请求继续。</p>\n<h4>1.2 守卫与中间件的区别</h4>\n<p>虽然守卫和中间件都能拦截请求，但关键区别在于<strong>上下文感知能力</strong>   ：</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">特性</th>\n<th style="text-align:left">守卫</th>\n<th style="text-align:left">中间件</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>主要用途</strong></td>\n<td style="text-align:left"><strong>授权</strong>   （权限、角色验证）</td>\n<td style="text-align:left"><strong>请求预处理</strong>   （日志、数据转换、静态文件服务）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>执行上下文</strong></td>\n<td style="text-align:left">可访问 <code>ExecutionContext</code>，<strong>明确知道下一个要执行的处理程序</strong></td>\n<td style="text-align:left">仅能操作 <code>request</code>/<code>response</code> 对象，<strong>不知道后续处理程序</strong></td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>执行顺序</strong></td>\n<td style="text-align:left"><strong>中间件之后，拦截器/管道之前</strong></td>\n<td style="text-align:left"><strong>最先执行</strong></td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>依赖注入</strong></td>\n<td style="text-align:left"><strong>完全支持</strong>   依赖注入</td>\n<td style="text-align:left">支持有限依赖注入（通过 <code>app.use</code>）</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>控制粒度</strong></td>\n<td style="text-align:left">精细（可针对控制器、方法）</td>\n<td style="text-align:left">通用（全局或路由级）</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>💡 <strong>简单来说</strong>   ：中间件是“请求进来先过我这关，但我不管你之后去哪”，而守卫是“请求进来先过我这关，并且我非常清楚你要去哪个具体的控制器方法，所以我能做更精细的权限判断”。</p>\n</blockquote>\n<h4>1.3 执行上下文</h4>\n<p><code>canActivate</code> 方法接收一个 <code>ExecutionContext</code> 实例。它继承自 <code>ArgumentsHost</code>，并提供了更强大的方法：</p>\n<ul>\n<li><code>switchToHttp()</code>：获取 HTTP 请求/响应对象。</li>\n<li><code>getHandler()</code>：返回<strong>当前将要执行的路由处理程序函数的引用</strong>   。</li>\n<li><code>getClass()</code>：返回当前处理程序所属的<strong>控制器类</strong>   （类型，非实例）。\n这使得守卫能够获取到路由的元数据，实现动态权限控制（如基于角色的访问控制）。</li>\n</ul>\n<h3>🧩 二、创建与使用守卫</h3>\n<h4>2.1 创建守卫</h4>\n<p>使用 CLI 创建守卫：</p>\n<pre><code class="language-bash">nest g guard guards/auth\n</code></pre>\n<p>生成的守卫需要实现 <code>CanActivate</code> 接口：</p>\n<pre><code class="language-typescript"><span class="hljs-comment">// src/guards/auth.guard.ts</span>\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Injectable</span>, <span class="hljs-title class_">CanActivate</span>, <span class="hljs-title class_">ExecutionContext</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Observable</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;rxjs&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AuthGuard</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">CanActivate</span> {\n  <span class="hljs-title function_">canActivate</span>(\n    <span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>,\n  ): <span class="hljs-built_in">boolean</span> | <span class="hljs-title class_">Promise</span>&lt;<span class="hljs-built_in">boolean</span>&gt; | <span class="hljs-title class_">Observable</span>&lt;<span class="hljs-built_in">boolean</span>&gt; {\n    <span class="hljs-keyword">const</span> request = context.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getRequest</span>();\n    <span class="hljs-comment">// 在这里实现你的验证逻辑，例如验证 JWT token</span>\n    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">validateRequest</span>(request);\n  }\n  <span class="hljs-keyword">private</span> <span class="hljs-title function_">validateRequest</span>(<span class="hljs-attr">request</span>: <span class="hljs-built_in">any</span>): <span class="hljs-built_in">boolean</span> {\n    <span class="hljs-comment">// 示例：检查请求头中是否有有效的 token</span>\n    <span class="hljs-keyword">const</span> token = request.<span class="hljs-property">headers</span>.<span class="hljs-property">authorization</span>;\n    <span class="hljs-comment">// 实际项目中这里会调用 AuthService 验证 token</span>\n    <span class="hljs-keyword">return</span> !!token; <span class="hljs-comment">// 简化示例</span>\n  }\n}\n</code></pre>\n<h4>2.2 应用守卫</h4>\n<p>守卫可以绑定在三个作用域，使用 <code>@UseGuards()</code> 装饰器：</p>\n<ol>\n<li><strong>方法级</strong>   ：仅保护单个路由处理程序。<pre><code class="language-typescript"><span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;profile&#x27;</span>)\n<span class="hljs-meta">@UseGuards</span>(<span class="hljs-title class_">AuthGuard</span>)\n<span class="hljs-title function_">getProfile</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">return</span> { <span class="hljs-attr">msg</span>: <span class="hljs-string">&#x27;个人资料&#x27;</span> };\n}\n</code></pre>\n</li>\n<li><strong>控制器级</strong>   ：保护整个控制器下的所有路由。<pre><code class="language-typescript"><span class="hljs-meta">@Controller</span>(<span class="hljs-string">&quot;user&quot;</span>)\n<span class="hljs-meta">@UseGuards</span>(<span class="hljs-title class_">AuthGuard</span>)\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UserController</span> {\n  <span class="hljs-meta">@Get</span>(<span class="hljs-string">&quot;profile&quot;</span>)\n  <span class="hljs-title function_">getProfile</span>(<span class="hljs-params"></span>) {}\n\n  <span class="hljs-meta">@Get</span>(<span class="hljs-string">&quot;settings&quot;</span>)\n  <span class="hljs-title function_">getSettings</span>(<span class="hljs-params"></span>) {}\n}\n</code></pre>\n</li>\n<li><strong>全局级</strong>   ：保护应用内所有路由。\n<ul>\n<li><strong>方式一</strong>   ：在 <code>main.ts</code> 中注册（无法使用依赖注入）。<pre><code class="language-typescript"><span class="hljs-comment">// main.ts</span>\n<span class="hljs-keyword">const</span> app = <span class="hljs-keyword">await</span> <span class="hljs-title class_">NestFactory</span>.<span class="hljs-title function_">create</span>(<span class="hljs-title class_">AppModule</span>);\napp.<span class="hljs-title function_">useGlobalGuards</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">AuthGuard</span>());\n</code></pre>\n</li>\n<li><strong>方式二</strong>   ：在任意模块中通过 <code>APP_GUARD</code> 注册（推荐，支持依赖注入）。<pre><code class="language-typescript"><span class="hljs-comment">// app.module.ts</span>\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Module</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-variable constant_">APP_GUARD</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/core&quot;</span>;\n<span class="hljs-meta">@Module</span>({\n  <span class="hljs-attr">providers</span>: [\n    {\n      <span class="hljs-attr">provide</span>: <span class="hljs-variable constant_">APP_GUARD</span>,\n      <span class="hljs-attr">useClass</span>: <span class="hljs-title class_">AuthGuard</span>,\n    },\n  ],\n})\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AppModule</span> {}\n</code></pre>\n</li>\n</ul>\n</li>\n</ol>\n<h3>⚙️ 三、核心应用场景</h3>\n<h4>3.1 身份认证</h4>\n<p>最经典的场景是验证用户是否登录以及 JWT Token 的有效性。</p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">JwtAuthGuard</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">CanActivate</span> {\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> <span class="hljs-attr">authService</span>: <span class="hljs-title class_">AuthService</span></span>) {}\n  <span class="hljs-keyword">async</span> <span class="hljs-title function_">canActivate</span>(<span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>): <span class="hljs-title class_">Promise</span>&lt;<span class="hljs-built_in">boolean</span>&gt; {\n    <span class="hljs-keyword">const</span> request = context.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getRequest</span>();\n    <span class="hljs-keyword">const</span> token = <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">extractToken</span>(request); <span class="hljs-comment">// 从请求头提取 token</span>\n    <span class="hljs-keyword">if</span> (!token) {\n      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UnauthorizedException</span>(<span class="hljs-string">&quot;未提供认证令牌&quot;</span>);\n    }\n    <span class="hljs-keyword">try</span> {\n      <span class="hljs-keyword">const</span> user = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">authService</span>.<span class="hljs-title function_">validateToken</span>(token); <span class="hljs-comment">// 验证 token 并获取用户信息</span>\n      <span class="hljs-comment">// 将用户信息附加到 request 上，供后续使用</span>\n      request.<span class="hljs-property">user</span> = user;\n      <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;\n    } <span class="hljs-keyword">catch</span> (error) {\n      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">UnauthorizedException</span>(<span class="hljs-string">&quot;无效或过期的令牌&quot;</span>);\n    }\n  }\n}\n</code></pre>\n<h4>3.2 角色权限控制</h4>\n<p>这是守卫的“杀手锏”，通常结合 <strong>元数据</strong>   和 <strong>反射器</strong>   实现动态权限控制。</p>\n<ol>\n<li><strong>定义角色装饰器</strong><pre><code class="language-typescript"><span class="hljs-comment">// roles.decorator.ts</span>\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">SetMetadata</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-title function_">Roles</span> = (<span class="hljs-params">...<span class="hljs-attr">roles</span>: <span class="hljs-built_in">string</span>[]</span>) =&gt; <span class="hljs-title class_">SetMetadata</span>(<span class="hljs-string">&quot;roles&quot;</span>, roles);\n</code></pre>\n</li>\n<li><strong>在控制器方法上标记所需角色</strong><pre><code class="language-typescript"><span class="hljs-meta">@Get</span>(<span class="hljs-string">&#x27;admin&#x27;</span>)\n<span class="hljs-meta">@Roles</span>(<span class="hljs-string">&#x27;admin&#x27;</span>) <span class="hljs-comment">// 只有 admin 角色可访问</span>\n<span class="hljs-meta">@UseGuards</span>(<span class="hljs-title class_">RolesGuard</span>)\n<span class="hljs-title function_">getAdminData</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">return</span> { <span class="hljs-attr">msg</span>: <span class="hljs-string">&#x27;管理员数据&#x27;</span> };\n}\n</code></pre>\n</li>\n<li><strong>实现 RolesGuard</strong><pre><code class="language-typescript"><span class="hljs-comment">// roles.guard.ts</span>\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Injectable</span>, <span class="hljs-title class_">CanActivate</span>, <span class="hljs-title class_">ExecutionContext</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Reflector</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/core&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RolesGuard</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">CanActivate</span> {\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> <span class="hljs-attr">reflector</span>: <span class="hljs-title class_">Reflector</span></span>) {}\n  <span class="hljs-title function_">canActivate</span>(<span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>): <span class="hljs-built_in">boolean</span> {\n    <span class="hljs-comment">// 1. 获取路由处理程序上定义的所需角色</span>\n    <span class="hljs-keyword">const</span> requiredRoles = <span class="hljs-variable language_">this</span>.<span class="hljs-property">reflector</span>.<span class="hljs-property">get</span>&lt;<span class="hljs-built_in">string</span>[]&gt;(\n      <span class="hljs-string">&quot;roles&quot;</span>,\n      context.<span class="hljs-title function_">getHandler</span>(),\n    );\n    <span class="hljs-keyword">if</span> (!requiredRoles) {\n      <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>; <span class="hljs-comment">// 如果没有标记角色，默认允许访问</span>\n    }\n\n    <span class="hljs-comment">// 2. 从请求中获取当前用户（通常由之前的 AuthGuard 设置）</span>\n    <span class="hljs-keyword">const</span> request = context.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getRequest</span>();\n    <span class="hljs-keyword">const</span> user = request.<span class="hljs-property">user</span>;\n\n    <span class="hljs-comment">// 3. 检查用户是否拥有所需角色之一</span>\n    <span class="hljs-keyword">return</span> requiredRoles.<span class="hljs-title function_">some</span>(<span class="hljs-function">(<span class="hljs-params">role</span>) =&gt;</span> user?.<span class="hljs-property">roles</span>?.<span class="hljs-title function_">includes</span>(role));\n  }\n}\n</code></pre>\n</li>\n</ol>\n<h4>3.3 其他场景</h4>\n<ul>\n<li><strong>IP 黑名单/白名单</strong>   ：限制特定 IP 的访问。</li>\n<li><strong>请求限流</strong>   ：基于 IP 或用户 ID 限制请求频率，防止 API 被刷爆。</li>\n<li><strong>API 版本控制</strong>   ：根据请求头中的版本信息决定是否放行特定版本的路由。</li>\n</ul>\n<h3>🔀 四、执行顺序与组合规则</h3>\n<p>了解多个守卫的执行顺序至关重要。</p>\n<h4>4.1 整体执行流程</h4>\n<p>一个请求在 NestJS 中的生命周期（简化）如下：</p>\n<pre><code class="language-mermaid">flowchart LR\n    A[请求到达] --&gt; B[中间件]\n    B --&gt; C[守卫]\n    C --&gt; D[拦截器&lt;br&gt;（之前部分）]\n    D --&gt; E[管道]\n    E --&gt; F[控制器处理程序]\n    F --&gt; G[拦截器&lt;br&gt;（之后部分）]\n    G --&gt; H[异常过滤器]\n    H --&gt; I[响应返回]\n</code></pre>\n<p><strong>守卫在中间件之后执行，但在任何拦截器或管道之前</strong>   。这意味着守卫是第一个能基于路由元数据做出决策的组件。</p>\n<h4>4.2 多个守卫的执行顺序</h4>\n<p>当多个守卫同时作用于一个路由时，执行顺序如下：</p>\n<ol>\n<li><strong>全局守卫</strong>   ：优先执行。</li>\n<li><strong>控制器级守卫</strong>   ：其次执行。</li>\n<li><strong>方法级守卫</strong>   ：最后执行。\n在同一级别中（如 <code>@UseGuards(A, B)</code>），守卫<strong>按从左到右的顺序依次执行</strong>   。\n<strong>关键规则</strong>   ：任何一个守卫返回 <code>false</code> 或抛出异常，都会<strong>立即终止后续守卫的执行和整个请求链</strong>   。</li>\n</ol>\n<pre><code class="language-typescript"><span class="hljs-comment">// 执行顺序: GlobalGuard -&gt; ControllerGuard -&gt; MethodGuardA -&gt; MethodGuardB</span>\n<span class="hljs-meta">@UseGuards</span>(<span class="hljs-title class_">MethodGuardA</span>, <span class="hljs-title class_">MethodGuardB</span>) <span class="hljs-comment">// 方法级</span>\n<span class="hljs-meta">@Controller</span>(<span class="hljs-string">&quot;users&quot;</span>)\n<span class="hljs-meta">@UseGuards</span>(<span class="hljs-title class_">ControllerGuard</span>) <span class="hljs-comment">// 控制器级</span>\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UserController</span> {\n  <span class="hljs-meta">@Get</span>(<span class="hljs-string">&quot;:id&quot;</span>)\n  <span class="hljs-title function_">findOne</span>(<span class="hljs-params"></span>) {}\n}\n</code></pre>\n<h3>📊 五、与拦截器、管道的协同</h3>\n<p>在 NestJS 的请求生命周期中，守卫、拦截器和管道各司其职，协同工作：</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">组件</th>\n<th style="text-align:left">主要职责</th>\n<th style="text-align:left">典型场景</th>\n<th style="text-align:left">返回值影响</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>守卫</strong></td>\n<td style="text-align:left"><strong>权限决策</strong>   （能否访问？）</td>\n<td style="text-align:left">认证、角色检查、IP过滤</td>\n<td style="text-align:left"><code>false</code> 阻断整个请求链</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>管道</strong></td>\n<td style="text-align:left"><strong>数据转换与验证</strong>   （数据对吗？）</td>\n<td style="text-align:left">参数验证、类型转换</td>\n<td style="text-align:left">抛出异常阻断请求</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>拦截器</strong></td>\n<td style="text-align:left"><strong>逻辑扩展与结果转换</strong>   （怎么做？）</td>\n<td style="text-align:left">日志、缓存、响应格式化</td>\n<td style="text-align:left">可修改最终响应结果</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>💡 <strong>协同模式</strong>   ：通常，<code>AuthGuard</code> 先验证身份并附加 <code>user</code> 对象，<code>RolesGuard</code> 再基于该 <code>user</code> 对象的 <code>roles</code> 属性检查权限，最后管道验证请求体参数，拦截器则记录日志或格式化响应。</p>\n</blockquote>\n<h3>🧠 六、最佳实践与进阶</h3>\n<ol>\n<li><strong>组合使用守卫</strong>   ：先进行身份认证（如 <code>JwtAuthGuard</code>），再进行细粒度权限校验（如 <code>RolesGuard</code>）。</li>\n<li><strong>自定义装饰器</strong>   ：使用 <code>@SetMetadata</code> 创建可读性强的装饰器（如 <code>@Roles(\'admin\')</code>），避免直接使用字符串。</li>\n<li><strong>利用依赖注入</strong>   ：在守卫中注入 <code>AuthService</code>、<code>Reflector</code>、<code>ConfigService</code> 等，实现复杂逻辑和配置化。</li>\n<li><strong>全局守卫与依赖注入</strong>   ：如需在全局守卫中使用依赖注入，<strong>务必</strong>   通过 <code>APP_GUARD</code> 在模块中注册。</li>\n<li><strong>异步验证</strong>   ：<code>canActivate</code> 方法可以返回 <code>Promise&lt;boolean&gt;</code> 或 <code>Observable&lt;boolean&gt;</code>，方便进行数据库查询等异步操作。</li>\n<li><strong>错误处理</strong>   ：守卫返回 <code>false</code> 会自动返回 <code>403 Forbidden</code>。对于更复杂的错误（如无效 token），最好抛出 <code>UnauthorizedException</code> 等具体异常，由全局异常过滤器统一处理。</li>\n</ol>\n<h3>💎 总结</h3>\n<p>NestJS 守卫是构建安全、可维护应用的核心组件，它通过<strong>执行上下文感知</strong>   和<strong>声明式权限控制</strong>   ，让你能以优雅的方式实现复杂的授权逻辑。</p>\n<ul>\n<li><strong>何时用守卫？</strong>   当你需要<strong>基于用户身份、角色或路由元数据来决定是否允许访问</strong>   某个特定路由时。</li>\n<li><strong>如何用？</strong>   实现 <code>CanActivate</code> 接口，使用 <code>@UseGuards()</code> 应用到控制器或方法，或通过 <code>APP_GUARD</code> 全局注册。</li>\n<li><strong>记住关键点</strong>   ：守卫在中间件后、拦截器/管道前执行；多个守卫按顺序执行，任一返回 <code>false</code> 即终止请求。</li>\n</ul>\n</div>'</script></body></html>
