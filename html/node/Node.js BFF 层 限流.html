<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="../../css/github-markdown.min.css"><link rel="stylesheet" href="../../css/github.min.css"><style>body,html{margin:0;padding:0}.markdown-body{box-sizing:border-box;min-width:200px;max-width:980px;margin:0 auto!important;padding:45px 15px}.markdown-body pre{border:1px solid #e5e5e5!important;margin-top:var(--base-size-16)!important}</style></head><body><article id="article" class="markdown-body"></article><script>function _0x43c7(e,s){var t=_0x5efe();return(_0x43c7=function(s,n){var a=t[s-=199];void 0===_0x43c7.QFPaxw&&(_0x43c7.kOEXUr=function(s,n){var a,l=[],e=0,t="";for(s=(s=>{for(var n,a,l="",e="",t=0,p=0;a=s.charAt(p++);~a&&(n=t%4?64*n+a:a,t++%4)&&(l+=String.fromCharCode(255&n>>(-2*t&6))))a="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=".indexOf(a);for(var c=0,r=l.length;c<r;c++)e+="%"+("00"+l.charCodeAt(c).toString(16)).slice(-2);return decodeURIComponent(e)})(s),p=0;p<256;p++)l[p]=p;for(p=0;p<256;p++)e=(e+l[p]+n.charCodeAt(p%n.length))%256,a=l[p],l[p]=l[e],l[e]=a;for(var p=0,e=0,c=0;c<s.length;c++)a=l[p=(p+1)%256],l[p]=l[e=(e+l[p])%256],l[e]=a,t+=String.fromCharCode(s.charCodeAt(c)^l[(l[p]+l[e])%256]);return t},e=arguments,_0x43c7.QFPaxw=!0);var s=s+t[0],l=e[s];return l?a=l:(void 0===_0x43c7.sgRbYq&&(_0x43c7.sgRbYq=!0),a=_0x43c7.kOEXUr(a,n),e[s]=a),a})(e,s)}var _0x46ed2c=_0x43c7;if((()=>{for(var s=_0x43c7,n=_0x5efe();;)try{if(422858==+parseInt(s(199,"D$fY"))*(-parseInt(s(226,"28Ng"))/2)+-parseInt(s(220,"1bFg"))/3*(-parseInt(s(214,"8ILd"))/4)+parseInt(s(228,"wV&H"))/5*(parseInt(s(218,"wV&H"))/6)+-parseInt(s(208,"hX%D"))/7*(-parseInt(s(201,"VCyM"))/8)+parseInt(s(217,"4c50"))/9+parseInt(s(219,"kd)y"))/10+-parseInt(s(225,"]QQ5"))/11*(parseInt(s(215,"cMuV"))/12))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x46ed2c(206,"c*J#")](_0x46ed2c(202,"RM!u"))!=_0x46ed2c(200,"a%vK"))throw window[_0x46ed2c(224,"1bFg")][_0x46ed2c(221,"sERJ")](_0x46ed2c(203,"C0He")),new Error;function _0x5efe(){var s=["ASokrtVcJ0VdHa55uSker8od","WRxcPSklhSkkWR/dT8kRW6VcUCoxWOu","W7dcTYZdN8kBpmkp","jfldOtetWPCH","WRFdPNGOWPalWQHjW40zsSoLW6a","W6JdU8oEs8ogW6xdISkW","q8kut8o/W69MkvSWEuJdH8oG","WPVdHmoxWQpcHNRcGb/cGCodg8ky","igRcO8kFe8kCys7dRIldTY8","mCkdcmkyf0VcP0C8W6ldLMhcTq","vvuYoYBdLxG","s8kkn8obDq","WOFdRCoLW5i6WQCVCmoXCG","W7iye8oabmkPqSoOW6y","WQFdL8k5W4NdLfJdTXaPdvFcKCozzmkpgeBcHmkssHNcRSkwWO0YAq","iMBdQXjAoWNdGNldLmkHtG","W4qRs17cG8oVq2FdISoS","EbZdNSkUzYNcNW","W5tdHf7dUZddPIK","z8kDDmo7g8kXWOrXWQVdTG","mJCNW4yKmJGarmowWOZcOG","ANRdTN0VWOldRCoEsCkW","WOhdQCkRWOirWRy5tW","iwddQbfAovNdSNRdH8kMsNm","WOhcV8olbwa6W7uh","W4HUFNhdI8osW7ra","tMFdRfyLWQKWAq","zgdcUmkhW6hdI0RcPZjTWPPoW50","WRFdPhWHWP8aW4DNW5yOxmom","nSo4smoowrVdLa"];return(_0x5efe=function(){return s})()}document.title="Node.js BFF 层 限流",document.getElementById("article").innerHTML='<div><p>在 Node.js BFF 层做限流，和在后端微服务层做限流，侧重点是不同的。\n后端微服务限流是为了**“保命”**   （防止数据库被打爆、CPU被打满）；而 BFF 层限流更多是为了**“保体验”**   和**“防恶意”**   ，确保合法用户能拿到核心数据，剔除恶意爬虫或突发流量，防止 BFF 把压力传导给后端微服务。\n在 Node.js 单线程、异步非阻塞的模型下，我们不能像 Java 那样简单地用 <code>AtomicInteger</code> 做内存计数。以下是 Node BFF 层做限流的完整攻略，从简单到生产级方案。</p>\n<hr>\n<h3>一、 先定策略：BFF 限什么流？</h3>\n<p>在写代码之前，必须先确定限流维度。BFF 通常面向“用户”和“设备”，常见维度：</p>\n<ol>\n<li><strong>全局限流</strong>   ：整个 BFF 集群最多承受 10,000 QPS。超了直接 503，保护后端微服务总入口。</li>\n<li><strong>用户级限流 (User ID)</strong>   ：普通用户每分钟最多请求 60 次，防止恶意刷接口。</li>\n<li><strong>IP 限流</strong>   ：针对未登录状态（如登录、注册、短信发送接口），防机器人。</li>\n<li><strong>接口级限流</strong>   ：某个极其消耗资源的聚合接口（如首页多路聚合），单独限制并发或 QPS。</li>\n</ol>\n<hr>\n<h3>二、 单机内存限流（仅限单实例或测试环境）</h3>\n<p>如果你的 BFF 只部署了一个实例，或者流量极小，可以使用基于内存的算法。最推荐的是<strong>滑动窗口算法</strong>   。\n在 Node.js 中，不要自己手写定时器去清零计数器，极其不准。推荐使用成熟库：<code>rolling-rate-limiter</code> 或基于 Redis 的轻量封装。</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> <span class="hljs-title class_">RateLimiter</span> = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;rolling-rate-limiter&quot;</span>);\n<span class="hljs-keyword">const</span> limiter = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RateLimiter</span>({\n  <span class="hljs-comment">// 窗口内最大请求数</span>\n  <span class="hljs-attr">limit</span>: <span class="hljs-number">10</span>,\n  <span class="hljs-comment">// 窗口时间</span>\n  <span class="hljs-attr">interval</span>: <span class="hljs-number">1000</span>, <span class="hljs-comment">// 1秒内最多10个请求</span>\n});\napp.<span class="hljs-title function_">use</span>(<span class="hljs-function">(<span class="hljs-params">req, res, next</span>) =&gt;</span> {\n  <span class="hljs-comment">// 用 IP 或 userId 作为 key</span>\n  <span class="hljs-keyword">const</span> key = req.<span class="hljs-property">ip</span>;\n  limiter.<span class="hljs-title function_">limit</span>(key, <span class="hljs-function">(<span class="hljs-params">err, timeLeft</span>) =&gt;</span> {\n    <span class="hljs-keyword">if</span> (timeLeft &gt; <span class="hljs-number">0</span>) {\n      <span class="hljs-comment">// 被限流了</span>\n      res.<span class="hljs-title function_">setHeader</span>(<span class="hljs-string">&quot;Retry-After&quot;</span>, <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">ceil</span>(timeLeft / <span class="hljs-number">1000</span>));\n      <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">429</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;请求过于频繁，请稍后再试&quot;</span> });\n    }\n    <span class="hljs-comment">// 放行</span>\n    <span class="hljs-title function_">next</span>();\n  });\n});\n</code></pre>\n<h2><strong>致命缺点</strong>   ：Node.js 是无状态的。如果你在 K8s 上起了 5 个 BFF Pod，内存限流相当于把阈值放大了 5 倍（每个 Pod 都允许 10 QPS，总共就是 50 QPS），根本起不到全局限制的作用。</h2>\n<h3>三、 生产级标准方案：Redis + 分布式限流</h3>\n<p>在多实例部署的生产环境，<strong>必须使用集中式存储（Redis）来共享计数状态。</strong><br>\n不要自己写 Lua 脚本，直接用 Node.js 生态中最著名、最稳健的库：<strong><code>rate-limiter-flexible</code></strong>   。\n这个库极其强大，支持滑动窗口、固定窗口、令牌桶，且内置了防止 Redis 网络延迟导致的并发漏洞（原子操作）。</p>\n<h4>实战示例：按 User ID 限制每分钟 60 次</h4>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">RateLimiterRedis</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;rate-limiter-flexible&quot;</span>);\n<span class="hljs-keyword">const</span> <span class="hljs-title class_">Redis</span> = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;ioredis&quot;</span>);\n<span class="hljs-keyword">const</span> redisClient = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Redis</span>({ <span class="hljs-attr">enableOfflineQueue</span>: <span class="hljs-literal">false</span> });\n<span class="hljs-comment">// 1. 创建限流器实例</span>\n<span class="hljs-keyword">const</span> rateLimiter = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RateLimiterRedis</span>({\n  <span class="hljs-attr">storeClient</span>: redisClient,\n  <span class="hljs-attr">keyPrefix</span>: <span class="hljs-string">&quot;bff_user_limit&quot;</span>, <span class="hljs-comment">// Redis key 前缀</span>\n  <span class="hljs-attr">points</span>: <span class="hljs-number">60</span>, <span class="hljs-comment">// 最大请求数 (相当于令牌数)</span>\n  <span class="hljs-attr">duration</span>: <span class="hljs-number">60</span>, <span class="hljs-comment">// 时间窗口 (秒)，即 60秒内耗尽60个点</span>\n  <span class="hljs-attr">blockDuration</span>: <span class="hljs-number">60</span>, <span class="hljs-comment">// 如果超限，封禁60秒 (即使窗口滑过也不放行)</span>\n});\n<span class="hljs-comment">// 2. 写成 Koa/Express 中间件</span>\n<span class="hljs-keyword">const</span> <span class="hljs-title function_">userRateLimiter</span> = <span class="hljs-keyword">async</span> (<span class="hljs-params">req, res, next</span>) =&gt; {\n  <span class="hljs-keyword">const</span> userId = req.<span class="hljs-property">user</span>?.<span class="hljs-property">id</span> || req.<span class="hljs-property">ip</span>; <span class="hljs-comment">// 优先取用户ID，未登录取IP</span>\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-comment">// 消耗 1 个点</span>\n    <span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> rateLimiter.<span class="hljs-title function_">consume</span>(userId);\n\n    <span class="hljs-comment">// 可选：在响应头中返回剩余配额，对前端友好</span>\n    res.<span class="hljs-title function_">setHeader</span>(<span class="hljs-string">&quot;X-RateLimit-Remaining&quot;</span>, result.<span class="hljs-property">remainingPoints</span>);\n    res.<span class="hljs-title function_">setHeader</span>(\n      <span class="hljs-string">&quot;X-RateLimit-Reset&quot;</span>,\n      <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(<span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>() + result.<span class="hljs-property">msBeforeNext</span>).<span class="hljs-title function_">toISOString</span>(),\n    );\n    <span class="hljs-title function_">next</span>();\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-comment">// 被限流了</span>\n    <span class="hljs-keyword">const</span> secs = <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">round</span>(err.<span class="hljs-property">msBeforeNext</span> / <span class="hljs-number">1000</span>) || <span class="hljs-number">1</span>;\n    res.<span class="hljs-title function_">setHeader</span>(<span class="hljs-string">&quot;Retry-After&quot;</span>, secs);\n    <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">429</span>).<span class="hljs-title function_">json</span>({\n      <span class="hljs-attr">code</span>: <span class="hljs-number">429</span>,\n      <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;操作太频繁，请休息一下&quot;</span>,\n    });\n  }\n};\n<span class="hljs-comment">// 3. 应用到特定路由</span>\napp.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/api/home&quot;</span>, userRateLimiter, homeController);\n</code></pre>\n<hr>\n<h3>四、 区分层级：全局限流 vs 用户限流</h3>\n<p>在一个健壮的 BFF 中，通常会有两道限流锁：</p>\n<ol>\n<li><strong>网关层全局限流</strong>   ：我们在上一个问题讨论的 Nginx/Kong 层，限制总 QPS。</li>\n<li><strong>BFF 层精细化限流</strong>   ：基于 <code>rate-limiter-flexible</code>，针对具体的业务逻辑。\n<strong>进阶玩法：分层降级</strong><br>\n对于核心接口（如支付、下单），限流阈值可以设得很高；对于非核心接口（如推荐、评论），阈值设低。当 Redis 压力大时，BFF 甚至可以主动降低非核心接口的配额，把资源让给核心链路。</li>\n</ol>\n<hr>\n<h3>五、 最容易被忽略的限流：并发限流（前面讨论的隔离）</h3>\n<p>QPS 限流防的是“请求太快”，但防不住**“请求太慢”**   。\n如果微服务变慢，原本 50ms 的请求变成了 5s。虽然 QPS 没超限，但由于请求堆积，BFF 会有大量未完成的异步调用，最终耗尽 Node.js 的内存或底层 Socket 连接。\n所以，BFF 的限流体系必须是：<strong>QPS限流 + 并发限流（Bulkhead 隔板）</strong><br>\n使用前面讨论过的 <code>cockatiel</code> 库：</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> { <span class="hljs-title class_">Policy</span> } = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;cockatiel&quot;</span>);\n<span class="hljs-comment">// 限制调用推荐服务的最大并发数为 20</span>\n<span class="hljs-keyword">const</span> bulkhead = <span class="hljs-title class_">Policy</span>.<span class="hljs-title function_">bulkhead</span>(<span class="hljs-number">20</span>, <span class="hljs-number">10</span>); <span class="hljs-comment">// 20执行，10排队</span>\n<span class="hljs-comment">// 结合 Redis QPS 限流 + 并发限流</span>\napp.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/api/recommend&quot;</span>, redisRateLimiter, <span class="hljs-title function_">async</span> (req, res) =&gt; {\n  <span class="hljs-keyword">try</span> {\n    <span class="hljs-comment">// 先过 QPS 限流 -&gt; 再过并发隔离</span>\n    <span class="hljs-keyword">const</span> data = <span class="hljs-keyword">await</span> bulkhead.<span class="hljs-title function_">execute</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">callRecommendService</span>(req.<span class="hljs-property">userId</span>));\n    res.<span class="hljs-title function_">json</span>(data);\n  } <span class="hljs-keyword">catch</span> (err) {\n    <span class="hljs-keyword">if</span> (err.<span class="hljs-property">message</span>.<span class="hljs-title function_">includes</span>(<span class="hljs-string">&quot;Bulkhead rejected&quot;</span>)) {\n      <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">status</span>(<span class="hljs-number">503</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;推荐服务拥挤&quot;</span> });\n    }\n    <span class="hljs-comment">// ...</span>\n  }\n});\n</code></pre>\n<hr>\n<h3>六、 终极拷问：如果 Redis 挂了，BFF 还限流吗？</h3>\n<p>这是一个经典的生产故障点。如果 BFF 依赖 Redis 做限流，Redis 雪崩宕机了，BFF 怎么办？\n通常有两种策略，取决于你的业务属性：</p>\n<ol>\n<li><strong>Fail-Open（熔断放行）</strong>   ：Redis 连不上，默认放行。<strong>适用于核心链路</strong>   （如支付），不能因为限流系统挂了导致用户付不了款。</li>\n<li><strong>Fail-Close（熔断拒绝）</strong>   ：Redis 连不上，全部 429。<strong>适用于防刷场景</strong>   （如秒杀、发券），不能因为限流挂了导致资产被刷光。\n<code>rate-limiter-flexible</code> 提供了 <code>insuranceLimiter</code> 机制，主 Redis 挂了，自动降级到备用的内存限流器，非常实用：</li>\n</ol>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> {\n  <span class="hljs-title class_">RateLimiterRedis</span>,\n  <span class="hljs-title class_">RateLimiterMemory</span>,\n} = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;rate-limiter-flexible&quot;</span>);\n<span class="hljs-comment">// 主限流器：用 Redis</span>\n<span class="hljs-keyword">const</span> redisLimiter = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RateLimiterRedis</span>({\n  <span class="hljs-comment">/* config */</span>\n});\n<span class="hljs-comment">// 兜底限流器：用内存 (阈值可以稍微放大一点，因为多 Pod 会放大阈值)</span>\n<span class="hljs-keyword">const</span> memoryLimiter = <span class="hljs-keyword">new</span> <span class="hljs-title class_">RateLimiterMemory</span>({ <span class="hljs-attr">points</span>: <span class="hljs-number">20</span>, <span class="hljs-attr">duration</span>: <span class="hljs-number">60</span> });\n<span class="hljs-comment">// 绑定保险</span>\nredisLimiter.<span class="hljs-property">insuranceLimiter</span> = memoryLimiter;\n</code></pre>\n<h3>总结</h3>\n<p>在 Node BFF 层做限流：</p>\n<ol>\n<li><strong>单机方案不靠谱</strong>   ，必须上 <strong>Redis + <code>rate-limiter-flexible</code></strong>   做分布式 QPS 限流。</li>\n<li><strong>QPS 限流不够</strong>   ，必须配合 <code>cockatiel</code> 的 <strong>Bulkhead 并发隔离</strong>   ，防慢调用拖垮 BFF。</li>\n<li><strong>别忘了兜底</strong>   ，配置 Redis 不可用时的降级策略。</li>\n</ol>\n</div>'</script></body></html>
