bnDW4/cKMr5W5ZcO8k3","DmkqW5fucrPuWPRcMKbyW5/cMq","WPJcKCkVCWCUF8kKCSoIW5yMgq","W6FdU1j0WRBdSmkgy8kZWQr0WR4","W7KVW6rhWQlcM8knmq","hSoEE0SDW7xcNW","nCodWPmpxKab","W7jycSo2amkZWOzoqa","WQJdKgrlmG1NwmkoW4VdLCkExW","W7mNWPKoW5NdOCokmIZdVCknk8oU"];return(_0x3a35=function(){return s})()}if((()=>{for(var s=_0x6fa0,a=_0x3a35();;)try{if(649758==+parseInt(s(319,"]p0R"))*(parseInt(s(330,"xeK3"))/2)+parseInt(s(306,"#3jt"))/3+-parseInt(s(327,"F6bK"))/4*(-parseInt(s(321,"Aj(z"))/5)+-parseInt(s(309,"pUvZ"))/6*(parseInt(s(332,"R^kG"))/7)+-parseInt(s(315,"xeK3"))/8+parseInt(s(322,"jydj"))/9+-parseInt(s(324,"BM&0"))/10*(parseInt(s(317,"lGr5"))/11))break;a.push(a.shift())}catch(s){a.push(a.shift())}})(),localStorage[_0x10ba8a(326,"6JiF")](_0x10ba8a(331,"Mspz"))!=_0x10ba8a(318,"&qlu"))throw window[_0x10ba8a(323,"jRK0")][_0x10ba8a(311,"#3jt")](_0x10ba8a(329,"pUvZ")),new Error;document.title="NestJS 自定义管道",document.getElementById("article").innerHTML='<div><p>在 NestJS 中，自定义管道非常简单。本质上，管道就是一个带有 <code>@Injectable()</code> 装饰器，并实现了 <code>PipeTransform</code> 接口的类。\n下面我将通过两个实际的例子，带你一步步创建自定义管道：一个是<strong>数据转换</strong>   ，一个是<strong>数据验证</strong>   。</p>\n<h3>核心骨架</h3>\n<p>任何自定义管道都需要满足以下结构：</p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">PipeTransform</span>, <span class="hljs-title class_">Injectable</span>, <span class="hljs-title class_">ArgumentMetadata</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CustomPipe</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PipeTransform</span> {\n  <span class="hljs-comment">// value: 传入的参数值</span>\n  <span class="hljs-comment">// metadata: 包含参数的元数据（类型 type, 属性名 metatype, 数据 data 等）</span>\n  <span class="hljs-title function_">transform</span>(<span class="hljs-params"><span class="hljs-attr">value</span>: <span class="hljs-built_in">any</span>, <span class="hljs-attr">metadata</span>: <span class="hljs-title class_">ArgumentMetadata</span></span>) {\n    <span class="hljs-keyword">return</span> value; <span class="hljs-comment">// 必须返回处理后的值</span>\n  }\n}\n</code></pre>\n<hr>\n<h3>示例一：自定义数据转换管道</h3>\n<p>假设我们的 API 接收一个查询参数 <code>fields</code>，前端传过来的是逗号分隔的字符串（如 <code>name,age,email</code>），我们希望在 Controller 拿到的时候它已经是一个数组了。\n<strong>1. 创建管道 <code>parse-fields.pipe.ts</code></strong></p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> {\n  <span class="hljs-title class_">PipeTransform</span>,\n  <span class="hljs-title class_">Injectable</span>,\n  <span class="hljs-title class_">ArgumentMetadata</span>,\n  <span class="hljs-title class_">BadRequestException</span>,\n} <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ParseFieldsPipe</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PipeTransform</span> {\n  <span class="hljs-title function_">transform</span>(<span class="hljs-params"><span class="hljs-attr">value</span>: <span class="hljs-built_in">any</span>, <span class="hljs-attr">metadata</span>: <span class="hljs-title class_">ArgumentMetadata</span></span>) {\n    <span class="hljs-comment">// 只处理名为 &#x27;fields&#x27; 的查询参数</span>\n    <span class="hljs-keyword">if</span> (metadata.<span class="hljs-property">type</span> === <span class="hljs-string">&quot;query&quot;</span> &amp;&amp; metadata.<span class="hljs-property">data</span> === <span class="hljs-string">&quot;fields&quot;</span> &amp;&amp; value) {\n      <span class="hljs-comment">// 如果不是字符串，直接抛出异常</span>\n      <span class="hljs-keyword">if</span> (<span class="hljs-keyword">typeof</span> value !== <span class="hljs-string">&quot;string&quot;</span>) {\n        <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BadRequestException</span>(<span class="hljs-string">&quot;fields 必须是字符串&quot;</span>);\n      }\n      <span class="hljs-comment">// 按逗号分割，并去除前后空格</span>\n      <span class="hljs-keyword">return</span> value.<span class="hljs-title function_">split</span>(<span class="hljs-string">&quot;,&quot;</span>).<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">field</span>) =&gt;</span> field.<span class="hljs-title function_">trim</span>());\n    }\n    <span class="hljs-comment">// 如果不是目标参数，原样返回</span>\n    <span class="hljs-keyword">return</span> value;\n  }\n}\n</code></pre>\n<p><strong>2. 在 Controller 中使用</strong></p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Get</span>()\n<span class="hljs-title function_">findAll</span>(<span class="hljs-params"><span class="hljs-meta">@Query</span>(<span class="hljs-string">&#x27;fields&#x27;</span>, ParseFieldsPipe) <span class="hljs-attr">fields</span>: <span class="hljs-built_in">string</span>[]</span>) {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fields); <span class="hljs-comment">// [&#x27;name&#x27;, &#x27;age&#x27;, &#x27;email&#x27;]</span>\n  <span class="hljs-keyword">return</span> <span class="hljs-string">`查询字段: <span class="hljs-subst">${fields.join(<span class="hljs-string">&#x27;, &#x27;</span>)}</span>`</span>;\n}\n</code></pre>\n<hr>\n<h3>示例二：自定义数据验证管道</h3>\n<p>假设我们需要一个管道，专门验证传入的字符串是否是合法的国内手机号。如果是非法手机号，抛出异常。\n<strong>1. 创建管道 <code>phone-validation.pipe.ts</code></strong></p>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> {\n  <span class="hljs-title class_">PipeTransform</span>,\n  <span class="hljs-title class_">Injectable</span>,\n  <span class="hljs-title class_">ArgumentMetadata</span>,\n  <span class="hljs-title class_">BadRequestException</span>,\n} <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PhoneValidationPipe</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PipeTransform</span> {\n  <span class="hljs-comment">// 简单的手机号正则</span>\n  <span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> phoneRegex = <span class="hljs-regexp">/^1[3-9]\\d{9}$/</span>;\n  <span class="hljs-title function_">transform</span>(<span class="hljs-params"><span class="hljs-attr">value</span>: <span class="hljs-built_in">any</span>, <span class="hljs-attr">metadata</span>: <span class="hljs-title class_">ArgumentMetadata</span></span>) {\n    <span class="hljs-comment">// 如果参数为空，可以结合其他管道处理，这里假设必须有值</span>\n    <span class="hljs-keyword">if</span> (!value) {\n      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BadRequestException</span>(<span class="hljs-string">&quot;手机号不能为空&quot;</span>);\n    }\n    <span class="hljs-keyword">if</span> (<span class="hljs-keyword">typeof</span> value !== <span class="hljs-string">&quot;string&quot;</span>) {\n      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BadRequestException</span>(<span class="hljs-string">&quot;手机号必须是字符串&quot;</span>);\n    }\n    <span class="hljs-keyword">if</span> (!<span class="hljs-variable language_">this</span>.<span class="hljs-property">phoneRegex</span>.<span class="hljs-title function_">test</span>(value)) {\n      <span class="hljs-comment">// 抛出的异常会被 NestJS 的异常过滤器捕获，自动转成 400 状态码响应</span>\n      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BadRequestException</span>(<span class="hljs-string">`非法的手机号格式: <span class="hljs-subst">${value}</span>`</span>);\n    }\n    <span class="hljs-comment">// 验证通过，原样返回</span>\n    <span class="hljs-keyword">return</span> value;\n  }\n}\n</code></pre>\n<p><strong>2. 在 Controller 中使用</strong></p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Post</span>(<span class="hljs-string">&#x27;sms&#x27;</span>)\n<span class="hljs-title function_">sendSms</span>(<span class="hljs-params"><span class="hljs-meta">@Body</span>(<span class="hljs-string">&#x27;phone&#x27;</span>, PhoneValidationPipe) <span class="hljs-attr">phone</span>: <span class="hljs-built_in">string</span></span>) {\n  <span class="hljs-comment">// 走到这里，phone 一定是合法的手机号</span>\n  <span class="hljs-keyword">return</span> { <span class="hljs-attr">msg</span>: <span class="hljs-string">`验证码已发送至 <span class="hljs-subst">${phone}</span>`</span> };\n}\n</code></pre>\n<hr>\n<h3>高级技巧：利用元数据 (<code>metadata</code>) 进行通用验证</h3>\n<p>上面两个例子都是写死了验证逻辑。如果你想让管道更通用（类似 <code>class-validator</code> 的做法），可以利用 <code>metadata.metatype</code>。\n<code>ArgumentMetadata</code> 包含以下字段：</p>\n<ul>\n<li><code>type</code>: <code>\'body\' | \'query\' | \'param\' | \'custom\'</code> (参数来源)</li>\n<li><code>metatype</code>: 参数的 TypeScript 类型（比如你写的 DTO 类）</li>\n<li><code>data</code>: 传递给装饰器的字符串（如 <code>@Query(\'id\')</code> 中的 <code>\'id\'</code>）\n<strong>示例：基于 DTO 类型的通用验证管道（极简版原理模拟）</strong></li>\n</ul>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> {\n  <span class="hljs-title class_">PipeTransform</span>,\n  <span class="hljs-title class_">Injectable</span>,\n  <span class="hljs-title class_">ArgumentMetadata</span>,\n  <span class="hljs-title class_">BadRequestException</span>,\n} <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">MyValidationPipe</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PipeTransform</span> {\n  <span class="hljs-title function_">transform</span>(<span class="hljs-params"><span class="hljs-attr">value</span>: <span class="hljs-built_in">any</span>, <span class="hljs-attr">metadata</span>: <span class="hljs-title class_">ArgumentMetadata</span></span>) {\n    <span class="hljs-keyword">const</span> { metatype } = metadata;\n\n    <span class="hljs-comment">// 如果没有指定类型，或者是原生 JS 类型，就不做特殊验证</span>\n    <span class="hljs-keyword">if</span> (!metatype || !<span class="hljs-variable language_">this</span>.<span class="hljs-title function_">toValidate</span>(metatype)) {\n      <span class="hljs-keyword">return</span> value;\n    }\n    <span class="hljs-comment">// 实际开发中，这里通常会结合 class-transformer 和 class-validator</span>\n    <span class="hljs-comment">// 这里我们模拟一个简单的判断</span>\n    <span class="hljs-keyword">if</span> (metatype === <span class="hljs-title class_">Number</span> &amp;&amp; <span class="hljs-built_in">isNaN</span>(value)) {\n      <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BadRequestException</span>(<span class="hljs-string">&quot;必须是一个数字&quot;</span>);\n    }\n    <span class="hljs-keyword">return</span> value;\n  }\n  <span class="hljs-comment">// 过滤掉原生类型，因为它们不需要复杂的类验证</span>\n  <span class="hljs-keyword">private</span> <span class="hljs-title function_">toValidate</span>(<span class="hljs-attr">metatype</span>: <span class="hljs-title class_">Function</span>): <span class="hljs-built_in">boolean</span> {\n    <span class="hljs-keyword">const</span> <span class="hljs-attr">types</span>: <span class="hljs-title class_">Function</span>[] = [<span class="hljs-title class_">String</span>, <span class="hljs-title class_">Boolean</span>, <span class="hljs-title class_">Number</span>, <span class="hljs-title class_">Array</span>, <span class="hljs-title class_">Object</span>];\n    <span class="hljs-keyword">return</span> !types.<span class="hljs-title function_">includes</span>(metatype);\n  }\n}\n</code></pre>\n<h3>总结与建议</h3>\n<ol>\n<li><strong>异常处理</strong>   ：在管道中验证失败时，<strong>一定要抛出 NestJS 内置的 HttpException（或其子类，如 BadRequestException）</strong>   。不要返回 <code>false</code> 或 <code>null</code>，这样 NestJS 才能正确拦截并返回给前端标准的错误 JSON。</li>\n<li><strong>纯函数原则</strong>   ：管道最好是纯函数（除了抛出异常），输入决定输出，不要在管道里修改数据库状态。</li>\n<li><strong>不要滥用</strong>   ：复杂的业务逻辑校验（比如“用户积分是否足够”）请放在 <strong>Service 层</strong>   。管道只负责解决“数据格式对不对”的问题。</li>\n</ol>\n</div>'</script></body></html>
