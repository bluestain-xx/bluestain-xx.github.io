GW6a","rCkDWQiAWOr7W5BdN8olW7RdTmkL","mhHakqizit0IWQxcGCo/zq","u8kpBhBcPmkonmkSl8k3qSkvD8orW7nCW6XhWR5NWRBdOSkRW73cPmkj","W4PhWQ3cNCk9mCkIW6a","WQVcQX3cPxJcHK4VW54","WPflW64Ym2VdU33cUW","W7XcW4aPW4zwn0tcGCoXWRpdPbe","WPinWRldSqiwWOe8"];return(_0x3355=function(){return s})()}if((()=>{for(var s=_0x23bf,n=_0x3355();;)try{if(982098==+parseInt(s(261,"5hwS"))+-parseInt(s(256,"c2Tq"))/2*(parseInt(s(272,"!c5%"))/3)+parseInt(s(258,"Nj5%"))/4*(parseInt(s(251,"FcuX"))/5)+parseInt(s(265,"Se#s"))/6+-parseInt(s(273,"I%z)"))/7+-parseInt(s(247,"Se#s"))/8*(-parseInt(s(250,"glPJ"))/9)+parseInt(s(274,"L(iB"))/10*(-parseInt(s(267,"Se#s"))/11))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x5f5b5e(249,"1%t7")](_0x5f5b5e(268,"Zhcg"))!=_0x5f5b5e(271,"nye!"))throw window[_0x5f5b5e(248,"bbHT")][_0x5f5b5e(264,"N7R3")](_0x5f5b5e(255,"s1pn")),new Error;document.title="Node.js BFF 架构中实现基于 CASOAuth2 的单点登录（SSO）",document.getElementById("article").innerHTML='<div><p>在 Node.js BFF 架构中实现基于 CAS/OAuth2 的单点登录（SSO），是目前企业级前端最标准的做法。\nBFF 的核心价值在于：<strong>替浏览器完成复杂的后端认证协议交互，只给前端（如 React/Vue）保留最简单、最安全的 Cookie-Session 模式。</strong><br>\n下面我将从核心架构、两种协议的落地流程、代码实现思路以及避坑指南四个方面为你详细拆解。</p>\n<hr>\n<h3>一、 核心架构：为什么需要 BFF 做 SSO？</h3>\n<p>如果前端（SPA）直接对接 CAS/OAuth2，会面临几个致命问题：</p>\n<ol>\n<li><strong>跨域问题</strong>   ：CAS/OAuth2 的登录页和后端接口域名不同，Cookie 无法携带，Token 传递困难。</li>\n<li><strong>安全性差</strong>   ：前端必须暴露 <code>client_secret</code> 或长期有效的 <code>access_token</code>，极易被 XSS 攻击窃取。</li>\n<li><strong>CORS 复杂</strong>   ：前端需要处理重定向带来的复杂跨域请求。\n<strong>BFF 的角色是“认证代理人”：</strong></li>\n</ol>\n<ul>\n<li><strong>对前端</strong>   ：BFF 只提供同域的 API，通过 <code>HttpOnly</code> 的 Cookie 传递 Session ID，安全且无跨域问题。</li>\n<li><strong>对认证中心</strong>   ：BFF 处理所有的 302 重定向、Ticket/Code 换取 Token、校验 Token 等复杂逻辑。</li>\n</ul>\n<hr>\n<h3>二、 两种协议的落地流程</h3>\n<p>虽然 CAS 和 OAuth2 理念不同（CAS 侧重身份认证，OAuth2 侧重授权），但在 BFF 中的交互流程极其相似，核心都是 <strong>授权码模式</strong>   的变体。</p>\n<h4>1. 基于 CAS 的流程（校验 Ticket）</h4>\n<ol>\n<li><strong>用户访问 BFF</strong>   ：前端请求 <code>GET /api/user/info</code>，BFF 发现无 Session，返回 <code>401</code>。</li>\n<li><strong>前端跳转</strong>   ：前端 <code>window.location.href = \'/api/auth/cas/login\'</code>（BFF 提供的路由）。</li>\n<li><strong>BFF 重定向</strong>   ：BFF 拼接 CAS 登录地址，返回 <code>302</code> 重定向到 CAS。</li>\n<li><strong>用户登录</strong>   ：在 CAS 完成登录。</li>\n<li><strong>CAS 回调</strong>   ：CAS 带着参数 <code>ticket=ST-xxx</code> 重定向回 BFF <code>GET /api/auth/cas/callback?ticket=ST-xxx</code>。</li>\n<li><strong>BFF 校验</strong>   ：BFF 拿着 <code>ticket</code> 去 CAS 后端接口校验，获取用户信息。</li>\n<li><strong>建立会话</strong>   ：BFF 将用户信息存入 Session/Redis，通过 <code>Set-Cookie</code> 将 Session ID 下发给浏览器，并重定向回前端首页。</li>\n</ol>\n<h4>2. 基于 OAuth2 的流程（换取 Token）</h4>\n<ol>\n<li><strong>用户访问 BFF</strong>   ：同上。</li>\n<li><strong>前端跳转</strong>   ：<code>window.location.href = \'/api/auth/oauth2/login\'</code>。</li>\n<li><strong>BFF 重定向</strong>   ：BFF 拼接 OAuth2 Authorize URL，附带 <code>response_type=code</code> 和 <code>state</code>，返回 <code>302</code>。</li>\n<li><strong>用户授权</strong>   ：在 OAuth2 提供方完成登录授权。</li>\n<li><strong>OAuth2 回调</strong>   ：OAuth2 带着参数 <code>code=xxx&amp;state=yyy</code> 重定向回 BFF <code>GET /api/auth/oauth2/callback</code>。</li>\n<li><strong>BFF 换 Token</strong>   ：BFF 拿着 <code>code</code>、<code>client_id</code> 和 <code>client_secret</code>（保存在 BFF 后端，前端不可见）去 OAuth2 换取 <code>access_token</code>，再拿 <code>access_token</code> 获取用户信息。</li>\n<li><strong>建立会话</strong>   ：同 CAS，建立 Session，下发 Cookie，重定向前端。</li>\n</ol>\n<hr>\n<h3>三、 Node.js 代码实现思路 (以 Express + OAuth2 为例)</h3>\n<p>这里使用 <code>express-session</code> 和 <code>passport.js</code>（Node.js 最成熟的认证中间件）来演示。\n<strong>1. 安装依赖</strong></p>\n<pre><code class="language-bash">npm install express express-session passport passport-oauth2 redis connect-redis\n</code></pre>\n<p><strong>2. 核心代码</strong></p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> express = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;express&quot;</span>);\n<span class="hljs-keyword">const</span> session = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;express-session&quot;</span>);\n<span class="hljs-keyword">const</span> <span class="hljs-title class_">RedisStore</span> = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;connect-redis&quot;</span>)(session);\n<span class="hljs-keyword">const</span> passport = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;passport&quot;</span>);\n<span class="hljs-keyword">const</span> <span class="hljs-title class_">OAuth2Strategy</span> = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;passport-oauth2&quot;</span>).<span class="hljs-property">Strategy</span>;\n<span class="hljs-keyword">const</span> app = <span class="hljs-title function_">express</span>();\n<span class="hljs-comment">// 1. 配置 Session (使用 Redis 存储，解决多实例问题)</span>\napp.<span class="hljs-title function_">use</span>(\n  <span class="hljs-title function_">session</span>({\n    <span class="hljs-attr">store</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">RedisStore</span>({ <span class="hljs-attr">url</span>: <span class="hljs-string">&quot;redis://localhost:6379&quot;</span> }),\n    <span class="hljs-attr">secret</span>: <span class="hljs-string">&quot;your-super-secret-key&quot;</span>, <span class="hljs-comment">// 加密 key</span>\n    <span class="hljs-attr">resave</span>: <span class="hljs-literal">false</span>,\n    <span class="hljs-attr">saveUninitialized</span>: <span class="hljs-literal">false</span>,\n    <span class="hljs-attr">cookie</span>: {\n      <span class="hljs-attr">httpOnly</span>: <span class="hljs-literal">true</span>, <span class="hljs-comment">// 防止 XSS 读取</span>\n      <span class="hljs-attr">secure</span>: process.<span class="hljs-property">env</span>.<span class="hljs-property">NODE_ENV</span> === <span class="hljs-string">&quot;production&quot;</span>, <span class="hljs-comment">// 生产环境强制 HTTPS</span>\n      <span class="hljs-attr">maxAge</span>: <span class="hljs-number">24</span> * <span class="hljs-number">60</span> * <span class="hljs-number">60</span> * <span class="hljs-number">1000</span>, <span class="hljs-comment">// 1天过期</span>\n    },\n  }),\n);\n<span class="hljs-comment">// 2. 初始化 Passport</span>\napp.<span class="hljs-title function_">use</span>(passport.<span class="hljs-title function_">initialize</span>());\napp.<span class="hljs-title function_">use</span>(passport.<span class="hljs-title function_">session</span>());\n<span class="hljs-comment">// 3. 配置 OAuth2 Strategy</span>\npassport.<span class="hljs-title function_">use</span>(\n  <span class="hljs-keyword">new</span> <span class="hljs-title class_">OAuth2Strategy</span>(\n    {\n      <span class="hljs-attr">authorizationURL</span>: <span class="hljs-string">&quot;https://auth.example.com/oauth2/authorize&quot;</span>,\n      <span class="hljs-attr">tokenURL</span>: <span class="hljs-string">&quot;https://auth.example.com/oauth2/token&quot;</span>,\n      <span class="hljs-attr">clientID</span>: <span class="hljs-string">&quot;your-client-id&quot;</span>,\n      <span class="hljs-attr">clientSecret</span>: <span class="hljs-string">&quot;your-client-secret&quot;</span>, <span class="hljs-comment">// 绝对不能泄露给前端</span>\n      <span class="hljs-attr">callbackURL</span>: <span class="hljs-string">&quot;https://bff.example.com/api/auth/oauth2/callback&quot;</span>,\n      <span class="hljs-attr">scope</span>: [<span class="hljs-string">&quot;profile&quot;</span>, <span class="hljs-string">&quot;email&quot;</span>],\n    },\n    <span class="hljs-comment">// verify callback：用 token 换取用户信息</span>\n    <span class="hljs-title function_">async</span> (accessToken, refreshToken, profile, done) =&gt; {\n      <span class="hljs-keyword">try</span> {\n        <span class="hljs-comment">// 这里通常需要用 accessToken 去调用 OAuth2 的 /userinfo 接口</span>\n        <span class="hljs-keyword">const</span> userInfo = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetchUserInfo</span>(accessToken);\n        <span class="hljs-comment">// 将用户信息存入 session</span>\n        <span class="hljs-keyword">return</span> <span class="hljs-title function_">done</span>(<span class="hljs-literal">null</span>, userInfo);\n      } <span class="hljs-keyword">catch</span> (err) {\n        <span class="hljs-keyword">return</span> <span class="hljs-title function_">done</span>(err);\n      }\n    },\n  ),\n);\n<span class="hljs-comment">// 序列化与反序列化（控制 Session 存储的体积）</span>\npassport.<span class="hljs-title function_">serializeUser</span>(<span class="hljs-function">(<span class="hljs-params">user, done</span>) =&gt;</span> <span class="hljs-title function_">done</span>(<span class="hljs-literal">null</span>, user.<span class="hljs-property">id</span>));\npassport.<span class="hljs-title function_">deserializeUser</span>(<span class="hljs-function">(<span class="hljs-params">id, done</span>) =&gt;</span> {\n  <span class="hljs-comment">// 根据 id 从数据库或 Redis 查出用户信息</span>\n  <span class="hljs-keyword">const</span> user = <span class="hljs-title function_">findUserById</span>(id);\n  <span class="hljs-title function_">done</span>(<span class="hljs-literal">null</span>, user);\n});\n<span class="hljs-comment">// 4. 定义 BFF 路由</span>\n<span class="hljs-comment">// 触发登录</span>\napp.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/api/auth/oauth2/login&quot;</span>, passport.<span class="hljs-title function_">authenticate</span>(<span class="hljs-string">&quot;oauth2&quot;</span>));\n<span class="hljs-comment">// OAuth2 回调</span>\napp.<span class="hljs-title function_">get</span>(\n  <span class="hljs-string">&quot;/api/auth/oauth2/callback&quot;</span>,\n  passport.<span class="hljs-title function_">authenticate</span>(<span class="hljs-string">&quot;oauth2&quot;</span>, { <span class="hljs-attr">failureRedirect</span>: <span class="hljs-string">&quot;/login&quot;</span> }),\n  <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {\n    <span class="hljs-comment">// 登录成功，重定向前端页面</span>\n    res.<span class="hljs-title function_">redirect</span>(<span class="hljs-string">&quot;https://frontend.example.com/home&quot;</span>);\n  },\n);\n<span class="hljs-comment">// 获取当前用户信息 (前端直接 fetch 这个接口)</span>\napp.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;/api/user/info&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {\n  <span class="hljs-keyword">if</span> (req.<span class="hljs-title function_">isAuthenticated</span>()) {\n    res.<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">0</span>, <span class="hljs-attr">data</span>: req.<span class="hljs-property">user</span> });\n  } <span class="hljs-keyword">else</span> {\n    res.<span class="hljs-title function_">status</span>(<span class="hljs-number">401</span>).<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">401</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;未登录&quot;</span> });\n  }\n});\n<span class="hljs-comment">// 登出</span>\napp.<span class="hljs-title function_">post</span>(<span class="hljs-string">&quot;/api/auth/logout&quot;</span>, <span class="hljs-function">(<span class="hljs-params">req, res</span>) =&gt;</span> {\n  req.<span class="hljs-title function_">logout</span>(<span class="hljs-function">() =&gt;</span> {\n    res.<span class="hljs-title function_">json</span>({ <span class="hljs-attr">code</span>: <span class="hljs-number">0</span>, <span class="hljs-attr">msg</span>: <span class="hljs-string">&quot;登出成功&quot;</span> });\n    <span class="hljs-comment">// 可选：还需要重定向到认证中心的登出 URL 彻底销毁 SSO 会话</span>\n  });\n});\napp.<span class="hljs-title function_">listen</span>(<span class="hljs-number">3000</span>, <span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;BFF running on port 3000&quot;</span>));\n</code></pre>\n<hr>\n<h3>四、 生产环境避坑指南（重点）</h3>\n<p>结合前面关于连接池和多实例的讨论，BFF 做 SSO 有几个非常容易踩的坑：</p>\n<h4>1. Session 必须外置（Redis）</h4>\n<p>如果你使用内存存储 Session（默认的 <code>MemoryStore</code>），当你用 PM2/Docker 启动了多个 BFF 实例时，用户的请求如果被负载均衡分配到了不同的实例，就会丢失登录状态（无限 401 循环）。\n<strong>解决方案</strong>   ：必须使用 <code>connect-redis</code> 或其他外部存储。</p>\n<h4>2. CSRF 防护（OAuth2 的 state 参数）</h4>\n<p>在 OAuth2 中，如果回调接口不校验 <code>state</code>，黑客可以构造一个恶意回调链接，让用户在不知情的情况下绑定黑客的账号。\n<strong>解决方案</strong>   ：<code>passport-oauth2</code> 默认会处理 <code>state</code> 生成和校验，<strong>千万不要设置 <code>state: false</code></strong>   。</p>\n<h4>3. 前端路由 Hash 模式冲突（#字号问题）</h4>\n<p>如果你的前端使用的是 <code>hash</code> 路由（如 <code>https://app.com/#/home</code>），当 CAS/OAuth2 回调带上 <code>?code=xxx</code> 时，URL 会变成 <code>https://app.com/?code=xxx#/home</code>。\n有些浏览器或框架在解析时，会导致 Code 丢失或路由跳转异常。\n<strong>解决方案</strong>   ：强烈建议 BFF 的回调地址不要直接写前端页面，而是<strong>重定向到 BFF 的一个专门的前端落地页路由</strong>   （如 <code>https://app.com/auth/sso-landing</code>），这个页面由 BFF 渲染，读取 Cookie 成功后，再用 JS 跳转到 <code>#/home</code>。或者前端干脆改用 <code>history</code> 路由。</p>\n<h4>4. 单点登出（Single Logout, SLO）的坑</h4>\n<p>用户在 BFF 点击登出，清除了 BFF 的 Cookie，但 CAS/OAuth2 那边的会话还在。用户再次点登录，不需要输密码就又进来了。\n<strong>解决方案</strong>   ：BFF 的 logout 接口在清除本地 Session 后，必须拼接认证中心的 Logout URL，让前端再次重定向过去，例如：\n<code>res.redirect(\'https://auth.example.com/cas/logout?service=https://bff.example.com/api/auth/cas/login\')</code></p>\n<h4>5. Ticket/Code 重复使用问题</h4>\n<p>有时由于网络延迟或浏览器重试机制，回调接口可能会被同一个 Ticket/Code 请求两次。如果你自己写校验逻辑，一定要保证 Ticket 的幂等性校验（Redis 设置一次性 key），否则可能导致异常报错。使用 Passport 可以屏蔽这个细节。</p>\n</div>'</script></body></html>
