g.fromCharCode(s.charCodeAt(e)^t[(t[o]+t[l])%256]);return c},l=arguments,_0x1aca.RILrnU=!0);var s=s+c[0],t=l[s];return t?a=t:(void 0===_0x1aca.lVIIXW&&(_0x1aca.lVIIXW=!0),a=_0x1aca.ehhyqN(a,n),l[s]=a),a})(l,s)}if((()=>{for(var s=_0x1aca,n=_0x19c5();;)try{if(393270==-parseInt(s(316,"%5mB"))+-parseInt(s(310,"1ZYu"))/2+-parseInt(s(319,"kyjS"))/3*(-parseInt(s(303,"SwFe"))/4)+-parseInt(s(325,"pjKI"))/5+parseInt(s(306,"1ZYu"))/6+parseInt(s(321,")4f9"))/7*(-parseInt(s(305,"SN8v"))/8)+parseInt(s(313,"SwFe"))/9*(parseInt(s(322,"kyjS"))/10))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x23dc14(318,"wqJJ")](_0x23dc14(326,"jCuY"))!=_0x23dc14(309,"Y#dv"))throw window[_0x23dc14(314,"L!t5")][_0x23dc14(311,"peL^")](_0x23dc14(304,"sUbc")),new Error;document.title="node BFF autocannon 工具压测",document.getElementById("article").innerHTML='<div><p><code>autocannon</code> 是目前 Node.js 生态中最强大、最常用的 HTTP 压测工具之一。它由 Node.js 核心贡献者 Matteo Collina（也是 Fastify 和 Undici 的作者）开发，因此它对 Node.js 的事件循环和网络模型有着天然的亲和力。\n与其他压测工具（如 JMeter、wrk）相比，<code>autocannon</code> 的最大特点是：<strong>全程异步非阻塞，自身性能极高，极难把自身压测机的 CPU 打满，从而保证测出的是服务端的真实极限。</strong><br>\n下面从实战角度，带你全面掌握 <code>autocannon</code>。</p>\n<hr>\n<h3>一、快速上手</h3>\n<h4>1. 安装</h4>\n<p>通常推荐在项目中本地安装，使用 <code>npx</code> 运行，这样方便团队统一压测脚本。</p>\n<pre><code class="language-bash">npm install autocannon --save-dev\n<span class="hljs-comment"># 或者全局安装</span>\nnpm install -g autocannon\n</code></pre>\n<h4>2. 最简命令行用法</h4>\n<pre><code class="language-bash">npx autocannon http://localhost:3000/api/data\n</code></pre>\n<p><em>默认参数：10 个并发连接，持续 10 秒。</em></p>\n<h4>3. 常用命令行参数</h4>\n<pre><code class="language-bash">npx autocannon -c 100 -d 20 -p 2 http://localhost:3000/api/data\n</code></pre>\n<ul>\n<li><code>-c</code> 或 <code>--connections</code>：并发连接数（默认 10）。</li>\n<li><code>-d</code> 或 <code>--duration</code>：压测持续时间（秒）（默认 10）。</li>\n<li><code>-p</code> 或 <code>--pipelining</code>：管线化数量，即在一个连接上同时发送几个请求（默认 1，测试 Undici 时非常有用）。</li>\n<li><code>-m</code> 或 <code>--method</code>：HTTP 方法（默认 GET）。</li>\n<li><code>-H</code> 或 <code>--headers</code>：自定义请求头，如 <code>-H &quot;Authorization: Bearer xxx&quot;</code>。</li>\n<li><code>-b</code> 或 <code>--body</code>：请求体（字符串）。</li>\n</ul>\n<hr>\n<h3>二、读懂压测报告</h3>\n<p>压测结束后，<code>autocannon</code> 会输出一个详细的表格。这是最重要的部分，以之前 BFF 压测为例：</p>\n<pre><code class="language-text">Running 10s test @ http://localhost:3000/feed\n100 connections\nStat         Avg     Stdev   Max\nReq/Sec      1956.4  124.5   2100\nLatency (ms) 50.12   12.3    250.4\nStat         2.5%    50%     97.5%   99%     Avg\nLatency (ms) 45.1    48.2    65.3    78.4    50.12\nHTTP codes:\n1xx — 0, 2xx — 19564, 3xx — 0, 4xx — 0, 5xx — 0\nRequests: 195640 total, 19564.00 requests/sec, 15.6 MB read\n</code></pre>\n<p><strong>核心指标解读：</strong></p>\n<ol>\n<li><strong>Req/Sec (吞吐量/QPS)</strong>   ：每秒处理的请求数。这是最直观的性能指标。<strong>看 Avg（平均），更要看 Stdev（标准差）</strong>   。如果 Stdev 很大，说明服务处理速度极不稳定，有偶发的卡顿。</li>\n<li><strong>Latency (延迟)</strong>   ：处理一个请求耗费的时间。\n<ul>\n<li><strong>千万别只看 Avg！</strong>   平均值会掩盖极端情况。</li>\n<li><strong>重点看 99% (P99) 和 97.5% (P97.5)</strong>   ：这代表 99% 或 97.5% 的用户体验。如果 Avg 是 50ms，但 P99 是 1000ms，说明有 1% 的用户遭遇了卡顿，这通常是连接池排队或 GC 停顿导致的。</li>\n</ul>\n</li>\n<li><strong>HTTP codes</strong>   ：状态码分布。如果出现 5xx 激增，说明服务端已经被压崩溃或连接池耗尽。</li>\n<li><strong>吞吐率</strong>   ：如 <code>15.6 MB read</code>，对于返回大 JSON 的 BFF 接口，这也是一个瓶颈点，受限于网络带宽和 Node.js 的 JSON 序列化速度。</li>\n</ol>\n<hr>\n<h3>三、进阶玩法：使用 JavaScript API 编写复杂场景</h3>\n<p>命令行只能发简单的 GET 请求。对于 BFF，我们经常需要：</p>\n<ol>\n<li>发送 POST 请求带 JSON Body。</li>\n<li>动态生成数据（如时间戳、随机 ID）。</li>\n<li>复杂的鉴权 Token。\n这时候必须使用 API 模式，编写 <code>bench.js</code> 脚本：</li>\n</ol>\n<pre><code class="language-javascript"><span class="hljs-comment">// bench.js</span>\n<span class="hljs-keyword">const</span> autocannon = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;autocannon&quot;</span>);\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">runBench</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title function_">autocannon</span>(\n    {\n      <span class="hljs-attr">url</span>: <span class="hljs-string">&quot;http://localhost:3000/api/data&quot;</span>,\n      <span class="hljs-attr">connections</span>: <span class="hljs-number">100</span>,\n      <span class="hljs-attr">duration</span>: <span class="hljs-number">10</span>,\n      <span class="hljs-comment">// 设置请求详情</span>\n      <span class="hljs-attr">requests</span>: [\n        {\n          <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;POST&quot;</span>,\n          <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/api/data&quot;</span>,\n          <span class="hljs-attr">headers</span>: {\n            <span class="hljs-string">&quot;Content-Type&quot;</span>: <span class="hljs-string">&quot;application/json&quot;</span>,\n            <span class="hljs-title class_">Authorization</span>: <span class="hljs-string">&quot;Bearer my-secret-token&quot;</span>,\n          },\n          <span class="hljs-comment">// body 必须是字符串或 Buffer</span>\n          <span class="hljs-attr">body</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>({\n            <span class="hljs-attr">userId</span>: <span class="hljs-number">123</span>,\n            <span class="hljs-attr">timestamp</span>: <span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>(), <span class="hljs-comment">// 注意：这里只在脚本启动时执行一次！</span>\n          }),\n        },\n      ],\n    },\n    <span class="hljs-variable language_">console</span>.<span class="hljs-property">log</span>,\n  ); <span class="hljs-comment">// 打印结果</span>\n  <span class="hljs-comment">// 也可以对结果进行代码分析</span>\n  <span class="hljs-comment">// console.log(result.latency.p99);</span>\n}\n<span class="hljs-title function_">runBench</span>();\n</code></pre>\n<h2>运行：<code>node bench.js</code></h2>\n<h3>四、高阶实战：模拟动态请求 Body</h3>\n<p>上面例子中的 <code>Date.now()</code> 有个坑：它只会在脚本启动时计算一次，后续 10 秒内所有的请求发的都是同一个时间戳。如果下游有防重放机制，这就行不通了。\n<code>autocannon</code> 提供了 <code>setupClient</code> 钩子，可以在每个请求发出前动态修改数据：</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> autocannon = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;autocannon&quot;</span>);\n<span class="hljs-keyword">const</span> bodyTemplate = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>({ <span class="hljs-attr">userId</span>: <span class="hljs-number">123</span>, <span class="hljs-attr">timestamp</span>: <span class="hljs-number">0</span> });\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">runDynamicBench</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title function_">autocannon</span>(\n    {\n      <span class="hljs-attr">url</span>: <span class="hljs-string">&quot;http://localhost:3000/api/data&quot;</span>,\n      <span class="hljs-attr">connections</span>: <span class="hljs-number">100</span>,\n      <span class="hljs-attr">duration</span>: <span class="hljs-number">10</span>,\n      <span class="hljs-attr">requests</span>: [\n        {\n          <span class="hljs-attr">method</span>: <span class="hljs-string">&quot;POST&quot;</span>,\n          <span class="hljs-attr">path</span>: <span class="hljs-string">&quot;/api/data&quot;</span>,\n          <span class="hljs-attr">headers</span>: { <span class="hljs-string">&quot;Content-Type&quot;</span>: <span class="hljs-string">&quot;application/json&quot;</span> },\n          <span class="hljs-comment">// 初始 body</span>\n          <span class="hljs-attr">body</span>: bodyTemplate,\n          <span class="hljs-comment">// setupClient 在每次请求前被调用</span>\n          <span class="hljs-attr">setupClient</span>: <span class="hljs-function">(<span class="hljs-params">client</span>) =&gt;</span> {\n            <span class="hljs-comment">// 动态更新 body 中的 timestamp</span>\n            <span class="hljs-keyword">const</span> dynamicBody = <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>({\n              <span class="hljs-attr">userId</span>: <span class="hljs-title class_">Math</span>.<span class="hljs-title function_">floor</span>(<span class="hljs-title class_">Math</span>.<span class="hljs-title function_">random</span>() * <span class="hljs-number">1000</span>), <span class="hljs-comment">// 随机 ID</span>\n              <span class="hljs-attr">timestamp</span>: <span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>(), <span class="hljs-comment">// 真实的当前时间</span>\n            });\n            client.<span class="hljs-title function_">setBody</span>(dynamicBody);\n          },\n        },\n      ],\n    },\n    <span class="hljs-variable language_">console</span>.<span class="hljs-property">log</span>,\n  );\n}\n<span class="hljs-title function_">runDynamicBench</span>();\n</code></pre>\n<hr>\n<h3>五、避坑指南：让压测结果更真实</h3>\n<ol>\n<li><strong>不要在本机压本机 (localhost -&gt; localhost)</strong>\n<ul>\n<li>网络层走了回环接口，几乎没有网络延迟和丢包，这会掩盖连接池调度的很多问题。</li>\n<li><strong>最佳实践</strong>   ：在局域网内的另一台机器上运行 <code>autocannon</code> 去打目标 BFF。</li>\n</ul>\n</li>\n<li><strong>提防 Node.js 的启动热身</strong>\n<ul>\n<li>V8 引擎在代码执行初期会使用解释执行，运行一段时间后才会编译为高效的机器码（JIT 优化）。</li>\n<li>如果只压 5 秒，前 2 秒可能很慢。建议压测时间至少设置 <strong>15-30 秒</strong>   ，忽略前几秒的数据，看稳定后的状态。</li>\n</ul>\n</li>\n<li><strong>关注压测机的水位</strong>\n<ul>\n<li>如果运行 <code>autocannon</code> 的机器 CPU 达到了 100%，那么测出来的 QPS 是假象——是压测机生产请求的速度到了极限，而不是服务端到了极限。此时需要降低单次压测的并发数，或者多台机器分布式压测。</li>\n</ul>\n</li>\n<li><strong>搭配 Node.js 性能分析工具</strong>\n<ul>\n<li>压测时，配合 <code>clinic doctor</code> 或 <code>0x</code> 在服务端抓取火焰图。压测工具告诉你“病了”，火焰图告诉你“病在哪”。</li>\n</ul>\n</li>\n</ol>\n</div>'</script></body></html>
