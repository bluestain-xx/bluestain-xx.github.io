rxjs/operators&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">LoggingInterceptor</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestInterceptor</span> {\n  <span class="hljs-title function_">intercept</span>(<span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>, <span class="hljs-attr">next</span>: <span class="hljs-title class_">CallHandler</span>): <span class="hljs-title class_">Observable</span>&lt;<span class="hljs-built_in">any</span>&gt; {\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Before...&quot;</span>);\n    <span class="hljs-keyword">const</span> now = <span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>();\n    <span class="hljs-keyword">return</span> next\n      .<span class="hljs-title function_">handle</span>()\n      .<span class="hljs-title function_">pipe</span>(<span class="hljs-title function_">tap</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`After... <span class="hljs-subst">${<span class="hljs-built_in">Date</span>.now() - now}</span>ms`</span>)));\n  }\n}\n</code></pre>\n<h3>关键组成部分</h3>\n<ol>\n<li><code>ExecutionContext</code> - 提供关于当前请求的详细信息</li>\n<li><code>CallHandler</code> - 提供 <code>handle()</code> 方法调用路由处理器</li>\n<li>返回 <code>Observable</code> - 使用 RxJS 操作符处理响应流</li>\n</ol>\n<h2>3. 应用拦截器</h2>\n<h3>全局应用</h3>\n<pre><code class="language-typescript"><span class="hljs-comment">// main.ts</span>\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Module</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/common&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-variable constant_">APP_INTERCEPTOR</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@nestjs/core&quot;</span>;\n<span class="hljs-meta">@Module</span>({\n  <span class="hljs-attr">providers</span>: [\n    {\n      <span class="hljs-attr">provide</span>: <span class="hljs-variable constant_">APP_INTERCEPTOR</span>,\n      <span class="hljs-attr">useClass</span>: <span class="hljs-title class_">LoggingInterceptor</span>,\n    },\n  ],\n})\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AppModule</span> {}\n</code></pre>\n<h3>控制器或方法级别应用</h3>\n<pre><code class="language-typescript"><span class="hljs-meta">@Controller</span>(<span class="hljs-string">&quot;cats&quot;</span>)\n<span class="hljs-meta">@UseInterceptors</span>(<span class="hljs-title class_">LoggingInterceptor</span>)\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CatsController</span> {\n  <span class="hljs-meta">@Get</span>()\n  <span class="hljs-meta">@UseInterceptors</span>(<span class="hljs-title class_">TransformInterceptor</span>)\n  <span class="hljs-title function_">findAll</span>(<span class="hljs-params"></span>) {\n    <span class="hljs-comment">// ...</span>\n  }\n}\n</code></pre>\n<h2>4. 常见拦截器用例</h2>\n<h3>4.1 响应转换</h3>\n<pre><code class="language-typescript"><span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TransformInterceptor</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestInterceptor</span> {\n  <span class="hljs-title function_">intercept</span>(<span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>, <span class="hljs-attr">next</span>: <span class="hljs-title class_">CallHandler</span>): <span class="hljs-title class_">Observable</span>&lt;<span class="hljs-built_in">any</span>&gt; {\n    <span class="hljs-keyword">return</span> next.<span class="hljs-title function_">handle</span>().<span class="hljs-title function_">pipe</span>(<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> ({ data })));\n  }\n}\n</code></pre>\n<h3>4.2 超时处理</h3>\n<pre><code class="language-typescript"><span class="hljs-keyword">import</span> { timeout, catchError } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;rxjs/operators&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">TimeoutError</span>, throwError } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;rxjs&quot;</span>;\n<span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TimeoutInterceptor</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestInterceptor</span> {\n  <span class="hljs-title function_">intercept</span>(<span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>, <span class="hljs-attr">next</span>: <span class="hljs-title class_">CallHandler</span>): <span class="hljs-title class_">Observable</span>&lt;<span class="hljs-built_in">any</span>&gt; {\n    <span class="hljs-keyword">return</span> next.<span class="hljs-title function_">handle</span>().<span class="hljs-title function_">pipe</span>(\n      <span class="hljs-title function_">timeout</span>(<span class="hljs-number">5000</span>),\n      <span class="hljs-title function_">catchError</span>(<span class="hljs-function">(<span class="hljs-params">err</span>) =&gt;</span> {\n        <span class="hljs-keyword">if</span> (err <span class="hljs-keyword">instanceof</span> <span class="hljs-title class_">TimeoutError</span>) {\n          <span class="hljs-keyword">return</span> <span class="hljs-title function_">throwError</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RequestTimeoutException</span>());\n        }\n        <span class="hljs-keyword">return</span> <span class="hljs-title function_">throwError</span>(<span class="hljs-function">() =&gt;</span> err);\n      }),\n    );\n  }\n}\n</code></pre>\n<h3>4.3 缓存</h3>\n<pre><code class="language-typescript"><span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CacheInterceptor</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestInterceptor</span> {\n  <span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> cache = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Map</span>();\n  <span class="hljs-title function_">intercept</span>(<span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>, <span class="hljs-attr">next</span>: <span class="hljs-title class_">CallHandler</span>): <span class="hljs-title class_">Observable</span>&lt;<span class="hljs-built_in">any</span>&gt; {\n    <span class="hljs-keyword">const</span> request = context.<span class="hljs-title function_">switchToHttp</span>().<span class="hljs-title function_">getRequest</span>();\n    <span class="hljs-keyword">const</span> key = request.<span class="hljs-property">url</span>;\n\n    <span class="hljs-keyword">if</span> (<span class="hljs-variable language_">this</span>.<span class="hljs-property">cache</span>.<span class="hljs-title function_">has</span>(key)) {\n      <span class="hljs-keyword">return</span> <span class="hljs-title function_">of</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-property">cache</span>.<span class="hljs-title function_">get</span>(key));\n    }\n\n    <span class="hljs-keyword">return</span> next.<span class="hljs-title function_">handle</span>().<span class="hljs-title function_">pipe</span>(\n      <span class="hljs-title function_">tap</span>(<span class="hljs-function">(<span class="hljs-params">response</span>) =&gt;</span> {\n        <span class="hljs-variable language_">this</span>.<span class="hljs-property">cache</span>.<span class="hljs-title function_">set</span>(key, response);\n      }),\n    );\n  }\n}\n</code></pre>\n<h2>5. 高级用法</h2>\n<h3>5.1 操作符链式调用</h3>\n<pre><code class="language-typescript"><span class="hljs-keyword">return</span> next.<span class="hljs-title function_">handle</span>().<span class="hljs-title function_">pipe</span>(\n  <span class="hljs-title function_">tap</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;...after&quot;</span>)),\n  <span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">data</span>) =&gt;</span> ({ ...data, <span class="hljs-attr">timestamp</span>: <span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>().<span class="hljs-title function_">toISOString</span>() })),\n  <span class="hljs-title function_">catchError</span>(<span class="hljs-function">(<span class="hljs-params">error</span>) =&gt;</span> {\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">error</span>(<span class="hljs-string">&quot;Error caught:&quot;</span>, error);\n    <span class="hljs-keyword">return</span> <span class="hljs-title function_">throwError</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BadRequestException</span>());\n  }),\n);\n</code></pre>\n<h3>5.2 多个拦截器的执行顺序</h3>\n<p>多个拦截器可以组合使用，执行顺序是从外到内：</p>\n<pre><code>First Interceptor (before)\n  Second Interceptor (before)\n    Route Handler\n  Second Interceptor (after)\nFirst Interceptor (after)\n</code></pre>\n<h3>5.3 依赖注入</h3>\n<p>拦截器可以像其他提供者一样注入依赖：</p>\n<pre><code class="language-typescript"><span class="hljs-meta">@Injectable</span>()\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">SomeInterceptor</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">NestInterceptor</span> {\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> <span class="hljs-attr">configService</span>: <span class="hljs-title class_">ConfigService</span></span>) {}\n  <span class="hljs-title function_">intercept</span>(<span class="hljs-attr">context</span>: <span class="hljs-title class_">ExecutionContext</span>, <span class="hljs-attr">next</span>: <span class="hljs-title class_">CallHandler</span>): <span class="hljs-title class_">Observable</span>&lt;<span class="hljs-built_in">any</span>&gt; {\n    <span class="hljs-comment">// 使用 this.configService</span>\n  }\n}\n</code></pre>\n<h2>6. 与中间件、守卫、管道的区别</h2>\n<table>\n<thead>\n<tr>\n<th>特性</th>\n<th>中间件</th>\n<th>守卫</th>\n<th>管道</th>\n<th>拦截器</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>执行顺序</td>\n<td>最先</td>\n<td>在中间件之后</td>\n<td>在守卫之后</td>\n<td>在管道之后</td>\n</tr>\n<tr>\n<td>用途</td>\n<td>通用请求处理</td>\n<td>认证/授权</td>\n<td>验证/转换数据</td>\n<td>响应转换/AOP</td>\n</tr>\n<tr>\n<td>能访问</td>\n<td>请求/响应对象</td>\n<td>请求/响应对象</td>\n<td>请求体/参数</td>\n<td>完整上下文</td>\n</tr>\n<tr>\n<td>能修改</td>\n<td>可以</td>\n<td>不能</td>\n<td>可以</td>\n<td>可以</td>\n</tr>\n<tr>\n<td>异步处理</td>\n<td>支持</td>\n<td>支持</td>\n<td>支持</td>\n<td>支持</td>\n</tr>\n</tbody>\n</table>\n<h2>7. 最佳实践</h2>\n<ol>\n<li><strong>保持拦截器单一职责</strong>   - 每个拦截器只做一件事</li>\n<li><strong>避免复杂逻辑</strong>   - 复杂逻辑应该在服务层处理</li>\n<li><strong>合理使用 RxJS 操作符</strong>   - 熟悉常用操作符如 <code>map</code>, <code>tap</code>, <code>catchError</code> 等</li>\n<li><strong>注意性能影响</strong>   - 拦截器会为每个请求执行，避免阻塞操作</li>\n<li><strong>正确处理错误</strong>   - 确保错误被正确捕获和传递</li>\n</ol>\n<h2>8. 总结</h2>\n<p>NestJS 拦截器是实现横切关注点(如日志、缓存、响应转换等)的强大工具。通过合理使用拦截器，可以保持代码的模块化和可维护性，同时避免重复代码。</p>\n</div>'</script></body></html>
