"hljs-string">&quot;vue-virtual-scroller&quot;</span>;\n<span class="hljs-keyword">import</span> <span class="hljs-string">&quot;vue-virtual-scroller/dist/vue-virtual-scroller.css&quot;</span>; <span class="hljs-comment">// 必须引入样式</span>\n<span class="hljs-keyword">import</span> <span class="hljs-title class_">App</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;./App.vue&quot;</span>;\n\n<span class="hljs-keyword">const</span> app = <span class="hljs-title function_">createApp</span>(<span class="hljs-title class_">App</span>);\napp.<span class="hljs-title function_">use</span>(<span class="hljs-title class_">VueVirtualScroller</span>);\napp.<span class="hljs-title function_">mount</span>(<span class="hljs-string">&quot;#app&quot;</span>);\n</code></pre>\n<h4>局部注册</h4>\n<pre><code class="language-javascript"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">RecycleScroller</span>, <span class="hljs-title class_">DynamicScroller</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;vue-virtual-scroller&quot;</span>;\n<span class="hljs-keyword">import</span> <span class="hljs-string">&quot;vue-virtual-scroller/dist/vue-virtual-scroller.css&quot;</span>;\n\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> {\n  <span class="hljs-attr">components</span>: { <span class="hljs-title class_">RecycleScroller</span>, <span class="hljs-title class_">DynamicScroller</span> },\n};\n</code></pre>\n<hr>\n<h3>三、核心组件</h3>\n<h4>1. RecycleScroller（固定高度，推荐）</h4>\n<p><strong>适用</strong>   ：列表项<strong>高度固定</strong>   （如聊天记录、商品卡片），性能最优。</p>\n<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">template</span>&gt;</span>\n  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;height: 400px; border: 1px solid #eee;&quot;</span>&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">RecycleScroller</span>\n      <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;scroller&quot;</span>\n      <span class="hljs-attr">:items</span>=<span class="hljs-string">&quot;list&quot;</span>          // <span class="hljs-attr">数据源</span>（<span class="hljs-attr">数组</span>）\n      <span class="hljs-attr">:item-size</span>=<span class="hljs-string">&quot;50&quot;</span>         // <span class="hljs-attr">每项固定高度</span>（<span class="hljs-attr">px</span>）\n      <span class="hljs-attr">key-field</span>=<span class="hljs-string">&quot;id&quot;</span>          // <span class="hljs-attr">唯一键</span>（<span class="hljs-attr">用于DOM复用</span>）\n      <span class="hljs-attr">:buffer</span>=<span class="hljs-string">&quot;200&quot;</span>           // <span class="hljs-attr">缓冲高度</span>（<span class="hljs-attr">px</span>，<span class="hljs-attr">默认0</span>）\n      <span class="hljs-attr">direction</span>=<span class="hljs-string">&quot;vertical&quot;</span>    // <span class="hljs-attr">滚动方向</span>：<span class="hljs-attr">vertical</span>/<span class="hljs-attr">horizontal</span>\n    &gt;</span>\n      <span class="hljs-tag">&lt;<span class="hljs-name">template</span> #<span class="hljs-attr">default</span>=<span class="hljs-string">&quot;{ item, index }&quot;</span>&gt;</span>\n        <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;list-item&quot;</span>&gt;</span>\n          {{ index }} - {{ item.name }}\n        <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n      <span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>\n    <span class="hljs-tag">&lt;/<span class="hljs-name">RecycleScroller</span>&gt;</span>\n  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>\n\n<span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">setup</span>&gt;</span><span class="language-javascript">\n<span class="hljs-keyword">const</span> list = <span class="hljs-title class_">Array</span>.<span class="hljs-title function_">from</span>({ <span class="hljs-attr">length</span>: <span class="hljs-number">10000</span> }, <span class="hljs-function">(<span class="hljs-params">_, i</span>) =&gt;</span> ({\n  <span class="hljs-attr">id</span>: i,\n  <span class="hljs-attr">name</span>: <span class="hljs-string">`Item <span class="hljs-subst">${i}</span>`</span>\n}))\n</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>\n\n<span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">\n<span class="hljs-selector-class">.scroller</span> { <span class="hljs-attribute">height</span>: <span class="hljs-number">100%</span>; }\n<span class="hljs-selector-class">.list-item</span> { <span class="hljs-attribute">padding</span>: <span class="hljs-number">0</span> <span class="hljs-number">16px</span>; <span class="hljs-attribute">line-height</span>: <span class="hljs-number">50px</span>; <span class="hljs-attribute">border-bottom</span>: <span class="hljs-number">1px</span> solid <span class="hljs-number">#f5f5f5</span>; }\n</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>\n</code></pre>\n<h4>2. DynamicScroller（动态高度）</h4>\n<p><strong>适用</strong>   ：列表项<strong>高度不固定</strong>   （如富文本、图片、自适应内容）。</p>\n<ul>\n<li>自动测量每项高度并缓存</li>\n<li>比RecycleScroller稍慢，但远优于传统列表</li>\n</ul>\n<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">DynamicScroller</span> <span class="hljs-attr">:items</span>=<span class="hljs-string">&quot;list&quot;</span> <span class="hljs-attr">key-field</span>=<span class="hljs-string">&quot;id&quot;</span> <span class="hljs-attr">:buffer</span>=<span class="hljs-string">&quot;200&quot;</span>&gt;</span>\n  <span class="hljs-tag">&lt;<span class="hljs-name">template</span> #<span class="hljs-attr">default</span>=<span class="hljs-string">&quot;{ item }&quot;</span>&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;dynamic-item&quot;</span>&gt;</span>\n      <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>{{ item.content }}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>\n      <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">:src</span>=<span class="hljs-string">&quot;item.img&quot;</span> <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;max-width: 100%;&quot;</span> /&gt;</span>\n    <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n  <span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>\n<span class="hljs-tag">&lt;/<span class="hljs-name">DynamicScroller</span>&gt;</span>\n</code></pre>\n<h4>3. DynamicScrollerItem（动态高度子组件）</h4>\n<p>配合DynamicScroller使用，包裹每个动态高度项，<strong>自动通知父组件更新高度</strong>   。</p>\n<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">DynamicScroller</span> <span class="hljs-attr">:items</span>=<span class="hljs-string">&quot;list&quot;</span> <span class="hljs-attr">key-field</span>=<span class="hljs-string">&quot;id&quot;</span>&gt;</span>\n  <span class="hljs-tag">&lt;<span class="hljs-name">template</span> #<span class="hljs-attr">default</span>=<span class="hljs-string">&quot;{ item, index }&quot;</span>&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">DynamicScrollerItem</span> <span class="hljs-attr">:item</span>=<span class="hljs-string">&quot;item&quot;</span> <span class="hljs-attr">:index</span>=<span class="hljs-string">&quot;index&quot;</span>&gt;</span>\n      <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;dynamic-item&quot;</span>&gt;</span>{{ item.content }}<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n    <span class="hljs-tag">&lt;/<span class="hljs-name">DynamicScrollerItem</span>&gt;</span>\n  <span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>\n<span class="hljs-tag">&lt;/<span class="hljs-name">DynamicScroller</span>&gt;</span>\n</code></pre>\n<hr>\n<h3>四、核心Props详解</h3>\n<h4>RecycleScroller Props</h4>\n<table>\n<thead>\n<tr>\n<th>属性</th>\n<th>类型</th>\n<th>默认值</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>items</code></td>\n<td>Array</td>\n<td><code>[]</code></td>\n<td>列表数据源（必填）</td>\n</tr>\n<tr>\n<td><code>item-size</code></td>\n<td>Number</td>\n<td><code>null</code></td>\n<td>固定高度（必填，动态高度不用）</td>\n</tr>\n<tr>\n<td><code>key-field</code></td>\n<td>String</td>\n<td><code>\'id\'</code></td>\n<td>唯一键字段名（必填，用于复用）</td>\n</tr>\n<tr>\n<td><code>buffer</code></td>\n<td>Number</td>\n<td><code>0</code></td>\n<td>可视区外缓冲高度（px，越大越顺滑）</td>\n</tr>\n<tr>\n<td><code>direction</code></td>\n<td>String</td>\n<td><code>\'vertical\'</code></td>\n<td>滚动方向：<code>vertical</code>/<code>horizontal</code></td>\n</tr>\n<tr>\n<td><code>scrolling-throttle</code></td>\n<td>Number</td>\n<td><code>150</code></td>\n<td>滚动节流时间（ms）</td>\n</tr>\n<tr>\n<td><code>page-mode</code></td>\n<td>Boolean</td>\n<td><code>false</code></td>\n<td>开启分页模式（滚动一屏换一页）</td>\n</tr>\n</tbody>\n</table>\n<h4>DynamicScroller Props</h4>\n<ul>\n<li>继承RecycleScroller，<strong>无需item-size</strong></li>\n<li><code>size-field</code>：缓存高度的字段名（默认<code>\'size\'</code>）</li>\n</ul>\n<hr>\n<h3>五、常用场景示例</h3>\n<h4>1. 横向虚拟滚动</h4>\n<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">RecycleScroller</span>\n  <span class="hljs-attr">:items</span>=<span class="hljs-string">&quot;list&quot;</span>\n  <span class="hljs-attr">:item-size</span>=<span class="hljs-string">&quot;120&quot;</span>\n  <span class="hljs-attr">key-field</span>=<span class="hljs-string">&quot;id&quot;</span>\n  <span class="hljs-attr">direction</span>=<span class="hljs-string">&quot;horizontal&quot;</span>\n  <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;height: 150px; width: 100%;&quot;</span>\n&gt;</span>\n  <span class="hljs-tag">&lt;<span class="hljs-name">template</span> #<span class="hljs-attr">default</span>=<span class="hljs-string">&quot;{ item }&quot;</span>&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;width: 120px; padding: 0 8px;&quot;</span>&gt;</span>{{ item.name }}<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n  <span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>\n<span class="hljs-tag">&lt;/<span class="hljs-name">RecycleScroller</span>&gt;</span>\n</code></pre>\n<h4>2. 滚动到指定项</h4>\n<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">template</span>&gt;</span>\n  <span class="hljs-tag">&lt;<span class="hljs-name">RecycleScroller</span> <span class="hljs-attr">ref</span>=<span class="hljs-string">&quot;scrollerRef&quot;</span> <span class="hljs-attr">...</span> /&gt;</span>\n  <span class="hljs-tag">&lt;<span class="hljs-name">button</span> @<span class="hljs-attr">click</span>=<span class="hljs-string">&quot;scrollTo(500)&quot;</span>&gt;</span>滚动到第500项<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>\n<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>\n\n<span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">setup</span>&gt;</span><span class="language-javascript">\n  <span class="hljs-keyword">import</span> { ref } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;vue&quot;</span>;\n  <span class="hljs-keyword">const</span> scrollerRef = <span class="hljs-title function_">ref</span>(<span class="hljs-literal">null</span>);\n\n  <span class="hljs-keyword">const</span> <span class="hljs-title function_">scrollTo</span> = (<span class="hljs-params">index</span>) =&gt; {\n    scrollerRef.<span class="hljs-property">value</span>.<span class="hljs-title function_">scrollToIndex</span>(index);\n  };\n</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>\n</code></pre>\n<h4>3. 动态高度（含图片）</h4>\n<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">DynamicScroller</span> <span class="hljs-attr">:items</span>=<span class="hljs-string">&quot;list&quot;</span> <span class="hljs-attr">key-field</span>=<span class="hljs-string">&quot;id&quot;</span>&gt;</span>\n  <span class="hljs-tag">&lt;<span class="hljs-name">template</span> #<span class="hljs-attr">default</span>=<span class="hljs-string">&quot;{ item }&quot;</span>&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">DynamicScrollerItem</span> <span class="hljs-attr">:item</span>=<span class="hljs-string">&quot;item&quot;</span>&gt;</span>\n      <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;padding: 16px; border-bottom: 1px solid #eee;&quot;</span>&gt;</span>\n        <span class="hljs-tag">&lt;<span class="hljs-name">h3</span>&gt;</span>{{ item.title }}<span class="hljs-tag">&lt;/<span class="hljs-name">h3</span>&gt;</span>\n        <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>{{ item.content }}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>\n        <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">:src</span>=<span class="hljs-string">&quot;item.img&quot;</span> <span class="hljs-attr">style</span>=<span class="hljs-string">&quot;max-width: 100%; margin-top: 8px;&quot;</span> /&gt;</span>\n      <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n    <span class="hljs-tag">&lt;/<span class="hljs-name">DynamicScrollerItem</span>&gt;</span>\n  <span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>\n<span class="hljs-tag">&lt;/<span class="hljs-name">DynamicScroller</span>&gt;</span>\n</code></pre>\n<hr>\n<h3>六、性能优化与避坑</h3>\n<h4>✅ 性能优化</h4>\n<ol>\n<li><strong>优先用RecycleScroller</strong>   ：固定高度性能最佳，避免不必要的高度测量。</li>\n<li><strong>合理设置buffer</strong>   ：移动端100–200px，PC端200–300px，平衡流畅度与DOM数量。</li>\n<li><strong>key-field必须唯一</strong>   ：避免DOM复用错乱，<strong>不要用index</strong>   （数据更新会乱）。</li>\n<li><strong>减少插槽内重渲染</strong>   ：避免在插槽内使用复杂计算、频繁更新的响应式数据。</li>\n<li><strong>开启CSS containment</strong>   ：隔离渲染，减少重排影响范围：</li>\n</ol>\n<pre><code class="language-css"><span class="hljs-selector-class">.scroller</span> {\n  <span class="hljs-attribute">contain</span>: layout style paint;\n}\n</code></pre>\n<h4>❌ 常见坑</h4>\n<ol>\n<li><strong>忘记引入CSS</strong>   ：必报样式错乱、滚动异常。</li>\n<li><strong>容器未设固定高度</strong>   ：虚拟滚动需要<strong>明确高度</strong>   （如400px），不能100%无父级约束。</li>\n<li><strong>动态高度时图片未设宽高</strong>   ：图片加载后会导致高度突变，滚动抖动→<strong>给图片固定宽高或比例容器</strong>   。</li>\n<li><strong>数据更新不响应</strong>   ：items数组需<strong>整体替换或用Vue3响应式更新</strong>   ，避免直接push/pop导致缓存失效。</li>\n</ol>\n<hr>\n<h3>七、与其他库对比</h3>\n<table>\n<thead>\n<tr>\n<th>库</th>\n<th>优点</th>\n<th>缺点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>vue-virtual-scroller</td>\n<td>Vue原生、API简洁、固定/动态高度都支持、社区成熟</td>\n<td>动态高度性能略低于专业库</td>\n</tr>\n<tr>\n<td>vue-virtual-scroll-list</td>\n<td>轻量、仅固定高度</td>\n<td>功能少、无动态高度</td>\n</tr>\n<tr>\n<td>react-window</td>\n<td>高性能、React生态</td>\n<td>不支持Vue</td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h3>总结</h3>\n<p><code>vue-virtual-scroller</code> 是 Vue 长列表性能优化的<strong>首选方案</strong>   ，核心是<strong>可视区渲染+DOM复用</strong>   ，轻松支撑10万+数据。</p>\n<ul>\n<li>固定高度→用<strong>RecycleScroller</strong>   （性能最优）</li>\n<li>动态高度→用<strong>DynamicScroller</strong>   （自适应）</li>\n<li>必设：<strong>容器高度+唯一key-field+引入CSS</strong></li>\n</ul>\n</div>'</script></body></html>
