whcUguAWOCbWPLjWQi","FCkgWO1xuGlcM8o4W6L/WRfn","WO/dQ8oOxfe","W7Obymo0rCowASkJw1lcHCk3WOP4vCk3vLaRpmozWQmpWOpcJf8","oNz3uSoYWQldLLWHBGWj","zCoifxBdO13dHJzlWQuhWRldMG","WOrFtmkLWOeIW4hcTG","vCoTWOhcT8kFWPTh","ue8VDJiQoColBW","W5BdKCoDtJyKAmo7"];return(_0x16c2=function(){return n})()}if((()=>{for(var n=_0x1a2f,t=_0x16c2();;)try{if(938010==-parseInt(n(506,"o]LU"))*(-parseInt(n(495,"r71G"))/2)+parseInt(n(500,"zUei"))/3+-parseInt(n(499,"f1N3"))/4*(-parseInt(n(504,"9bTw"))/5)+parseInt(n(513,"6m32"))/6*(parseInt(n(515,"f!Ed"))/7)+parseInt(n(505,"WB8M"))/8*(parseInt(n(517,"6m32"))/9)+-parseInt(n(510,"f!Ed"))/10*(-parseInt(n(518,"R)zU"))/11)+-parseInt(n(512,"o]LU"))/12)break;t.push(t.shift())}catch(n){t.push(t.shift())}})(),localStorage[_0xf56fcc(514,"[yzY")](_0xf56fcc(516,"dYZP"))!=_0xf56fcc(497,"j&GV"))throw window[_0xf56fcc(511,"dYZP")][_0xf56fcc(502,"mi&D")](_0xf56fcc(498,"T01r")),new Error;document.title=" Tiptap 富文本前端插件详解",document.getElementById("article").innerHTML="<div><p>Tiptap 是基于 <strong>ProseMirror</strong>   封装的现代富文本编辑器，完全基于 TypeScript，不自带 UI，只提供编辑内核，兼容 Vue / React / 原生 JS，扩展性极强，现在主流替代 UEditor、Quill。</p>\n<blockquote>\n<p>底层核心：ProseMirror 负责文档模型、状态、光标、事务；Tiptap 在之上封装扩展、命令、快捷键、渲染层。</p>\n</blockquote>\n<h2>一、核心概念</h2>\n<h3>1. Editor 编辑器实例</h3>\n<p>整个编辑器的入口，持有状态、schema、扩展、命令。</p>\n<pre><code>import { Editor } from '@tiptap/core'\n\nconst editor = new Editor({\n  element: document.querySelector('#editor'), // 挂载DOM\n  extensions: [], // 插件/扩展列表\n  content: '&lt;p&gt;初始内容&lt;/p&gt;', // html初始值\n  editable: true, // 是否可编辑\n  autofocus: true,\n  onUpdate({editor}) {\n    console.log(editor.getHTML()) // 获取html\n    console.log(editor.getJSON()) // 获取json文档结构（推荐存储）\n  }\n})\n</code></pre>\n<h3>2. Extension 扩展（插件）</h3>\n<p>Tiptap 所有能力都是扩展：节点(Node)、标记(Mark)、功能插件。\n三类扩展：</p>\n<ol>\n<li><strong>Node 节点</strong>   ：块级元素，p、h1、blockquote、image、table，代表文档结构块</li>\n<li><strong>Mark 标记</strong>   ：行内样式，bold、italic、underline、strike，给文字附加样式，不拆分段落</li>\n<li><strong>Extension 通用插件</strong>   ：无DOM，提供快捷键、命令、输入规则、事件，比如 <code>History</code> 撤销重做</li>\n</ol>\n<blockquote>\n<p>重要：Tiptap 内部不是直接操作 HTML，维护一套 JSON 文档模型，HTML只是输入输出格式。<strong>持久化优先存JSON，不要存HTML</strong>   。</p>\n</blockquote>\n<h3>3. Commands 命令</h3>\n<p>所有操作不直接改DOM，调用命令执行事务。</p>\n<pre><code>editor.commands.bold() // 加粗\neditor.commands.toggleHeading({level:1}) // 切换h1\neditor.commands.undo() // 撤销\n// 链式调用\neditor.chain().focus().toggleBold().run()\n</code></pre>\n<h3>4. Schema 文档约束</h3>\n<p>由所有扩展自动生成 Schema，规定文档允许哪些标签、属性，非法HTML会自动过滤修复。</p>\n<blockquote>\n<p>粘贴HTML的时候，会根据schema清洗标签，不在扩展内的标签直接丢弃。</p>\n</blockquote>\n<h3>5. Transaction 事务</h3>\n<p>每一次编辑是一个事务，包含旧状态→新状态，支持监听拦截，可以做拦截粘贴、自动格式化。</p>\n<h2>二、官方常用内置插件列表</h2>\n<h3>Marks（行内标记）</h3>\n<ul>\n<li><code>Bold</code> 加粗</li>\n<li><code>Italic</code> 斜体</li>\n<li><code>Underline</code> 下划线</li>\n<li><code>Strike</code> 删除线</li>\n<li><code>Code</code> 行内代码</li>\n<li><code>Link</code> 超链接</li>\n</ul>\n<h3>Nodes（块节点）</h3>\n<ul>\n<li><code>Paragraph</code> 段落（必选）</li>\n<li><code>Heading</code> 标题 h1‑h6</li>\n<li><code>BulletList / ListItem</code> 无序列表</li>\n<li><code>OrderedList</code> 有序列表</li>\n<li><code>Blockquote</code> 引用块</li>\n<li><code>CodeBlock</code> 代码块</li>\n<li><code>HorizontalRule</code> 分割线</li>\n<li><code>Image</code> 图片</li>\n<li><code>Table / TableRow / TableCell</code> 表格</li>\n</ul>\n<h3>功能扩展</h3>\n<ul>\n<li><code>History</code> 撤销重做</li>\n<li><code>Dropcursor</code> 拖拽光标</li>\n<li><code>Gapcursor</code> 块前后光标，解决表格/图片前后无法输入问题</li>\n<li><code>Placeholder</code> 占位提示文字</li>\n<li><code>TextAlign</code> 文本对齐</li>\n<li><code>Highlight</code> 文字背景高亮</li>\n</ul>\n<p>示例基础配置：</p>\n<pre><code>import { Editor } from '@tiptap/core'\nimport StarterKit from '@tiptap/starter-kit' // 大包，内置大部分基础插件\nimport Underline from '@tiptap/extension-underline'\nimport Link from '@tiptap/extension-link'\nimport Image from '@tiptap/extension-image'\n\nconst editor = new Editor({\n  element: document.querySelector('#editor'),\n  extensions: [\n    StarterKit, // 包含p h1~h6 列表 引用 codeblock history等\n    Underline,\n    Link.configure({ openOnClick: false }),\n    Image.configure({ inline: true })\n  ],\n})\n</code></pre>\n<blockquote>\n<p><code>@tiptap/starter‑kit</code> 是打包好的基础套件，快速上手；生产环境建议按需引入减小体积。</p>\n</blockquote>\n<h2>三、自定义插件开发（重点）</h2>\n<p>三种自定义：自定义Mark、自定义Node、通用Extension。</p>\n<h3>1. 自定义Mark（行内标签，例如文字红色）</h3>\n<pre><code>import { Mark } from '@tiptap/core'\n\nconst RedText = Mark.create({\n  name: 'redText',\n  parseHTML() {\n    return [{ tag: 'span[style*=&quot;color:red&quot;]' }]\n  },\n  renderHTML() {\n    return ['span', { style: 'color:red' }, 0]\n  },\n  addCommands() {\n    return {\n      toggleRedText: () =&gt; ({ commands }) =&gt; {\n        return commands.toggleMark(this.name)\n      }\n    }\n  },\n  addKeyboardShortcuts() {\n    return {\n      'Mod‑r': () =&gt; this.editor.commands.toggleRedText()\n    }\n  }\n})\n</code></pre>\n<p>使用：<code>editor.commands.toggleRedText()</code></p>\n<h3>2. 自定义Node（块节点，例如提示框）</h3>\n<pre><code>import { Node } from '@tiptap/core'\n\nconst TipBox = Node.create({\n  name: 'tipBox',\n  group: 'block',\n  content: 'block+', // 内部可以放块内容\n  parseHTML() {\n    return [{ tag: 'div.tip-box' }]\n  },\n  renderHTML({ HTMLAttributes }) {\n    return ['div', { class: 'tip-box', ...HTMLAttributes }, 0]\n  },\n  addCommands() {\n    return {\n      insertTipBox: () =&gt; ({ commands }) =&gt; {\n        return commands.insertContent({ type: this.name })\n      }\n    }\n  }\n})\n</code></pre>\n<h3>3. 通用Extension，监听事件、拦截粘贴</h3>\n<pre><code>import { Extension } from '@tiptap/core'\n\nconst MyPaste = Extension.create({\n  name: 'myPaste',\n  addProseMirrorPlugins() {\n    return [\n      new ProseMirrorPlugin({\n        props: {\n          handlePaste(view, event, slice) {\n            // 拦截粘贴逻辑，可以过滤内容、转换图片\n            return false\n          }\n        }\n      })\n    ]\n  }\n})\n</code></pre>\n<h2>四、重要API常用方法</h2>\n<pre><code>// 获取内容\neditor.getHTML()        // html字符串\neditor.getJSON()        // json对象，推荐存储数据库\neditor.getText()        // 纯文本\n\n// 设置内容\neditor.setContent('&lt;p&gt;hello&lt;/p&gt;')\n\n// 焦点\neditor.focus()\neditor.blur()\n\n// 判断选中是否应用标记\neditor.isActive('bold')\neditor.isActive('heading', { level:1 })\n\n// 获取选中范围\neditor.state.selection\n\n// 销毁\neditor.destroy()\n</code></pre>\n<h2>五、常见坑与踩坑点</h2>\n<ol>\n<li><strong>粘贴HTML标签丢失</strong><br>\nTiptap会根据schema过滤不在扩展内的标签。解决：必须写对应 Node / Mark 解析规则 <code>parseHTML</code>。</li>\n<li><strong>图片/表格前后无法输入文字</strong><br>\n缺少 <code>Gapcursor</code> 扩展，务必加入。</li>\n<li><strong>不要直接操作编辑器DOM</strong><br>\n禁止 <code>editor.view.dom.innerHTML=xxx</code>，会破坏ProseMirror内部状态，全部走 <code>setContent</code> / commands。</li>\n<li><strong>存储用JSON，不要直接存HTML</strong><br>\nHTML会丢失部分语义，不同导出会有差异；JSON是内部标准文档模型。回显直接 <code>setContent(json)</code>。</li>\n<li><strong>光标位置丢失</strong><br>\n批量修改内容，优先用 <code>chain().focus()</code> 保证光标复位。</li>\n<li>Link链接点击会跳转\n默认 <code>openOnClick:true</code>，编辑模式下要关闭 <code>Link.configure({openOnClick:false})</code>。</li>\n<li>自定义节点必须正确填写 <code>group</code>、<code>content</code>，否则schema报错，编辑器直接崩溃。</li>\n</ol>\n<h2>六、图片上传插件实现思路</h2>\n<p>Tiptap Image扩展只插入图片url，没有上传能力，需要自己实现：</p>\n<ol>\n<li>监听文件选择/拖拽文件</li>\n<li>上传拿到服务端url</li>\n<li><code>editor.chain().focus().setImage({src: url}).run()</code></li>\n</ol>\n<h2>七、与UEditor、Quill对比</h2>\n<table>\n<thead>\n<tr>\n<th>特性</th>\n<th>Tiptap</th>\n<th>Quill</th>\n<th>UEditor</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>底层</td>\n<td>ProseMirror</td>\n<td>自研delta</td>\n<td>DOM直接操作</td>\n</tr>\n<tr>\n<td>TypeScript</td>\n<td>原生TS</td>\n<td>弱TS</td>\n<td>js老项目</td>\n</tr>\n<tr>\n<td>UI</td>\n<td>无UI，完全自定义</td>\n<td>自带简单工具栏</td>\n<td>完整自带UI</td>\n</tr>\n<tr>\n<td>扩展</td>\n<td>扩展系统强大，自定义节点方便</td>\n<td>格式自定义受限</td>\n<td>二次改源码痛苦</td>\n</tr>\n<tr>\n<td>数据模型</td>\n<td>JSON文档</td>\n<td>Delta</td>\n<td>HTML字符串</td>\n</tr>\n<tr>\n<td>体积</td>\n<td>按需引入，可很小</td>\n<td>中等</td>\n<td>体积巨大</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>适合场景：需要深度定制富文本，自定义弹窗、自定义块组件，Vue/React项目；不想要笨重自带UI编辑器。</p>\n</blockquote>\n<h2>八、包说明</h2>\n<pre><code># 核心\n@tiptap/core          # 内核，原生JS使用\n@tiptap/starter-kit   # 基础套件\n@tiptap/extension-xxx # 各个独立扩展\n\n# 框架封装\n@tiptap/vue-3\n@tiptap/react\n@tiptap/vue-2\n</code></pre>\n<h2>九、简单原生JS完整最小示例</h2>\n<pre><code>&lt;div id=&quot;editor&quot;&gt;&lt;/div&gt;\n\n&lt;script type=&quot;module&quot;&gt;\nimport {Editor} from '@tiptap/core'\nimport StarterKit from '@tiptap/starter-kit'\n\nconst editor = new Editor({\n  element: document.querySelector('#editor'),\n  extensions: [StarterKit],\n  content: '&lt;p&gt;Hello Tiptap&lt;/p&gt;',\n  onUpdate: ({editor})=&gt;{\n    console.log(editor.getHTML())\n  }\n})\n// 执行加粗\neditor.chain().focus().toggleBold().run()\n&lt;/script&gt;\n</code></pre>\n</div>"</script></body></html>
