me">div</span>&gt;</span>\n<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n</code></pre>\n<p>父容器 <code>parent</code> 高度为 0，塌陷。</p>\n<h3>2. 方案1：flow-root（推荐）</h3>\n<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {\n  <span class="hljs-attribute">display</span>: flow-root;\n}\n</code></pre>\n<p>✅ 一行代码、无副作用、纯 CSS 原生、语义清晰。</p>\n<h3>3. 方案2：伪元素清浮动（老方案）</h3>\n<pre><code class="language-css"><span class="hljs-selector-class">.parent</span><span class="hljs-selector-pseudo">::after</span> {\n  <span class="hljs-attribute">content</span>: <span class="hljs-string">&quot;&quot;</span>;\n  <span class="hljs-attribute">display</span>: block;\n  <span class="hljs-attribute">clear</span>: both;\n}\n</code></pre>\n<p>代码更长，历史遗留方案。</p>\n<h3>4. 方案3：overflow 触发 BFC（有副作用）</h3>\n<pre><code class="language-css"><span class="hljs-selector-class">.parent</span> {\n  <span class="hljs-attribute">overflow</span>: hidden;\n}\n</code></pre>\n<p>❌ 会<strong>裁剪溢出内容</strong>   ，弹窗、下拉、阴影会被切掉。</p>\n<h2>五、特性总结</h2>\n<ul>\n<li>元素表现：<strong>块级元素</strong>   ，独占一行，和 <code>block</code> 视觉表现一致</li>\n<li>自带 BFC：\n<ul>\n<li>清除内部浮动</li>\n<li>阻止外边距折叠（margin collapse）</li>\n<li>不会被外部浮动元素覆盖</li>\n</ul>\n</li>\n<li><strong>无副作用</strong>   ：不会裁剪内容、不会改变定位规则</li>\n<li>兼容性：<strong>现代浏览器全支持</strong>   （IE 不支持，老旧项目慎用）</li>\n</ul>\n<h2>六、使用场景</h2>\n<ol>\n<li>父容器包含浮动子元素，需要自动撑开高度</li>\n<li>不想用 <code>overflow:hidden</code> 导致内容裁剪</li>\n<li>替代伪元素清浮动，简化代码</li>\n</ol>\n<h2>七、简单完整示例</h2>\n<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">\n  <span class="hljs-selector-class">.box</span> {\n    <span class="hljs-attribute">width</span>: <span class="hljs-number">300px</span>;\n    <span class="hljs-attribute">border</span>: <span class="hljs-number">2px</span> solid <span class="hljs-number">#333</span>;\n    <span class="hljs-comment">/* 清浮动，撑开父容器 */</span>\n    <span class="hljs-attribute">display</span>: flow-root;\n  }\n  <span class="hljs-selector-class">.item</span> {\n    <span class="hljs-attribute">float</span>: left;\n    <span class="hljs-attribute">width</span>: <span class="hljs-number">100px</span>;\n    <span class="hljs-attribute">height</span>: <span class="hljs-number">100px</span>;\n    <span class="hljs-attribute">background</span>: <span class="hljs-number">#42b983</span>;\n  }\n</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>\n\n<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;box&quot;</span>&gt;</span>\n  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;item&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n</code></pre>\n<p>父容器正常被撑开，无高度塌陷。</p>\n</div>'</script></body></html>
