span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">App</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">return</span> (\n    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Virtuoso</span>\n      <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">height:</span> &quot;<span class="hljs-attr">400px</span>&quot; }} // <span class="hljs-attr">必须给容器高度</span>\n      <span class="hljs-attr">totalCount</span>=<span class="hljs-string">{1000}</span> // <span class="hljs-attr">总数据量</span>\n      <span class="hljs-attr">itemContent</span>=<span class="hljs-string">{(index)</span> =&gt;</span> (\n        <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">padding:</span> &quot;<span class="hljs-attr">10px</span>&quot; }}&gt;</span>Item {index}<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n      )}\n    /&gt;</span>\n  );\n}\n</code></pre>\n<ul>\n<li><strong>必须设置高度</strong>   （固定 px 或父 flex 1）；</li>\n<li><strong>自动虚拟化</strong>   ：只渲染可视区 + 少量缓冲区。</li>\n</ul>\n<hr>\n<h3>三、核心组件一览</h3>\n<h4>1. Virtuoso（基础列表）</h4>\n<p>最常用，<strong>不定高自动适配</strong>   。</p>\n<pre><code class="language-jsx">&lt;<span class="hljs-title class_">Virtuoso</span> totalCount={<span class="hljs-number">1000</span>} itemContent={<span class="hljs-function">(<span class="hljs-params">index</span>) =&gt;</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>Item {index}<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span></span>} /&gt;\n</code></pre>\n<h4>2. GroupedVirtuoso（分组+粘性头部）</h4>\n<p>适合通讯录、分类列表，<strong>组头自动吸顶</strong>   。</p>\n<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">GroupedVirtuoso</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;react-virtuoso&quot;</span>;\n\n<span class="hljs-comment">// groupCounts：每组数量；示例：2组，分别3、2项</span>\n<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">GroupedVirtuoso</span>\n  <span class="hljs-attr">groupCounts</span>=<span class="hljs-string">{[3,</span> <span class="hljs-attr">2</span>]}\n  <span class="hljs-attr">itemContent</span>=<span class="hljs-string">{(index)</span> =&gt;</span> <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>Item {index}<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>}\n  groupContent={(groupIndex) =&gt; (\n    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">background:</span> &quot;#<span class="hljs-attr">eee</span>&quot; }}&gt;</span>Group {groupIndex}<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n  )}\n/&gt;</span>;\n</code></pre>\n<h4>3. VirtuosoGrid（网格布局）</h4>\n<p><strong>响应式网格、等宽项</strong>   。</p>\n<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">VirtuosoGrid</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;react-virtuoso&quot;</span>;\n\n<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">VirtuosoGrid</span>\n  <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">height:</span> <span class="hljs-attr">400</span> }}\n  <span class="hljs-attr">totalCount</span>=<span class="hljs-string">{100}</span>\n  <span class="hljs-attr">itemContent</span>=<span class="hljs-string">{(index)</span> =&gt;</span> (\n    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">border:</span> &quot;<span class="hljs-attr">1px</span> <span class="hljs-attr">solid</span> #<span class="hljs-attr">ccc</span>&quot;, <span class="hljs-attr">padding:</span> <span class="hljs-attr">20</span> }}&gt;</span>Grid {index}<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n  )}\n  listStyle={{ display: &quot;flex&quot;, flexWrap: &quot;wrap&quot;, gap: &quot;10px&quot; }}\n/&gt;</span>;\n</code></pre>\n<h4>4. TableVirtuoso（虚拟表格）</h4>\n<p><strong>虚拟行、粘性表头、原生 table 结构</strong>   。</p>\n<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">TableVirtuoso</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;react-virtuoso&quot;</span>;\n\n<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">TableVirtuoso</span>\n  <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">height:</span> <span class="hljs-attr">400</span> }}\n  <span class="hljs-attr">totalCount</span>=<span class="hljs-string">{100}</span>\n  <span class="hljs-attr">itemContent</span>=<span class="hljs-string">{(index)</span> =&gt;</span> (\n    <span class="hljs-tag">&lt;<span class="hljs-name">tr</span>&gt;</span>\n      <span class="hljs-tag">&lt;<span class="hljs-name">td</span>&gt;</span>{index}<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>\n      <span class="hljs-tag">&lt;<span class="hljs-name">td</span>&gt;</span>Data {index}<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>\n    <span class="hljs-tag">&lt;/<span class="hljs-name">tr</span>&gt;</span>\n  )}\n  header={() =&gt; (\n    <span class="hljs-tag">&lt;<span class="hljs-name">tr</span>&gt;</span>\n      <span class="hljs-tag">&lt;<span class="hljs-name">th</span>&gt;</span>ID<span class="hljs-tag">&lt;/<span class="hljs-name">th</span>&gt;</span>\n      <span class="hljs-tag">&lt;<span class="hljs-name">th</span>&gt;</span>Name<span class="hljs-tag">&lt;/<span class="hljs-name">th</span>&gt;</span>\n    <span class="hljs-tag">&lt;/<span class="hljs-name">tr</span>&gt;</span>\n  )}\n/&gt;</span>;\n</code></pre>\n<h4>5. VirtuosoMessageList（聊天列表）</h4>\n<p><strong>反向滚动、消息追加/前置、滚动位置控制</strong>   。</p>\n<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">VirtuosoMessageList</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;react-virtuoso&quot;</span>;\n\n<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">VirtuosoMessageList</span>\n  <span class="hljs-attr">groupCounts</span>=<span class="hljs-string">{[5,</span> <span class="hljs-attr">3</span>]}\n  <span class="hljs-attr">itemContent</span>=<span class="hljs-string">{(index)</span> =&gt;</span> <span class="hljs-tag">&lt;<span class="hljs-name">div</span>&gt;</span>Msg {index}<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>}\n/&gt;</span>;\n</code></pre>\n<hr>\n<h3>四、核心 Props 详解</h3>\n<h4>基础</h4>\n<ul>\n<li><strong>totalCount: number</strong>   ：总数据条数（必填）。</li>\n<li><strong>itemContent: (index, item, context) =&gt; ReactNode</strong>   ：渲染每一项（必填）。</li>\n<li><strong>style: React.CSSProperties</strong>   ：容器样式，<strong>必须设 height</strong>   。</li>\n</ul>\n<h4>性能与渲染</h4>\n<ul>\n<li><strong>overscan: number | { main: number; reverse: number }</strong>   ：可视区外多渲染几项，减少滚动白屏；默认 5。</li>\n<li><strong>increaseViewportBy: number | { top: number; bottom: number }</strong>   ：扩大虚拟视口范围，和 overscan 类似。</li>\n<li><strong>fixedItemHeight: number</strong>   ：如果所有项<strong>高度一致</strong>   ，可设此值<strong>跳过自动测量，性能更高</strong>   。</li>\n</ul>\n<h4>无限滚动</h4>\n<ul>\n<li><strong>endReached: () =&gt; void</strong>   ：滚动到底部触发，<strong>加载下一页</strong>   。</li>\n<li><strong>startReached: () =&gt; void</strong>   ：滚动到顶部触发，<strong>加载上一页（聊天）</strong>   。</li>\n<li><strong>initialTopMostItemIndex: number</strong>   ：初始滚动到指定索引。</li>\n</ul>\n<h4>自定义 UI</h4>\n<ul>\n<li><strong>Header: React.ComponentType</strong>   ：顶部自定义组件。</li>\n<li><strong>Footer: React.ComponentType</strong>   ：底部自定义组件。</li>\n<li><strong>EmptyPlaceholder: React.ComponentType</strong>   ：空列表时显示。</li>\n</ul>\n<h4>滚动控制（Ref）</h4>\n<pre><code class="language-jsx"><span class="hljs-keyword">const</span> virtuosoRef = <span class="hljs-title function_">useRef</span>(<span class="hljs-literal">null</span>);\n\n<span class="hljs-comment">// 滚动到指定索引</span>\nvirtuosoRef.<span class="hljs-property">current</span>.<span class="hljs-title function_">scrollToIndex</span>({ <span class="hljs-attr">index</span>: <span class="hljs-number">50</span>, <span class="hljs-attr">behavior</span>: <span class="hljs-string">&quot;smooth&quot;</span> });\n\n<span class="hljs-comment">// 滚动到顶部</span>\nvirtuosoRef.<span class="hljs-property">current</span>.<span class="hljs-title function_">scrollToTop</span>();\n\n<span class="hljs-comment">// 滚动到底部</span>\nvirtuosoRef.<span class="hljs-property">current</span>.<span class="hljs-title function_">scrollToBottom</span>();\n</code></pre>\n<hr>\n<h3>五、不定高原理与性能要点</h3>\n<h4>自动测量原理</h4>\n<ol>\n<li>首屏渲染少量项；</li>\n<li>用 <strong>ResizeObserver</strong>   监听每项尺寸变化；</li>\n<li>动态计算总滚动高度，<strong>无需手动传高度</strong>   。</li>\n</ol>\n<h4>性能最佳实践</h4>\n<ul>\n<li>✅ <strong>必须给容器固定高度</strong>   （或 flex:1）；</li>\n<li>✅ 项内容尽量<strong>轻量化</strong>   ，避免复杂渲染；</li>\n<li>✅ 数据量大时用 <strong>endReached</strong>   分页加载；</li>\n<li>✅ 高度固定时<strong>务必用 fixedItemHeight</strong>   ；</li>\n<li>❌ 不要在 itemContent 里做<strong>复杂计算/请求</strong>   ；</li>\n<li>❌ 不要给列表项加<strong>频繁变动的 state</strong>   。</li>\n</ul>\n<hr>\n<h3>六、常见场景代码示例</h3>\n<h4>1. 不定高列表 + 无限滚动</h4>\n<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Virtuoso</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;react-virtuoso&quot;</span>;\n<span class="hljs-keyword">import</span> { useState, useEffect } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;react&quot;</span>;\n\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">App</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">const</span> [data, setData] = <span class="hljs-title function_">useState</span>(<span class="hljs-title class_">Array</span>.<span class="hljs-title function_">from</span>({ <span class="hljs-attr">length</span>: <span class="hljs-number">50</span> }, <span class="hljs-function">(<span class="hljs-params">_, i</span>) =&gt;</span> i));\n  <span class="hljs-keyword">const</span> loading = <span class="hljs-title function_">useState</span>(<span class="hljs-literal">false</span>);\n\n  <span class="hljs-keyword">const</span> <span class="hljs-title function_">loadMore</span> = (<span class="hljs-params"></span>) =&gt; {\n    <span class="hljs-keyword">if</span> (loading[<span class="hljs-number">0</span>]) <span class="hljs-keyword">return</span>;\n    loading[<span class="hljs-number">1</span>](<span class="hljs-literal">true</span>);\n    <span class="hljs-built_in">setTimeout</span>(<span class="hljs-function">() =&gt;</span> {\n      <span class="hljs-title function_">setData</span>(<span class="hljs-function">(<span class="hljs-params">prev</span>) =&gt;</span> [\n        ...prev,\n        ...<span class="hljs-title class_">Array</span>.<span class="hljs-title function_">from</span>({ <span class="hljs-attr">length</span>: <span class="hljs-number">50</span> }, <span class="hljs-function">(<span class="hljs-params">_, i</span>) =&gt;</span> prev.<span class="hljs-property">length</span> + i),\n      ]);\n      loading[<span class="hljs-number">1</span>](<span class="hljs-literal">false</span>);\n    }, <span class="hljs-number">1000</span>);\n  };\n\n  <span class="hljs-keyword">return</span> (\n    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Virtuoso</span>\n      <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">height:</span> &quot;<span class="hljs-attr">500px</span>&quot; }}\n      <span class="hljs-attr">totalCount</span>=<span class="hljs-string">{data.length}</span>\n      <span class="hljs-attr">itemContent</span>=<span class="hljs-string">{(index)</span> =&gt;</span> (\n        <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">padding:</span> &quot;<span class="hljs-attr">15px</span>&quot;, <span class="hljs-attr">borderBottom:</span> &quot;<span class="hljs-attr">1px</span> <span class="hljs-attr">solid</span> #<span class="hljs-attr">eee</span>&quot; }}&gt;</span>\n          Item {index} — 不定高内容{&quot; &quot;}\n          {Math.random() &gt; 0.5 ? &quot;长文本&quot;.repeat(10) : &quot;短文本&quot;}\n        <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n      )}\n      endReached={loadMore}\n      overscan={10}\n    /&gt;</span>\n  );\n}\n</code></pre>\n<h4>2. 分组粘性头部</h4>\n<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">GroupedVirtuoso</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;react-virtuoso&quot;</span>;\n\n<span class="hljs-keyword">const</span> groups = [\n  { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Group A&quot;</span>, <span class="hljs-attr">count</span>: <span class="hljs-number">3</span> },\n  { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;Group B&quot;</span>, <span class="hljs-attr">count</span>: <span class="hljs-number">5</span> },\n];\n\n<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">App</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">return</span> (\n    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">GroupedVirtuoso</span>\n      <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">height:</span> <span class="hljs-attr">400</span> }}\n      <span class="hljs-attr">groupCounts</span>=<span class="hljs-string">{groups.map((g)</span> =&gt;</span> g.count)}\n      groupContent={(groupIndex) =&gt; (\n        <span class="hljs-tag">&lt;<span class="hljs-name">div</span>\n          <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">padding:</span> &quot;<span class="hljs-attr">10px</span>&quot;, <span class="hljs-attr">background:</span> &quot;#<span class="hljs-attr">f5f5f5</span>&quot;, <span class="hljs-attr">fontWeight:</span> &quot;<span class="hljs-attr">bold</span>&quot; }}\n        &gt;</span>\n          {groups[groupIndex].name}\n        <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n      )}\n      itemContent={(index) =&gt; (\n        <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">style</span>=<span class="hljs-string">{{</span> <span class="hljs-attr">padding:</span> &quot;<span class="hljs-attr">10px</span>&quot; }}&gt;</span>Item {index}<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n      )}\n    /&gt;</span>\n  );\n}\n</code></pre>\n<hr>\n<h3>七、优缺点总结</h3>\n<h4>优点</h4>\n<ul>\n<li>✅ <strong>零配置不定高</strong>   ：最省心；</li>\n<li>✅ <strong>自动动态尺寸</strong>   ：内容变高自动适配；</li>\n<li>✅ <strong>组件丰富</strong>   ：列表/网格/表格/聊天全覆盖；</li>\n<li>✅ <strong>性能优秀</strong>   ：虚拟滚动 + 高效测量；</li>\n<li>✅ <strong>现代维护</strong>   ：GitHub 活跃、文档完善。</li>\n</ul>\n<h4>缺点</h4>\n<ul>\n<li>❌ 包体积比 react‑window 稍大；</li>\n<li>❌ 极复杂布局（多层嵌套）可能有测量误差；</li>\n<li>❌ 不支持 IE。</li>\n</ul>\n<hr>\n<h3>八、适用场景</h3>\n<ul>\n<li>超大列表/表格（1000+ 条）；</li>\n<li><strong>不定高</strong>   内容（富文本、图片、卡片）；</li>\n<li>聊天/消息列表（反向滚动、追加）；</li>\n<li>分组列表（通讯录、分类）；</li>\n<li>响应式网格（图片墙、商品列表）。</li>\n</ul>\n</div>'</script></body></html>
