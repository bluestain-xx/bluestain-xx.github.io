o，TS 新增类型）</h2>\n<p><code>object</code> 代表<strong>非原始类型</strong>   。\n原始类型：<code>string</code> / <code>number</code> / <code>boolean</code> / <code>symbol</code> / <code>null</code> / <code>undefined</code>\n👉 所以<strong>只能赋值：对象、数组、函数</strong></p>\n<pre><code>let b: object;\nb = {};\nb = [1,2];\nb = () =&gt; {};\n// b = 123;    // 报错，原始类型不行\n// b = &quot;hi&quot;;   // 报错\n// b = null;   // 报错\n</code></pre>\n<blockquote>\n<p>特点：知道它是对象，但不知道对象有哪些属性。\n不能直接访问任意自定义属性：</p>\n</blockquote>\n<pre><code>b.name = &quot;test&quot;; // 报错：类型 object 上不存在属性 name\n</code></pre>\n<h2>3. <code>{}</code> 空对象字面量类型</h2>\n<p><code>{}</code> 含义：<strong>没有声明任何自有属性的对象类型</strong><br>\n⚠️ 重点坑：<strong>原始值也可以赋值给 <code>{}</code></strong>   ！\n原理：JS 原始值有包装对象，它们也继承 <code>Object.prototype</code>，没有冲突属性。</p>\n<pre><code>let c: {};\nc = 123;\nc = &quot;abc&quot;;\nc = true;\nc = {};\nc = [];\n// c = null;      // 报错\n// c = undefined; // 报错\n</code></pre>\n<p>⚠️ 但是：<strong>不能添加/读取任意自定义属性</strong></p>\n<pre><code>c.foo = 1; // 报错：类型 {} 上不存在属性 foo\n</code></pre>\n<p>允许调用原型链上的方法：</p>\n<pre><code>c.toString(); // ok\n</code></pre>\n<h1>对比表格</h1>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>允许赋值</th>\n<th>禁止赋值</th>\n<th>能否访问自定义属性</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>Object</code></td>\n<td>number/string/boolean/对象/数组/函数</td>\n<td>null, undefined</td>\n<td>❌ 只能原型方法</td>\n</tr>\n<tr>\n<td><code>object</code></td>\n<td>对象/数组/函数</td>\n<td>所有原始值、null、undefined</td>\n<td>❌</td>\n</tr>\n<tr>\n<td><code>{}</code></td>\n<td>number/string/boolean/对象/数组/函数</td>\n<td>null, undefined</td>\n<td>❌</td>\n</tr>\n</tbody>\n</table>\n<h1>高频易错点区分</h1>\n<h3>① <code>object</code> vs <code>{}</code></h3>\n<ul>\n<li><code>object</code>：<strong>排除原始类型</strong>   ，只能是引用类型（对象、数组、函数）</li>\n<li><code>{}</code>：<strong>不排除原始类型</strong>   ，数字字符串布尔都能赋值进去，只是不能读写自定义属性</li>\n</ul>\n<pre><code>let v1: object = 1; // ❌\nlet v2: {} = 1;     // ✅\n</code></pre>\n<h3>② <code>{}</code> 不是空对象！</h3>\n<p>很多人误以为 <code>{}</code> 代表空对象 <code>{}</code>，这是最大误区。\n如果你想表达<strong>空对象（只能是 <code>{}</code>，不能是数字字符串）</strong>   ，不能写 <code>{}</code>，应该：</p>\n<pre><code>type EmptyObj = Record&lt;string, never&gt;\nconst o: EmptyObj = {}; // ok\nconst o2: EmptyObj = 1; // 报错\n</code></pre>\n<h1>开发中该怎么选？</h1>\n<ol>\n<li>想表示<strong>普通对象，任意键值</strong>   ：用 <code>Record&lt;string, unknown&gt;</code>，不要用 <code>object</code> / <code>Object</code> / <code>{}</code></li>\n<li>只想表示<strong>引用类型（不是原始值）</strong>   ：用 <code>object</code></li>\n<li><strong>不要用大写 <code>Object</code></strong>   ，它几乎没有合适场景</li>\n<li><code>{}</code> 一般很少主动写，常见是泛型推导出来，它不是用来描述空对象</li>\n</ol>\n<h1>扩展：配合 <code>unknown</code> / <code>any</code> 辅助理解</h1>\n<ul>\n<li><code>unknown</code>：任何值都能赋值，但使用前必须类型收窄</li>\n<li><code>object</code>：只能是引用类型</li>\n<li><code>{}</code>：可以是原始包装类型，但是不能访问自定义属性</li>\n</ul>\n</div>"</script></body></html>
