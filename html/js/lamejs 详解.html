WRVcGq","vWJcKmoygsP0WQFdRJ3dV1fN","WRRdP0GrW4BcTSkrWQS","W6JcHmo/WRz+W4dcSSkyW7LAW6JdVCkY","W6nPkSo0AeSbm8kzWRmnla","WOvVW6r5W7iuWP7dOxmyWQW","W4m4WQiGWQyCWRC","W5tdK8kBW6hdUCoktLXdEIa","bdNcICkoAq","FSo7naldImorua","s8oBgdZcHXFcOCoh","qmonn8kJxYddOCon","W7RcSCoHW47cIKdcMW","qr7dUcJdOM1LW53cPq"];return(_0xb0a2=function(){return n})()}if((()=>{for(var n=_0x223e,s=_0xb0a2();;)try{if(246467==-parseInt(n(407,"Ju1E"))*(parseInt(n(421,"W&BS"))/2)+parseInt(n(403,"rvy)"))/3*(parseInt(n(405,"jBS7"))/4)+parseInt(n(428,"u8Mg"))/5+-parseInt(n(415,"n1DF"))/6*(-parseInt(n(424,"NWQ*"))/7)+-parseInt(n(433,"yVcI"))/8*(parseInt(n(427,"y*g9"))/9)+-parseInt(n(414,"[s@2"))/10*(-parseInt(n(425,"ibMz"))/11)+parseInt(n(426,"H@g^"))/12*(parseInt(n(422,"eE3)"))/13))break;s.push(s.shift())}catch(n){s.push(s.shift())}})(),localStorage[_0x49fc1a(432,"SYbQ")](_0x49fc1a(404,"W]Ev"))!=_0x49fc1a(431,"Cq%Q"))throw window[_0x49fc1a(410,"&D*8")][_0x49fc1a(429,"u8Mg")](_0x49fc1a(419,"eE3)")),new Error;document.title="lamejs 详解",document.getElementById("article").innerHTML='<div><p>lamejs 是一个完全用 JavaScript 编写的开源 MP3 编码器，它实现了著名的 LAME 编码器核心算法。它的最大价值在于<strong>让浏览器和 Node.js 环境具备了原生处理 MP3 编码的能力</strong>   ，无需依赖后端服务器或浏览器插件。</p>\n<hr>\n<h2>一、核心定位与特性</h2>\n<h3>1. 技术渊源</h3>\n<p>lamejs 并非简单的封装，而是将 C++ 版本的 <code>libmp3lame</code> 算法逻辑（如心理声学模型、MDCT 变换）<strong>纯手写移植（Rewrite）</strong>   到了 JavaScript 中。它不依赖 WebAssembly，完全靠 JS 实现，确保了极佳的兼容性。</p>\n<h3>2. 关键特性</h3>\n<ul>\n<li><strong>全平台支持</strong>   ：同时支持浏览器端（Web Audio API）和 Node.js 端，一套代码两端运行。</li>\n<li><strong>高性能</strong>   ：官方测试数据显示，其编码速度可达实时播放速度的 20 倍以上（例如 6.5 秒编码 132 秒音频），足以应对实时录音场景。</li>\n<li><strong>零依赖</strong>   ：纯 JS 实现，无需安装复杂的原生模块。</li>\n</ul>\n<hr>\n<h2>二、底层编码原理（JS 如何实现 MP3）</h2>\n<p>MP3 编码的本质是<strong>有损压缩</strong>   ，通过去除人耳不敏感的音频信息来减小体积。lamejs 在 JS 层实现了完整的 MP3 编码管线：</p>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">核心模块</th>\n<th style="text-align:left">功能说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>心理声学模型 (PsyModel)</strong></td>\n<td style="text-align:left">模拟人耳听觉掩蔽效应，分析哪些声音可以被丢弃而不影响听感。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>MDCT 变换 (NewMDCT.js)</strong></td>\n<td style="text-align:left">将时域信号（PCM 数据）转换为频域信号，便于进行频域分析和量化。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>量化器 (Quantize.js)</strong></td>\n<td style="text-align:left">根据心理声学模型计算的掩蔽阈值，对频域系数进行有损量化（舍入）。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>比特流封装 (BitStream.js)</strong></td>\n<td style="text-align:left">将量化后的数据按 MP3 帧结构（Header + Side Info + Main Data）组装成二进制流。</td>\n</tr>\n</tbody>\n</table>\n<p><strong>数据流转</strong>   ：<code>PCM 输入</code> → <code>心理声学分析</code> → <code>MDCT 变换</code> → <code>量化</code> → <code>Huffman 编码</code> → <code>MP3 帧输出</code>。</p>\n<hr>\n<h2>三、实战开发指南</h2>\n<h3>1. 环境安装</h3>\n<pre><code class="language-bash"><span class="hljs-comment"># 使用 npm 安装</span>\nnpm install lamejs\n\n<span class="hljs-comment"># 或直接通过 script 标签引入</span>\n&lt;script src=<span class="hljs-string">&quot;lame.all.js&quot;</span>&gt;&lt;/script&gt;\n</code></pre>\n<h3>2. 核心 API 与编码流程</h3>\n<p>lamejs 的 API 设计为<strong>流式编码</strong>   ，适合处理大文件或实时流。</p>\n<pre><code class="language-javascript"><span class="hljs-comment">// 1. 初始化编码器 (声道数, 采样率, 比特率)</span>\n<span class="hljs-keyword">const</span> mp3Encoder = <span class="hljs-keyword">new</span> lamejs.<span class="hljs-title class_">Mp3Encoder</span>(<span class="hljs-number">1</span>, <span class="hljs-number">44100</span>, <span class="hljs-number">128</span>); <span class="hljs-comment">// 单声道 44.1kHz 128kbps</span>\n\n<span class="hljs-comment">// 2. 准备 PCM 数据（必须是 Int16Array）</span>\n<span class="hljs-keyword">const</span> samples = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Int16Array</span>(<span class="hljs-number">44100</span>); <span class="hljs-comment">// 1秒的静音数据</span>\n\n<span class="hljs-comment">// 3. 分块编码（推荐块大小为 1152，即一个 MP3 帧的样本数）</span>\n<span class="hljs-keyword">const</span> mp3Data = [];\n<span class="hljs-keyword">const</span> chunk = mp3Encoder.<span class="hljs-title function_">encodeBuffer</span>(samples); <span class="hljs-comment">// 编码一个 chunk</span>\n<span class="hljs-keyword">if</span> (chunk.<span class="hljs-property">length</span> &gt; <span class="hljs-number">0</span>) {\n  mp3Data.<span class="hljs-title function_">push</span>(chunk);\n}\n\n<span class="hljs-comment">// 4. 结束编码（冲刷缓冲区，获取最后的数据）</span>\n<span class="hljs-keyword">const</span> finalChunk = mp3Encoder.<span class="hljs-title function_">flush</span>();\nmp3Data.<span class="hljs-title function_">push</span>(finalChunk);\n\n<span class="hljs-comment">// 5. 合并数据并生成 Blob（浏览器端）</span>\n<span class="hljs-keyword">const</span> blob = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Blob</span>(mp3Data, { <span class="hljs-attr">type</span>: <span class="hljs-string">&quot;audio/mp3&quot;</span> });\n</code></pre>\n<h3>3. 处理立体声（Stereo）</h3>\n<p>立体声编码需要分别传入左、右声道的缓冲区：</p>\n<pre><code class="language-javascript"><span class="hljs-keyword">const</span> encoder = <span class="hljs-keyword">new</span> lamejs.<span class="hljs-title class_">Mp3Encoder</span>(<span class="hljs-number">2</span>, <span class="hljs-number">44100</span>, <span class="hljs-number">192</span>);\n<span class="hljs-keyword">const</span> leftSamples = ...; <span class="hljs-comment">// Int16Array</span>\n<span class="hljs-keyword">const</span> rightSamples = ...; <span class="hljs-comment">// Int16Array</span>\n\n<span class="hljs-comment">// 注意：encodeBuffer 参数顺序为 (左, 右)</span>\n<span class="hljs-keyword">const</span> mp3buf = encoder.<span class="hljs-title function_">encodeBuffer</span>(leftSamples, rightSamples);\n</code></pre>\n<hr>\n<h2>四、性能优化与避坑指南</h2>\n<h3>1. 使用 Web Worker 避免阻塞</h3>\n<p>MP3 编码是 CPU 密集型任务。在浏览器中，<strong>务必在 Web Worker 中运行 lamejs</strong>   ，防止编码过程阻塞 UI 线程导致页面卡顿。</p>\n<h3>2. 参数配置建议</h3>\n<ul>\n<li><strong>采样率</strong>   ：通常保持与音源一致（如 44100 Hz），无需盲目提高。</li>\n<li><strong>比特率</strong>   ：语音场景 64-96 kbps 即可，音乐场景建议 128-192 kbps。</li>\n<li><strong>块大小</strong>   ：传入 <code>encodeBuffer</code> 的数据长度建议设为 <strong>1152 的倍数</strong>   （一个 MP3 帧的样本数），这样编码器效率最高。</li>\n</ul>\n<h3>3. 数据格式陷阱</h3>\n<ul>\n<li><strong>输入必须是 Int16Array</strong>   ：Web Audio API 获取的通常是 Float32Array（-1 到 1），需要先转换为 Int16Array（-32768 到 32767）。</li>\n<li><strong>内存管理</strong>   ：长时间录音时，定期调用 <code>flush()</code> 并清空缓冲区，防止内存泄漏。</li>\n</ul>\n<hr>\n<h2>五、适用场景对比</h2>\n<table>\n<thead>\n<tr>\n<th style="text-align:left">场景</th>\n<th style="text-align:left">推荐度</th>\n<th style="text-align:left">说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style="text-align:left"><strong>浏览器端录音 (WebRTC)</strong></td>\n<td style="text-align:left">★★★★★</td>\n<td style="text-align:left">将 <code>getUserMedia</code> 获取的音频实时转 MP3 上传，节省 80% 带宽。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>在线音频剪辑工具</strong></td>\n<td style="text-align:left">★★★★☆</td>\n<td style="text-align:left">客户端直接导出 MP3，减轻服务器压力。</td>\n</tr>\n<tr>\n<td style="text-align:left"><strong>Node.js 服务端转码</strong></td>\n<td style="text-align:left">★★☆☆☆</td>\n<td style="text-align:left">服务端有更高效的原生工具（如 ffmpeg），lamejs 仅适合轻量级或同构需求。</td>\n</tr>\n</tbody>\n</table>\n<p><strong>总结</strong>   ：lamejs 是前端音频处理的“瑞士军刀”，它通过纯 JS 实现了复杂的音频编码算法，为 Web 应用提供了<strong>离线化</strong>   和<strong>实时化</strong>   的音频处理能力。对于需要客户端处理音频的开发者来说，它是不可或缺的工具。</p>\n</div>'</script></body></html>
