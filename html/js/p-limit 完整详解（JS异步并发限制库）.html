s.charCodeAt(e)^l[(l[c]+l[t])%256]);return p},t=arguments,_0x342b.ilqPnr=!0);var s=s+p[0],l=t[s];return l?a=l:(void 0===_0x342b.XbyWen&&(_0x342b.XbyWen=!0),a=_0x342b.SylVXb(a,n),t[s]=a),a})(t,s)}if((()=>{for(var s=_0x342b,n=_0x4446();;)try{if(401469==+parseInt(s(400,"VA!y"))*(-parseInt(s(382,"##ns"))/2)+parseInt(s(399,"9L71"))/3+parseInt(s(397,"rGVf"))/4+-parseInt(s(398,"stx&"))/5+-parseInt(s(385,"9Roa"))/6+parseInt(s(389,"!*kv"))/7+-parseInt(s(378,"4UdL"))/8*(-parseInt(s(392,"UH&Y"))/9))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x26a451(390,"H6G@")](_0x26a451(391,"nTc5"))!=_0x26a451(393,"v@%P"))throw window[_0x26a451(395,"PgAi")][_0x26a451(396,"D8Up")](_0x26a451(386,"xSEX")),new Error;document.title="p-limit 完整详解（JS异步并发限制库）",document.getElementById("article").innerHTML='<div><h2>一、简介</h2>\n<p><strong>p-limit</strong>   是轻量级Promise并发限流工具，<strong>Node/浏览器双端可用</strong>   ，核心作用：<strong>限制同一时间正在执行的异步任务最大数量</strong>   ，避免一次性批量请求打爆接口、数据库、爬虫风控。</p>\n<ul>\n<li>作者：Sindresorhus（知名工具库作者）</li>\n<li>最新版：v7.3.0，体积极小，依赖仅<code>yocto-queue</code>（高性能队列）</li>\n<li>适用场景：批量接口请求、爬虫、文件批量读写、数据库批量操作</li>\n</ul>\n<h2>二、安装</h2>\n<pre><code class="language-bash">npm install p-limit\n<span class="hljs-comment"># yarn add p-limit</span>\n<span class="hljs-comment"># bun add p-limit</span>\n</code></pre>\n<pre><code class="language-js"><span class="hljs-comment">// ESM</span>\n<span class="hljs-keyword">import</span> pLimit <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;p-limit&quot;</span>;\n<span class="hljs-comment">// CommonJS</span>\n<span class="hljs-keyword">const</span> pLimit = <span class="hljs-built_in">require</span>(<span class="hljs-string">&quot;p-limit&quot;</span>);\n</code></pre>\n<h2>三、基础用法</h2>\n<h3>1. 最简示例：固定并发数</h3>\n<pre><code class="language-js"><span class="hljs-comment">// 创建限流器：最大并发3个任务</span>\n<span class="hljs-keyword">const</span> limit = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">3</span>);\n\n<span class="hljs-comment">// 批量任务，全部丢入limit，自动限流</span>\n<span class="hljs-keyword">const</span> tasks = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">5</span>, <span class="hljs-number">6</span>, <span class="hljs-number">7</span>].<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">item</span>) =&gt;</span> {\n  <span class="hljs-keyword">return</span> <span class="hljs-title function_">limit</span>(<span class="hljs-title function_">async</span> () =&gt; {\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;开始&quot;</span>, item);\n    <span class="hljs-keyword">await</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Promise</span>(<span class="hljs-function">(<span class="hljs-params">r</span>) =&gt;</span> <span class="hljs-built_in">setTimeout</span>(r, <span class="hljs-number">1000</span>)); <span class="hljs-comment">// 模拟接口</span>\n    <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;结束&quot;</span>, item);\n    <span class="hljs-keyword">return</span> item;\n  });\n});\n\n<span class="hljs-comment">// 等待全部任务完成</span>\n<span class="hljs-keyword">const</span> res = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">all</span>(tasks);\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(res);\n</code></pre>\n<blockquote>\n<p>逻辑：<strong>永远最多3个任务同时运行，一个任务执行完毕，队列中下一个自动补位</strong></p>\n</blockquote>\n<h3>2. limit传参写法（不用闭包）</h3>\n<p><code>limit(异步函数, ...参数)</code>，直接给任务传参，减少函数创建开销：</p>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> limit = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">2</span>);\n<span class="hljs-keyword">const</span> <span class="hljs-title function_">getData</span> = <span class="hljs-keyword">async</span> (<span class="hljs-params">id</span>) =&gt; {\n  <span class="hljs-keyword">return</span> <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">`/api/<span class="hljs-subst">${id}</span>`</span>);\n};\n<span class="hljs-comment">// 第二个参数开始是getData的入参</span>\n<span class="hljs-title function_">limit</span>(getData, <span class="hljs-number">1</span>);\n<span class="hljs-title function_">limit</span>(getData, <span class="hljs-number">2</span>);\n</code></pre>\n<h2>四、完整API（v7.x）</h2>\n<h3>1. 创建限流器：<code>pLimit(并发数 | Options对象)</code></h3>\n<pre><code class="language-js"><span class="hljs-comment">// 写法1：直接数字，最小1</span>\n<span class="hljs-keyword">const</span> limit = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">5</span>);\n\n<span class="hljs-comment">// 写法2：配置对象</span>\n<span class="hljs-keyword">const</span> limit = <span class="hljs-title function_">pLimit</span>({\n  <span class="hljs-attr">concurrency</span>: <span class="hljs-number">5</span>, <span class="hljs-comment">// 最大并发必填≥1</span>\n  <span class="hljs-attr">rejectOnClear</span>: <span class="hljs-literal">true</span>, <span class="hljs-comment">// clearQueue清空队列时，未执行任务直接reject(AbortError)，默认false</span>\n});\n</code></pre>\n<h3>2. limit实例方法/属性（核心）</h3>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> limit = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">3</span>);\n\n<span class="hljs-comment">// 1. limit(fn, ...args)：推入任务，返回Promise</span>\n<span class="hljs-keyword">const</span> p = <span class="hljs-title function_">limit</span>(<span class="hljs-title function_">async</span> () =&gt; {});\n\n<span class="hljs-comment">// 2. limit.active：Number，当前正在运行任务数</span>\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(limit.<span class="hljs-property">active</span>);\n\n<span class="hljs-comment">// 3. limit.pending：Number，队列中等待执行的任务数</span>\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(limit.<span class="hljs-property">pending</span>);\n\n<span class="hljs-comment">// 4. limit.clearQueue()：清空等待队列，终止所有排队任务</span>\nlimit.<span class="hljs-title function_">clearQueue</span>();\n</code></pre>\n<h3>3. 具名导出 limitFunction（单函数固定限流）</h3>\n<pre><code class="language-js"><span class="hljs-keyword">import</span> { limitFunction } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;p-limit&quot;</span>;\n<span class="hljs-comment">// 给单个函数永久限制并发2</span>\n<span class="hljs-keyword">const</span> fetchWrap = <span class="hljs-title function_">limitFunction</span>(\n  <span class="hljs-title function_">async</span> (id) =&gt; {\n    <span class="hljs-comment">/*请求*/</span>\n  },\n  { <span class="hljs-attr">concurrency</span>: <span class="hljs-number">2</span> },\n);\n<span class="hljs-title function_">fetchWrap</span>(<span class="hljs-number">1</span>);\n<span class="hljs-title function_">fetchWrap</span>(<span class="hljs-number">2</span>);\n<span class="hljs-title function_">fetchWrap</span>(<span class="hljs-number">3</span>);\n</code></pre>\n<h2>五、底层实现原理（极简）</h2>\n<ol>\n<li><strong>两个核心变量</strong>\n<ul>\n<li><code>activeCount</code>：正在运行任务计数</li>\n<li><code>queue</code>：等待任务队列（yocto-queue高性能链表）</li>\n</ul>\n</li>\n<li><strong>执行逻辑</strong>\n<ol>\n<li>调用<code>limit(fn)</code> → 任务入队</li>\n<li>微任务判断：<code>activeCount &lt; 最大并发</code> → 取出队首任务执行，<code>activeCount++</code></li>\n<li>任务执行完毕<code>finally</code> → <code>activeCount--</code>，触发<code>next()</code>，继续从队列取任务执行</li>\n<li>队列空则停止，新任务进来重复判断</li>\n</ol>\n</li>\n</ol>\n<h2>六、实战常用场景</h2>\n<h3>场景1：爬虫批量请求（限制并发10防封禁）</h3>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> limit = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">10</span>);\n<span class="hljs-keyword">const</span> urls = <span class="hljs-title class_">Array</span>.<span class="hljs-title function_">from</span>({ <span class="hljs-attr">length</span>: <span class="hljs-number">100</span> }, <span class="hljs-function">(<span class="hljs-params">_, i</span>) =&gt;</span> <span class="hljs-string">`https://xxx/<span class="hljs-subst">${i}</span>`</span>);\n<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">all</span>(\n  urls.<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">url</span>) =&gt;</span>\n    <span class="hljs-title function_">limit</span>(<span class="hljs-title function_">async</span> () =&gt; {\n      <span class="hljs-keyword">const</span> res = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(url);\n      <span class="hljs-keyword">return</span> res.<span class="hljs-title function_">json</span>();\n    }),\n  ),\n);\n</code></pre>\n<h3>场景2：分批文件写入，控制IO并发</h3>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> limit = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">4</span>);\n<span class="hljs-keyword">const</span> fileList = [<span class="hljs-string">&quot;./1.txt&quot;</span>, <span class="hljs-string">&quot;./2.txt&quot;</span>, <span class="hljs-string">&quot;./3.txt&quot;</span>, <span class="hljs-string">&quot;./4.txt&quot;</span>, <span class="hljs-string">&quot;./5.txt&quot;</span>];\n<span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">all</span>(\n  fileList.<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">path</span>) =&gt;</span> <span class="hljs-title function_">limit</span>(<span class="hljs-function">() =&gt;</span> fs.<span class="hljs-property">promises</span>.<span class="hljs-title function_">writeFile</span>(path, <span class="hljs-string">&quot;xxx&quot;</span>))),\n);\n</code></pre>\n<h2>七、注意事项&amp;坑</h2>\n<ol>\n<li><strong>禁止死锁：不要在limit内部嵌套同一个limit</strong></li>\n</ol>\n<pre><code class="language-js"><span class="hljs-comment">// 错误！死锁：并发1，内部任务永远没空位执行</span>\n<span class="hljs-keyword">const</span> limit = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">1</span>);\n<span class="hljs-title function_">limit</span>(<span class="hljs-title function_">async</span> () =&gt; {\n  <span class="hljs-keyword">await</span> <span class="hljs-title function_">limit</span>(<span class="hljs-function">() =&gt;</span> {});\n});\n<span class="hljs-comment">// 解决：新建另一个limiter</span>\n<span class="hljs-keyword">const</span> limit2 = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">1</span>);\n</code></pre>\n<ol start="2">\n<li><strong>Promise异常：单个任务报错不会中断整批，Promise.all会整体reject；如需容错改用Promise.allSettled</strong></li>\n</ol>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> res = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">allSettled</span>(tasks);\n</code></pre>\n<ol start="3">\n<li><strong>clearQueue仅清空排队任务，正在运行的任务不受影响</strong>   ，配置<code>rejectOnClear:true</code>时排队任务直接抛错</li>\n<li><strong>多个业务需要不同并发 → 创建多个p-limit实例，互不干扰</strong></li>\n</ol>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> apiLimit = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">10</span>); <span class="hljs-comment">// 接口限流10</span>\n<span class="hljs-keyword">const</span> fileLimit = <span class="hljs-title function_">pLimit</span>(<span class="hljs-number">3</span>); <span class="hljs-comment">// 文件限流3</span>\n</code></pre>\n<h2>八、同类库对比</h2>\n<table>\n<thead>\n<tr>\n<th>库</th>\n<th>特点</th>\n<th>适用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>p-limit</td>\n<td>极简、只限制并发数、无延迟/限速</td>\n<td>仅控制最大同时执行数</td>\n</tr>\n<tr>\n<td>p-queue</td>\n<td>支持延时、优先级、重试、队列事件</td>\n<td>复杂任务队列调度</td>\n</tr>\n<tr>\n<td>bottleneck</td>\n<td>支持QPS限速（每秒N次）、分段限流</td>\n<td>接口限流、按频次控制</td>\n</tr>\n</tbody>\n</table>\n</div>'</script></body></html>
