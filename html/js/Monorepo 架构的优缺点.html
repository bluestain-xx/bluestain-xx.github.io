度粗</strong><br>\n一般整个仓库一套权限，很难做到：A开发只能看A应用，不能看B应用代码。对比 multirepo 每个仓库独立权限，隔离性差。</p>\n</li>\n<li>\n<p><strong>构建/CI 压力大（不加增量工具会很痛）</strong><br>\n没有 Turbo / Nx 的增量构建、affected 能力时，哪怕只改一个小工具包，也会触发全量构建、全量测试，CI 耗时很长。</p>\n</li>\n<li>\n<p><strong>变更风险放大</strong><br>\n一个错误提交、坏依赖、违规代码，可能影响仓库内<strong>所有包</strong>   ；对单测、类型检查、前置校验、code review 的要求更高。</p>\n</li>\n<li>\n<p><strong>包之间容易产生隐式耦合、循环依赖</strong><br>\n大家图方便直接互相引用，久而久之边界模糊，写出循环依赖，后期拆包非常麻烦。</p>\n</li>\n<li>\n<p><strong>版本管理复杂度上升</strong></p>\n</li>\n</ol>\n<ul>\n<li>fixed 模式：改一个包，所有包统一升级版本，很多无关包被迫升版；</li>\n<li>independent 模式：需要配套 changesets 等工具管理版本和 Changelog，有额外学习成本。</li>\n</ul>\n<ol start="7">\n<li><strong>不适合完全独立、迭代节奏差异巨大的项目</strong><br>\n如果多个包/业务属于不同团队、迭代周期完全无关、发布周期互不干扰，monorepo 会带来不必要的约束。</li>\n</ol>\n</div>'</script></body></html>
