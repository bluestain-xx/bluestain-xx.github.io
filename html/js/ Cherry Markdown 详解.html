function _0x2153(){var n=["WRFdKCo9acldQSohm03cHW","WOVcPCozWOKJzY8","W5JdHNddK8kyW7PNpmk3nSo7WPVdTW","WRO0vCoLgW","bSkWWO3dKCkFv8owDSo7W5m","WQpcP8kFCMZcRmka","omkrl2ldKIWwxuJcIgNdHLz0WPTDwupdPdxdSCo0W4ldLtGT","W6JdKmoiW6zTW5SHbGa4iSkJkW","C1zxW7a7vSkRWQBdGCoJW48I","W6ldS8oFlZNdV8otW7T9W7DgW6xcUW","W5XetCkkW6hcJGOjtvPDCmoL","W5NdH3FdMmkyW7SNc8kTaCoHWQ8","WRBcJSkBWR8RWOv6iq","W6ddKdNcPmoLfSoEW5hdU3/cU0i","W5LbtCkoWRRdSKSbtK4","W57dLCoKW5rqfI7dU0e","W6ddTSoDktxdUmotW5nIW4bMW5VcUq","W6NdKmoiW69RW5WJbJG5omkFkG","W6ddLZRcP8oUgSkCW43dGvpcOwWh","W6FdKJ3cRCoKfmkDW4ldMu7cO141","W60nWP3cU8okWPhcOCkyWP/cRW"];return(_0x2153=function(){return n})()}document.title=" Cherry Markdown 详解",document.getElementById("article").innerHTML='<div><p>Cherry Markdown（Cherry Editor）是<strong>腾讯开源、Apache-2.0协议</strong>   、纯原生JS实现的Markdown网页编辑器组件，<strong>零框架依赖</strong>   ，可嵌入原生HTML、Vue、React、Angular等任意前端项目，同时提供Node.js解析、Tauri桌面端、VSCode插件，非常适合B端文档、知识库、AI对话流式渲染场景。</p>\n<blockquote>\n<p>GitHub：<a href="https://github.com/Tencent/cherry-markdown" target="_blank">https://github.com/Tencent/cherry-markdown</a></p>\n</blockquote>\n<h2>一、整体架构</h2>\n<p>内核拆分为四大核心模块，微内核+插件化设计：</p>\n<ol>\n<li><strong>Engine 解析引擎</strong>   ：核心MD解析器，负责Markdown转HTML，支持自定义语法Hook、局部增量渲染；单独提供<code>CherryStream</code>，专门用于AI流式输出。</li>\n<li><strong>Editor 编辑区</strong>   ：底层基于CodeMirror，负责代码编辑、光标、多光标、Vim模式、快捷键。</li>\n<li><strong>Previewer 预览区</strong>   ：渲染HTML，<strong>局部DOM更新</strong>   （不是全量重渲染），支持预览区直接拖拽编辑图片、表格（所见即所得）。</li>\n<li><strong>Toolbar 工具栏</strong>   ：顶部工具栏、右侧工具栏、选中文字弹出Bubble悬浮工具栏、行首Float工具栏、悬浮目录TOC，支持自定义按钮、顺序、隐藏。</li>\n</ol>\n<p>源码目录核心：</p>\n<pre><code>packages/cherry-markdown/src\n├── core          # 解析引擎、语法钩子hooks\n├── toolbars      # 各类工具栏实现\n├── addons        # 插件：mermaid、echarts等\n├── locales       # 国际化（中文/英文/俄语）\n├── sass          # 主题样式\n├── Cherry.js     # 入口类\n├── Engine.js\n├── Editor.js\n└── Previewer.js\n</code></pre>\n<h2>二、核心特性</h2>\n<h3>✅ 框架无关，多种构建产物</h3>\n<ul>\n<li>UMD / ESM / IIFE，<code>npm i cherry-markdown</code>引入；</li>\n<li>多种包：完整包、core精简包、<strong>Stream流式包（AI聊天专用，体积更小）</strong>   、仅Engine解析包（Node渲染用）；</li>\n<li>支持多实例、纯预览模式、无工具栏极简模式、移动端H5模式。</li>\n</ul>\n<h3>✅ 性能：局部增量渲染</h3>\n<p>传统MD编辑器每次输入全量解析+全量刷新DOM；Cherry把文档拆成段落/列表/代码块单元，只重新渲染变更模块，长文档（万字）依然流畅，减少DOM开销。</p>\n<blockquote>\n<p><strong>CherryStream 流式渲染（王牌能力）</strong><br>\nAI大模型逐token输出场景，自动补全不完整语法（未闭合代码块、表格、加粗），<strong>不会闪烁原始markdown标记</strong>   ，增量渲染，虚拟光标，适合ChatGPT类对话页面。</p>\n</blockquote>\n<h3>✅ 丰富内置扩展语法（很多是Cherry独有，<strong>无法在其他MD编辑器渲染</strong>   ）</h3>\n<p>兼容CommonMark/GFM标准，额外扩展大量语法：</p>\n<ol>\n<li><strong>图片增强</strong>   ：<code>![alt #宽#高#对齐#圆角#阴影](url)</code>，支持px/百分比，居中、浮动左右，预览区直接拖拽缩放图片</li>\n<li><strong>表格WYSIWYG</strong>   ：预览区直接增删行列、合并单元格；<strong>表格一键转ECharts图表</strong>   （柱状/折线/散点）</li>\n<li>排版面板：<code>::: center</code>居中、<code>::: right</code>右对齐；<code>::: cols</code>多列布局；<code>::: tabs</code>选项卡面板；提示块、手风琴折叠面板</li>\n<li>样式：字体颜色、背景色、上下标、ruby拼音标注</li>\n<li>图表&amp;公式：Mermaid流程图、MathJax LaTeX数学公式</li>\n<li>媒体：<code>!video</code>、<code>!audio</code>直接插入音视频</li>\n<li>任务列表：<code>- [ ] / - [x]</code>，预览可直接点击勾选</li>\n<li>自动目录TOC、标题自动编号、脚注</li>\n<li>HTML粘贴自动转Markdown（复制Word/网页富文本粘贴自动转md，而不是粘贴一堆html）</li>\n</ol>\n<h3>✅ 安全机制</h3>\n<p>内置HTML白名单 + DOMPurify做XSS过滤，默认过滤危险标签/事件，防止注入攻击；可配置是否允许自定义HTML注入。</p>\n<h3>✅ 体验能力</h3>\n<ul>\n<li>双栏分屏，编辑预览滚动联动；</li>\n<li>多光标编辑、Vim编辑模式、完整自定义快捷键；</li>\n<li>导出PDF、长图片；</li>\n<li>图片拖拽上传，可自定义文件上传回调对接图床；</li>\n<li>多主题（亮色/暗色）、代码块高亮主题切换；</li>\n<li>选中文字弹出悬浮工具栏，行首快捷工具栏。</li>\n</ul>\n<h2>三、快速上手示例</h2>\n<h3>1. 原生HTML引入</h3>\n<pre><code>&lt;link rel=&quot;stylesheet&quot; href=&quot;./dist/cherry-markdown.css&quot;&gt;\n&lt;div id=&quot;cherry-container&quot;&gt;&lt;/div&gt;\n&lt;script src=&quot;./dist/cherry-markdown.js&quot;&gt;&lt;/script&gt;\n&lt;script&gt;\nnew Cherry({\n  id: \'cherry-container\',\n  value: \'# Hello Cherry Markdown\\n- [x] 任务1\\n- [ ] 任务2\',\n  editor: {\n    defaultModel: \'edit&amp;preview\' // 双栏模式\n  },\n  engine: {\n    syntax: {\n      table: { enableChart: true } // 开启表格转图表\n    }\n  }\n})\n&lt;/script&gt;\n</code></pre>\n<h3>2. ESM（Vue/React项目）</h3>\n<pre><code>import Cherry from \'cherry-markdown\';\nimport \'cherry-markdown/dist/cherry-markdown.css\';\n\nconst cherry = new Cherry({\n  id: \'container\',\n  value: \'# 标题\',\n  toolbars: {\n    toolbar: [\'bold\', \'italic\', \'header\', \'table\', \'code\'] // 自定义工具栏\n  }\n})\n</code></pre>\n<h2>四、常用实例API</h2>\n<pre><code>cherry.getMarkdown()    // 获取原始markdown文本\ncherry.getHtml()        // 获取渲染后的HTML\ncherry.insert(text)     // 在光标处插入md内容\ncherry.setValue(text)   // 设置全部内容（AI流式场景循环调用）\ncherry.refreshPreviewer() // 刷新预览\ncherry.destroy()        // 销毁实例，释放资源\ncherry.setTheme(\'dark\') // 切换暗色主题\ncherry.on(\'afterChange\', (md, html)=&gt;{}) // 内容变更回调\n</code></pre>\n<h2>五、自定义扩展能力（二次开发）</h2>\n<ol>\n<li><strong>自定义语法Hook</strong>   ：<code>Cherry.createSyntaxHook()</code>，新增自己的markdown语法，替换原有解析规则</li>\n<li><strong>自定义工具栏按钮</strong>   ：<code>Cherry.createMenuHook()</code>，新增按钮、绑定点击事件</li>\n<li><strong>插件系统</strong>   ：<code>Cherry.usePlugin()</code>，如Mermaid、ECharts等插件按需注册</li>\n<li>可拦截图片上传、链接处理、粘贴回调、渲染前HTML处理</li>\n</ol>\n<h2>六、优缺点分析</h2>\n<h3>✅ 优点</h3>\n<ol>\n<li><strong>开箱即用</strong>   ，内置功能多，不用自己拼装md解析+代码高亮+图表+上传；</li>\n<li><strong>AI流式渲染是强项</strong>   ，同类编辑器很难做到稳定不闪；</li>\n<li>纯JS无框架绑定，任意项目接入；</li>\n<li>预览区图片/表格所见即所得，降低用户写复杂md成本；</li>\n<li>细粒度配置：可逐个开关语法、裁剪工具栏、自定义主题；</li>\n<li>安全XSS防护内置。</li>\n</ol>\n<h3>⚠️ 缺点</h3>\n<ol>\n<li><strong>扩展语法非标准</strong>   ：多列、选项卡、图片样式、表格转图表，复制到GitHub、Notion等平台无法正常渲染；</li>\n<li>包体积偏大，Mermaid等高级功能需要额外引入插件；</li>\n<li>社区生态相比<code>marked</code>、<code>markdown-it</code>小，问题案例较少；</li>\n<li>底层编辑器是CodeMirror5，较老旧；</li>\n<li>不是真正的WYSWYG富文本，依然是<strong>markdown源码编辑 + 预览增强</strong>   ，和Typora理念不同。</li>\n</ol>\n<h2>七、适用场景</h2>\n<p>✅ 适合：</p>\n<ul>\n<li>企业后台内嵌文档编辑器、知识库、产品手册；</li>\n<li>AI对话页面流式Markdown渲染；</li>\n<li>内网平台、工单、需求系统内嵌MD编辑；</li>\n<li>需要表格、流程图、数学公式，且希望用户不用手写复杂md标记。</li>\n</ul>\n<p>❌ 不适合：</p>\n<ul>\n<li>需要<strong>跨平台通用Markdown</strong>   （要导出到GitHub/Notion，大量使用cherry专属扩展语法会出问题）；</li>\n<li>极致精简、只需要简单md预览（推荐marked/markdown-it）。</li>\n</ul>\n<h2>八、同类对比简要</h2>\n<ul>\n<li><strong>Cherry Markdown</strong>   ：一体化编辑器组件，自带工具栏、WYSIWYG预览、AI流式，适合业务系统嵌入；</li>\n<li><strong>markdown-it + 自定义UI</strong>   ：轻量解析库，需要自己写编辑器、工具栏，自由度高但开发成本高；</li>\n<li><strong>Editor.md</strong>   ：老牌web md编辑器，维护弱，没有流式渲染；</li>\n<li><strong>Typora</strong>   ：桌面软件，不能嵌入网页。</li>\n</ul>\n<pre><code class="language-html"><span class="hljs-meta">&lt;!DOCTYPE <span class="hljs-keyword">html</span>&gt;</span>\n<span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;zh-CN&quot;</span>&gt;</span>\n  <span class="hljs-tag">&lt;<span class="hljs-name">head</span>&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">meta</span> <span class="hljs-attr">charset</span>=<span class="hljs-string">&quot;UTF-8&quot;</span> /&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">title</span>&gt;</span>Cherry Markdown UMD 流式输出<span class="hljs-tag">&lt;/<span class="hljs-name">title</span>&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">link</span>\n      <span class="hljs-attr">rel</span>=<span class="hljs-string">&quot;stylesheet&quot;</span>\n      <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;https://cdn.jsdelivr.net/npm/cherry-markdown@0.11.9/dist/cherry-markdown.min.css&quot;</span>\n    /&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span><span class="language-css">\n      <span class="hljs-selector-id">#md-container</span> {\n        <span class="hljs-attribute">height</span>: auto;\n        <span class="hljs-attribute">min-height</span>: <span class="hljs-number">200px</span>;\n        <span class="hljs-attribute">max-height</span>: <span class="hljs-number">600px</span>;\n        <span class="hljs-attribute">overflow-y</span>: auto;\n      }\n    </span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span>\n  <span class="hljs-tag">&lt;/<span class="hljs-name">head</span>&gt;</span>\n\n  <span class="hljs-tag">&lt;<span class="hljs-name">body</span>&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;md-container&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>\n\n    <span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://cdn.jsdelivr.net/npm/cherry-markdown@0.11.9/dist/cherry-markdown.js&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>\n    <span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript">\n      <span class="hljs-comment">// 初始化cherry，开启流式会话，纯预览模式（AI聊天推荐）</span>\n      <span class="hljs-keyword">const</span> cherry = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Cherry</span>({\n        <span class="hljs-attr">id</span>: <span class="hljs-string">&quot;md-container&quot;</span>,\n        <span class="hljs-attr">editor</span>: {\n          <span class="hljs-attr">height</span>: <span class="hljs-string">&quot;auto&quot;</span>,\n          <span class="hljs-attr">defaultModel</span>: <span class="hljs-string">&quot;previewOnly&quot;</span>, <span class="hljs-comment">// 纯预览，隐藏编辑区</span>\n        },\n        <span class="hljs-attr">engine</span>: {\n          <span class="hljs-attr">global</span>: {\n            <span class="hljs-attr">flowSessionContext</span>: <span class="hljs-literal">true</span>, <span class="hljs-comment">// ✅ 开启流式渲染核心开关</span>\n            <span class="hljs-attr">flowSessionCursor</span>: <span class="hljs-string">&quot;default&quot;</span>, <span class="hljs-comment">// ✅ 流式虚拟光标（打字机闪烁光标）</span>\n          },\n        },\n        <span class="hljs-attr">previewer</span>: {\n          <span class="hljs-attr">enablePreviewerBubble</span>: <span class="hljs-literal">false</span>, <span class="hljs-comment">// 关闭预览区右键编辑气泡</span>\n        },\n      });\n\n      <span class="hljs-comment">// 保存当前累计的markdown文本</span>\n      <span class="hljs-keyword">let</span> fullMd = <span class="hljs-string">&quot;&quot;</span>;\n\n      <span class="hljs-comment">// 模拟SSE/大模型流式token回调，每收到一段token调用这个函数</span>\n      <span class="hljs-keyword">function</span> <span class="hljs-title function_">appendToken</span>(<span class="hljs-params">token</span>) {\n        fullMd += token;\n        cherry.<span class="hljs-title function_">setMarkdown</span>(fullMd);\n\n        <span class="hljs-comment">// 自动滚动到底部</span>\n        <span class="hljs-keyword">const</span> previewDom = cherry.<span class="hljs-property">previewer</span>.<span class="hljs-title function_">getDom</span>();\n        previewDom.<span class="hljs-property">scrollTop</span> = previewDom.<span class="hljs-property">scrollHeight</span>;\n      }\n\n      <span class="hljs-comment">// 流式结束：清除虚拟光标</span>\n      <span class="hljs-keyword">function</span> <span class="hljs-title function_">streamEnd</span>(<span class="hljs-params"></span>) {\n        cherry.<span class="hljs-title function_">clearFlowSessionCursor</span>();\n      }\n\n      <span class="hljs-comment">// ========== 模拟流式输出测试 ==========</span>\n      <span class="hljs-keyword">const</span> aiText = <span class="hljs-string">`# Cherry Markdown 流式渲染示例\n这是**加粗文本**  ，这是*斜体*。\n\n- 列表项1\n- 列表项2\n\n\\`\\`\\`html\nfunction hello() {\nconst aa = &#x27;666666&#x27;;\nconst bb = &#x27;666666&#x27;;\nconst cc = &#x27;666666&#x27;;\nconst dd = &#x27;666666&#x27;;\n  console.log(&quot;流式输出&quot;);\n}\n\\`\\`\\`\n\n&gt; 引用块测试`</span>;\n\n      <span class="hljs-keyword">let</span> idx = <span class="hljs-number">0</span>;\n      <span class="hljs-keyword">const</span> timer = <span class="hljs-built_in">setInterval</span>(<span class="hljs-function">() =&gt;</span> {\n        <span class="hljs-keyword">if</span> (idx &lt; aiText.<span class="hljs-property">length</span>) {\n          <span class="hljs-title function_">appendToken</span>(aiText[idx]);\n          idx++;\n        } <span class="hljs-keyword">else</span> {\n          <span class="hljs-built_in">clearInterval</span>(timer);\n          <span class="hljs-title function_">streamEnd</span>();\n        }\n      }, <span class="hljs-number">20</span>);\n    </span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>\n  <span class="hljs-tag">&lt;/<span class="hljs-name">body</span>&gt;</span>\n<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span>\n</code></pre>\n</div>'</script></body></html>
