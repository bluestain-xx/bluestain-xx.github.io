 def 普通函数\ndef add(x,y):\n    return x + y\n\n# lambda 等价写法\nadd_lambda = lambda x,y: x + y\n</code></pre>\n<p>区别：</p>\n<ol>\n<li><code>def</code> 定义有名字函数，可以多行逻辑；<code>lambda</code>只能单行表达式</li>\n<li><code>lambda</code> 自带返回，不能写 <code>return</code></li>\n<li><code>lambda</code> 是表达式，不是语句，可以嵌入到代码行里</li>\n</ol>\n<h2>三、常用场景：作为高阶函数参数</h2>\n<p>lambda最大用处：临时传递一个简短回调函数，用完即弃，<strong>不用单独def定义</strong></p>\n<h3>1. map()</h3>\n<p><code>map(函数, 可迭代对象)</code>：把函数依次作用在序列每个元素</p>\n<pre><code>lst = [1,2,3]\nres = list(map(lambda x: x**2, lst))\nprint(res) # [1,4,9]\n</code></pre>\n<h3>2. filter()</h3>\n<p><code>filter(判断函数, 可迭代对象)</code>，保留函数返回True的元素</p>\n<pre><code>lst = [1,2,3,4,5]\nres = list(filter(lambda x: x % 2 == 0, lst))\nprint(res) # [2,4]\n</code></pre>\n<h3>3. sorted() 自定义排序 key（最常用）</h3>\n<p><code>sorted</code> 的 <code>key</code> 参数接收函数，函数返回值作为排序依据</p>\n<pre><code>data = [(&quot;a&quot;, 5), (&quot;b&quot;, 2), (&quot;c&quot;, 8)]\n# 按元组第二个值排序\nres = sorted(data, key=lambda item: item[1])\nprint(res)\n# [('b', 2), ('a', 5), ('c', 8)]\n</code></pre>\n<ul>\n<li>还支持反向排序：<code>sorted(..., key=..., reverse=True)</code></li>\n</ul>\n<h2>四、lambda 的参数形式（和普通函数一致）</h2>\n<pre><code># 默认参数\nf = lambda x=10: x + 1\nprint(f())    #11\nprint(f(20))  #21\n\n# 可变位置参数 *args\nf = lambda *args: sum(args)\nprint(f(1,2,3)) #6\n\n# 可变关键字参数 **kwargs\nf = lambda **kwargs: kwargs.get(&quot;name&quot;)\nprint(f(name=&quot;tom&quot;)) # tom\n</code></pre>\n<h2>五、条件表达式在 lambda 里</h2>\n<p>lambda内部<strong>不能写if代码块</strong>   ，但可以用<strong>三元表达式</strong>   （它本身是表达式）\n语法：<code>真值 if 条件 else 假值</code></p>\n<pre><code>f = lambda x: &quot;大于0&quot; if x&gt;0 else &quot;小于等于0&quot;\nprint(f(5))  #大于0\nprint(f(-1)) #小于等于0\n</code></pre>\n<blockquote>\n<p>⚠️ 不能写：<code>lambda x: if x&gt;0: print(1)</code>，这是语句，会报错！</p>\n</blockquote>\n<h2>六、lambda 的闭包陷阱（重点坑）</h2>\n<pre><code>funcs = [lambda x: x+i for i in range(3)]\nfor f in funcs:\n    print(f(10))\n# 输出：12 12 12\n</code></pre>\n<p>原因：<code>lambda</code> 延迟引用变量，<strong>调用时才去读取i的值</strong>   ，循环结束i=2。\n✅ 修复：把i绑定为默认参数，捕获当时的值</p>\n<pre><code>funcs = [lambda x, i=i: x+i for i in range(3)]\nfor f in funcs:\n    print(f(10))\n# 10,11,12\n</code></pre>\n<h2>七、lambda 的限制（缺点）</h2>\n<ol>\n<li>只能<strong>单个表达式</strong>   ，不能多行、不能循环、不能分支语句块</li>\n<li>没有函数名，异常报错时栈信息可读性差，看到的都是 <code>&lt;lambda&gt;</code></li>\n<li>逻辑复杂时代码可读性差，复杂逻辑<strong>优先用def</strong></li>\n<li>PEP8规范：<strong>不要把lambda赋值给变量</strong>   （<code>f=lambda x:x+1</code> 不推荐），直接内联使用</li>\n</ol>\n<h2>八、不适合用lambda的场景</h2>\n<ul>\n<li>逻辑复杂，需要多行</li>\n<li>需要文档字符串说明函数用途</li>\n<li>函数需要复用多处&gt;\n<blockquote>\n<p>一句话原则：<strong>短小一次性回调函数才考虑lambda</strong></p>\n</blockquote>\n</li>\n</ul>\n<h2>九、小练习</h2>\n<pre><code># 1. 求两数最大值\nmax_func = lambda a,b: a if a&gt;b else b\nprint(max_func(3,9))\n\n# 2. 列表按绝对值排序\nnums = [-5, 3, -2, 7]\nres = sorted(nums, key=lambda x: abs(x))\nprint(res)\n</code></pre>\n</div>"</script></body></html>
