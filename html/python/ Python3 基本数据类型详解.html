lse, 0, 0.0, &quot;&quot;, [], {}, set(), None</code></p>\n<h3>4. complex 复数</h3>\n<p>格式 <code>实部 + 虚部j</code></p>\n<pre><code>c = 3 + 4j\nprint(c.real, c.imag) # 3.0 4.0\n</code></pre>\n<h2>二、<a href="https://www.runoob.com/python3/python3-string.html" target="_blank">字符串 str（不可变）</a></h2>\n<p><strong>单引号、双引号、三引号</strong>   ；三引号支持换行。</p>\n<pre><code>s1 = \'hello\'\ns2 = &quot;world&quot;\ns3 = &quot;&quot;&quot;多行\n字符串&quot;&quot;&quot;\n</code></pre>\n<ol>\n<li>不可变：不能原地修改字符，<code>s[0]=\'A\'</code> 报错，只能新建字符串</li>\n<li>索引从0开始，支持切片 <code>s[start:end:step]</code></li>\n<li>转义字符 <code>\\n \\t \\\\ \\&quot; \\\'</code>；原始字符串 <code>r&quot;raw string\\n&quot;</code> 不转义</li>\n<li>常用方法：<code>split()</code>、<code>join()</code>、<code>strip()</code>、<code>find()</code>、<code>replace()</code></li>\n</ol>\n<pre><code>s = &quot;python&quot;\nprint(s[0])      # p\nprint(s[1:4])    # yth\nprint(s[::-1])   # 反转 nohtyp\n</code></pre>\n<h2>三、<a href="https://www.runoob.com/python3/python3-list.html" target="_blank">列表 list（可变）</a></h2>\n<p>有序、可重复，用 <code>[]</code>，<strong>元素可以是任意类型</strong></p>\n<pre><code>lst = [1, &quot;a&quot;, True, [2,3]]\n</code></pre>\n<ul>\n<li>可变：可原地增删改 <code>append()</code>、<code>pop()</code>、<code>insert()</code></li>\n<li>切片语法同字符串</li>\n<li>浅拷贝：<code>lst.copy()</code> / <code>lst[:]</code></li>\n</ul>\n<blockquote>\n<p>注意：列表存的是<strong>元素引用</strong>   ，嵌套列表修改会互相影响（浅拷贝坑）</p>\n</blockquote>\n<h2>四、<a href="https://www.runoob.com/python3/python3-tuple.html" target="_blank">元组 tuple（不可变）</a></h2>\n<p>有序、可重复，<code>()</code>；<strong>单个元素必须加逗号</strong>   <code>(1,)</code></p>\n<pre><code>t = (1, 2, &quot;abc&quot;)\nt2 = (1,) # 元组；t2 = (1) 是int\n</code></pre>\n<ul>\n<li>不可变：不能增删改元素；⚠️ 如果元组内包含可变对象（list），列表内容可以修改</li>\n</ul>\n<pre><code>t = (1, [2,3])\nt[1].append(4) # 合法！元组本身引用没变\n</code></pre>\n<h2>五、<a href="https://www.runoob.com/python3/python3-dictionary.html" target="_blank">字典 dict（可变）</a></h2>\n<p><code>{key:value}</code>，<strong>无序（python3.7+ 插入顺序保留）</strong></p>\n<ul>\n<li>key 必须是<strong>不可变类型</strong>   ：int/str/tuple；不能是 list/dict/set</li>\n<li>value 任意类型</li>\n</ul>\n<pre><code>d = {&quot;name&quot;:&quot;Tom&quot;, &quot;age&quot;:18}\nd[&quot;age&quot;] = 19\nprint(d.get(&quot;name&quot;))\n</code></pre>\n<h2>六、<a href="https://www.runoob.com/python3/python3-set.html" target="_blank">集合 set（可变）</a>、frozenset（不可变）</h2>\n<p>集合：<code>{元素}</code>，<strong>无序，元素唯一，不能索引</strong></p>\n<pre><code>s = {1,2,3,3}\nprint(s) # {1,2,3}\n</code></pre>\n<ul>\n<li>空集合不能写 <code>{}</code>（空字典），要用 <code>set()</code></li>\n<li>集合运算：<code>&amp;</code>交集、<code>|</code>并集、<code>-</code>差集、<code>^</code>对称差集</li>\n<li>frozenset：不可变集合，可作为 dict 的 key</li>\n</ul>\n<h2>七、NoneType</h2>\n<p>唯一值 <code>None</code>，代表空，不是0，不是空字符串</p>\n<pre><code>n = None\nprint(type(n)) # &lt;class \'NoneType\'&gt;\n</code></pre>\n<h1>类型转换常用函数</h1>\n<pre><code>int(x)\nfloat(x)\nbool(x)\nstr(x)\nlist(x)\ntuple(x)\ndict()\nset(x)\n</code></pre>\n<h1>类型判断</h1>\n<pre><code>a = 10\nprint(type(a))          # 获取类型\nprint(isinstance(a, int)) # 判断是否属于某个类型（支持继承判断）\n</code></pre>\n<blockquote>\n<p><code>type</code> 不考虑继承；<code>isinstance</code> 会考虑继承关系。</p>\n</blockquote>\n<h1>可变 vs 不可变核心区别</h1>\n<ol>\n<li><strong>不可变类型</strong>   ：修改时，开辟新内存，变量指向新对象。<code>str/tuple/int</code></li>\n</ol>\n<pre><code>a = 1\nb = a\na = 2\nprint(b) # 1\n</code></pre>\n<ol start="2">\n<li><strong>可变类型</strong>   ：原地修改内存内容，所有引用同时看到变化</li>\n</ol>\n<pre><code>lst1 = [1,2]\nlst2 = lst1\nlst1.append(3)\nprint(lst2) # [1,2,3]\n</code></pre>\n<h1>内存小知识点（id函数）</h1>\n<p><code>id(obj)</code> 返回对象内存地址</p>\n<pre><code>a = 10\nprint(id(a))\n</code></pre>\n<p>小整数池：<code>[-5,256]</code> 的整数会被缓存，复用同一个对象；字符串也有驻留机制。</p>\n<hr>\n</div>'</script></body></html>
