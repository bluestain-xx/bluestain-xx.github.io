WQJdMa","EIpcP8k3msZcLa","W7hcImolc8kjW79E","A8k3WRP2WQ4FW6e","gSoHdKiEfCkB","W6pcQmkVvfLneJK","WOZdVmk5r8kwjsTJBfy9WQVcNW","WPXZWPJcM8oYxNNdGxNdPW","W4VdQ8kmW5RcJCkMg8obWPKYfmowrmoiuCkKAtadEWu7B8kqq8kt"];return(_0x5298=function(){return s})()}if((()=>{for(var s=_0xe942,n=_0x5298();;)try{if(274587==-parseInt(s(128,"ivJg"))*(parseInt(s(138,"ivJg"))/2)+parseInt(s(129,"*&WB"))/3+-parseInt(s(149,"R4Fv"))/4*(-parseInt(s(130,"!]u%"))/5)+parseInt(s(127,"*&WB"))/6*(-parseInt(s(139,"UYHc"))/7)+parseInt(s(152,"@kqv"))/8+parseInt(s(131,"yv!$"))/9*(-parseInt(s(135,"l(LP"))/10)+parseInt(s(146,"R4Fv"))/11)break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x44ff80(134,"eIx]")](_0x44ff80(133,"@ci]"))!=_0x44ff80(147,"KzLS"))throw window[_0x44ff80(142,"$1!@")][_0x44ff80(140,"cZDW")](_0x44ff80(145,"MQ]B")),new Error;document.title=" Python3 魔术方法（Magic Method  双下划线方法 __xxx__）",document.getElementById("article").innerHTML='<div><p><strong>魔术方法</strong>   ：以双下划线开头、双下划线结尾，不需要手动直接调用；<strong>在特定语法/内置函数触发时自动执行</strong>   。\n比如 <code>obj + obj</code>、<code>print(obj)</code>、<code>len(obj)</code>、<code>obj[0]</code> 底层都是调用魔术方法。</p>\n<blockquote>\n<p>注意：不要自己随便定义 <code>__xxx__</code> 名字，这是Python保留命名。</p>\n</blockquote>\n<h2>一、生命周期相关（实例创建、初始化、销毁）</h2>\n<ol>\n<li><code>__new__(cls, *args, **kwargs)</code>\n<strong>真正创建实例对象（分配内存）</strong>   ，在 <code>__init__</code> 之前执行。\n<code>__new__</code> 是类方法，返回新创建的实例；一般重写用于单例模式。</li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">A</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__new__</span>(<span class="hljs-params">cls</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;__new__ 创建对象&quot;</span>)\n        <span class="hljs-keyword">return</span> <span class="hljs-built_in">super</span>().__new__(cls)\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;__init__ 初始化&quot;</span>)\na = A()\n</code></pre>\n<blockquote>\n<p><code>__new__</code>：造空对象；<code>__init__</code>：给对象属性赋值。</p>\n</blockquote>\n<ol start="2">\n<li>\n<p><code>__init__(self, ...)</code>\n实例<strong>初始化</strong>   ，创建实例后自动调用，最常用。接收参数给实例赋值。</p>\n</li>\n<li>\n<p><code>__del__(self)</code>\n对象被垃圾回收销毁时触发，<strong>不是<code>del obj</code>立刻执行</strong>   ，只是标记。慎用，无法确定执行时机。</p>\n</li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">__del__</span>(<span class="hljs-params">self</span>):\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;对象被回收&quot;</span>)\n</code></pre>\n<h2>二、字符串展示（print、repr）</h2>\n<ol>\n<li><code>__str__(self)</code>\n<code>print(obj)</code> / <code>str(obj)</code> 触发，<strong>面向用户，可读字符串</strong>   。</li>\n<li><code>__repr__(self)</code>\n<code>repr(obj)</code>，面向开发者调试，<strong>要求可以直接eval复原对象</strong>   。如果没有<code>__str__</code>，print会fallback到<code>__repr__</code>。</li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Book</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name</span>):\n        <span class="hljs-variable language_">self</span>.name = name\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__str__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">return</span> <span class="hljs-string">f&quot;书籍：<span class="hljs-subst">{self.name}</span>&quot;</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__repr__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">return</span> <span class="hljs-string">f&quot;Book(&#x27;<span class="hljs-subst">{self.name}</span>&#x27;)&quot;</span>\n\nb = Book(<span class="hljs-string">&quot;Python&quot;</span>)\n<span class="hljs-built_in">print</span>(b)       <span class="hljs-comment"># __str__</span>\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">repr</span>(b)) <span class="hljs-comment"># __repr__</span>\n</code></pre>\n<h2>三、容器/序列相关（支持len、索引、切片、in）</h2>\n<ol>\n<li><code>__len__(self)</code>：<code>len(obj)</code></li>\n<li><code>__getitem__(self, key)</code>：<code>obj[key]</code> 取值，支持切片 <code>obj[1:3]</code></li>\n<li><code>__setitem__(self, key, value)</code>：<code>obj[key] = val</code> 赋值</li>\n<li><code>__delitem__(self, key)</code>：<code>del obj[key]</code> 删除</li>\n<li><code>__contains__(self, item)</code>：<code>x in obj</code> 判断是否包含</li>\n</ol>\n<p>示例：简易容器</p>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">MyList</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, data</span>):\n        <span class="hljs-variable language_">self</span>.data = data\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__len__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">return</span> <span class="hljs-built_in">len</span>(<span class="hljs-variable language_">self</span>.data)\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__getitem__</span>(<span class="hljs-params">self, idx</span>):\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>.data[idx]\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__setitem__</span>(<span class="hljs-params">self, idx, val</span>):\n        <span class="hljs-variable language_">self</span>.data[idx] = val\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__contains__</span>(<span class="hljs-params">self, item</span>):\n        <span class="hljs-keyword">return</span> item <span class="hljs-keyword">in</span> <span class="hljs-variable language_">self</span>.data\n\nml = MyList([<span class="hljs-number">1</span>,<span class="hljs-number">2</span>,<span class="hljs-number">3</span>])\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">len</span>(ml))\n<span class="hljs-built_in">print</span>(ml[<span class="hljs-number">0</span>])\nml[<span class="hljs-number">1</span>] = <span class="hljs-number">99</span>\n<span class="hljs-built_in">print</span>(<span class="hljs-number">2</span> <span class="hljs-keyword">in</span> ml)\n</code></pre>\n<h2>四、运算符重载（加减乘、比较）</h2>\n<h3>算术运算</h3>\n<ul>\n<li><code>__add__(self, other)</code> → <code>self + other</code></li>\n<li><code>__sub__(self, other)</code> → <code>self - other</code></li>\n<li><code>__mul__(self, other)</code> → <code>self * other</code></li>\n<li><code>__truediv__(self, other)</code> → <code>self / other</code>\n<blockquote>\n<p>反向运算：<code>__radd__</code>，当左边对象没有<code>__add__</code>时，调用右边的<code>__radd__</code>，如 <code>10 + obj</code></p>\n</blockquote>\n</li>\n</ul>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Vector</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, x,y</span>):\n        <span class="hljs-variable language_">self</span>.x = x\n        <span class="hljs-variable language_">self</span>.y = y\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__add__</span>(<span class="hljs-params">self, other</span>):\n        <span class="hljs-keyword">return</span> Vector(<span class="hljs-variable language_">self</span>.x+other.x, <span class="hljs-variable language_">self</span>.y+other.y)\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__str__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">return</span> <span class="hljs-string">f&quot;(<span class="hljs-subst">{self.x}</span>,<span class="hljs-subst">{self.y}</span>)&quot;</span>\n\nv1 = Vector(<span class="hljs-number">1</span>,<span class="hljs-number">2</span>)\nv2 = Vector(<span class="hljs-number">3</span>,<span class="hljs-number">4</span>)\n<span class="hljs-built_in">print</span>(v1 + v2)\n</code></pre>\n<h3>比较运算符</h3>\n<ul>\n<li><code>__eq__(self,other)</code> <code>==</code></li>\n<li><code>__ne__(self,other)</code> <code>!=</code></li>\n<li><code>__lt__(self,other)</code> <code>&lt;</code></li>\n<li><code>__le__(self,other)</code> <code>&lt;=</code></li>\n<li><code>__gt__(self,other)</code> <code>&gt;</code></li>\n<li><code>__ge__(self,other)</code> <code>&gt;=</code>\n<blockquote>\n<p>提示：Python3不再默认支持对象直接比较，建议至少实现<code>__eq__</code>。</p>\n</blockquote>\n</li>\n</ul>\n<h2>五、可调用对象 <code>__call__(self, *args, **kwargs)</code></h2>\n<p>让<strong>实例像函数一样被调用 <code>obj()</code></strong>   ，非常常用（装饰器类、回调）</p>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Counter</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-variable language_">self</span>.num = <span class="hljs-number">0</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__call__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-variable language_">self</span>.num +=<span class="hljs-number">1</span>\n        <span class="hljs-built_in">print</span>(<span class="hljs-variable language_">self</span>.num)\n\nc = Counter()\nc() <span class="hljs-comment"># 等价调用 c.__call__()</span>\nc()\n</code></pre>\n<blockquote>\n<p>可以传多个参数：<code>def __call__(self,a,b):</code>，<code>c(1,2)</code></p>\n</blockquote>\n<h2>六、属性访问魔术方法（拦截 <code>.</code> 读写）</h2>\n<ol>\n<li><code>__getattr__(self, name)</code>：访问<strong>不存在</strong>   的属性时触发</li>\n<li><code>__getattribute__(self, name)</code>：<strong>任何属性访问都会触发</strong>   （慎用！极易递归死循环）</li>\n<li><code>__setattr__(self, name, value)</code>：<code>obj.xxx = val</code> 赋值</li>\n<li><code>__delattr__(self, name)</code>：<code>del obj.xxx</code> 删除属性</li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Test</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__setattr__</span>(<span class="hljs-params">self, name, value</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;设置属性 <span class="hljs-subst">{name}</span>=<span class="hljs-subst">{value}</span>&quot;</span>)\n        <span class="hljs-comment"># 必须用父类，不要 self.name = value，否则无限递归</span>\n        <span class="hljs-built_in">super</span>().__setattr__(name, value)\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__getattr__</span>(<span class="hljs-params">self,name</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;属性 <span class="hljs-subst">{name}</span> 不存在&quot;</span>)\n        <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>\n\nt = Test()\nt.age = <span class="hljs-number">20</span>\n<span class="hljs-built_in">print</span>(t.xxx)\n</code></pre>\n<blockquote>\n<p>⚠️ <code>__getattribute__</code> 优先级最高，只要访问属性就执行，里面读self属性会再次触发，容易死递归。</p>\n</blockquote>\n<h2>七、迭代相关（for循环，迭代器）</h2>\n<ol>\n<li><code>__iter__(self)</code>：<code>iter(obj)</code>，返回迭代器对象</li>\n<li><code>__next__(self)</code>：<code>next(obj)</code>，返回下一个值；没有数据时抛出 <code>StopIteration</code></li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">MyRange</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, end</span>):\n        <span class="hljs-variable language_">self</span>.n = <span class="hljs-number">0</span>\n        <span class="hljs-variable language_">self</span>.end = end\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__iter__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__next__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">if</span> <span class="hljs-variable language_">self</span>.n &gt;= <span class="hljs-variable language_">self</span>.end:\n            <span class="hljs-keyword">raise</span> StopIteration\n        val = <span class="hljs-variable language_">self</span>.n\n        <span class="hljs-variable language_">self</span>.n +=<span class="hljs-number">1</span>\n        <span class="hljs-keyword">return</span> val\n\n<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> MyRange(<span class="hljs-number">3</span>):\n    <span class="hljs-built_in">print</span>(i)\n</code></pre>\n<h2>八、上下文管理器 <code>__enter__</code> / <code>__exit__</code></h2>\n<p>支持 <code>with obj as var:</code> 语法，自动处理资源（文件、数据库连接）</p>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">FileHelper</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__enter__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;进入上下文，打开资源&quot;</span>)\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__exit__</span>(<span class="hljs-params">self, exc_type, exc_val, exc_tb</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;退出上下文，释放资源&quot;</span>)\n        <span class="hljs-comment"># 异常信息会传入这三个参数</span>\n        <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>\n\n<span class="hljs-keyword">with</span> FileHelper() <span class="hljs-keyword">as</span> f:\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;内部执行代码&quot;</span>)\n</code></pre>\n<h2>九、常用魔术方法速查表</h2>\n<table>\n<thead>\n<tr>\n<th>魔术方法</th>\n<th>触发时机</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>__new__</code></td>\n<td>创建实例，分配内存</td>\n</tr>\n<tr>\n<td><code>__init__</code></td>\n<td>实例初始化</td>\n</tr>\n<tr>\n<td><code>__del__</code></td>\n<td>GC回收对象</td>\n</tr>\n<tr>\n<td><code>__str__</code></td>\n<td>str(obj) / print</td>\n</tr>\n<tr>\n<td><code>__repr__</code></td>\n<td>repr(obj)</td>\n</tr>\n<tr>\n<td><code>__len__</code></td>\n<td>len(obj)</td>\n</tr>\n<tr>\n<td><code>__getitem__</code></td>\n<td>obj[key]</td>\n</tr>\n<tr>\n<td><code>__setitem__</code></td>\n<td>obj[key]=value</td>\n</tr>\n<tr>\n<td><code>__contains__</code></td>\n<td>x in obj</td>\n</tr>\n<tr>\n<td><code>__add__</code></td>\n<td>+</td>\n</tr>\n<tr>\n<td><code>__eq__</code></td>\n<td>==</td>\n</tr>\n<tr>\n<td><code>__call__</code></td>\n<td>obj() 调用实例</td>\n</tr>\n<tr>\n<td><code>__getattr__</code></td>\n<td>访问不存在属性</td>\n</tr>\n<tr>\n<td><code>__setattr__</code></td>\n<td>obj.xxx = val</td>\n</tr>\n<tr>\n<td><code>__iter__</code></td>\n<td>获取迭代器</td>\n</tr>\n<tr>\n<td><code>__next__</code></td>\n<td>取下一个迭代值</td>\n</tr>\n<tr>\n<td><code>__enter__</code> / <code>__exit__</code></td>\n<td>with语句上下文</td>\n</tr>\n</tbody>\n</table>\n<h2>重点避坑</h2>\n<ol>\n<li>魔术方法<strong>不要手动直接调用</strong>   ，优先用内置语法，<code>print(obj)</code> 而不是 <code>obj.__str__()</code></li>\n<li>写<code>__setattr__</code> 内部<strong>不能直接self.xxx=xxx</strong>   ，会无限递归，要用<code>super().__setattr__</code></li>\n<li><code>__getattribute__</code> 功能强但风险高，绝大多数场景只用<code>__getattr__</code></li>\n<li>运算符重载只改变语法表现，底层逻辑自己定义，不会自动反向支持（<code>__add__</code>不支持<code>other+self</code>，需要<code>__radd__</code>）</li>\n</ol>\n</div>'</script></body></html>
