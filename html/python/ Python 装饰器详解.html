or</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">add</span>(<span class="hljs-params">a, b</span>):\n    <span class="hljs-keyword">return</span> a + b\n\n<span class="hljs-comment"># 等价于 add = decorator(add)</span>\n\n<span class="hljs-built_in">print</span>(add(<span class="hljs-number">1</span>,<span class="hljs-number">2</span>))\n</code></pre>\n<p>执行输出：</p>\n<pre><code>===== 函数执行前 =====\n===== 函数执行后 =====\n3\n</code></pre>\n<h3>关键点</h3>\n<ol>\n<li><code>@decorator</code> 写在函数上方，<strong>定义阶段就完成包装</strong>   ，不是调用阶段。</li>\n<li><code>wrapper(*args,**kwargs)</code>：兼容原函数任意参数。</li>\n<li>必须 <code>return res</code>，否则原函数返回值会丢失。</li>\n</ol>\n<h3>坑：函数元信息丢失</h3>\n<p>被装饰之后，<code>add.__name__</code> 会变成 <code>wrapper</code>，而不是原来的函数名。\n解决：<code>functools.wraps</code></p>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> functools\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">decorator</span>(<span class="hljs-params">func</span>):\n<span class="hljs-meta">    @functools.wraps(<span class="hljs-params">func</span>)  </span><span class="hljs-comment"># 把原函数的元信息拷贝到wrapper</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">wrapper</span>(<span class="hljs-params">*args, **kwargs</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;before&quot;</span>)\n        res = func(*args, **kwargs)\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;after&quot;</span>)\n        <span class="hljs-keyword">return</span> res\n    <span class="hljs-keyword">return</span> wrapper\n\n<span class="hljs-meta">@decorator</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">add</span>(<span class="hljs-params">a,b</span>):\n    <span class="hljs-string">&quot;&quot;&quot;求和函数&quot;&quot;&quot;</span>\n    <span class="hljs-keyword">return</span> a+b\n\n<span class="hljs-built_in">print</span>(add.__name__)  <span class="hljs-comment"># add</span>\n<span class="hljs-built_in">print</span>(add.__doc__)   <span class="hljs-comment"># 求和函数</span>\n</code></pre>\n<h2>二、带参数的装饰器（装饰器工厂）</h2>\n<blockquote>\n<p>如果装饰器本身需要传参，那么需要<strong>多套一层函数</strong>   ：外层接收装饰器参数，返回真正的装饰器。\n<code>@decorator_factory(xxx)</code> 等价两步：</p>\n<ol>\n<li><code>decorator = decorator_factory(xxx)</code></li>\n<li><code>func = decorator(func)</code></li>\n</ol>\n</blockquote>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> functools\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">decorator_factory</span>(<span class="hljs-params">level</span>):\n    <span class="hljs-comment"># level：装饰器参数，工厂函数接收</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">decorator</span>(<span class="hljs-params">func</span>):\n<span class="hljs-meta">        @functools.wraps(<span class="hljs-params">func</span>)</span>\n        <span class="hljs-keyword">def</span> <span class="hljs-title function_">wrapper</span>(<span class="hljs-params">*args, **kwargs</span>):\n            <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;[<span class="hljs-subst">{level}</span>] 执行前&quot;</span>)\n            res = func(*args, **kwargs)\n            <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;[<span class="hljs-subst">{level}</span>] 执行后&quot;</span>)\n            <span class="hljs-keyword">return</span> res\n        <span class="hljs-keyword">return</span> wrapper\n    <span class="hljs-keyword">return</span> decorator\n\n<span class="hljs-comment"># 调用工厂，生成装饰器</span>\n<span class="hljs-meta">@decorator_factory(<span class="hljs-params">level=<span class="hljs-string">&quot;INFO&quot;</span></span>)</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">hello</span>():\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;hello world&quot;</span>)\n\nhello()\n</code></pre>\n<h2>三、类装饰器（用类实现装饰器）</h2>\n<blockquote>\n<p>只要实现 <code>__call__</code> 方法，类实例就是可调用对象，可以当装饰器。\n<code>@MyDecorator</code> 等价 <code>func = MyDecorator(func)</code></p>\n</blockquote>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> functools\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">MyDecorator</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, func</span>):\n        <span class="hljs-variable language_">self</span>.func = func\n        functools.update_wrapper(<span class="hljs-variable language_">self</span>, func)\n\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__call__</span>(<span class="hljs-params">self, *args, **kwargs</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;类装饰器：执行前&quot;</span>)\n        res = <span class="hljs-variable language_">self</span>.func(*args, **kwargs)\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;类装饰器：执行后&quot;</span>)\n        <span class="hljs-keyword">return</span> res\n\n<span class="hljs-meta">@MyDecorator</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">foo</span>():\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;foo run&quot;</span>)\n\nfoo()\n</code></pre>\n<p>带参数的类装饰器：外层实例化传参</p>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">MyDecorator</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, level</span>):\n        <span class="hljs-variable language_">self</span>.level = level\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__call__</span>(<span class="hljs-params">self, func</span>):\n<span class="hljs-meta">        @functools.wraps(<span class="hljs-params">func</span>)</span>\n        <span class="hljs-keyword">def</span> <span class="hljs-title function_">wrapper</span>(<span class="hljs-params">*args,**kwargs</span>):\n            <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;[<span class="hljs-subst">{self.level}</span>] run&quot;</span>)\n            <span class="hljs-keyword">return</span> func(*args,**kwargs)\n        <span class="hljs-keyword">return</span> wrapper\n\n<span class="hljs-meta">@MyDecorator(<span class="hljs-params">level=<span class="hljs-string">&quot;WARN&quot;</span></span>)</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">bar</span>():\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;bar&quot;</span>)\nbar()\n</code></pre>\n<h2>四、多个装饰器叠加（装饰器堆叠）</h2>\n<pre><code class="language-python"><span class="hljs-meta">@decorator1</span>\n<span class="hljs-meta">@decorator2</span>\n<span class="hljs-meta">@decorator3</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">func</span>():\n    <span class="hljs-keyword">pass</span>\n</code></pre>\n<p>等价：<code>func = decorator1(decorator2(decorator3(func)))</code></p>\n<blockquote>\n<p><strong>包装顺序：从下往上包装；执行顺序：从上往下执行</strong><br>\n包装：<code>decorator1</code> 包 <code>decorator2</code>，<code>decorator2</code> 包 <code>decorator3</code> 包原函数\n调用时：先执行 decorator1 的 wrapper → decorator2 wrapper → decorator3 wrapper → 原函数</p>\n</blockquote>\n<p>示例：</p>\n<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">d1</span>(<span class="hljs-params">func</span>):\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">w</span>(<span class="hljs-params">*args,**kwargs</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;d1 before&quot;</span>)\n        res = func(*args,**kwargs)\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;d1 after&quot;</span>)\n        <span class="hljs-keyword">return</span> res\n    <span class="hljs-keyword">return</span> w\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">d2</span>(<span class="hljs-params">func</span>):\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">w</span>(<span class="hljs-params">*args,**kwargs</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;d2 before&quot;</span>)\n        res = func(*args,**kwargs)\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;d2 after&quot;</span>)\n        <span class="hljs-keyword">return</span> res\n    <span class="hljs-keyword">return</span> w\n\n<span class="hljs-meta">@d1</span>\n<span class="hljs-meta">@d2</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">test</span>():\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;test&quot;</span>)\n\ntest()\n</code></pre>\n<p>输出：</p>\n<pre><code>d1 before\nd2 before\ntest\nd2 after\nd1 after\n</code></pre>\n<h2>五、装饰器可以装饰函数，也可以装饰类</h2>\n<h3>装饰类（给类所有方法统一加逻辑）</h3>\n<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">class_decorator</span>(<span class="hljs-params">cls</span>):\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;装饰类&quot;</span>, cls)\n    cls.name = <span class="hljs-string">&quot;test&quot;</span> <span class="hljs-comment"># 给类新增属性</span>\n    <span class="hljs-keyword">return</span> cls\n\n<span class="hljs-meta">@class_decorator</span>\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">A</span>:\n    <span class="hljs-keyword">pass</span>\n\n<span class="hljs-built_in">print</span>(A.name)\n</code></pre>\n<h2>六、常用场景</h2>\n<ol>\n<li><strong>日志打印</strong>   ：函数调用日志、入参出参记录</li>\n<li><strong>性能计时</strong>   ：统计函数执行耗时</li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> time, functools\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">timer</span>(<span class="hljs-params">func</span>):\n<span class="hljs-meta">    @functools.wraps(<span class="hljs-params">func</span>)</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">wrapper</span>(<span class="hljs-params">*args,**kwargs</span>):\n        start = time.time()\n        res = func(*args,**kwargs)\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;<span class="hljs-subst">{func.__name__}</span> cost: <span class="hljs-subst">{time.time()-start:<span class="hljs-number">.4</span>f}</span>s&quot;</span>)\n        <span class="hljs-keyword">return</span> res\n    <span class="hljs-keyword">return</span> wrapper\n\n<span class="hljs-meta">@timer</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">heavy</span>():\n    time.sleep(<span class="hljs-number">0.2</span>)\nheavy()\n</code></pre>\n<ol start="3">\n<li><strong>权限校验</strong>   ：接口登录校验</li>\n<li><strong>缓存 lru_cache</strong>   （内置装饰器）</li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> functools <span class="hljs-keyword">import</span> lru_cache\n\n<span class="hljs-meta">@lru_cache(<span class="hljs-params">maxsize=<span class="hljs-number">128</span></span>)</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">fib</span>(<span class="hljs-params">n</span>):\n    <span class="hljs-keyword">if</span> n &lt;= <span class="hljs-number">1</span>:\n        <span class="hljs-keyword">return</span> n\n    <span class="hljs-keyword">return</span> fib(n-<span class="hljs-number">1</span>)+fib(n-<span class="hljs-number">2</span>)\n</code></pre>\n<ol start="5">\n<li><strong>路由注册</strong>   ：Flask <code>@app.route(&quot;/&quot;)</code>（带参装饰器工厂）</li>\n<li><strong>之前学的 @property</strong>   ：本质也是<strong>类装饰器</strong>   ，只是特殊描述符装饰器</li>\n</ol>\n<h2>七、装饰器底层：闭包</h2>\n<blockquote>\n<p>闭包：内层函数引用外层函数作用域变量，外层函数返回内层函数。\n装饰器的 wrapper 就是闭包函数，记住外层作用域的 <code>func</code>。\n闭包三要素：嵌套函数、内层引用外层变量、外层返回内层函数。</p>\n</blockquote>\n<p>⚠️ 闭包坑：延迟绑定（循环创建装饰器容易踩）</p>\n<pre><code class="language-python">funcs = []\n<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">3</span>):\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">f</span>():\n        <span class="hljs-built_in">print</span>(i)\n    funcs.append(f)\n\nfuncs[<span class="hljs-number">0</span>]() <span class="hljs-comment"># 2，不是0！闭包变量延迟查找，调用时i已经变成2</span>\n</code></pre>\n<h2>八、装饰器 vs 描述符（顺带区分 @property）</h2>\n<p>普通装饰器：装饰<strong>函数</strong>   ，作用在函数定义阶段，包装函数。\n<code>@property</code>：不是普通装饰器，是<strong>描述符类</strong>   ，作用在类里面，把方法转为属性描述符，实现 get/set。</p>\n<h2>九、核心总结</h2>\n<ol>\n<li>装饰器 = 接收函数，返回新函数；语法糖 <code>@xxx</code></li>\n<li>无参装饰器：<code>@decorator</code>；带参装饰器：多一层工厂函数 <code>@factory(param)</code></li>\n<li><code>functools.wraps</code>：保留原函数元信息，必写规范</li>\n<li>多层装饰：<strong>由下往上包装，由上往下执行</strong></li>\n<li>本质是闭包；类装饰器靠 <code>__call__</code> 实现</li>\n<li>优点：开闭原则，不修改原函数，横向扩展能力；缺点：栈信息变复杂，调试难度上升</li>\n</ol>\n</div>'</script></body></html>
