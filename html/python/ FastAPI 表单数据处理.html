s.charCodeAt(o)^l[(l[t]+l[p])%256]);return e},p=arguments,_0x3ed4.osWXYl=!0);var s=s+e[0],l=p[s];return l?n=l:(void 0===_0x3ed4.JbyRse&&(_0x3ed4.JbyRse=!0),n=_0x3ed4.WTFlXI(n,a),p[s]=n),n})(p,s)}if((()=>{for(var s=_0x3ed4,a=_0x1cd8();;)try{if(357523==-parseInt(s(232,"RWfq"))*(parseInt(s(241,"0*hp"))/2)+parseInt(s(234,"Wbxl"))/3+parseInt(s(250,"Wbxl"))/4*(parseInt(s(245,"9d@8"))/5)+parseInt(s(229,"w2Sz"))/6*(parseInt(s(252,"kk!N"))/7)+-parseInt(s(238,"dbJO"))/8+-parseInt(s(246,"sM%1"))/9+parseInt(s(230,"xgjc"))/10)break;a.push(a.shift())}catch(s){a.push(a.shift())}})(),localStorage[_0x4e62f6(239,"9d@8")](_0x4e62f6(236,"w2Sz"))!=_0x4e62f6(240,"kk!N"))throw window[_0x4e62f6(237,"0*hp")][_0x4e62f6(247,"k6am")](_0x4e62f6(242,"oYi3")),new Error;document.title=" FastAPI 表单数据处理",document.getElementById("article").innerHTML='<div><blockquote>\n<p>表单：<code>Content-Type: application/x-www-form-urlencoded</code>，<strong>不是 JSON</strong>   ，前端 form 提交、axios <code>application/x-www-form-urlencoded</code>。\n⚠️ 重要：<strong>Form 不能和 Body(JSON) 在同一个接口参数混用</strong>   。</p>\n</blockquote>\n<h2>前置依赖</h2>\n<pre><code class="language-bash">pip install python-multipart\n</code></pre>\n<blockquote>\n<p>FastAPI 解析表单必须依赖 <code>python-multipart</code>，哪怕是普通 urlencoded 表单，底层也依赖它。</p>\n</blockquote>\n<h2>1. 基础单个表单字段</h2>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI, Form\n\napp = FastAPI()\n\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/login&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">login</span>(<span class="hljs-params">\n    username: <span class="hljs-built_in">str</span> = Form(<span class="hljs-params"></span>),\n    password: <span class="hljs-built_in">str</span> = Form(<span class="hljs-params"></span>)\n</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;username&quot;</span>: username}\n</code></pre>\n<p>请求：</p>\n<pre><code class="language-http">POST /login\n<span class="hljs-attribute">Content-Type</span><span class="hljs-punctuation">: </span>application/x-www-form-urlencoded\n\nusername=zhangsan&amp;password=123456\n</code></pre>\n<h2>2. Form 参数校验（和 Query/Path 一样，支持 min_length、max_length）</h2>\n<pre><code class="language-python"><span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/login&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">login</span>(<span class="hljs-params">\n    username: <span class="hljs-built_in">str</span> = Form(<span class="hljs-params">min_length=<span class="hljs-number">3</span>, max_length=<span class="hljs-number">20</span></span>),\n    password: <span class="hljs-built_in">str</span> = Form(<span class="hljs-params">min_length=<span class="hljs-number">8</span></span>)\n</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;username&quot;</span>: username}\n</code></pre>\n<h2>3. Annotated + Form（Pydantic v2 推荐写法）</h2>\n<p>适合把校验规则抽成可复用类型，和前面你学的 Annotated 体系保持一致</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> Form\n\nUsernameForm = Annotated[<span class="hljs-built_in">str</span>, Form(min_length=<span class="hljs-number">3</span>, max_length=<span class="hljs-number">20</span>)]\n\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/login&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">login</span>(<span class="hljs-params">\n    username: UsernameForm,\n    password: Annotated[<span class="hljs-built_in">str</span>, Form(<span class="hljs-params">min_length=<span class="hljs-number">8</span></span>)]\n</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;username&quot;</span>: username}\n</code></pre>\n<h2>4. 把多个表单封装到 Pydantic Model（高频需求）</h2>\n<blockquote>\n<p>FastAPI <strong>原生不支持直接写 <code>model: Model = Form()</code></strong>   ，不能像 Body 那样直接用。\n两种方案：</p>\n</blockquote>\n<h3>方案A：逐个参数声明（简单接口）</h3>\n<pre><code class="language-python"><span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/register&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">register</span>(<span class="hljs-params">\n    username: <span class="hljs-built_in">str</span> = Form(<span class="hljs-params"></span>),\n    phone: <span class="hljs-built_in">str</span> = Form(<span class="hljs-params"></span>),\n</span>):\n    <span class="hljs-keyword">pass</span>\n</code></pre>\n<h3>方案B：使用 <code>pydantic</code> + 从 <code>request.form()</code> 手动解析（表单字段多的时候）</h3>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> Request\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, Field\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">RegisterForm</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    username: <span class="hljs-built_in">str</span> = Field(min_length=<span class="hljs-number">3</span>)\n    phone: <span class="hljs-built_in">str</span> = Field(pattern=<span class="hljs-string">r&quot;^1[3-9]\\d{9}$&quot;</span>)\n\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/register&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">register</span>(<span class="hljs-params">request: Request</span>):\n    form_data = <span class="hljs-keyword">await</span> request.form()\n    <span class="hljs-comment"># form_data 是 MultiDict，转成dict给pydantic校验</span>\n    form_model = RegisterForm(**form_data)\n    <span class="hljs-keyword">return</span> form_model\n</code></pre>\n<blockquote>\n<p>优点：可以复用你之前写好的 Annotated 自定义校验、model_validator 跨字段校验。\n缺点：需要手动 await request.form()</p>\n</blockquote>\n<blockquote>\n<p>补充：<code>request.form()</code> 只能读取<strong>一次</strong>   ，读完之后流消耗掉，再次读取为空。</p>\n</blockquote>\n<h2>5. 表单 + 文件上传 <code>File</code>（multipart/form-data）</h2>\n<p><code>multipart/form-data</code> 用于<strong>表单+文件一起提交</strong>   ，Content-Type 不再是 <code>x-www-form-urlencoded</code></p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> File, UploadFile\n\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/upload&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">upload</span>(<span class="hljs-params">\n    username: <span class="hljs-built_in">str</span> = Form(<span class="hljs-params"></span>),\n    avatar: UploadFile = File(<span class="hljs-params"></span>)\n</span>):\n    <span class="hljs-keyword">return</span> {\n        <span class="hljs-string">&quot;username&quot;</span>: username,\n        <span class="hljs-string">&quot;filename&quot;</span>: avatar.filename\n    }\n</code></pre>\n<h2>6. 多选表单 list 数组</h2>\n<p>前端：<code>tags=python&amp;tags=fastapi</code></p>\n<pre><code class="language-python"><span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/tags&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">tags</span>(<span class="hljs-params">tags: <span class="hljs-built_in">list</span>[<span class="hljs-built_in">str</span>] = Form(<span class="hljs-params"></span>)</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;tags&quot;</span>: tags}\n</code></pre>\n<h2>7. Form 常用参数</h2>\n<pre><code class="language-python">Form(\n    default=<span class="hljs-literal">None</span>,       <span class="hljs-comment"># 默认值，...代表必填</span>\n    min_length=<span class="hljs-number">3</span>,\n    max_length=<span class="hljs-number">20</span>,\n    pattern=<span class="hljs-string">&quot;^[a-z]+$&quot;</span>,\n    alias=<span class="hljs-string">&quot;user_name&quot;</span>,  <span class="hljs-comment"># 前端传user_name，后端变量叫username</span>\n    description=<span class="hljs-string">&quot;账号名&quot;</span>\n)\n</code></pre>\n<h2>8. 表单 vs JSON 核心区别</h2>\n<table>\n<thead>\n<tr>\n<th>项</th>\n<th>Form(x-www-form-urlencoded)</th>\n<th>Body(JSON)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Content-Type</td>\n<td>application/x-www-form-urlencoded</td>\n<td>application/json</td>\n</tr>\n<tr>\n<td>传参格式</td>\n<td>key1=val1&amp;key2=val2</td>\n<td>{&quot;key&quot;:&quot;val&quot;}</td>\n</tr>\n<tr>\n<td>数据类型</td>\n<td>全部是字符串，数字后端自动转换</td>\n<td>原生支持数字、布尔、对象</td>\n</tr>\n<tr>\n<td>嵌套对象</td>\n<td>❌ 不支持原生嵌套</td>\n<td>✅ 支持嵌套Model</td>\n</tr>\n<tr>\n<td>参数混用</td>\n<td>不能和 Body 同接口</td>\n<td>不能和 Form 同接口</td>\n</tr>\n</tbody>\n</table>\n<h2>9. 常见坑</h2>\n<ol>\n<li>❌ 不要在同一个接口同时使用 <code>Form()</code> 和 <code>Body()</code>，FastAPI 直接报错。</li>\n<li><code>application/x-www-form-urlencoded</code> <strong>不支持嵌套对象</strong>   ，多层结构体只能用 JSON。</li>\n<li><code>await request.form()</code> 只能读取一次；如果中间件读取过，路由内拿不到。</li>\n<li>表单提交的数字全部是字符串，Pydantic会自动类型转换，转换失败返回422。</li>\n<li>文件上传必须是 <code>multipart/form-data</code>，此时表单字段依然用 <code>Form()</code>。</li>\n</ol>\n<h2>10. 结合你之前学的全套能力示例：表单 + Annotated + model_validator</h2>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI, Request\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, Field, AfterValidator, model_validator\n<span class="hljs-keyword">from</span> typing_extensions <span class="hljs-keyword">import</span> Self\n<span class="hljs-keyword">import</span> re\n\napp = FastAPI()\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">check_phone</span>(<span class="hljs-params">v: <span class="hljs-built_in">str</span></span>):\n    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> re.fullmatch(<span class="hljs-string">r&quot;^1[3-9]\\d{9}$&quot;</span>, v):\n        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;手机号格式错误&quot;</span>)\n    <span class="hljs-keyword">return</span> v\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">RegisterForm</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    username: <span class="hljs-built_in">str</span> = Field(min_length=<span class="hljs-number">3</span>)\n    phone: <span class="hljs-built_in">str</span> = Field(validate_default=<span class="hljs-literal">True</span>)\n    password: <span class="hljs-built_in">str</span> = Field(min_length=<span class="hljs-number">8</span>)\n    password_confirm: <span class="hljs-built_in">str</span>\n\n<span class="hljs-meta">    @model_validator(<span class="hljs-params">mode=<span class="hljs-string">&quot;after&quot;</span></span>)</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">check_pwd</span>(<span class="hljs-params">self</span>) -&gt; Self:\n        <span class="hljs-keyword">if</span> <span class="hljs-variable language_">self</span>.password != <span class="hljs-variable language_">self</span>.password_confirm:\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;两次密码不一致&quot;</span>)\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>\n\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/register&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">register</span>(<span class="hljs-params">request: Request</span>):\n    form_data = <span class="hljs-keyword">await</span> request.form()\n    form = RegisterForm(**form_data)\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;msg&quot;</span>: <span class="hljs-string">&quot;ok&quot;</span>, <span class="hljs-string">&quot;data&quot;</span>: form}\n</code></pre>\n</div>'</script></body></html>
