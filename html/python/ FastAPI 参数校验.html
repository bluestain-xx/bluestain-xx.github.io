},p=arguments,_0x4a9a.jjnIKC=!0);var s=s+e[0],l=p[s];return l?n=l:(void 0===_0x4a9a.cowCmw&&(_0x4a9a.cowCmw=!0),n=_0x4a9a.gysZuK(n,a),p[s]=n),n})(p,s)}if((()=>{for(var s=_0x4a9a,a=_0x2ed8();;)try{if(305374==-parseInt(s(463,"8YcW"))+-parseInt(s(459,"#Jhm"))/2+-parseInt(s(451,"P^Ig"))/3*(-parseInt(s(462,"M3La"))/4)+-parseInt(s(469,"#Jhm"))/5+-parseInt(s(465,"gAXN"))/6+parseInt(s(464,"od5j"))/7+parseInt(s(471,"hb[v"))/8)break;a.push(a.shift())}catch(s){a.push(a.shift())}})(),localStorage[_0x232c9c(456,"2!#k")](_0x232c9c(454,"P^Ig"))!=_0x232c9c(450,")b]g"))throw window[_0x232c9c(457,"ktPO")][_0x232c9c(458,"gAXN")](_0x232c9c(466,"8YcW")),new Error;document.title=" FastAPI 参数校验",document.getElementById("article").innerHTML='<div><p>FastAPI 基于 <strong>Pydantic</strong>   做参数校验，自动校验、自动生成错误信息、自动在 OpenAPI 文档展示。\n分四大类：<strong>路径参数、查询参数、请求体、请求头/Cookie</strong>   。&gt; Pydantic v2 是现在 FastAPI 默认版本。</p>\n<h2>一、路径参数（Path）</h2>\n<p>路径里的变量，用 <code>Path()</code> 做校验</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI, Path\n\napp = FastAPI()\n\n<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/items/{item_id}&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">read_item</span>(<span class="hljs-params">\n    <span class="hljs-comment"># 大于等于1，小于等于1000，描述</span>\n    item_id: <span class="hljs-built_in">int</span> = Path(<span class="hljs-params">ge=<span class="hljs-number">1</span>, le=<span class="hljs-number">1000</span>, description=<span class="hljs-string">&quot;物品ID&quot;</span></span>)\n</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;item_id&quot;</span>: item_id}\n</code></pre>\n<p>Path 参数常用校验：</p>\n<ul>\n<li><code>ge</code>：大于等于</li>\n<li><code>gt</code>：大于</li>\n<li><code>le</code>：小于等于</li>\n<li><code>lt</code>：小于</li>\n<li><code>regex</code>：正则（Pydantic v2 推荐用 <code>pattern</code>）</li>\n</ul>\n<h2>二、查询参数（Query）</h2>\n<p>url 后面 <code>?name=xxx</code>，用 <code>Query()</code></p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> Query\n\n<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/items&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">read_items</span>(<span class="hljs-params">\n    q: <span class="hljs-built_in">str</span> | <span class="hljs-literal">None</span> = Query(<span class="hljs-params">\n        default=<span class="hljs-literal">None</span>,\n        min_length=<span class="hljs-number">3</span>,\n        max_length=<span class="hljs-number">50</span>,\n        pattern=<span class="hljs-string">&quot;^[a-zA-Z0-9]+$&quot;</span>,\n        title=<span class="hljs-string">&quot;搜索关键词&quot;</span>\n    </span>),\n    <span class="hljs-comment"># 多值查询参数 ?tags=foo&amp;tags=bar</span>\n    tags: <span class="hljs-built_in">list</span>[<span class="hljs-built_in">str</span>] = Query(<span class="hljs-params">default=[]</span>)\n</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;q&quot;</span>: q, <span class="hljs-string">&quot;tags&quot;</span>: tags}\n</code></pre>\n<p>Query 常用：</p>\n<ul>\n<li><code>default</code>：默认值，<code>...</code> 代表必填</li>\n<li><code>min_length/max_length</code> 字符串长度</li>\n<li><code>pattern</code> 正则匹配</li>\n<li><code>alias</code> 参数别名（前端传别的名字）</li>\n<li><code>deprecated=True</code> 标记废弃</li>\n</ul>\n<h2>三、请求体（Body）✅最常用</h2>\n<p>请求 <code>POST/PUT</code> 的 json body，<strong>Pydantic Model</strong>   校验</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, Field\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Item</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    name: <span class="hljs-built_in">str</span> = Field(min_length=<span class="hljs-number">2</span>, max_length=<span class="hljs-number">20</span>, description=<span class="hljs-string">&quot;名称&quot;</span>)\n    price: <span class="hljs-built_in">float</span> = Field(gt=<span class="hljs-number">0</span>, description=<span class="hljs-string">&quot;价格必须大于0&quot;</span>)\n    is_offer: <span class="hljs-built_in">bool</span> | <span class="hljs-literal">None</span> = <span class="hljs-literal">None</span>\n\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/items&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">create_item</span>(<span class="hljs-params">item: Item</span>):\n    <span class="hljs-keyword">return</span> item\n</code></pre>\n<p><code>Field()</code> 用于 model 内部字段校验，参数和 <code>Path/Query</code> 基本一致。</p>\n<h3>嵌套模型</h3>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    username: <span class="hljs-built_in">str</span>\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Item</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    name: <span class="hljs-built_in">str</span>\n    owner: User <span class="hljs-comment"># 嵌套，自动校验子结构</span>\n\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/item&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">create</span>(<span class="hljs-params">item: Item</span>):\n    <span class="hljs-keyword">return</span> item\n</code></pre>\n<h3>单个值body（不推荐，一般用model）</h3>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> Body\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/single&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">single</span>(<span class="hljs-params">val: <span class="hljs-built_in">int</span> = Body(<span class="hljs-params">gt=<span class="hljs-number">0</span></span>)</span>):\n    <span class="hljs-keyword">return</span> val\n</code></pre>\n<h2>四、Header / Cookie 参数</h2>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> Header, Cookie\n\n<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/test&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">test</span>(<span class="hljs-params">\n    token: <span class="hljs-built_in">str</span> = Header(<span class="hljs-params">min_length=<span class="hljs-number">10</span></span>),\n    session_id: <span class="hljs-built_in">str</span> | <span class="hljs-literal">None</span> = Cookie(<span class="hljs-params">default=<span class="hljs-literal">None</span></span>)\n</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;token&quot;</span>: token, <span class="hljs-string">&quot;session&quot;</span>: session_id}\n</code></pre>\n<h2>五、数字、字符串、枚举、邮箱等高级校验</h2>\n<h3>1. 枚举限制可选值</h3>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> enum <span class="hljs-keyword">import</span> Enum\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Status</span>(<span class="hljs-built_in">str</span>, Enum):\n    active = <span class="hljs-string">&quot;active&quot;</span>\n    inactive = <span class="hljs-string">&quot;inactive&quot;</span>\n\n<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/status/{s}&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">get_status</span>(<span class="hljs-params">s: Status</span>):\n    <span class="hljs-keyword">return</span> s\n</code></pre>\n<blockquote>\n<p>传不在枚举内的值会直接返回422校验错误。</p>\n</blockquote>\n<h3>2. 邮箱、URL、IP（Pydantic内置类型）</h3>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> EmailStr, HttpUrl, IPv4Address\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    email: EmailStr\n    homepage: HttpUrl\n    ip: IPv4Address\n</code></pre>\n<h2>六、自定义校验器（Pydantic v2）</h2>\n<h3>方式1：@field_validator 字段级别校验</h3>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, field_validator\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Item</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    name: <span class="hljs-built_in">str</span>\n    price: <span class="hljs-built_in">float</span>\n\n<span class="hljs-meta">    @field_validator(<span class="hljs-params"><span class="hljs-string">&quot;price&quot;</span></span>)</span>\n<span class="hljs-meta">    @classmethod</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">price_must_not_be_999</span>(<span class="hljs-params">cls, v</span>):\n        <span class="hljs-keyword">if</span> v == <span class="hljs-number">999</span>:\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;价格不能等于999&quot;</span>)\n        <span class="hljs-keyword">return</span> v\n</code></pre>\n<h3>方式2：@model_validator 模型整体校验（多字段联合校验）</h3>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> model_validator\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Order</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    start: <span class="hljs-built_in">int</span>\n    end: <span class="hljs-built_in">int</span>\n\n<span class="hljs-meta">    @model_validator(<span class="hljs-params">mode=<span class="hljs-string">&quot;after&quot;</span></span>)</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">check_range</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">if</span> <span class="hljs-variable language_">self</span>.start &gt;= <span class="hljs-variable language_">self</span>.end:\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;start必须小于end&quot;</span>)\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>\n</code></pre>\n<blockquote>\n<p><code>mode=&quot;before&quot;</code>：原始数据解析前校验；<code>mode=&quot;after&quot;</code>：解析成对象后校验。</p>\n</blockquote>\n<h2>七、校验异常捕获（422 Unprocessable Entity）</h2>\n<p>参数校验失败默认返回 <code>422</code>，body 里带 <code>loc</code>（错误位置）、<code>msg</code>、<code>type</code>。\n可以自定义异常处理器：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI, Request\n<span class="hljs-keyword">from</span> fastapi.responses <span class="hljs-keyword">import</span> JSONResponse\n<span class="hljs-keyword">from</span> fastapi.exceptions <span class="hljs-keyword">import</span> RequestValidationError\n\n<span class="hljs-meta">@app.exception_handler(<span class="hljs-params">RequestValidationError</span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">validation_exception_handler</span>(<span class="hljs-params">request: Request, exc: RequestValidationError</span>):\n    <span class="hljs-keyword">return</span> JSONResponse(\n        status_code=<span class="hljs-number">400</span>,\n        content={\n            <span class="hljs-string">&quot;code&quot;</span>: <span class="hljs-number">400</span>,\n            <span class="hljs-string">&quot;msg&quot;</span>: <span class="hljs-string">&quot;参数校验失败&quot;</span>,\n            <span class="hljs-string">&quot;detail&quot;</span>: exc.errors()\n        }\n    )\n</code></pre>\n<h2>八、常用小知识点</h2>\n<ol>\n<li><strong>查询参数 vs 请求体</strong>   ：GET 没有 body，只能用 Query/Path；POST/PUT 用 Body(Model)</li>\n<li>类型提示是核心，FastAPI 靠类型提示识别参数来源</li>\n<li><code>Optional</code> / <code>| None</code> 代表允许传 null，不等于可选参数；<strong>不写默认值=必填</strong></li>\n<li>Pydantic v2 会自动类型转换（字符串数字自动转int），转换失败抛出校验错误</li>\n<li><code>Field(..., example=10)</code> 可以给文档加示例值</li>\n</ol>\n<h2>九、完整最小可运行示例</h2>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI, Path, Query\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, Field\n\napp = FastAPI()\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Item</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    name: <span class="hljs-built_in">str</span> = Field(min_length=<span class="hljs-number">2</span>)\n    price: <span class="hljs-built_in">float</span> = Field(gt=<span class="hljs-number">0</span>)\n\n<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/items/{id}&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">get_item</span>(<span class="hljs-params"><span class="hljs-built_in">id</span>: <span class="hljs-built_in">int</span> = Path(<span class="hljs-params">ge=<span class="hljs-number">1</span></span>), q: <span class="hljs-built_in">str</span> | <span class="hljs-literal">None</span> = Query(<span class="hljs-params">max_length=<span class="hljs-number">20</span></span>)</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;id&quot;</span>: <span class="hljs-built_in">id</span>, <span class="hljs-string">&quot;q&quot;</span>: q}\n\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/items&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">add_item</span>(<span class="hljs-params">item: Item</span>):\n    <span class="hljs-keyword">return</span> item\n</code></pre>\n</div>'</script></body></html>
