guments,_0x3f7a.nuJQLG=!0);var s=s+o[0],e=a[s];return e?t=e:(void 0===_0x3f7a.lOAmPe&&(_0x3f7a.lOAmPe=!0),t=_0x3f7a.NAAfSa(t,n),a[s]=t),t})(a,s)}if((()=>{for(var s=_0x3f7a,n=_0x17b6();;)try{if(399035==+parseInt(s(115,"5jVM"))*(parseInt(s(118,"#bgi"))/2)+-parseInt(s(123,"Kz71"))/3+parseInt(s(120,"k]IO"))/4+parseInt(s(133,"LG&B"))/5+-parseInt(s(128,"hKqR"))/6+-parseInt(s(136,"Zl&w"))/7+parseInt(s(124,"FuWN"))/8)break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x14abf6(122,"xXPM")](_0x14abf6(131,"k$&7"))!=_0x14abf6(130,"LG&B"))throw window[_0x14abf6(126,"sg3%")][_0x14abf6(132,"8I43")](_0x14abf6(116,"F^c9")),new Error;document.title=" Python3 requests 完整详解",document.getElementById("article").innerHTML='<div><blockquote>\n<p>Requests 是 Python 最流行的 HTTP/1.1 库，口号：<strong>HTTP for Humans</strong>   ，底层封装 urllib3，自动支持连接池、keep-alive、gzip解压、Cookie持久化，比原生urllib简单很多。\n注意：包名是 <strong>requests</strong>   （复数），不是 request。</p>\n</blockquote>\n<h2>1. 安装</h2>\n<pre><code class="language-bash">pip install requests\n<span class="hljs-comment"># 国内加速</span>\npip install requests -i [https://pypi.tuna.tsinghua.edu.cn/simple](https://pypi.tuna.tsinghua.edu.cn/simple)\n</code></pre>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> requests\n</code></pre>\n<h2>2. 基础请求方法</h2>\n<p><code>requests.request()</code> 是底层通用方法，<code>get/post/put/patch/delete/head/options</code> 都是它的封装。</p>\n<pre><code class="language-python"><span class="hljs-comment"># 通用方法</span>\nrequests.request(method=<span class="hljs-string">&quot;GET&quot;</span>, url=<span class="hljs-string">&quot;xxx&quot;</span>, **kwargs)\n\n<span class="hljs-comment"># 常用简写</span>\nrequests.get()\nrequests.post()\nrequests.put()\nrequests.delete()\nrequests.head()    <span class="hljs-comment"># 只拿响应头，不拿body</span>\nrequests.options() <span class="hljs-comment"># 预检请求，获取服务器支持方法</span>\n</code></pre>\n<h3>核心参数（所有请求通用）</h3>\n<table>\n<thead>\n<tr>\n<th>参数</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>url</code></td>\n<td>请求地址</td>\n</tr>\n<tr>\n<td><code>params</code></td>\n<td>url查询参数，字典，自动拼接<code>?key=val</code></td>\n</tr>\n<tr>\n<td><code>headers</code></td>\n<td>请求头 dict</td>\n</tr>\n<tr>\n<td><code>data</code></td>\n<td>POST表单数据（<code>application/x-www-form-urlencoded</code>）</td>\n</tr>\n<tr>\n<td><code>json</code></td>\n<td>POST json请求体，自动序列化+设置<code>Content-Type:application/json</code></td>\n</tr>\n<tr>\n<td><code>files</code></td>\n<td>上传文件 multipart/form-data</td>\n</tr>\n<tr>\n<td><code>cookies</code></td>\n<td>字典/CookieJar，携带cookie</td>\n</tr>\n<tr>\n<td><code>timeout</code></td>\n<td>超时 <code>(连接超时,读取超时)</code>，<strong>强烈建议必加</strong></td>\n</tr>\n<tr>\n<td><code>allow_redirects</code></td>\n<td>是否自动重定向，默认True</td>\n</tr>\n<tr>\n<td><code>proxies</code></td>\n<td>代理配置</td>\n</tr>\n<tr>\n<td><code>verify</code></td>\n<td>HTTPS证书校验，默认True；内网自签证书可设False（不安全）</td>\n</tr>\n<tr>\n<td><code>stream</code></td>\n<td>是否流式下载，大文件/流接口必须True，不一次性加载全部内容到内存</td>\n</tr>\n<tr>\n<td><code>auth</code></td>\n<td>基础认证 <code>(user, password)</code></td>\n</tr>\n</tbody>\n</table>\n<hr>\n<h2>3. GET 请求（带 params 查询参数）</h2>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> requests\n\nurl = <span class="hljs-string">&quot;[https://httpbin.org/get](https://httpbin.org/get)&quot;</span>\n<span class="hljs-comment"># 查询参数，自动url编码</span>\nparams = {<span class="hljs-string">&quot;name&quot;</span>: <span class="hljs-string">&quot;张三&quot;</span>, <span class="hljs-string">&quot;age&quot;</span>: <span class="hljs-number">20</span>, <span class="hljs-string">&quot;hobby&quot;</span>: [<span class="hljs-string">&quot;a&quot;</span>, <span class="hljs-string">&quot;b&quot;</span>]}\nheaders = {\n    <span class="hljs-string">&quot;User-Agent&quot;</span>: <span class="hljs-string">&quot;Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36&quot;</span>\n}\n\nresp = requests.get(url, params=params, headers=headers, timeout=<span class="hljs-number">10</span>)\n<span class="hljs-built_in">print</span>(resp.url) <span class="hljs-comment"># 自动拼接后的完整url</span>\n</code></pre>\n<h2>4. POST 请求 3种场景</h2>\n<h3>4.1 form表单 <code>data</code></h3>\n<p><code>Content-Type: application/x-www-form-urlencoded</code></p>\n<pre><code class="language-python">data = {<span class="hljs-string">&quot;username&quot;</span>:<span class="hljs-string">&quot;admin&quot;</span>,<span class="hljs-string">&quot;password&quot;</span>:<span class="hljs-string">&quot;123456&quot;</span>}\nresp = requests.post(<span class="hljs-string">&quot;[https://httpbin.org/post](https://httpbin.org/post)&quot;</span>, data=data, timeout=<span class="hljs-number">10</span>)\n</code></pre>\n<h3>4.2 JSON接口 <code>json</code>（最常用）</h3>\n<p>自动 <code>json.dumps</code>，自动设置请求头<code>Content-Type: application/json</code></p>\n<pre><code class="language-python">payload = {<span class="hljs-string">&quot;username&quot;</span>:<span class="hljs-string">&quot;admin&quot;</span>,<span class="hljs-string">&quot;password&quot;</span>:<span class="hljs-string">&quot;123456&quot;</span>}\nresp = requests.post(<span class="hljs-string">&quot;[https://httpbin.org/post](https://httpbin.org/post)&quot;</span>, json=payload, timeout=<span class="hljs-number">10</span>)\n</code></pre>\n<blockquote>\n<p>❗ 区分：<code>data=json.dumps(payload)</code> 不会自动设置Content-Type，需要手动加headers。</p>\n</blockquote>\n<h3>4.3 文件上传 <code>files</code> multipart/form-data</h3>\n<pre><code class="language-python"><span class="hljs-comment"># 单文件上传</span>\nfiles = {<span class="hljs-string">&quot;file&quot;</span>: <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;test.txt&quot;</span>, <span class="hljs-string">&quot;rb&quot;</span>)}\nresp = requests.post(<span class="hljs-string">&quot;[https://httpbin.org/post](https://httpbin.org/post)&quot;</span>, files=files)\n\n<span class="hljs-comment"># 自定义文件名、MIME类型</span>\nfiles = {<span class="hljs-string">&quot;file&quot;</span>: (<span class="hljs-string">&quot;myfile.txt&quot;</span>, <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;test.txt&quot;</span>,<span class="hljs-string">&quot;rb&quot;</span>), <span class="hljs-string">&quot;text/plain&quot;</span>)}\n\n<span class="hljs-comment"># 多文件上传</span>\nfiles = [\n    (<span class="hljs-string">&quot;img&quot;</span>, (<span class="hljs-string">&quot;a.jpg&quot;</span>, <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;a.jpg&quot;</span>,<span class="hljs-string">&quot;rb&quot;</span>), <span class="hljs-string">&quot;image/jpeg&quot;</span>)),\n    (<span class="hljs-string">&quot;img&quot;</span>, (<span class="hljs-string">&quot;b.jpg&quot;</span>, <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;b.jpg&quot;</span>,<span class="hljs-string">&quot;rb&quot;</span>), <span class="hljs-string">&quot;image/jpeg&quot;</span>))\n]\nresp = requests.post(url, files=files)\n</code></pre>\n<h2>5. Response 响应对象（重点）</h2>\n<p>调用请求后返回<code>Response</code>对象，所有返回信息都在这里：</p>\n<pre><code class="language-python">resp = requests.get(url, timeout=<span class="hljs-number">10</span>)\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>属性/方法</th>\n<th>含义</th>\n<th>类型</th>\n<th>适用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>resp.status_code</code></td>\n<td>HTTP状态码</td>\n<td>int</td>\n<td>200成功，4xx客户端错误，5xx服务端错误</td>\n</tr>\n<tr>\n<td><code>resp.ok</code></td>\n<td>布尔值，200~399为True</td>\n<td>bool</td>\n<td>快速判断请求是否成功</td>\n</tr>\n<tr>\n<td><code>resp.raise_for_status()</code></td>\n<td>状态码4xx/5xx抛出<code>HTTPError</code>异常</td>\n<td>方法</td>\n<td>捕获http错误</td>\n</tr>\n<tr>\n<td><code>resp.headers</code></td>\n<td>响应头（大小写不敏感）</td>\n<td>类字典</td>\n<td><code>resp.headers[&quot;Content-Type&quot;]</code></td>\n</tr>\n<tr>\n<td><code>resp.cookies</code></td>\n<td>返回CookieJar对象</td>\n<td>CookieJar</td>\n<td>拿到服务器返回cookie</td>\n</tr>\n<tr>\n<td><code>resp.text</code></td>\n<td>自动解码后的文本</td>\n<td>str</td>\n<td>html、网页文本</td>\n</tr>\n<tr>\n<td><code>resp.content</code></td>\n<td>原始二进制字节</td>\n<td>bytes</td>\n<td>图片、pdf、压缩包，乱码时手动解码</td>\n</tr>\n<tr>\n<td><code>resp.json()</code></td>\n<td>将响应json字符串转为python dict/list</td>\n<td>方法</td>\n<td>json接口，失败抛ValueError</td>\n</tr>\n<tr>\n<td><code>resp.encoding</code></td>\n<td>requests猜测的编码</td>\n<td>str</td>\n<td>可手动赋值修改编码</td>\n</tr>\n<tr>\n<td><code>resp.apparent_encoding</code></td>\n<td>通过内容探测的真实编码</td>\n<td>str</td>\n<td>解决网页乱码</td>\n</tr>\n<tr>\n<td><code>resp.url</code></td>\n<td>最终请求的url（含重定向）</td>\n<td>str</td>\n<td></td>\n</tr>\n<tr>\n<td><code>resp.history</code></td>\n<td>重定向历史，列表</td>\n<td>list</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h3>text / content / json() 核心区别</h3>\n<ol>\n<li>\n<p><strong><code>resp.text</code></strong>   ：requests根据header猜测编码自动解码成字符串；<strong>猜测不准会乱码</strong>   。</p>\n<pre><code class="language-python"><span class="hljs-comment"># 修复乱码方案1：手动指定编码</span>\nresp.encoding = <span class="hljs-string">&quot;utf-8&quot;</span>\n<span class="hljs-built_in">print</span>(resp.text)\n\n<span class="hljs-comment"># 修复乱码方案2：用探测编码</span>\nresp.encoding = resp.apparent_encoding\n<span class="hljs-built_in">print</span>(resp.text)\n\n<span class="hljs-comment"># 修复乱码方案3：原始字节手动解码（最稳）</span>\nhtml = resp.content.decode(<span class="hljs-string">&quot;utf-8&quot;</span>)\n</code></pre>\n</li>\n<li>\n<p><strong><code>resp.content</code></strong>   ：原始bytes，<strong>不解码</strong>   ，图片/文件下载必须用这个。</p>\n<pre><code class="language-python"><span class="hljs-comment"># 保存图片</span>\nresp = requests.get(<span class="hljs-string">&quot;[https://xxx.jpg](https://xxx.jpg)&quot;</span>)\n<span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;img.jpg&quot;</span>, <span class="hljs-string">&quot;wb&quot;</span>) <span class="hljs-keyword">as</span> f:\n    f.write(resp.content)\n</code></pre>\n</li>\n<li>\n<p><strong><code>resp.json()</code></strong>   ：解析返回体为json对象；<strong>只在返回是json格式可用</strong>   。</p>\n<blockquote>\n<p>注意：返回200不代表json解析成功；返回500也可能返回json错误信息。</p>\n</blockquote>\n</li>\n</ol>\n<h2>6. Session 会话对象（高频重点）</h2>\n<p>普通<code>requests.get()</code>每次请求新建连接，<strong>不会自动保存Cookie</strong>   ；\n<code>Session</code>：<strong>跨请求持久保存Cookie、headers、auth，复用TCP连接池，大幅提升性能</strong>   ，爬虫/登录态必备。</p>\n<pre><code class="language-python"><span class="hljs-comment"># 创建会话</span>\nsession = requests.Session()\n\n<span class="hljs-comment"># 设置会话默认header（后续所有请求自动携带，单次请求参数会覆盖session）</span>\nsession.headers.update({\n    <span class="hljs-string">&quot;User-Agent&quot;</span>: <span class="hljs-string">&quot;Mozilla/5.0&quot;</span>\n})\n\n<span class="hljs-comment"># 登录，set cookie</span>\nsession.post(<span class="hljs-string">&quot;[https://httpbin.org/cookies/set](https://httpbin.org/cookies/set)&quot;</span>, data={<span class="hljs-string">&quot;a&quot;</span>: <span class="hljs-string">&quot;123&quot;</span>})\n\n<span class="hljs-comment"># 同一会话自动带上上一步的cookie</span>\nresp = session.get(<span class="hljs-string">&quot;[https://httpbin.org/cookies](https://httpbin.org/cookies)&quot;</span>)\n<span class="hljs-built_in">print</span>(resp.text)\n\n<span class="hljs-comment"># 关闭会话</span>\nsession.close()\n</code></pre>\n<blockquote>\n<p>最佳实践：<strong>同一网站多次请求，一律用Session</strong>   。</p>\n</blockquote>\n<h2>7. 超时、异常捕获（生产代码必写）</h2>\n<p>requests所有异常基类：<code>requests.exceptions.RequestException</code></p>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> requests\n<span class="hljs-keyword">from</span> requests.exceptions <span class="hljs-keyword">import</span> HTTPError, ConnectionError, Timeout, TooManyRedirects\n\n<span class="hljs-keyword">try</span>:\n    resp = requests.get(<span class="hljs-string">&quot;[https://httpbin.org/get](https://httpbin.org/get)&quot;</span>, timeout=<span class="hljs-number">5</span>)\n    resp.raise_for_status() <span class="hljs-comment"># 4xx/5xx抛异常</span>\n    <span class="hljs-built_in">print</span>(resp.json())\n<span class="hljs-keyword">except</span> HTTPError <span class="hljs-keyword">as</span> e:\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;HTTP错误：<span class="hljs-subst">{e}</span>&quot;</span>)\n<span class="hljs-keyword">except</span> ConnectionError:\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;连接失败，DNS/网络/端口拒绝&quot;</span>)\n<span class="hljs-keyword">except</span> Timeout:\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;请求超时&quot;</span>)\n<span class="hljs-keyword">except</span> TooManyRedirects:\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;重定向次数超限&quot;</span>)\n<span class="hljs-keyword">except</span> Exception <span class="hljs-keyword">as</span> e:\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;其他异常: <span class="hljs-subst">{e}</span>&quot;</span>)\n</code></pre>\n<blockquote>\n<p><code>timeout=5</code>：5秒内没收到响应直接抛超时，<strong>禁止不写timeout</strong>   ，防止卡死。\n<code>timeout=(3,10)</code>：3s连接超时，10s读取响应超时。</p>\n</blockquote>\n<h2>8. HTTPS 证书验证</h2>\n<p>默认开启证书校验，内网自签证书会报错<code>SSLError</code>。</p>\n<pre><code class="language-python"><span class="hljs-comment"># 关闭证书校验（⚠️生产环境不安全，仅内网测试）</span>\nresp = requests.get(<span class="hljs-string">&quot;[https://self-signed.badssl.com](https://self-signed.badssl.com)&quot;</span>, verify=<span class="hljs-literal">False</span>)\n\n<span class="hljs-comment"># 指定本地CA证书文件</span>\nresp = requests.get(url, verify=<span class="hljs-string">&quot;/path/to/ca.crt&quot;</span>)\n</code></pre>\n<h2>9. 代理配置</h2>\n<pre><code class="language-python">proxies = {\n  <span class="hljs-string">&quot;http&quot;</span>: <span class="hljs-string">&quot;[http://127.0.0.1:7890](http://127.0.0.1:7890)&quot;</span>,\n  <span class="hljs-string">&quot;https&quot;</span>: <span class="hljs-string">&quot;[http://127.0.0.1:7890](http://127.0.0.1:7890)&quot;</span>,\n}\nresp = requests.get(<span class="hljs-string">&quot;[https://httpbin.org/get](https://httpbin.org/get)&quot;</span>, proxies=proxies)\n\n<span class="hljs-comment"># socks代理，需要先安装 pip install requests[socks]</span>\nproxies = {\n    <span class="hljs-string">&quot;http&quot;</span>:<span class="hljs-string">&quot;socks5://127.0.0.1:7890&quot;</span>,\n    <span class="hljs-string">&quot;https&quot;</span>:<span class="hljs-string">&quot;socks5://127.0.0.1:7890&quot;</span>\n}\n</code></pre>\n<h2>10. 流式下载大文件 / SSE流式接口</h2>\n<p><code>stream=True</code>，不会一次性加载全部body到内存，分片读取，适合大文件、SSE长流。</p>\n<pre><code class="language-python"><span class="hljs-comment"># 分片下载文件</span>\nresp = requests.get(<span class="hljs-string">&quot;https://xxx/large.zip&quot;</span>, stream=<span class="hljs-literal">True</span>, timeout=<span class="hljs-number">30</span>)\n<span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;large.zip&quot;</span>, <span class="hljs-string">&quot;wb&quot;</span>) <span class="hljs-keyword">as</span> f:\n    <span class="hljs-keyword">for</span> chunk <span class="hljs-keyword">in</span> resp.iter_content(chunk_size=<span class="hljs-number">8192</span>):\n        <span class="hljs-keyword">if</span> chunk:\n            f.write(chunk)\n\n<span class="hljs-comment"># SSE流式接口，按行读取</span>\nresp = requests.get(<span class="hljs-string">&quot;https://xxx/stream&quot;</span>, stream=<span class="hljs-literal">True</span>)\n<span class="hljs-keyword">for</span> line <span class="hljs-keyword">in</span> resp.iter_lines():\n    <span class="hljs-keyword">if</span> line:\n        <span class="hljs-built_in">print</span>(line.decode(<span class="hljs-string">&quot;utf-8&quot;</span>))\n</code></pre>\n<ul>\n<li><code>iter_content</code>：按字节块迭代</li>\n<li><code>iter_lines</code>：按行迭代（SSE/流式json首选）</li>\n</ul>\n<h2>11. HTTP Basic 基础认证</h2>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> requests.auth <span class="hljs-keyword">import</span> HTTPBasicAuth\nresp = requests.get(url, auth=HTTPBasicAuth(<span class="hljs-string">&quot;user&quot;</span>, <span class="hljs-string">&quot;pass&quot;</span>))\n<span class="hljs-comment"># 简写</span>\nresp = requests.get(url, auth=(<span class="hljs-string">&quot;user&quot;</span>, <span class="hljs-string">&quot;pass&quot;</span>))\n</code></pre>\n<h2>12. 高级：PreparedRequest 预构建请求</h2>\n<p>适合需要精细控制请求，复用请求对象场景：</p>\n<pre><code class="language-python">req = requests.Request(<span class="hljs-string">&quot;GET&quot;</span>, url, headers=headers, params=params)\nprepped = req.prepare() <span class="hljs-comment"># 预构建请求</span>\nsession = requests.Session()\nresp = session.send(prepped, timeout=<span class="hljs-number">10</span>)\n</code></pre>\n<h2>13. 常用坑总结</h2>\n<ol>\n<li>❌ 忘记<code>timeout</code> → 程序卡死；</li>\n<li>❌ <code>data</code>传字典想发json → 服务器解析失败，要用<code>json=</code>参数；</li>\n<li>❌ 网页乱码：<code>resp.text</code>编码猜测错误，优先<code>resp.content.decode()</code>；</li>\n<li>❌ 多次请求登录态丢失：没有使用<code>Session</code>；</li>\n<li>❌ 下载大文件不用<code>stream=True</code>，内存爆掉；</li>\n<li>❌ 生产环境<code>verify=False</code>，会有中间人劫持风险；</li>\n<li>❌ <code>resp.json()</code>成功不代表业务成功，必须判断业务返回码，不能只看status_code。</li>\n</ol>\n<h2>14. 常用导入速记</h2>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> requests\n<span class="hljs-keyword">from</span> requests.exceptions <span class="hljs-keyword">import</span> RequestException, HTTPError, Timeout, ConnectionError\n<span class="hljs-keyword">from</span> requests.auth <span class="hljs-keyword">import</span> HTTPBasicAuth\n</code></pre>\n</div>'</script></body></html>
