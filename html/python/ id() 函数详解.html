">1</span>,<span class="hljs-number">2</span>]\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">id</span>(a) == <span class="hljs-built_in">id</span>(c)) <span class="hljs-comment"># False，内容一样，但两个独立对象</span>\n</code></pre>\n<h2>区分：<code>id()</code>、<code>==</code>、<code>is</code></h2>\n<ul>\n<li><code>is</code>：判断<strong>id是否相等</strong>   （是不是同一个对象）</li>\n<li><code>==</code>：调用 <code>__eq__</code>，判断<strong>值是否相等</strong></li>\n</ul>\n<pre><code class="language-python">lst1 = [<span class="hljs-number">1</span>,<span class="hljs-number">2</span>]\nlst2 = [<span class="hljs-number">1</span>,<span class="hljs-number">2</span>]\n<span class="hljs-built_in">print</span>(lst1 == lst2)  <span class="hljs-comment"># True，值相等</span>\n<span class="hljs-built_in">print</span>(lst1 <span class="hljs-keyword">is</span> lst2)  <span class="hljs-comment"># False，不是同一个对象</span>\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">id</span>(lst1) == <span class="hljs-built_in">id</span>(lst2)) <span class="hljs-comment"># False</span>\n</code></pre>\n<h2>不可变对象的 id（小整数池/字符串驻留）</h2>\n<p>Python 会对一部分不可变对象做缓存复用，所以多个变量可能 id 相同：</p>\n<pre><code class="language-python">a = <span class="hljs-number">10</span>\nb = <span class="hljs-number">10</span>\n<span class="hljs-built_in">print</span>(a <span class="hljs-keyword">is</span> b) <span class="hljs-comment"># True，[-5,256]小整数池复用对象</span>\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">id</span>(a) == <span class="hljs-built_in">id</span>(b))\n</code></pre>\n<blockquote>\n<p>⚠️ 这个是 CPython 的实现细节，<strong>不是语言标准</strong>   ，不要业务代码依赖这个特性。</p>\n</blockquote>\n<p>字符串驻留例子：</p>\n<pre><code class="language-python">s1 = <span class="hljs-string">&quot;abc&quot;</span>\ns2 = <span class="hljs-string">&quot;abc&quot;</span>\n<span class="hljs-built_in">print</span>(s1 <span class="hljs-keyword">is</span> s2) <span class="hljs-comment"># True</span>\n</code></pre>\n<h2>可变对象 id 特点</h2>\n<p>可变对象原地修改，<strong>对象本身不变，id不变</strong>   ：</p>\n<pre><code class="language-python">lst = [<span class="hljs-number">1</span>,<span class="hljs-number">2</span>]\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">id</span>(lst))\nlst.append(<span class="hljs-number">3</span>)\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">id</span>(lst)) <span class="hljs-comment"># id没变！只是修改内存里的内容</span>\n</code></pre>\n<p>不可变对象“修改”，实际新建对象，id 变：</p>\n<pre><code class="language-python">a = <span class="hljs-number">10</span>\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">id</span>(a))\na = <span class="hljs-number">20</span> <span class="hljs-comment"># 不是修改10这个对象，a指向新对象20</span>\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">id</span>(a)) <span class="hljs-comment"># id改变</span>\n</code></pre>\n<h2>常见误区</h2>\n<ol>\n<li>❌ id 永远等于内存地址：只是 CPython 这样实现，其他 Python 解释器不一定。语言层面只保证：<strong>同一对象 id 唯一且生命周期不变</strong>   。</li>\n<li>❌ 值相同 id 一定相同：可变对象肯定不是；不可变对象也不一定（超出小整数池、动态拼接字符串）。</li>\n<li>❌ id 可以手动修改：不能。</li>\n</ol>\n</div>'</script></body></html>
