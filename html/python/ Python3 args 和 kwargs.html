class 'dict'&gt;\n# 张三\n</code></pre>\n<p>规则：</p>\n<ol>\n<li>只能放在参数列表<strong>最后</strong>   ；</li>\n<li>只捕获 <code>key=value</code> 关键字实参；</li>\n<li>不传关键字参数时，<code>kwargs</code> 是空字典 <code>{}</code>。</li>\n</ol>\n<h2>3. 混合参数顺序（重要！Python强制顺序）</h2>\n<p>**顺序：普通位置参数 → *args → 关键字-only参数 → **   kwargs**</p>\n<pre><code>def demo(a, b, *args, c=10, **kwargs):\n    print(f&quot;a={a}, b={b}&quot;)\n    print(f&quot;args={args}&quot;)\n    print(f&quot;c={c}&quot;)\n    print(f&quot;kwargs={kwargs}&quot;)\n\ndemo(1, 2, 3, 4, c=20, name=&quot;test&quot;)\n# a=1, b=2\n# args=(3,4)\n# c=20\n# kwargs={'name': 'test'}\n</code></pre>\n<p>❌ 错误示例：<code>**kwargs</code> 不能写在 <code>*args</code> 前面</p>\n<pre><code># 语法报错\ndef bad(**kwargs, *args):\n    pass\n</code></pre>\n<h2>4. 解包（调用函数时使用 * 和 **）</h2>\n<p>除了定义函数收集参数，调用函数时 <code>*</code> / <code>**</code> 还能**   解包**：</p>\n<pre><code>def func(a,b,c):\n    print(a,b,c)\n\n# 元组解包 *\nt = (10,20,30)\nfunc(*t)  # 等价 func(10,20,30)\n\n# 字典解包 **\nd = {&quot;a&quot;:1, &quot;b&quot;:2, &quot;c&quot;:3}\nfunc(**d) # 等价 func(a=1,b=2,c=3)\n</code></pre>\n<h2>5. 常见使用场景</h2>\n<ol>\n<li>包装通用函数/装饰器，不确定传入多少参数；</li>\n<li>代理转发参数：封装一层，把所有参数原样传给内层函数；</li>\n</ol>\n<pre><code>def log_call(*args, **kwargs):\n    print(&quot;调用参数：&quot;, args, kwargs)\n    return real_func(*args, **kwargs)\n</code></pre>\n<ol start=\"3\">\n<li>兼容多版本接口，参数数量动态变化。</li>\n</ol>\n<h2>6. 易错点</h2>\n<ul>\n<li><code>*args</code> 是元组，<strong>不可修改</strong>   ；<code>**kwargs</code> 是字典，可以增删键值；</li>\n<li><code>**kwargs</code> 的 key 必须是合法标识符，不能是数字；</li>\n<li>不能同时出现两个 <code>*args</code> 或者两个 <code>**kwargs</code>；</li>\n<li><code>*</code> 单独作为参数：<code>def f(a, *, b)</code>，代表后面的 <code>b</code> 必须用关键字传参（关键字-only参数）。</li>\n</ul>\n<h3>极简记忆</h3>\n<ul>\n<li><code>*</code> → 打包/解包<strong>位置参数，tuple</strong></li>\n<li><code>**</code> → 打包/解包**   关键字参数，dict**</li>\n</ul>\n</div>"</script></body></html>
