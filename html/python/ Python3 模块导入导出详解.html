/span> <span class="hljs-comment"># 名称改写(name mangling)，不是真正私有</span>\n</code></pre>\n<h3>1. 导入（import）四种写法</h3>\n<p><code>main.py</code></p>\n<pre><code class="language-python"><span class="hljs-comment"># 1. 导入整个模块，使用时必须加模块名前缀</span>\n<span class="hljs-keyword">import</span> math_util\n<span class="hljs-built_in">print</span>(math_util.PI)\n<span class="hljs-built_in">print</span>(math_util.add(<span class="hljs-number">1</span>,<span class="hljs-number">2</span>))\n\n<span class="hljs-comment"># 2. 从模块导入指定对象（函数/变量/类），直接使用名字</span>\n<span class="hljs-keyword">from</span> math_util <span class="hljs-keyword">import</span> PI, add\n<span class="hljs-built_in">print</span>(PI)\n\n<span class="hljs-comment"># 3. 导入并重命名（解决名字冲突，推荐）</span>\n<span class="hljs-keyword">from</span> math_util <span class="hljs-keyword">import</span> add <span class="hljs-keyword">as</span> math_add\n<span class="hljs-built_in">print</span>(math_add(<span class="hljs-number">2</span>,<span class="hljs-number">3</span>))\n\n<span class="hljs-comment"># 4. 通配符导入 from xxx import *</span>\n<span class="hljs-keyword">from</span> math_util <span class="hljs-keyword">import</span> *\n<span class="hljs-built_in">print</span>(PI)\n</code></pre>\n<blockquote>\n<p>⚠️ <strong>禁止在生产代码使用 <code>from xxx import *</code></strong><br>\n会污染当前命名空间，无法看清名字来源；只在交互式控制台临时使用。\n<code>import *</code> 默认只会导入<strong>不在 <code>_</code>开头</strong>   且在 <code>__all__</code> 列表里的对象。</p>\n</blockquote>\n<h2>二、所谓“导出”：<code>__all__</code> 变量（重点）</h2>\n<p><code>__all__</code> 是模块里的列表，<strong>控制 <code>from xxx import *</code> 时哪些名字会被导出</strong>   ，只对通配符导入生效！</p>\n<blockquote>\n<p>它<strong>不限制</strong>   <code>import module</code> / <code>from module import name</code> 显式导入。</p>\n</blockquote>\n<p>修改 <code>math_util.py</code>：</p>\n<pre><code class="language-python">PI = <span class="hljs-number">3.14</span>\nadd = <span class="hljs-keyword">lambda</span> a,b:a+b\n_secret = <span class="hljs-string">&quot;内部变量&quot;</span>\n\n<span class="hljs-comment"># 定义导出列表</span>\n__all__ = [<span class="hljs-string">&quot;PI&quot;</span>, <span class="hljs-string">&quot;add&quot;</span>]\n</code></pre>\n<p>此时：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> math_util <span class="hljs-keyword">import</span> *\n<span class="hljs-built_in">print</span>(PI)   <span class="hljs-comment"># ✅ 可以</span>\n<span class="hljs-built_in">print</span>(add)  <span class="hljs-comment"># ✅ 可以</span>\n<span class="hljs-built_in">print</span>(_secret) <span class="hljs-comment"># ❌ 找不到，因为不在 __all__</span>\n</code></pre>\n<p>但显式导入依然可以拿到 <code>_secret</code>：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> math_util <span class="hljs-keyword">import</span> _secret\n<span class="hljs-built_in">print</span>(_secret) <span class="hljs-comment"># ✅ 仍然可以导入，__all__拦不住显式导入</span>\n</code></pre>\n<blockquote>\n<p>总结：\n<code>__all__</code> = 给阅读者说明<strong>模块对外公开API</strong>   ，同时控制 <code>import *</code>，不是真正的访问权限控制。</p>\n</blockquote>\n<h2>三、模块导入原理（底层）</h2>\n<p>Python 导入分 3 步：</p>\n<ol>\n<li><strong>查找</strong>   ：在 <code>sys.path</code> 路径列表搜索模块文件</li>\n<li><strong>加载</strong>   ：读取源码，编译成字节码（<code>.pyc</code>）</li>\n<li><strong>实例化</strong>   ：创建一个 <code>module</code> 对象，把模块顶层变量挂到对象的命名空间，存入 <code>sys.modules</code></li>\n</ol>\n<h3>sys.path 搜索顺序</h3>\n<ol>\n<li>当前脚本所在目录（<code>\'\'</code>）</li>\n<li>环境变量 <code>PYTHONPATH</code></li>\n<li>Python 标准库目录</li>\n<li>site-packages（pip安装包）</li>\n</ol>\n<blockquote>\n<p><code>sys.modules</code>：全局模块缓存字典。<strong>同一个模块只会被加载一次</strong>   。\n多次 <code>import math_util</code>，不会重复执行模块代码，直接复用缓存里的module对象。</p>\n</blockquote>\n<h3>模块执行时机</h3>\n<p>模块文件里<strong>顶层代码</strong>   ，在<strong>第一次被导入时执行一次</strong>   。\n<code>math_util.py</code></p>\n<pre><code class="language-python"><span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;模块 math_util 正在被加载！&quot;</span>)\n\nPI = <span class="hljs-number">3.14</span>\n</code></pre>\n<p>运行 main.py：</p>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> math_util <span class="hljs-comment"># 第一次导入：打印这句话</span>\n<span class="hljs-keyword">import</span> math_util <span class="hljs-comment"># 第二次：不会再次打印，直接拿缓存</span>\n</code></pre>\n<p>判断是被导入还是直接运行：<code>if __name__ == &quot;__main__&quot;:</code></p>\n<pre><code class="language-python"><span class="hljs-comment"># math_util.py</span>\nPI = <span class="hljs-number">3.14</span>\n\n<span class="hljs-keyword">if</span> __name__ == <span class="hljs-string">&quot;__main__&quot;</span>:\n    <span class="hljs-comment"># 当前文件作为脚本直接运行时才执行；被 import 时不会执行</span>\n    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;直接运行 math_util&quot;</span>)\n</code></pre>\n<p>原理：</p>\n<ul>\n<li>文件直接执行：<code>__name__ = &quot;__main__&quot;</code></li>\n<li>文件被别的模块导入：<code>__name__ = 模块文件名</code>（<code>math_util</code>）</li>\n</ul>\n<h2>四、包（Package）导入</h2>\n<p>文件夹包结构：</p>\n<pre><code>project/\n├── mypkg/\n│   ├── __init__.py\n│   ├── a.py\n│   └── b.py\n└── main.py\n</code></pre>\n<p><code>__init__.py</code>：当 <code>import mypkg</code> 时，自动执行这个文件，用来做包的导出。</p>\n<p><code>mypkg/__init__.py</code></p>\n<pre><code class="language-python"><span class="hljs-comment"># 从包内模块导入，对外暴露，简化外部导入</span>\n<span class="hljs-keyword">from</span> .a <span class="hljs-keyword">import</span> func_a\n<span class="hljs-keyword">from</span> .b <span class="hljs-keyword">import</span> func_b\n\n<span class="hljs-comment"># 定义包级别的 __all__，针对 from mypkg import *</span>\n__all__ = [<span class="hljs-string">&quot;func_a&quot;</span>, <span class="hljs-string">&quot;func_b&quot;</span>]\n</code></pre>\n<p><code>mypkg/a.py</code></p>\n<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">func_a</span>():\n    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;A&quot;</span>\n</code></pre>\n<p>main.py 使用：</p>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> mypkg\n<span class="hljs-built_in">print</span>(mypkg.func_a())\n\n<span class="hljs-comment"># 或者</span>\n<span class="hljs-keyword">from</span> mypkg <span class="hljs-keyword">import</span> func_a, func_b\n</code></pre>\n<h3>相对导入 vs 绝对导入（包内）</h3>\n<blockquote>\n<p>相对导入<strong>只能在包内部使用</strong>   ，不能在作为主脚本（<code>__main__</code>）的文件里使用。</p>\n</blockquote>\n<ul>\n<li><code>.</code> 当前包</li>\n<li><code>..</code> 上一级包</li>\n</ul>\n<p><code>mypkg/b.py</code></p>\n<pre><code class="language-python"><span class="hljs-comment"># mypkg/b.py，包内相对导入</span>\n<span class="hljs-keyword">from</span> .a <span class="hljs-keyword">import</span> func_a\n</code></pre>\n<p>绝对导入（推荐工程化项目）：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> mypkg.a <span class="hljs-keyword">import</span> func_a\n</code></pre>\n<blockquote>\n<p>规范：<strong>优先绝对导入</strong>   ，可读性更好；相对导入适合包内部模块互相引用。</p>\n</blockquote>\n<h2>五、常见坑点</h2>\n<h3>1. 循环导入（Circular Import）</h3>\n<blockquote>\n<p>a.py import b，b.py import a → 报错 <code>ImportError</code></p>\n</blockquote>\n<pre><code># a.py\nfrom b import bb\naa = 1\n\n# b.py\nfrom a import aa\nbb = 2\n</code></pre>\n<p>原因：模块加载未完成，命名空间不完整。\n✅ 解决办法：</p>\n<ol>\n<li>将导入放到<strong>函数内部</strong>   （运行时才导入，不是模块顶层）</li>\n<li>重构代码，抽离公共模块</li>\n<li>改为 <code>import module</code> 而不是 <code>from module import name</code></li>\n</ol>\n<h3>2. 名字覆盖</h3>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> math_util <span class="hljs-keyword">import</span> add\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">add</span>(): <span class="hljs-comment"># 覆盖了导入进来的 add</span>\n    <span class="hljs-keyword">pass</span>\n</code></pre>\n<h3>3. 模块和标准库重名</h3>\n<p>不要自己写 <code>os.py</code> / <code>sys.py</code>，会覆盖标准库模块，导致诡异错误。</p>\n<h3>4. 缓存 sys.modules</h3>\n<p>想要重新加载模块（调试用）：</p>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> importlib\n<span class="hljs-keyword">import</span> math_util\nmath_util = importlib.reload(math_util)\n</code></pre>\n<blockquote>\n<p>reload 不推荐生产使用，只用于交互式调试。</p>\n</blockquote>\n<h2>六、导入方式速查表</h2>\n<table>\n<thead>\n<tr>\n<th>写法</th>\n<th>作用</th>\n<th>命名空间</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>import mod</code></td>\n<td>导入整个模块</td>\n<td>使用 <code>mod.xxx</code></td>\n</tr>\n<tr>\n<td><code>from mod import x</code></td>\n<td>导入单个对象</td>\n<td>当前作用域直接 x</td>\n</tr>\n<tr>\n<td><code>from mod import x as y</code></td>\n<td>导入并别名</td>\n<td>当前作用域 y</td>\n</tr>\n<tr>\n<td><code>from mod import *</code></td>\n<td>导入 <strong>all</strong>   内所有</td>\n<td>污染命名空间，禁止生产</td>\n</tr>\n</tbody>\n</table>\n<h2>七、总结一句话</h2>\n<p>Python 的模块<strong>没有显式 export</strong>   ：</p>\n<ol>\n<li>模块顶层定义的名字，默认对外可见；</li>\n<li><code>__all__</code> 只是声明公开API，只对 <code>import *</code>生效；</li>\n<li><code>import</code> 本质加载模块，生成module对象，存入全局缓存；</li>\n<li>包用 <code>__init__.py</code> 对外暴露接口，推荐绝对导入。</li>\n</ol>\n</div>'</script></body></html>
