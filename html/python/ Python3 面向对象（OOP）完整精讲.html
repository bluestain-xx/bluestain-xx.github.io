_0x4eb6.olvsQS=!0),a=_0x4eb6.jbLKpl(a,n),p[s]=a),a})(p,s)}function _0x5bc3(){var s=["W4mGFvBcSSkAWOHNWQhcTSoecSoc","W6VdNguUWP/dUN/dQSoqyCkwWOhcUW","jJtcLeaIWPHYW6pdRSk7zM9QdSkNzCouWPrJW7hcTLa1W5tdNea","hmoRaLBdGeddNCoLBmkpWRJcPHi","Du3dNG/cJG","f8kKWPqDdaxcVmo5","g8oqW6HmW5FcG8oXn8o7","WQNcNKGPvWRdPX/dUc9OW7u","WQBdUxJcMJddSmkt","AehcP8oYm1fsrSknW4RcSqz3","aaJcMSkchfiGm2jtW6/cSrq","cGqEW4ZcM8kIWQu","W6bNW7GfWQmfWRC","quZcVtzjW5NdGCkwdJ3dQbBdRG","BedcOmo2pveZzmk/W4BcHY8","WQRcT8ogWROWWQ3cTa","WQX/W6fMw8kIW58RW6iPWPT8W44","ab57tCojprlcRCo+h8oibYm","D1SSCIm7f8kuWQdcKmoSWOSm","wK4UW4LteGKj","W67dIqXYdL7dLq","xwGkWQPRxIxdPSkFW7XajWu","W41Gt8o1eCo7DcC","jmkUAXFcQqZcHMWnW7ldPrWb","WPtdHCooW4NdP8o8WOG"];return(_0x5bc3=function(){return s})()}document.title=" Python3 面向对象（OOP）完整精讲",document.getElementById("article").innerHTML='<div><p>Python 是<strong>完全面向对象</strong>   ：一切皆对象（数字、字符串、函数、类都是对象）。\nOOP 四大核心：<strong>封装、继承、多态、抽象</strong>   。</p>\n<blockquote>\n<p>两个基础名词：</p>\n<ul>\n<li><strong>类 Class</strong>   ：模板、图纸，用来创建对象。</li>\n<li><strong>实例 Instance（对象 Object）</strong>   ：根据类创建出来的实体。</li>\n</ul>\n</blockquote>\n<h2>一、类与实例、构造方法</h2>\n<h3>基础语法</h3>\n<pre><code class="language-python"><span class="hljs-comment"># 定义类</span>\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span>:\n    <span class="hljs-comment"># 构造方法：创建实例时自动调用</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, age</span>):\n        <span class="hljs-comment"># self 代表当前实例本身，必须写在第一个参数</span>\n        <span class="hljs-variable language_">self</span>.name = name   <span class="hljs-comment"># 实例属性</span>\n        <span class="hljs-variable language_">self</span>.age = age\n\n    <span class="hljs-comment"># 实例方法，第一个参数固定self</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">say_hello</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;你好，我是<span class="hljs-subst">{self.name}</span>，今年<span class="hljs-subst">{self.age}</span>岁&quot;</span>)\n\n\n<span class="hljs-comment"># 创建实例（实例化）</span>\np1 = Person(<span class="hljs-string">&quot;张三&quot;</span>, <span class="hljs-number">20</span>)\np2 = Person(<span class="hljs-string">&quot;李四&quot;</span>, <span class="hljs-number">25</span>)\n\n<span class="hljs-comment"># 访问实例属性</span>\n<span class="hljs-built_in">print</span>(p1.name)\n<span class="hljs-comment"># 调用实例方法</span>\np1.say_hello()\n</code></pre>\n<blockquote>\n<p>✅ <code>self</code> 只是约定名称，可以换成别的名字，但<strong>规范必须用self</strong>   。\n✅ <code>__init__</code> 是<strong>初始化方法</strong>   ，不是构造函数（Python真正构造是<code>__new__</code>，日常几乎不用）</p>\n</blockquote>\n<h3>类属性 vs 实例属性</h3>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span>:\n    species = <span class="hljs-string">&quot;人类&quot;</span>  <span class="hljs-comment"># 类属性：属于类，所有实例共享</span>\n\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name</span>):\n        <span class="hljs-variable language_">self</span>.name = name <span class="hljs-comment"># 实例属性：每个实例独有</span>\n\np1 = Person(<span class="hljs-string">&quot;张三&quot;</span>)\n<span class="hljs-built_in">print</span>(Person.species)\n<span class="hljs-built_in">print</span>(p1.species)\n\n<span class="hljs-comment"># 修改实例的species，只会给p1新增实例属性，不会修改类属性</span>\np1.species = <span class="hljs-string">&quot;超人&quot;</span>\n<span class="hljs-built_in">print</span>(Person.species) <span class="hljs-comment"># 仍然是人类</span>\n</code></pre>\n<h2>二、访问控制：私有（只是约定，不是强制）</h2>\n<p>Python<strong>没有真正的私有关键字</strong>   ，靠命名约定：</p>\n<ol>\n<li><code>name</code>：公开</li>\n<li><code>_name</code>：单下划线，<strong>约定私有</strong>   ，外部语法上仍可访问，提示不要直接用</li>\n<li><code>__name</code>：双下划线，触发<strong>名称改写 name mangling</strong>   ，自动变成 <code>_类名__name</code></li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-variable language_">self</span>.pub = <span class="hljs-string">&quot;公开&quot;</span>\n        <span class="hljs-variable language_">self</span>._protect = <span class="hljs-string">&quot;约定私有&quot;</span>\n        <span class="hljs-variable language_">self</span>.__secret = <span class="hljs-string">&quot;双下划线&quot;</span>\n\np = Person()\n<span class="hljs-built_in">print</span>(p.pub)\n<span class="hljs-built_in">print</span>(p._protect)\n<span class="hljs-comment"># print(p.__secret)  # 直接访问报错</span>\n<span class="hljs-built_in">print</span>(p._Person__secret) <span class="hljs-comment"># 仍然可以绕过去读取！</span>\n</code></pre>\n<blockquote>\n<p>⚠️ 重点：<strong>不是安全加密，只是防止意外覆盖，不能阻止强行访问</strong>   。</p>\n</blockquote>\n<h2>三、三种方法：实例方法 / 类方法 / 静态方法</h2>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Demo</span>:\n    <span class="hljs-comment"># 实例方法：默认接收self，操作实例属性</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">instance_func</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;实例方法&quot;</span>, <span class="hljs-variable language_">self</span>)\n\n    <span class="hljs-comment"># 类方法：@classmethod，第一个参数cls，代表类本身，操作类属性</span>\n<span class="hljs-meta">    @classmethod</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">class_func</span>(<span class="hljs-params">cls</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;类方法&quot;</span>, cls)\n\n    <span class="hljs-comment"># 静态方法：@staticmethod，无默认参数，属于类，和实例无关，普通函数</span>\n<span class="hljs-meta">    @staticmethod</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">static_func</span>():\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;静态方法&quot;</span>)\n\n\nd = Demo()\nd.instance_func()\n\nDemo.class_func()\nDemo.static_func()\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>装饰器</th>\n<th>第一个参数</th>\n<th>适用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>实例方法</td>\n<td>无</td>\n<td><code>self</code></td>\n<td>读写实例数据，最常用</td>\n</tr>\n<tr>\n<td>类方法</td>\n<td><code>@classmethod</code></td>\n<td><code>cls</code></td>\n<td>工厂方法、修改类属性</td>\n</tr>\n<tr>\n<td>静态方法</td>\n<td><code>@staticmethod</code></td>\n<td>无</td>\n<td>工具函数，不需要类/实例数据</td>\n</tr>\n</tbody>\n</table>\n<h2>四、继承（核心）</h2>\n<blockquote>\n<p>子类继承父类，复用父类代码；支持<strong>多继承</strong>   。</p>\n</blockquote>\n<pre><code class="language-python"><span class="hljs-comment"># 父类（基类）</span>\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Animal</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name</span>):\n        <span class="hljs-variable language_">self</span>.name = name\n\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">speak</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;动物发出声音&quot;</span>)\n\n<span class="hljs-comment"># 子类（派生类）</span>\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span>(<span class="hljs-title class_ inherited__">Animal</span>):\n    <span class="hljs-comment"># 重写构造</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, breed</span>):\n        <span class="hljs-comment"># 调用父类的__init__</span>\n        <span class="hljs-built_in">super</span>().__init__(name)\n        <span class="hljs-variable language_">self</span>.breed = breed\n\n    <span class="hljs-comment"># 重写父类方法</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">speak</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;<span class="hljs-subst">{self.name}</span>：汪汪&quot;</span>)\n\n\ndog = Dog(<span class="hljs-string">&quot;旺财&quot;</span>, <span class="hljs-string">&quot;金毛&quot;</span>)\ndog.speak()\n</code></pre>\n<p><code>super()</code>：拿到父类对象，调用父类方法，<strong>推荐优先使用super()</strong>   。</p>\n<h3>多继承</h3>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">A</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">hello</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;A&quot;</span>)\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">B</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">hello</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;B&quot;</span>)\n\n<span class="hljs-comment"># 同时继承A、B</span>\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">C</span>(A,B):\n    <span class="hljs-keyword">pass</span>\n\nc = C()\nc.hello() <span class="hljs-comment"># 输出A，按MRO顺序查找</span>\n</code></pre>\n<h4>MRO（方法解析顺序）</h4>\n<p>Python 多继承查找方法顺序，可以打印：</p>\n<pre><code class="language-python"><span class="hljs-built_in">print</span>(C.__mro__)\n</code></pre>\n<blockquote>\n<p>多继承坑：菱形继承，复杂项目尽量少用多继承。</p>\n</blockquote>\n<h2>五、多态</h2>\n<p>Python 的多态是<strong>鸭子类型</strong>   ：<strong>只要长得像鸭子，叫起来像鸭子，就当成鸭子</strong>   ，不需要显式声明接口。</p>\n<blockquote>\n<p>不需要像Java一样继承同一个父类。</p>\n</blockquote>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">speak</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;汪汪&quot;</span>)\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Cat</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">speak</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;喵喵&quot;</span>)\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">make_speak</span>(<span class="hljs-params">animal</span>):\n    animal.speak() <span class="hljs-comment"># 只要有speak方法，就能传进来</span>\n\nmake_speak(Dog())\nmake_speak(Cat())\n</code></pre>\n<h2>六、封装</h2>\n<p>把属性和方法打包到类内部；对外只暴露必要接口，隐藏内部实现。</p>\n<ul>\n<li>用实例属性保存数据</li>\n<li>对外提供方法读写，而不是直接操作属性</li>\n</ul>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, age</span>):\n        <span class="hljs-variable language_">self</span>.__age = age\n\n    <span class="hljs-comment"># getter</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">get_age</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>.__age\n\n    <span class="hljs-comment"># setter，加校验</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">set_age</span>(<span class="hljs-params">self, val</span>):\n        <span class="hljs-keyword">if</span> <span class="hljs-number">0</span> &lt; val &lt;<span class="hljs-number">150</span>:\n            <span class="hljs-variable language_">self</span>.__age = val\n        <span class="hljs-keyword">else</span>:\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;年龄非法&quot;</span>)\n</code></pre>\n<p>Python 更推荐 <code>@property</code> 装饰器替代get/set：</p>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, age</span>):\n        <span class="hljs-variable language_">self</span>.__age = age\n\n<span class="hljs-meta">    @property</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">age</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>.__age\n\n<span class="hljs-meta">    @age.setter</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">age</span>(<span class="hljs-params">self, val</span>):\n        <span class="hljs-keyword">if</span> <span class="hljs-number">0</span> &lt; val &lt;<span class="hljs-number">150</span>:\n            <span class="hljs-variable language_">self</span>.__age = val\n        <span class="hljs-keyword">else</span>:\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;年龄非法&quot;</span>)\n\np = Person(<span class="hljs-number">20</span>)\n<span class="hljs-built_in">print</span>(p.age)\np.age = <span class="hljs-number">30</span>\n</code></pre>\n<h2>七、抽象类（abc模块）</h2>\n<p>强制子类必须实现指定方法，用于定义接口。</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> abc <span class="hljs-keyword">import</span> ABC, abstractmethod\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Animal</span>(<span class="hljs-title class_ inherited__">ABC</span>):\n<span class="hljs-meta">    @abstractmethod</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">speak</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-comment"># 抽象方法，子类必须实现</span>\n        <span class="hljs-keyword">pass</span>\n\n<span class="hljs-comment"># 不能实例化抽象类</span>\n<span class="hljs-comment"># a = Animal() # 报错</span>\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Dog</span>(<span class="hljs-title class_ inherited__">Animal</span>):\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">speak</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;汪汪&quot;</span>)\n</code></pre>\n<h2>八、魔术方法（双下划线方法 <strong>xxx</strong>  ）</h2>\n<p>常用魔术方法：</p>\n<ul>\n<li><code>__init__</code>：实例初始化</li>\n<li><code>__str__</code>：<code>print(obj)</code> 字符串展示</li>\n<li><code>__repr__</code>：开发调试字符串</li>\n<li><code>__len__</code>：<code>len(obj)</code></li>\n<li><code>__call__</code>：对象可以像函数一样调用 <code>obj()</code></li>\n<li><code>__getitem__</code>：支持 <code>obj[0]</code> 索引访问</li>\n</ul>\n<p>示例：</p>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Book</span>:\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self,name</span>):\n        <span class="hljs-variable language_">self</span>.name = name\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__str__</span>(<span class="hljs-params">self</span>):\n        <span class="hljs-keyword">return</span> <span class="hljs-string">f&quot;Book:<span class="hljs-subst">{self.name}</span>&quot;</span>\n\nb = Book(<span class="hljs-string">&quot;Python入门&quot;</span>)\n<span class="hljs-built_in">print</span>(b) <span class="hljs-comment"># 自动调用 __str__</span>\n</code></pre>\n<h2>九、OOP四大特性小结</h2>\n<ol>\n<li><strong>封装</strong>   ：把数据、方法打包，隐藏内部细节，开放接口</li>\n<li><strong>继承</strong>   ：子类复用父类代码，扩展功能</li>\n<li><strong>多态</strong>   ：同一个方法，不同对象不同实现；鸭子类型</li>\n<li><strong>抽象</strong>   ：定义接口，约束子类必须实现方法</li>\n</ol>\n<h2>十、常见坑</h2>\n<ol>\n<li>类属性是共享的，如果是可变对象(list/dict)，修改会影响所有实例</li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">A</span>:\n    lst = []\na1 = A()\na1.lst.append(<span class="hljs-number">1</span>)\na2 = A()\n<span class="hljs-built_in">print</span>(a2.lst) <span class="hljs-comment"># [1] 会被污染！可变类属性大坑</span>\n</code></pre>\n<ol start="2">\n<li><code>super()</code> 多继承MRO顺序问题</li>\n<li>混淆实例方法，忘记加self参数</li>\n<li>双下划线不是真正私有，只是名称改写</li>\n</ol>\n<hr>\n</div>'</script></body></html>
