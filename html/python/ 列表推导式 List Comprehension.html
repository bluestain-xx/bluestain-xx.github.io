= [(x,y) for x in [1,2,3] for y in [10,20]]\nprint(res)\n</code></pre>\n<h2>5. 嵌套列表推导式（二维列表）</h2>\n<pre><code>matrix = [[1,2,3],[4,5,6],[7,8,9]]\n# 取出每一行第二个元素\nres = [row[1] for row in matrix]\nprint(res) # [2,5,8]\n\n# 二维转一维\nres2 = [num for row in matrix for num in row]\nprint(res2)\n</code></pre>\n<h2>6. 其他推导式（顺带记住，面试一起考）</h2>\n<ul>\n<li><strong>集合推导式 set</strong>   ：<code>{表达式 for var in iter}</code></li>\n</ul>\n<pre><code>s = {i**2 for i in [1,2,2,3]}\nprint(s) # {1,4,9} 自动去重\n</code></pre>\n<ul>\n<li><strong>字典推导式 dict</strong>   ：<code>{key:value for var in iter}</code></li>\n</ul>\n<pre><code>d = {k:k*2 for k in range(3)}\nprint(d) # {0:0,1:2,2:4}\n</code></pre>\n<blockquote>\n<p>❌ 没有元组推导式！<code>(i for i in range(5))</code> 不是元组，是<strong>生成器表达式</strong></p>\n</blockquote>\n<pre><code>gen = (i for i in range(5))\nprint(type(gen)) # &lt;class 'generator'&gt;\n# 想得到元组：tuple(i for i in range(5))\n</code></pre>\n<h2>7. 优缺点 &amp; 坑点</h2>\n<p>✅ 优点：简洁，执行速度比普通for+append略快\n❌ 缺点：<strong>不要写过于复杂多层嵌套</strong>   ，可读性会爆炸</p>\n<p>坑1：变量泄漏（python3已经改善，但尽量注意）</p>\n<pre><code>res = [i for i in range(5)]\n# i 在推导式执行完之后不会残留（python3）\n</code></pre>\n<p>坑2：推导式一次性生成完整列表，<strong>一次性占用全部内存</strong></p>\n<blockquote>\n<p>如果数据量巨大，优先用<strong>生成器表达式</strong>   ，节省内存</p>\n</blockquote>\n<h2>8. 列表推导式 vs 生成器表达式</h2>\n<pre><code>lst = [x for x in range(10000)] # 全部加载到内存\ngen = (x for x in range(10000)) # 迭代时逐个生成，内存占用很小\n</code></pre>\n</div>"</script></body></html>
