\n    gt: <span class="hljs-built_in">float</span> | <span class="hljs-literal">None</span> = <span class="hljs-literal">None</span>,\n    le: <span class="hljs-built_in">float</span> | <span class="hljs-literal">None</span> = <span class="hljs-literal">None</span>,\n    lt: <span class="hljs-built_in">float</span> | <span class="hljs-literal">None</span> = <span class="hljs-literal">None</span>,\n    deprecated: <span class="hljs-built_in">bool</span> | <span class="hljs-literal">None</span> = <span class="hljs-literal">None</span>,\n    include_in_schema: <span class="hljs-built_in">bool</span> = <span class="hljs-literal">True</span>,\n)\n</code></pre>\n<blockquote>\n<p>第一个位置参数是 <code>default</code>；后面所有参数<strong>必须是关键字传参</strong>   （<code>*</code> 强制）</p>\n</blockquote>\n<h2>分组讲解</h2>\n<h3>1. 默认值相关</h3>\n<ol>\n<li>\n<p><strong>default</strong></p>\n<ul>\n<li><code>Query(123)</code>：默认值123，参数可选</li>\n<li><code>Query(...)</code>：<code>Ellipsis</code>，代表<strong>必填参数</strong>   ，不允许缺失</li>\n<li><code>Query(None)</code>：不传参时值为<code>None</code>\n<blockquote>\n<p>⚠️ Annotated写法：不要在Query里面写default，默认值写在函数参数<code>=</code>后面！</p>\n</blockquote>\n</li>\n</ul>\n<pre><code class="language-python"><span class="hljs-comment"># Annotated 正确</span>\nq: Annotated[<span class="hljs-built_in">str</span>, Query(min_length=<span class="hljs-number">2</span>)] = <span class="hljs-string">&quot;abc&quot;</span>\n</code></pre>\n</li>\n<li>\n<p><strong>default_factory</strong><br>\n延迟生成默认值，适合可变对象（list/dict），函数调用生成。</p>\n<pre><code class="language-python">Query(default_factory=<span class="hljs-keyword">lambda</span>: [<span class="hljs-number">1</span>,<span class="hljs-number">2</span>])\n</code></pre>\n</li>\n</ol>\n<h3>2. 文档 &amp; 别名（OpenAPI /docs）</h3>\n<ol>\n<li><strong>alias</strong>   ：URL参数别名。python变量名不能用<code>item-query</code>，用alias映射<pre><code class="language-python">Query(alias=<span class="hljs-string">&quot;item-query&quot;</span>)\n<span class="hljs-comment"># 请求 ?item-query=xxx</span>\n</code></pre>\n</li>\n<li><strong>title</strong>   ：接口文档里的参数标题</li>\n<li><strong>description</strong>   ：接口文档的详细描述</li>\n<li><strong>deprecated</strong>   ：<code>True</code>，在文档标记参数废弃，加删除线</li>\n<li><strong>include_in_schema</strong>   ：<code>False</code>，隐藏参数，不在OpenAPI文档展示（内部参数）</li>\n</ol>\n<h3>3. 字符串校验</h3>\n<ul>\n<li><code>min_length</code>：字符串最小长度</li>\n<li><code>max_length</code>：字符串最大长度</li>\n<li><code>pattern</code>：正则表达式（Pydantic v2，旧版<code>regex</code>已经废弃）</li>\n</ul>\n<pre><code class="language-python">Query(pattern=<span class="hljs-string">&quot;^[a-z0-9]+$&quot;</span>)\n</code></pre>\n<h3>4. 数字校验（int/float）</h3>\n<ul>\n<li><code>ge</code>：greater or equal <strong>&gt;=</strong></li>\n<li><code>gt</code>：greater than <strong>&gt;</strong></li>\n<li><code>le</code>：less or equal <strong>&lt;=</strong></li>\n<li><code>lt</code>：less than <strong>&lt;</strong></li>\n</ul>\n<pre><code class="language-python">Query(ge=<span class="hljs-number">1</span>, le=<span class="hljs-number">100</span>) <span class="hljs-comment"># 数字 1 ≤ value ≤100</span>\n</code></pre>\n<h2>示例：一次性组合多个参数</h2>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI, Query\n\napp = FastAPI()\n\n<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/demo&quot;</span></span>)</span>\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">demo</span>(<span class="hljs-params">\n    q: Annotated[<span class="hljs-built_in">str</span>, Query(<span class="hljs-params">\n        alias=<span class="hljs-string">&quot;search-key&quot;</span>,\n        title=<span class="hljs-string">&quot;搜索关键词&quot;</span>,\n        description=<span class="hljs-string">&quot;用于全文检索，3~20个小写字母&quot;</span>,\n        min_length=<span class="hljs-number">3</span>,\n        max_length=<span class="hljs-number">20</span>,\n        pattern=<span class="hljs-string">&quot;^[a-z]+$&quot;</span>,\n        deprecated=<span class="hljs-literal">False</span>\n    </span>)] = <span class="hljs-literal">None</span>,\n    page: Annotated[<span class="hljs-built_in">int</span>, Query(<span class="hljs-params">ge=<span class="hljs-number">1</span>, le=<span class="hljs-number">999</span>, description=<span class="hljs-string">&quot;页码&quot;</span></span>)] = <span class="hljs-number">1</span>\n</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;q&quot;</span>: q, <span class="hljs-string">&quot;page&quot;</span>: page}\n</code></pre>\n<h2>重要注意点</h2>\n<ol>\n<li>校验规则底层交给Pydantic，校验失败自动返回<code>422 Unprocessable Entity</code></li>\n<li>列表参数 <code>list[str]</code>，只需要写<code>Query()</code>，不需要额外参数，即可接收<code>?tag=a&amp;tag=b</code></li>\n<li><code>Query</code> 只处理<strong>URL查询参数</strong>   ，不能接收body、header、path参数</li>\n<li>老写法 <code>q:str=Query(..., min_length=2)</code> 把default写在Query内部；Annotated写法把default移到参数末尾</li>\n</ol>\n</div>'</script></body></html>
