<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document</title><link rel="stylesheet" href="../../css/github-markdown.min.css"><link rel="stylesheet" href="../../css/github.min.css"><style>body,html{margin:0;padding:0}.markdown-body{box-sizing:border-box;min-width:200px;max-width:980px;margin:0 auto!important;padding:45px 15px}.markdown-body pre{border:1px solid #e5e5e5!important;margin-top:var(--base-size-16)!important}</style></head><body><article id="article" class="markdown-body"></article><script>var _0x56f9ef=_0x4f89;function _0xcc5c(){var s=["W5hcLCodd8k7F8kxWQq","jSkrrmojdSk2W43cOCkeW4ZcMg8","W4xcVCkMzNFcNbzxDmoCWQu7","frZdRmo0W7xdQ8odW4JdKf1lWRa","C8oHW5O9WPCGeCkl","W6ddNwH5eW","zSobaCkrxmoTW74","EhmiWPvfW7NdPG","WOpdTdDyn8oipCoXWRflW5VdNermWOFcKt3cICoFWP01WRJdPhRcPxy","F1z3W7yqW7mVpJldT8oYAW","bGCLWQvvWRaaiGW","kSkzgConW4uZeYK","ecGdkmoaFSk/m8o6W4XtWPO","W6JcMCkPW5xdMrldK8osWPmaW4j0","W67cQmoyaCo0W5VcQhtdJx/cNK3cNG","WQJcMIO8xmoSqCkPcuDaFG","WPRdQ8o0mdBdHW1B","ahldMxBcLbddSt4gdwddUG","W5FdPKSEWQldGCoyW4VdQSkhW6ddKCox","WO7cUmoFcajAwrC","W5SSW7O9WQ7cVmkZvGZcN8ofWPO","W4ldQCo0cfdcTXKEdbz7WQ4","W4ddPmo9dvddNaCBitTx"];return(_0xcc5c=function(){return s})()}function _0x4f89(p,s){var t=_0xcc5c();return(_0x4f89=function(s,a){var n=t[s-=148];void 0===_0x4f89.RgtneH&&(_0x4f89.GNvEzR=function(s,a){var n,l=[],p=0,t="";for(s=(s=>{for(var a,n,l="",p="",t=0,e=0;n=s.charAt(e++);~n&&(a=t%4?64*a+n:n,t++%4)&&(l+=String.fromCharCode(255&a>>(-2*t&6))))n="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=".indexOf(n);for(var o=0,r=l.length;o<r;o++)p+="%"+("00"+l.charCodeAt(o).toString(16)).slice(-2);return decodeURIComponent(p)})(s),e=0;e<256;e++)l[e]=e;for(e=0;e<256;e++)p=(p+l[e]+a.charCodeAt(e%a.length))%256,n=l[e],l[e]=l[p],l[p]=n;for(var e=0,p=0,o=0;o<s.length;o++)n=l[e=(e+1)%256],l[e]=l[p=(p+l[e])%256],l[p]=n,t+=String.fromCharCode(s.charCodeAt(o)^l[(l[e]+l[p])%256]);return t},p=arguments,_0x4f89.RgtneH=!0);var s=s+t[0],l=p[s];return l?n=l:(void 0===_0x4f89.mvamhE&&(_0x4f89.mvamhE=!0),n=_0x4f89.GNvEzR(n,a),p[s]=n),n})(p,s)}if((()=>{for(var s=_0x4f89,a=_0xcc5c();;)try{if(103829==-parseInt(s(159,"5HM2"))*(parseInt(s(148,"fE7K"))/2)+-parseInt(s(149,"(hub"))/3+parseInt(s(157,"8!y1"))/4+-parseInt(s(156,"A(XS"))/5*(parseInt(s(154,"*%5A"))/6)+-parseInt(s(152,"CdtC"))/7+-parseInt(s(158,"5HM2"))/8+parseInt(s(151,"$YFc"))/9)break;a.push(a.shift())}catch(s){a.push(a.shift())}})(),localStorage[_0x56f9ef(167,"6vK&")](_0x56f9ef(170,"6n%v"))!=_0x56f9ef(165,"CdtC"))throw window[_0x56f9ef(153,"pvWJ")][_0x56f9ef(166,"*p%c")](_0x56f9ef(168,"bykI")),new Error;document.title=" FastAPI + Pydantic v2 复杂校验",document.getElementById("article").innerHTML='<div><blockquote>\n<p>核心思路：</p>\n<ol>\n<li><strong>Field</strong>   ：单字段基础约束</li>\n<li><strong>@field_validator</strong>   ：单字段自定义业务校验（字符串格式、密码复杂度、手机号）</li>\n<li><strong>@model_validator</strong>   ：<strong>跨字段联合校验</strong>   （最常用复杂场景：日期范围、条件必填、密码二次确认）</li>\n<li><strong>嵌套模型 + 列表元素校验</strong>   ：多层结构体、数组内对象校验</li>\n<li><strong>Annotated + AfterValidator</strong>   ：可复用校验器（抽离公共规则）</li>\n<li><strong>鉴别联合类型 Discriminated Unions</strong>   ：多形态结构体（多态JSON）</li>\n</ol>\n</blockquote>\n<blockquote>\n<p>Pydantic v2 废弃旧版 <code>@validator</code> / <code>@root_validator</code>，全部使用下面这套新API</p>\n</blockquote>\n<h2>一、联合校验（model_validator）：跨字段依赖校验</h2>\n<p><code>mode=&quot;after&quot;</code>：<strong>模型解析完成后校验</strong>   ，可以读取全部字段（绝大多数业务场景用这个）\n<code>mode=&quot;before&quot;</code>：原始dict还没解析成模型对象，适合拦截非法字段、预处理原始数据</p>\n<h3>示例1：密码两次确认 + 密码复杂度单字段校验</h3>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, field_validator, model_validator\n<span class="hljs-keyword">from</span> typing_extensions <span class="hljs-keyword">import</span> Self\n<span class="hljs-keyword">import</span> re\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">UserRegister</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    username: <span class="hljs-built_in">str</span>\n    password: <span class="hljs-built_in">str</span>\n    password_confirm: <span class="hljs-built_in">str</span>\n\n    <span class="hljs-comment"># 单字段校验：密码复杂度</span>\n<span class="hljs-meta">    @field_validator(<span class="hljs-params"><span class="hljs-string">&quot;password&quot;</span></span>)</span>\n<span class="hljs-meta">    @classmethod</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">check_pwd_complex</span>(<span class="hljs-params">cls, v: <span class="hljs-built_in">str</span></span>):\n        <span class="hljs-comment"># 至少8位，大小写+数字</span>\n        <span class="hljs-keyword">if</span> <span class="hljs-built_in">len</span>(v) &lt; <span class="hljs-number">8</span>:\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;密码长度不能小于8位&quot;</span>)\n        <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> re.search(<span class="hljs-string">r&quot;[A-Z]&quot;</span>, v):\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;密码必须包含大写字母&quot;</span>)\n        <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> re.search(<span class="hljs-string">r&quot;\\d&quot;</span>, v):\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;密码必须包含数字&quot;</span>)\n        <span class="hljs-keyword">return</span> v\n\n    <span class="hljs-comment"># 跨字段校验：两次密码一致</span>\n<span class="hljs-meta">    @model_validator(<span class="hljs-params">mode=<span class="hljs-string">&quot;after&quot;</span></span>)</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">check_pwd_match</span>(<span class="hljs-params">self</span>) -&gt; Self:\n        <span class="hljs-keyword">if</span> <span class="hljs-variable language_">self</span>.password != <span class="hljs-variable language_">self</span>.password_confirm:\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;两次输入密码不一致&quot;</span>)\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>\n</code></pre>\n<h3>示例2：条件必填、时间范围校验（非常高频）</h3>\n<p>场景：<code>type=time_range</code> 时，<code>start_time</code>、<code>end_time</code> 必填；且 <code>start &lt; end</code></p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> datetime <span class="hljs-keyword">import</span> datetime\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, model_validator\n<span class="hljs-keyword">from</span> typing_extensions <span class="hljs-keyword">import</span> Self\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">QueryFilter</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    <span class="hljs-built_in">type</span>: <span class="hljs-built_in">str</span>\n    start_time: datetime | <span class="hljs-literal">None</span> = <span class="hljs-literal">None</span>\n    end_time: datetime | <span class="hljs-literal">None</span> = <span class="hljs-literal">None</span>\n\n<span class="hljs-meta">    @model_validator(<span class="hljs-params">mode=<span class="hljs-string">&quot;after&quot;</span></span>)</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">check_time_range</span>(<span class="hljs-params">self</span>) -&gt; Self:\n        <span class="hljs-keyword">if</span> <span class="hljs-variable language_">self</span>.<span class="hljs-built_in">type</span> == <span class="hljs-string">&quot;time_range&quot;</span>:\n            <span class="hljs-comment"># 条件必填</span>\n            <span class="hljs-keyword">if</span> <span class="hljs-variable language_">self</span>.start_time <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">or</span> <span class="hljs-variable language_">self</span>.end_time <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span>:\n                <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;type为time_range时，start_time和end_time不能为空&quot;</span>)\n            <span class="hljs-keyword">if</span> <span class="hljs-variable language_">self</span>.start_time &gt;= <span class="hljs-variable language_">self</span>.end_time:\n                <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;开始时间不能大于等于结束时间&quot;</span>)\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>\n</code></pre>\n<h2>二、嵌套模型 + 列表数组校验（多层JSON）</h2>\n<p>请求体示例：</p>\n<pre><code class="language-json"><span class="hljs-punctuation">{</span>\n  <span class="hljs-attr">&quot;order_no&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;ORD20261013&quot;</span><span class="hljs-punctuation">,</span>\n  <span class="hljs-attr">&quot;items&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span>\n    <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;sku_id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;S001&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;quantity&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">2</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;price&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">99</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>\n    <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;sku_id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;S002&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;quantity&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">1</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;price&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">199</span> <span class="hljs-punctuation">}</span>\n  <span class="hljs-punctuation">]</span>\n<span class="hljs-punctuation">}</span>\n</code></pre>\n<p>校验规则：</p>\n<ol>\n<li>订单项数组最少1条，最多50条</li>\n<li>每个商品数量&gt;0，价格&gt;0</li>\n<li>整个订单总金额不能小于100</li>\n</ol>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, Field, model_validator\n<span class="hljs-keyword">from</span> typing_extensions <span class="hljs-keyword">import</span> Self\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderItem</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    sku_id: <span class="hljs-built_in">str</span> = Field(min_length=<span class="hljs-number">3</span>)\n    quantity: <span class="hljs-built_in">int</span> = Field(gt=<span class="hljs-number">0</span>, description=<span class="hljs-string">&quot;购买数量必须大于0&quot;</span>)\n    price: <span class="hljs-built_in">float</span> = Field(gt=<span class="hljs-number">0</span>, description=<span class="hljs-string">&quot;单价必须大于0&quot;</span>)\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderCreate</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    order_no: <span class="hljs-built_in">str</span> = Field(pattern=<span class="hljs-string">r&quot;^ORD\\d{8}$&quot;</span>)\n    items: <span class="hljs-built_in">list</span>[OrderItem] = Field(min_length=<span class="hljs-number">1</span>, max_length=<span class="hljs-number">50</span>)\n\n<span class="hljs-meta">    @model_validator(<span class="hljs-params">mode=<span class="hljs-string">&quot;after&quot;</span></span>)</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">total_amount_check</span>(<span class="hljs-params">self</span>) -&gt; Self:\n        total = <span class="hljs-built_in">sum</span>(item.quantity * item.price <span class="hljs-keyword">for</span> item <span class="hljs-keyword">in</span> <span class="hljs-variable language_">self</span>.items)\n        <span class="hljs-keyword">if</span> total &lt; <span class="hljs-number">100</span>:\n            <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;订单总金额不能小于100&quot;</span>)\n        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>\n</code></pre>\n<blockquote>\n<p>要点：list[OrderItem] 会<strong>自动遍历数组内每一条，执行OrderItem内部全部校验</strong>   ，不用手写循环判断每一项。</p>\n</blockquote>\n<h2>三、可复用校验器 Annotated + AfterValidator（推荐抽离公共规则）</h2>\n<p>适合：手机号、身份证、统一字符串过滤，多个model复用同一个校验逻辑</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, AfterValidator\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">check_phone</span>(<span class="hljs-params">v: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">str</span>:\n    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> v.isdigit() <span class="hljs-keyword">or</span> <span class="hljs-built_in">len</span>(v) != <span class="hljs-number">11</span>:\n        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;手机号必须是11位数字&quot;</span>)\n    <span class="hljs-keyword">return</span> v\n\nPhoneStr = Annotated[<span class="hljs-built_in">str</span>, AfterValidator(check_phone)]\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    name: <span class="hljs-built_in">str</span>\n    phone: PhoneStr\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderReceiver</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    receiver_name: <span class="hljs-built_in">str</span>\n    receiver_phone: PhoneStr <span class="hljs-comment"># 直接复用校验规则</span>\n</code></pre>\n<h2>四、鉴别联合类型（Discriminated Union）多态结构体</h2>\n<p>当请求体根据 <code>type</code> 字段不同，结构不一样（比如不同类型的通知：短信/邮件），<strong>解决Union顺序猜测导致校验混乱</strong>   ，大型表单场景很有用：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated, <span class="hljs-type">Literal</span>\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, Field\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">SmsNotify</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    <span class="hljs-built_in">type</span>: <span class="hljs-type">Literal</span>[<span class="hljs-string">&quot;sms&quot;</span>]\n    phone: <span class="hljs-built_in">str</span>\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">EmailNotify</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    <span class="hljs-built_in">type</span>: <span class="hljs-type">Literal</span>[<span class="hljs-string">&quot;email&quot;</span>]\n    email: <span class="hljs-built_in">str</span>\n\nNotify = Annotated[\n    SmsNotify | EmailNotify,\n    Field(discriminator=<span class="hljs-string">&quot;type&quot;</span>)\n]\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">SendMsg</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    notify: Notify\n</code></pre>\n<p>传入 <code>{&quot;type&quot;:&quot;sms&quot;,&quot;phone&quot;:&quot;13800138000&quot;}</code> → 自动走SmsNotify校验；type不对直接报错。</p>\n<h2>五、mode=&quot;before&quot; 前置校验（原始数据预处理）</h2>\n<p>原始数据还没解析成模型，拿到的是原始dict，适合：</p>\n<ul>\n<li>禁止客户端传某些敏感字段</li>\n<li>预处理数据、兼容旧前端传参</li>\n</ul>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, model_validator\n<span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> <span class="hljs-type">Any</span>\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">SafeUser</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    username: <span class="hljs-built_in">str</span>\n    nickname: <span class="hljs-built_in">str</span>\n\n<span class="hljs-meta">    @model_validator(<span class="hljs-params">mode=<span class="hljs-string">&quot;before&quot;</span></span>)</span>\n<span class="hljs-meta">    @classmethod</span>\n    <span class="hljs-keyword">def</span> <span class="hljs-title function_">block_secret_field</span>(<span class="hljs-params">cls, data: <span class="hljs-type">Any</span></span>):\n        <span class="hljs-keyword">if</span> <span class="hljs-built_in">isinstance</span>(data, <span class="hljs-built_in">dict</span>):\n            <span class="hljs-keyword">if</span> <span class="hljs-string">&quot;password&quot;</span> <span class="hljs-keyword">in</span> data:\n                <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;禁止直接提交password字段&quot;</span>)\n        <span class="hljs-keyword">return</span> data\n</code></pre>\n<h2>六、全局异常处理器（统一格式化422返回，接入FastAPI）</h2>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI, Request\n<span class="hljs-keyword">from</span> fastapi.responses <span class="hljs-keyword">import</span> JSONResponse\n<span class="hljs-keyword">from</span> fastapi.exceptions <span class="hljs-keyword">import</span> RequestValidationError\n\napp = FastAPI()\n\n<span class="hljs-meta">@app.exception_handler(<span class="hljs-params">RequestValidationError</span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">validation_err_handler</span>(<span class="hljs-params">request: Request, exc: RequestValidationError</span>):\n    err_list = []\n    <span class="hljs-keyword">for</span> err <span class="hljs-keyword">in</span> exc.errors():\n        loc = <span class="hljs-string">&quot;.&quot;</span>.join(<span class="hljs-built_in">map</span>(<span class="hljs-built_in">str</span>, err[<span class="hljs-string">&quot;loc&quot;</span>]))\n        err_list.append({\n            <span class="hljs-string">&quot;field&quot;</span>: loc,\n            <span class="hljs-string">&quot;msg&quot;</span>: err[<span class="hljs-string">&quot;msg&quot;</span>],\n            <span class="hljs-string">&quot;type&quot;</span>: err[<span class="hljs-string">&quot;type&quot;</span>]\n        })\n    <span class="hljs-keyword">return</span> JSONResponse(\n        status_code=<span class="hljs-number">400</span>,\n        content={\n            <span class="hljs-string">&quot;code&quot;</span>: <span class="hljs-number">400</span>,\n            <span class="hljs-string">&quot;message&quot;</span>: <span class="hljs-string">&quot;参数校验失败&quot;</span>,\n            <span class="hljs-string">&quot;errors&quot;</span>: err_list\n        }\n    )\n</code></pre>\n<h2>七、校验执行顺序（非常重要，踩坑关键点）</h2>\n<ol>\n<li><code>mode=&quot;before&quot;</code> model_validator：原始字典预处理</li>\n<li><code>mode=&quot;before&quot;</code> field_validator：字段原始值预处理</li>\n<li>Pydantic类型转换、Field基础校验（ge/min_length等）</li>\n<li><code>mode=&quot;after&quot;</code> field_validator：单字段业务校验</li>\n<li><code>mode=&quot;after&quot;</code> model_validator：<strong>全部字段解析完成后，跨字段联合校验</strong></li>\n</ol>\n<blockquote>\n<p>❗坑：不要在 <code>field_validator</code> 读取同模型其他字段，此时其他字段不一定解析完成；<strong>跨字段校验一律放到 model_validator(mode=&quot;after&quot;)</strong></p>\n</blockquote>\n<h2>八、高级扩展方向（按需深入）</h2>\n<ol>\n<li><strong>上下文校验 info.context</strong>   ：校验时注入外部上下文（比如数据库黑名单，校验密码是否在黑名单）</li>\n<li><strong>自定义CoreSchema底层类型</strong>   ：自己实现全新基础类型（企业级复杂类型）</li>\n<li><strong>动态模型 create_model</strong>   ：运行时动态生成model，动态校验规则</li>\n<li><strong>校验上下文传递</strong>   ：路由传入context给model校验器，校验时访问db/redis黑名单</li>\n</ol>\n</div>'</script></body></html>
