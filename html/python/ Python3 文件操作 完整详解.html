ring.fromCharCode(s.charCodeAt(e)^a[(a[p]+a[l])%256]);return o},l=arguments,_0x309b.QbhHwY=!0);var s=s+o[0],a=l[s];return a?t=a:(void 0===_0x309b.ZlFtmg&&(_0x309b.ZlFtmg=!0),t=_0x309b.LSPyuk(t,n),l[s]=t),t})(l,s)}if((()=>{for(var s=_0x309b,n=_0x2d84();;)try{if(364045==+parseInt(s(413,"hiip"))+parseInt(s(423,"xLfn"))/2+parseInt(s(419,"cgBC"))/3+parseInt(s(425,"RUom"))/4*(parseInt(s(418,"Kcnu"))/5)+parseInt(s(411,"IY0k"))/6+parseInt(s(430,"hA%^"))/7*(parseInt(s(432,"FE]@"))/8)+parseInt(s(417,"5cor"))/9*(-parseInt(s(416,"TN]b"))/10))break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x314db6(412,"Lhg7")](_0x314db6(409,"AY)w"))!=_0x314db6(415,"hiip"))throw window[_0x314db6(424,"hA%^")][_0x314db6(414,"%BeU")](_0x314db6(431,"z2m5")),new Error;document.title=" Python3 文件操作 完整详解",document.getElementById("article").innerHTML='<div><p>Python 文件操作核心：<strong>打开文件 → 读写 → 关闭文件</strong>   ，推荐优先使用 <code>with</code> 上下文管理器（自动关闭，避免资源泄漏）。</p>\n<h2>一、基础语法</h2>\n<h3>1. open() 函数</h3>\n<pre><code class="language-python"><span class="hljs-built_in">open</span>(file, mode=<span class="hljs-string">&#x27;r&#x27;</span>, encoding=<span class="hljs-literal">None</span>)\n</code></pre>\n<ul>\n<li><code>file</code>：文件路径（相对路径 / 绝对路径）</li>\n<li><code>mode</code>：打开模式，<strong>默认 <code>r</code> 只读</strong></li>\n<li><code>encoding</code>：文本文件编码，Windows 常用 <code>gbk</code>，通用写 <code>utf-8</code>，<strong>文本模式才需要</strong>   ；二进制模式不能加 encoding</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>模式</th>\n<th>含义</th>\n<th>文件不存在</th>\n<th>文件指针</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>r</code></td>\n<td>read 只读（文本）</td>\n<td>报错</td>\n<td>文件开头</td>\n</tr>\n<tr>\n<td><code>w</code></td>\n<td>write 只写（文本）</td>\n<td>创建</td>\n<td><strong>清空原有内容</strong>   ，从头写</td>\n</tr>\n<tr>\n<td><code>a</code></td>\n<td>append 追加（文本）</td>\n<td>创建</td>\n<td>文件末尾，追加写入</td>\n</tr>\n<tr>\n<td><code>r+</code></td>\n<td>读写</td>\n<td>报错</td>\n<td>文件开头，可读可写</td>\n</tr>\n<tr>\n<td><code>w+</code></td>\n<td>读写</td>\n<td>创建</td>\n<td><strong>先清空</strong>   ，再读写</td>\n</tr>\n<tr>\n<td><code>a+</code></td>\n<td>追加读写</td>\n<td>创建</td>\n<td>文件末尾，只能在末尾新增</td>\n</tr>\n<tr>\n<td><code>rb</code></td>\n<td>二进制只读</td>\n<td>报错</td>\n<td>开头</td>\n</tr>\n<tr>\n<td><code>wb</code></td>\n<td>二进制只写</td>\n<td>创建</td>\n<td>清空</td>\n</tr>\n<tr>\n<td><code>ab</code></td>\n<td>二进制追加</td>\n<td>创建</td>\n<td>末尾</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>二进制模式（带b）：图片、视频、exe，读写返回 bytes，<strong>不能指定 encoding</strong></p>\n</blockquote>\n<h2>二、两种写法</h2>\n<h3>方式1：手动 open + close（不推荐，忘记close会资源泄露）</h3>\n<pre><code class="language-python"><span class="hljs-comment"># 打开</span>\nf = <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;test.txt&quot;</span>, <span class="hljs-string">&quot;r&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>)\n<span class="hljs-comment"># 读取</span>\ncontent = f.read()\n<span class="hljs-built_in">print</span>(content)\n<span class="hljs-comment"># 必须关闭</span>\nf.close()\n</code></pre>\n<h3>方式2：with 上下文管理器 ✅【工程首选】</h3>\n<p><code>with</code> 代码块结束<strong>自动调用close</strong>   ，即使代码异常也会关闭文件</p>\n<pre><code class="language-python"><span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;test.txt&quot;</span>, <span class="hljs-string">&quot;r&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> f:\n    content = f.read()\n    <span class="hljs-built_in">print</span>(content)\n<span class="hljs-comment"># 离开with，自动关闭，不用写 f.close()</span>\n</code></pre>\n<h2>三、读取文件常用方法</h2>\n<p>假设有文本文件 <code>test.txt</code></p>\n<pre><code>第一行\n第二行\n第三行\n</code></pre>\n<pre><code class="language-python"><span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;test.txt&quot;</span>, <span class="hljs-string">&quot;r&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> f:\n    <span class="hljs-comment"># 1. read() 一次性读取全部内容，返回字符串，大文件容易占内存</span>\n    data = f.read()\n    <span class="hljs-built_in">print</span>(data)\n\n    <span class="hljs-comment"># 2. readline() 读取一行，包含换行符 \\n</span>\n    line1 = f.readline()\n    <span class="hljs-built_in">print</span>(line1)\n\n    <span class="hljs-comment"># 3. readlines() 读取所有行，返回列表，每行作为一个元素，带 \\n</span>\n    lines = f.readlines()\n    <span class="hljs-built_in">print</span>(lines)\n\n<span class="hljs-comment"># 4. 迭代文件对象（推荐！逐行读取，内存友好，适合大文件）</span>\n<span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;test.txt&quot;</span>, <span class="hljs-string">&quot;r&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> f:\n    <span class="hljs-keyword">for</span> line <span class="hljs-keyword">in</span> f:\n        <span class="hljs-comment"># line 自带换行符</span>\n        <span class="hljs-built_in">print</span>(line.strip()) <span class="hljs-comment"># strip() 去除首尾空白 \\n \\r 空格</span>\n</code></pre>\n<blockquote>\n<p>大文件严禁直接 <code>read()</code> / <code>readlines()</code> 一次性加载全部到内存，用 <code>for line in f</code> 逐行遍历</p>\n</blockquote>\n<h2>四、写入文件</h2>\n<h3>w 模式：覆盖原有内容</h3>\n<pre><code class="language-python"><span class="hljs-comment"># 写入字符串，会覆盖旧文件</span>\n<span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;write.txt&quot;</span>, <span class="hljs-string">&quot;w&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> f:\n    f.write(<span class="hljs-string">&quot;hello python\\n&quot;</span>)\n    f.write(<span class="hljs-string">&quot;文件操作\\n&quot;</span>)\n\n<span class="hljs-comment"># writelines 写入序列，不会自动加换行！</span>\nlines = [<span class="hljs-string">&quot;aaa\\n&quot;</span>, <span class="hljs-string">&quot;bbb\\n&quot;</span>, <span class="hljs-string">&quot;ccc&quot;</span>]\n<span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;write.txt&quot;</span>, <span class="hljs-string">&quot;w&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> f:\n    f.writelines(lines)\n</code></pre>\n<h3>a 模式：追加，不覆盖，在文件末尾新增</h3>\n<pre><code class="language-python"><span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;write.txt&quot;</span>, <span class="hljs-string">&quot;a&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> f:\n    f.write(<span class="hljs-string">&quot;追加一行\\n&quot;</span>)\n</code></pre>\n<blockquote>\n<p>注意：<code>write()</code> 返回<strong>写入的字符数量</strong>   ，print不会自动换行，需要手动加 <code>\\n</code></p>\n</blockquote>\n<h2>五、文件指针操作 seek / tell</h2>\n<ul>\n<li><code>f.tell()</code>：获取当前指针位置（字节数！文本模式下有坑，二进制更稳定）</li>\n<li><code>f.seek(offset, whence)</code>：移动文件指针\n<ul>\n<li>whence=0：从文件开头（默认）</li>\n<li>whence=1：从当前位置（<strong>仅二进制模式可用</strong>   ）</li>\n<li>whence=2：从文件末尾（<strong>仅二进制模式可用</strong>   ）</li>\n</ul>\n</li>\n</ul>\n<pre><code class="language-python"><span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;seek.txt&quot;</span>, <span class="hljs-string">&quot;rb&quot;</span>) <span class="hljs-keyword">as</span> f:\n    <span class="hljs-built_in">print</span>(f.tell())\n    f.seek(<span class="hljs-number">3</span>)   <span class="hljs-comment"># 指针移动到第3字节</span>\n    <span class="hljs-built_in">print</span>(f.read(<span class="hljs-number">2</span>))\n</code></pre>\n<blockquote>\n<p>⚠️ 文本模式下 seek 只支持 offset=0，不要随便移动指针，容易乱码</p>\n</blockquote>\n<h2>六、二进制文件读写（图片/音频）</h2>\n<pre><code class="language-python"><span class="hljs-comment"># 读取图片</span>\n<span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;pic.jpg&quot;</span>, <span class="hljs-string">&quot;rb&quot;</span>) <span class="hljs-keyword">as</span> f:\n    img_bytes = f.read()\n\n<span class="hljs-comment"># 复制图片</span>\n<span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;pic.jpg&quot;</span>, <span class="hljs-string">&quot;rb&quot;</span>) <span class="hljs-keyword">as</span> fr, <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;pic_copy.jpg&quot;</span>, <span class="hljs-string">&quot;wb&quot;</span>) <span class="hljs-keyword">as</span> fw:\n    fw.write(fr.read())\n</code></pre>\n<h2>七、os / pathlib 配套文件路径操作（常用）</h2>\n<p>需要导入模块</p>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> os\n<span class="hljs-keyword">from</span> pathlib <span class="hljs-keyword">import</span> Path\n\n<span class="hljs-comment"># os模块</span>\n<span class="hljs-built_in">print</span>(os.getcwd())          <span class="hljs-comment"># 获取当前工作目录</span>\nos.listdir(<span class="hljs-string">&quot;.&quot;</span>)             <span class="hljs-comment"># 列出目录下所有文件</span>\nos.path.exists(<span class="hljs-string">&quot;test.txt&quot;</span>)  <span class="hljs-comment"># 判断文件是否存在</span>\nos.path.isfile(<span class="hljs-string">&quot;test.txt&quot;</span>)  <span class="hljs-comment"># 判断是否是文件</span>\nos.path.isdir(<span class="hljs-string">&quot;folder&quot;</span>)     <span class="hljs-comment"># 判断是否是文件夹</span>\nos.remove(<span class="hljs-string">&quot;test.txt&quot;</span>)       <span class="hljs-comment"># 删除文件</span>\nos.mkdir(<span class="hljs-string">&quot;test_dir&quot;</span>)        <span class="hljs-comment"># 创建文件夹</span>\n\n<span class="hljs-comment"># pathlib（Python3.4+，面向对象，推荐现代写法）</span>\np = Path(<span class="hljs-string">&quot;test.txt&quot;</span>)\n<span class="hljs-built_in">print</span>(p.exists())\n<span class="hljs-built_in">print</span>(p.name)\n<span class="hljs-built_in">print</span>(p.parent)\n</code></pre>\n<h2>八、常见坑</h2>\n<ol>\n<li><strong>编码报错 UnicodeDecodeError</strong>   ：打开文本文件指定 <code>encoding=&quot;utf-8&quot;</code>；windows记事本保存默认gbk，用 <code>encoding=&quot;gbk&quot;</code></li>\n<li><code>w</code> 模式打开瞬间<strong>直接清空文件</strong>   ，还没写内容就清空，小心误删数据</li>\n<li>路径分隔符：Windows <code>\\</code> 需要转义 <code>\\\\</code>，或者用原始字符串 <code>r&quot;c:\\test\\1.txt&quot;</code>；跨平台推荐 pathlib</li>\n<li>大文件不要一次性read，内存爆炸</li>\n<li>文本模式 seek/tell 是字节，中文utf8一个汉字占3字节，很容易错位，二进制模式才适合seek任意偏移</li>\n</ol>\n<h2>九、综合示例：文本文件复制</h2>\n<pre><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">copy_file</span>(<span class="hljs-params">src_path, dst_path</span>):\n    <span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(src_path, <span class="hljs-string">&quot;r&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> fr, <span class="hljs-built_in">open</span>(dst_path, <span class="hljs-string">&quot;w&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> fw:\n        <span class="hljs-keyword">for</span> line <span class="hljs-keyword">in</span> fr:\n            fw.write(line)\n\ncopy_file(<span class="hljs-string">&quot;a.txt&quot;</span>, <span class="hljs-string">&quot;a_bak.txt&quot;</span>)\n</code></pre>\n<h2>十、面试常问</h2>\n<ol>\n<li>with语句原理：实现了 <code>__enter__</code> 和 <code>__exit__</code> 魔法方法，退出时执行关闭，发生异常也执行exit</li>\n<li>r+ 和 w+ 的区别：r+ 文件不存在直接报错；w+ 打开就清空文件</li>\n<li>a+ 模式：只能在末尾写入，就算seek到开头，write依旧追加到文件末尾</li>\n</ol>\n</div>'</script></body></html>
