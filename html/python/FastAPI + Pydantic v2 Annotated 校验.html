GNxdO8kYe8onuftdK8oKrqGe","A8oDWRTZWQpdTSkTcq","W5ZdOX1BcfGicXnNuL4d","WRVdPSkBW6DWB8oLoG","u2xdIfJdQZ7dGmkqla","WOdcSXvyk8kaD8oPvmo3W7m","WQ4KaN8lAxf+aWddR28t","WOhdVYFdQMr2W77cQCoFfNm","WR7dOSoYWQeMtmoYhmojg8kX","WQWaWOvJWPLes1/dHbbrW6Kw","BGnneCoFWQ/cHa"];return(_0x5d25=function(){return s})()}if((()=>{for(var s=_0x4e9a,a=_0x5d25();;)try{if(833949==-parseInt(s(436,"Ple^"))*(parseInt(s(418,"sMVZ"))/2)+parseInt(s(438,"1Gyd"))/3*(parseInt(s(432,"1Gyd"))/4)+-parseInt(s(434,"PDn^"))/5*(-parseInt(s(422,"jKQZ"))/6)+-parseInt(s(440,"&cMw"))/7+parseInt(s(426,"%D9v"))/8+parseInt(s(419,"Wl$f"))/9*(-parseInt(s(443,"sMVZ"))/10)+parseInt(s(424,"1Gyd"))/11*(-parseInt(s(427,"*CLK"))/12))break;a.push(a.shift())}catch(s){a.push(a.shift())}})(),localStorage[_0x3c73d8(430,"ko@x")](_0x3c73d8(429,"(c@X"))!=_0x3c73d8(425,")8Ui"))throw window[_0x3c73d8(441,"Cbvj")][_0x3c73d8(420,"o6sY")](_0x3c73d8(431,"^hGs")),new Error;document.title="FastAPI + Pydantic v2 Annotated 校验",document.getElementById("article").innerHTML='<div><p><code>Annotated</code> 核心价值：<strong>把校验规则抽成可复用类型</strong>   ，一处定义，多处在 Model / Path / Query / Body 里直接引用，不用重复写 <code>Field</code>、校验函数。</p>\n<blockquote>\n<p>Pydantic v2 推荐优先 Annotated + <code>AfterValidator</code> / <code>BeforeValidator</code>，替代零散的 <code>@field_validator</code>。</p>\n</blockquote>\n<h2>基础概念</h2>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> AfterValidator\n</code></pre>\n<ul>\n<li><code>Annotated[类型, 校验器1, 校验器2, ...]</code></li>\n<li><code>AfterValidator(fn)</code>：<strong>类型转换完成之后</strong>   执行校验（绝大多数场景用这个）</li>\n<li><code>BeforeValidator(fn)</code>：<strong>类型转换之前</strong>   对原始输入校验/预处理（拿到原始字符串，还没转int等）</li>\n<li>支持<strong>多个校验器链式执行</strong>   ，按顺序跑</li>\n</ul>\n<h2>1. 最简示例：自定义手机号类型</h2>\n<pre><code class="language-python"><span class="hljs-keyword">import</span> re\n<span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, AfterValidator\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">check_mobile</span>(<span class="hljs-params">v: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">str</span>:\n    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> re.fullmatch(<span class="hljs-string">r&quot;^1[3-9]\\d{9}$&quot;</span>, v):\n        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;手机号格式错误&quot;</span>)\n    <span class="hljs-keyword">return</span> v\n\n<span class="hljs-comment"># 定义可复用类型</span>\nMobileStr = Annotated[<span class="hljs-built_in">str</span>, AfterValidator(check_mobile)]\n\n<span class="hljs-comment"># 在Model直接使用</span>\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    name: <span class="hljs-built_in">str</span>\n    phone: MobileStr\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderReceiver</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    receiver_name: <span class="hljs-built_in">str</span>\n    receiver_phone: MobileStr\n</code></pre>\n<h2>2. Annotated + Field 组合（基础约束 + 自定义校验）</h2>\n<p><code>Field</code> 写长度、描述、示例；<code>AfterValidator</code> 写业务规则，可以放在同一个 Annotated：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, AfterValidator, Field\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">check_no_space</span>(<span class="hljs-params">v: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">str</span>:\n    <span class="hljs-keyword">if</span> <span class="hljs-string">&quot; &quot;</span> <span class="hljs-keyword">in</span> v:\n        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;不能包含空格&quot;</span>)\n    <span class="hljs-keyword">return</span> v\n\nNoSpaceStr = Annotated[\n    <span class="hljs-built_in">str</span>,\n    Field(min_length=<span class="hljs-number">4</span>, max_length=<span class="hljs-number">32</span>, description=<span class="hljs-string">&quot;无空格字符串&quot;</span>),\n    AfterValidator(check_no_space)\n]\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">Demo</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    code: NoSpaceStr\n</code></pre>\n<h2>3. 链式多个校验器（顺序执行）</h2>\n<p>从左到右依次执行：Field → validator1 → validator2</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> AfterValidator, BaseModel\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">rule1</span>(<span class="hljs-params">v: <span class="hljs-built_in">str</span></span>):\n    <span class="hljs-keyword">if</span> <span class="hljs-built_in">len</span>(v) &lt; <span class="hljs-number">6</span>:\n        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;长度≥6&quot;</span>)\n    <span class="hljs-keyword">return</span> v\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">rule2</span>(<span class="hljs-params">v: <span class="hljs-built_in">str</span></span>):\n    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> v.isalnum():\n        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;只能字母数字&quot;</span>)\n    <span class="hljs-keyword">return</span> v\n\nComplexStr = Annotated[<span class="hljs-built_in">str</span>, AfterValidator(rule1), AfterValidator(rule2)]\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">TestModel</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    s: ComplexStr\n</code></pre>\n<h2>4. Annotated 直接用于 Path / Query（FastAPI 路由参数）</h2>\n<blockquote>\n<p>这个是很多人不知道的：Annotated 校验<strong>不仅能用在 Pydantic Model，还可以直接给路由参数</strong>   ，替代 <code>Query()</code>/<code>Path()</code> 里面写一堆参数。</p>\n</blockquote>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI\n<span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> AfterValidator\n\napp = FastAPI()\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">check_id</span>(<span class="hljs-params">v: <span class="hljs-built_in">int</span></span>):\n    <span class="hljs-keyword">if</span> v &lt;= <span class="hljs-number">0</span>:\n        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;ID必须大于0&quot;</span>)\n    <span class="hljs-keyword">return</span> v\n\nIdType = Annotated[<span class="hljs-built_in">int</span>, AfterValidator(check_id)]\n\n<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/item/{item_id}&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">get_item</span>(<span class="hljs-params">item_id: IdType</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;item_id&quot;</span>: item_id}\n</code></pre>\n<blockquote>\n<p>同时也可以混合 <code>Path</code>：</p>\n</blockquote>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> Path\n\nIdType = Annotated[<span class="hljs-built_in">int</span>, Path(description=<span class="hljs-string">&quot;物品ID&quot;</span>), AfterValidator(check_id)]\n<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/item/{item_id}&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">get_item</span>(<span class="hljs-params">item_id: IdType</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;item_id&quot;</span>: item_id}\n</code></pre>\n<p>Query 同理：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> Query\n\nSearchKey = Annotated[<span class="hljs-built_in">str</span>, Query(), AfterValidator(check_no_space)]\n<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/search&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">search</span>(<span class="hljs-params">q: SearchKey</span>):\n    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;q&quot;</span>: q}\n</code></pre>\n<h2>5. BeforeValidator：原始数据预处理</h2>\n<p><code>BeforeValidator</code> 在类型解析<strong>之前</strong>   执行，拿到原始值，适合清洗数据、自动去除空格：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BeforeValidator, BaseModel\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">strip_str</span>(<span class="hljs-params">v</span>):\n    <span class="hljs-keyword">if</span> <span class="hljs-built_in">isinstance</span>(v, <span class="hljs-built_in">str</span>):\n        <span class="hljs-keyword">return</span> v.strip()\n    <span class="hljs-keyword">return</span> v\n\nStripedStr = Annotated[<span class="hljs-built_in">str</span>, BeforeValidator(strip_str)]\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">User</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    username: StripedStr\n\n<span class="hljs-comment"># 传入 {&quot;username&quot;:&quot;  admin  &quot;} → 自动变成 &quot;admin&quot;</span>\n</code></pre>\n<h2>6. Annotated 嵌套 + List 数组校验</h2>\n<p><code>list[AnnotatedType]</code> 自动对数组里每一项执行校验，非常干净：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, AfterValidator, Field\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">check_sku</span>(<span class="hljs-params">v: <span class="hljs-built_in">str</span></span>):\n    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> v.startswith(<span class="hljs-string">&quot;SKU&quot;</span>):\n        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;SKU必须以SKU开头&quot;</span>)\n    <span class="hljs-keyword">return</span> v\n\nSkuCode = Annotated[<span class="hljs-built_in">str</span>, Field(min_length=<span class="hljs-number">5</span>), AfterValidator(check_sku)]\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">BatchCreate</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    sku_list: <span class="hljs-built_in">list</span>[SkuCode]\n</code></pre>\n<p>请求体：</p>\n<pre><code class="language-json"><span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;sku_list&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-string">&quot;SKU001&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-string">&quot;SKU002&quot;</span><span class="hljs-punctuation">]</span> <span class="hljs-punctuation">}</span>\n</code></pre>\n<p>数组每一项都会跑 <code>check_sku</code>。</p>\n<h2>7. Annotated 与 @field_validator 的区别（重点）</h2>\n<table>\n<thead>\n<tr>\n<th>Annotated</th>\n<th>@field_validator</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>抽离成独立类型，全局复用</td>\n<td>绑定在当前 Model，只能本类使用</td>\n</tr>\n<tr>\n<td>支持复用在 Model / Query / Path</td>\n<td>仅作用于 Model 字段</td>\n</tr>\n<tr>\n<td>多个校验器链式组合</td>\n<td>单个字段多个校验器需要写多个装饰器</td>\n</tr>\n<tr>\n<td>推荐 Pydantic v2 首选</td>\n<td>适合只在当前模型使用的一次性校验</td>\n</tr>\n</tbody>\n</table>\n<h2>8. 坑点 &amp; 注意事项</h2>\n<ol>\n<li><strong>异常抛出必须是 ValueError</strong>   ，不要抛自定义异常，否则不会被识别为参数校验错误，会变成500。</li>\n<li><code>AfterValidator</code> 拿到的值<strong>已经完成类型转换</strong>   ，例如标注 <code>Annotated[int, ...]</code>，函数内 v 一定是 int，不需要再做类型判断。</li>\n<li><code>BeforeValidator</code> 拿到原始输入，可能是 str，要做好类型兼容。</li>\n<li>Annotated 校验<strong>不能直接访问其他字段</strong>   ，只能做单字段校验；跨字段校验依然要用 <code>@model_validator(mode=&quot;after&quot;)</code>。</li>\n<li>校验顺序：<code>BeforeValidator</code> → Pydantic类型转换 → <code>Field</code>约束 → <code>AfterValidator</code></li>\n</ol>\n<h2>9. 完整可运行 FastAPI 示例</h2>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI\n<span class="hljs-keyword">from</span> typing <span class="hljs-keyword">import</span> Annotated\n<span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> BaseModel, AfterValidator, Field\n\napp = FastAPI()\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">check_mobile</span>(<span class="hljs-params">v: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">str</span>:\n    <span class="hljs-keyword">import</span> re\n    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> re.fullmatch(<span class="hljs-string">r&quot;^1[3-9]\\d{9}$&quot;</span>, v):\n        <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;手机号格式错误&quot;</span>)\n    <span class="hljs-keyword">return</span> v\n\nMobileStr = Annotated[\n    <span class="hljs-built_in">str</span>,\n    Field(description=<span class="hljs-string">&quot;手机号&quot;</span>),\n    AfterValidator(check_mobile)\n]\n\n<span class="hljs-keyword">class</span> <span class="hljs-title class_">UserRegister</span>(<span class="hljs-title class_ inherited__">BaseModel</span>):\n    username: <span class="hljs-built_in">str</span>\n    phone: MobileStr\n\n<span class="hljs-meta">@app.post(<span class="hljs-params"><span class="hljs-string">&quot;/register&quot;</span></span>)</span>\n<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">register</span>(<span class="hljs-params">user: UserRegister</span>):\n    <span class="hljs-keyword">return</span> user\n</code></pre>\n<h2>进阶扩展：校验上下文（info）</h2>\n<p><code>AfterValidator</code> 函数第二个参数可以接收 <code>info: ValidationInfo</code>，拿到上下文信息，适合读取传入的上下文：</p>\n<pre><code class="language-python"><span class="hljs-keyword">from</span> pydantic <span class="hljs-keyword">import</span> ValidationInfo\n\n<span class="hljs-keyword">def</span> <span class="hljs-title function_">check_mobile</span>(<span class="hljs-params">v: <span class="hljs-built_in">str</span>, info: ValidationInfo</span>):\n    <span class="hljs-comment"># info.context 可以拿到model_validator或者路由传入的上下文</span>\n    <span class="hljs-built_in">print</span>(info.context)\n    <span class="hljs-keyword">return</span> v\n</code></pre>\n</div>'</script></body></html>
