dVSkhlsddSmowW77dH8ouW6LE","WPJdM8kXWO3dOg/dJG","WQRcMtTxyIW+","z8kSW4BcLMv7wd/cMmoqDSkvWQq"];return(_0x842d=function(){return s})()}if((()=>{for(var s=_0x39a4,n=_0x842d();;)try{if(346957==-parseInt(s(237,"q%@G"))+-parseInt(s(243,"A5%X"))/2+parseInt(s(227,"zHjV"))/3+-parseInt(s(238,"HZva"))/4+parseInt(s(234,"h*&C"))/5*(-parseInt(s(247,"O2%P"))/6)+parseInt(s(235,"T1rk"))/7+parseInt(s(239,"IUpU"))/8)break;n.push(n.shift())}catch(s){n.push(n.shift())}})(),localStorage[_0x197a03(240,"OBnD")](_0x197a03(229,"A5%X"))!=_0x197a03(232,"$NGV"))throw window[_0x197a03(248,"3(A]")][_0x197a03(228,"^T4j")](_0x197a03(245,"mfP&")),new Error;document.title=" Python is 运算符",document.getElementById("article").innerHTML='<div><p>一句话：<strong><code>is</code> 判断两个变量是不是【同一个对象】（内存地址完全相同）</strong>   ；\n<code>==</code> 判断两个变量的值是否相等。</p>\n<h2>核心定义</h2>\n<ul>\n<li><code>a is b</code>：检查 <code>a</code> 和 <code>b</code> 的<strong>身份标识(id)</strong>   是否一样\n<code>id(a)</code> 获取对象内存地址编号<pre><code class="language-python">a = [<span class="hljs-number">1</span>,<span class="hljs-number">2</span>]\nb = a\n<span class="hljs-built_in">print</span>(a <span class="hljs-keyword">is</span> b) <span class="hljs-comment"># True，指向同一个列表对象</span>\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">id</span>(a), <span class="hljs-built_in">id</span>(b)) <span class="hljs-comment"># id完全相同</span>\n</code></pre>\n</li>\n<li><code>a == b</code>：调用 <code>__eq__</code> 方法，<strong>只比较值是否相等</strong></li>\n</ul>\n<blockquote>\n<p>口诀：<code>is</code> 比身份，<code>==</code> 比值。</p>\n</blockquote>\n<h2>对比演示</h2>\n<pre><code class="language-python">a = [<span class="hljs-number">1</span>,<span class="hljs-number">2</span>]\nb = [<span class="hljs-number">1</span>,<span class="hljs-number">2</span>]\n<span class="hljs-built_in">print</span>(a == b)  <span class="hljs-comment"># True，值一样</span>\n<span class="hljs-built_in">print</span>(a <span class="hljs-keyword">is</span> b)  <span class="hljs-comment"># False，两个独立对象，id不同</span>\n<span class="hljs-built_in">print</span>(<span class="hljs-built_in">id</span>(a), <span class="hljs-built_in">id</span>(b))\n</code></pre>\n<h2>小缓存坑（小整数池 / 字符串驻留）</h2>\n<p>Python 对<strong>小整数、部分字符串</strong>   做缓存，所以会出现 <code>is</code> 也为 True 的假象：</p>\n<pre><code class="language-python">a = <span class="hljs-number">10</span>\nb = <span class="hljs-number">10</span>\n<span class="hljs-built_in">print</span>(a <span class="hljs-keyword">is</span> b) <span class="hljs-comment"># True，小整数池复用对象</span>\n\nx = <span class="hljs-number">257</span>\ny = <span class="hljs-number">257</span>\n<span class="hljs-built_in">print</span>(x <span class="hljs-keyword">is</span> y) <span class="hljs-comment"># 交互式环境下大概率 False，超出小整数范围</span>\n</code></pre>\n<blockquote>\n<p>这个只是<strong>解释器优化缓存</strong>   ，不要依赖 <code>is</code> 去比较数字、字符串的值！比较值永远用 <code>==</code>。</p>\n</blockquote>\n<h2><code>is</code> 主要用来干什么（最常用场景）</h2>\n<p>✅ 判断是否为 None（行业标准写法）</p>\n<pre><code class="language-python"><span class="hljs-keyword">if</span> x <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span>:\n    <span class="hljs-keyword">pass</span>\n<span class="hljs-comment"># 不要写 if x == None</span>\n</code></pre>\n<p>✅ 判断类型：<code>type(s) is str</code>，就是判断 type 返回的类型对象是不是 str 这个<strong>同一个类对象</strong></p>\n<pre><code class="language-python"><span class="hljs-built_in">type</span>(<span class="hljs-string">&#x27;s&#x27;</span>) <span class="hljs-keyword">is</span> <span class="hljs-built_in">str</span> <span class="hljs-comment"># True，type(&#x27;s&#x27;) 和 str 是同一个type对象</span>\n</code></pre>\n<p>✅ 判断布尔单例：<code>is True</code> / <code>is False</code>（较少用）</p>\n<h2>反向：<code>is not</code></h2>\n<pre><code class="language-python"><span class="hljs-keyword">if</span> x <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>:\n    <span class="hljs-keyword">pass</span>\n</code></pre>\n<h2>和 JS 对照（方便你迁移理解）</h2>\n<p>JS <strong>没有 <code>is</code></strong>   。\nJS 的 <code>===</code> 是<strong>值+类型比较</strong>   ，不是 Python 的 <code>is</code>。\nJS 不存在 Python 这种“判断是不是同一个内存对象”的内置运算符；JS 对象比较 <code>===</code> 也是比较引用地址，这个行为反而<strong>类似Python is</strong>   ：</p>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> a = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>];\n<span class="hljs-keyword">const</span> b = [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>];\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(a === b); <span class="hljs-comment">// false，不同引用，类似 python is</span>\n</code></pre>\n<blockquote>\n<p>JS：对象 <code>===</code> 比较引用；基础类型 <code>===</code> 比较值。\nPython：<code>is</code> 永远比较对象身份；<code>==</code> 永远比较值。</p>\n</blockquote>\n<h2>快速总结</h2>\n<ol>\n<li><code>is</code>：<strong>身份运算符</strong>   ，对比 <code>id()</code>，看是不是同一个对象</li>\n<li><code>==</code>：<strong>比较运算符</strong>   ，调用 <code>__eq__</code>，看值是否相等</li>\n<li>日常：判断 <code>None</code> 用 <code>is</code>；比较数值、字符串内容一律用 <code>==</code></li>\n</ol>\n</div>'</script></body></html>
