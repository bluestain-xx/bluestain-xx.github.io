s="hljs-keyword">const</span> [isLoading, setIsLoading] = <span class="hljs-title function_">useState</span>(<span class="hljs-literal">true</span>);\n\n  <span class="hljs-title function_">useEffect</span>(<span class="hljs-function">() =&gt;</span> {\n    <span class="hljs-keyword">const</span> <span class="hljs-title function_">loadData</span> = <span class="hljs-keyword">async</span> (<span class="hljs-params"></span>) =&gt; {\n      <span class="hljs-keyword">try</span> {\n        <span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetchWithFallback</span>(\n          <span class="hljs-string">&quot;/api/main-data&quot;</span>,\n          <span class="hljs-string">&quot;/api/fallback-data&quot;</span>,\n        );\n        <span class="hljs-title function_">setData</span>(result);\n      } <span class="hljs-keyword">catch</span> (error) {\n        <span class="hljs-comment">// 显示降级UI</span>\n        <span class="hljs-title function_">setData</span>({ <span class="hljs-attr">isFallback</span>: <span class="hljs-literal">true</span> });\n      } <span class="hljs-keyword">finally</span> {\n        <span class="hljs-title function_">setIsLoading</span>(<span class="hljs-literal">false</span>);\n      }\n    };\n\n    <span class="hljs-title function_">loadData</span>();\n  }, []);\n}\n</code></pre>\n<h3>2. 监控和性能测量</h3>\n<pre><code class="language-javascript"><span class="hljs-comment">// 性能监控</span>\n<span class="hljs-keyword">function</span> <span class="hljs-title function_">monitorPerformance</span>(<span class="hljs-params"></span>) {\n  <span class="hljs-keyword">const</span> observer = <span class="hljs-keyword">new</span> <span class="hljs-title class_">PerformanceObserver</span>(<span class="hljs-function">(<span class="hljs-params">list</span>) =&gt;</span> {\n    list.<span class="hljs-title function_">getEntries</span>().<span class="hljs-title function_">forEach</span>(<span class="hljs-function">(<span class="hljs-params">entry</span>) =&gt;</span> {\n      <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`<span class="hljs-subst">${entry.name}</span>: <span class="hljs-subst">${entry.duration}</span>ms`</span>);\n    });\n  });\n\n  observer.<span class="hljs-title function_">observe</span>({ <span class="hljs-attr">entryTypes</span>: [<span class="hljs-string">&quot;measure&quot;</span>, <span class="hljs-string">&quot;resource&quot;</span>, <span class="hljs-string">&quot;navigation&quot;</span>] });\n}\n\n<span class="hljs-comment">// 错误监控</span>\n<span class="hljs-variable language_">window</span>.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;error&quot;</span>, <span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {\n  <span class="hljs-comment">// 上报错误到监控系统</span>\n  <span class="hljs-title function_">reportError</span>({\n    <span class="hljs-attr">message</span>: event.<span class="hljs-property">error</span>.<span class="hljs-property">message</span>,\n    <span class="hljs-attr">stack</span>: event.<span class="hljs-property">error</span>.<span class="hljs-property">stack</span>,\n    <span class="hljs-attr">timestamp</span>: <span class="hljs-title class_">Date</span>.<span class="hljs-title function_">now</span>(),\n  });\n});\n</code></pre>\n<h2>📈 优化效果评估</h2>\n<table>\n<thead>\n<tr>\n<th>优化措施</th>\n<th>预期效果</th>\n<th>适用场景</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>资源懒加载</td>\n<td>减少初始加载时间 40-60%</td>\n<td>图片、长列表、非首屏内容</td>\n</tr>\n<tr>\n<td>接口缓存</td>\n<td>减少重复请求 70%</td>\n<td>频繁访问的静态数据</td>\n</tr>\n<tr>\n<td>请求队列</td>\n<td>控制并发连接数，避免阻塞</td>\n<td>批量操作、文件上传</td>\n</tr>\n<tr>\n<td>Web Worker</td>\n<td>主线程解放，避免界面卡顿</td>\n<td>大数据处理、复杂计算</td>\n</tr>\n<tr>\n<td>降级策略</td>\n<td>保证基本功能可用性</td>\n<td>高并发时的服务降级</td>\n</tr>\n</tbody>\n</table>\n<h2>🎯 实施建议</h2>\n<ol>\n<li><strong>分级实施</strong>   ：先从最影响用户体验的部分开始优化</li>\n<li><strong>监控先行</strong>   ：建立完善的性能监控体系</li>\n<li><strong>渐进式优化</strong>   ：采用逐步 rollout 的方式验证效果</li>\n<li><strong>A/B 测试</strong>   ：通过对比数据验证优化效果</li>\n</ol>\n<p>这些优化措施需要根据具体业务场景组合使用，建议通过性能监控工具持续评估优化效果。</p>\n<blockquote>\n<p>先澄清：<strong>前端本身不产生并发，并发来源：大量异步请求 / 大量 DOM 操作 / 大量计算任务</strong>  ；前端高并发本质是：<strong>控制并发数量、避免阻塞主线程、防止接口雪崩、优化渲染调度</strong>  。</p>\n</blockquote>\n<h2>一、前端高并发常见场景</h2>\n<ol>\n<li>批量上传文件（几十/上百个分片请求）</li>\n<li>列表批量导出、批量操作（几十条接口并行）</li>\n<li>大量图片预加载、资源并发请求</li>\n<li>WebSocket 高频推送大量消息渲染</li>\n<li>大数据表格渲染、海量数据循环处理</li>\n<li>多 Tab、多 Worker 同时发起接口</li>\n</ol>\n<h2>二、前端高并发核心痛点</h2>\n<ol>\n<li><strong>浏览器同源并发限制</strong>  （Chrome 同域名最大 6~8 个 TCP 请求），超出会排队，请求卡住超时</li>\n<li><strong>主线程阻塞</strong>  ：大量同步循环、JSON 解析、DOM 操作 → 页面卡顿、点击无响应</li>\n<li><strong>接口雪崩</strong>  ：无限制并发，短时间上百请求打垮后端，同时大量 pending 请求占用连接池</li>\n<li><strong>内存暴涨</strong>  ：大量请求实例、未销毁定时器、DOM 节点堆积 → 页面崩溃</li>\n<li><strong>竞态问题</strong>  ：多个异步返回顺序不可控（先发后回，数据覆盖）</li>\n</ol>\n<h2>三、核心解决方案分类</h2>\n<h3>✅ 1. 请求层：并发控制（最常用）</h3>\n<p>核心：<strong>并发池，限制同时进行的请求数量</strong>  ，队列排队，一个完成再补下一个。\n原生 JS 实现简易并发调度器（无第三方库）</p>\n<pre><code class="language-js"><span class="hljs-keyword">class</span> <span class="hljs-title class_">ConcurrentPool</span> {\n  <span class="hljs-title function_">constructor</span>(<span class="hljs-params">limit = <span class="hljs-number">6</span></span>) {\n    <span class="hljs-variable language_">this</span>.<span class="hljs-property">limit</span> = limit; <span class="hljs-comment">// 最大并发数，建议≤6 适配浏览器</span>\n    <span class="hljs-variable language_">this</span>.<span class="hljs-property">running</span> = <span class="hljs-number">0</span>;\n    <span class="hljs-variable language_">this</span>.<span class="hljs-property">queue</span> = [];\n  }\n\n  <span class="hljs-title function_">add</span>(<span class="hljs-params">task</span>) {\n    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Promise</span>(<span class="hljs-function">(<span class="hljs-params">resolve, reject</span>) =&gt;</span> {\n      <span class="hljs-variable language_">this</span>.<span class="hljs-property">queue</span>.<span class="hljs-title function_">push</span>({ task, resolve, reject });\n      <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">run</span>();\n    });\n  }\n\n  <span class="hljs-title function_">run</span>(<span class="hljs-params"></span>) {\n    <span class="hljs-keyword">if</span> (<span class="hljs-variable language_">this</span>.<span class="hljs-property">running</span> &gt;= <span class="hljs-variable language_">this</span>.<span class="hljs-property">limit</span> || !<span class="hljs-variable language_">this</span>.<span class="hljs-property">queue</span>.<span class="hljs-property">length</span>) <span class="hljs-keyword">return</span>;\n    <span class="hljs-variable language_">this</span>.<span class="hljs-property">running</span>++;\n    <span class="hljs-keyword">const</span> { task, resolve, reject } = <span class="hljs-variable language_">this</span>.<span class="hljs-property">queue</span>.<span class="hljs-title function_">shift</span>();\n    <span class="hljs-title function_">task</span>()\n      .<span class="hljs-title function_">then</span>(resolve)\n      .<span class="hljs-title function_">catch</span>(reject)\n      .<span class="hljs-title function_">finally</span>(<span class="hljs-function">() =&gt;</span> {\n        <span class="hljs-variable language_">this</span>.<span class="hljs-property">running</span>--;\n        <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">run</span>();\n      });\n  }\n}\n\n<span class="hljs-comment">// ===== 使用示例 =====</span>\n<span class="hljs-keyword">const</span> pool = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ConcurrentPool</span>(<span class="hljs-number">6</span>);\n<span class="hljs-keyword">const</span> urls = <span class="hljs-title class_">Array</span>.<span class="hljs-title function_">from</span>({ <span class="hljs-attr">length</span>: <span class="hljs-number">20</span> }, <span class="hljs-function">(<span class="hljs-params">_, i</span>) =&gt;</span> <span class="hljs-string">`https://xxx/api?id=<span class="hljs-subst">${i}</span>`</span>);\n\n<span class="hljs-keyword">const</span> tasks = urls.<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">url</span>) =&gt;</span> <span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">fetch</span>(url).<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">r</span>) =&gt;</span> r.<span class="hljs-title function_">json</span>()));\n<span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">allSettled</span>(tasks.<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">t</span>) =&gt;</span> pool.<span class="hljs-title function_">add</span>(t))).<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">res</span>) =&gt;</span> {\n  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;全部完成&quot;</span>, res);\n});\n</code></pre>\n<blockquote>\n<p>成熟库备选：<code>p-limit</code>（生产常用，轻量）</p>\n</blockquote>\n<h4>配套优化</h4>\n<ol>\n<li><strong>请求防抖/节流</strong>  ：高频触发（搜索输入、窗口 resize）</li>\n<li><strong>请求取消 AbortController</strong>  ：避免无效请求占用并发槽</li>\n</ol>\n<pre><code class="language-js"><span class="hljs-keyword">const</span> controller = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();\n<span class="hljs-title function_">fetch</span>(<span class="hljs-string">&quot;/api&quot;</span>, { <span class="hljs-attr">signal</span>: controller.<span class="hljs-property">signal</span> });\n<span class="hljs-comment">// 取消：controller.abort()</span>\n</code></pre>\n<ol start="3">\n<li><strong>重复请求合并、缓存响应</strong>  （axios 封装缓存，避免相同接口重复并发）</li>\n<li>接口支持：批量合并接口（优先！能合并就不要并发 N 次）</li>\n</ol>\n<h3>✅ 2. 渲染层并发：避免主线程阻塞</h3>\n<p>浏览器 JS、布局、绘制共用<strong>主线程</strong>  ，长时间任务会卡死页面\n方案：</p>\n<ol>\n<li><strong>Web Worker</strong>  ：把大量计算（大数据排序、解析、加密）丢到子线程，不能操作 DOM</li>\n<li><strong>任务分片（Time Slicing）</strong>  ：<code>requestIdleCallback</code> / <code>setTimeout</code> 拆分长循环，让出主线程</li>\n</ol>\n<pre><code class="language-js"><span class="hljs-comment">// 分片处理十万条数据，不阻塞页面</span>\n<span class="hljs-keyword">function</span> <span class="hljs-title function_">sliceTask</span>(<span class="hljs-params">list, handleItem, chunkSize = <span class="hljs-number">20</span></span>) {\n  <span class="hljs-keyword">let</span> index = <span class="hljs-number">0</span>;\n  <span class="hljs-keyword">function</span> <span class="hljs-title function_">run</span>(<span class="hljs-params"></span>) {\n    <span class="hljs-keyword">let</span> count = <span class="hljs-number">0</span>;\n    <span class="hljs-keyword">while</span> (index &lt; list.<span class="hljs-property">length</span> &amp;&amp; count &lt; chunkSize) {\n      <span class="hljs-title function_">handleItem</span>(list[index]);\n      index++;\n      count++;\n    }\n    <span class="hljs-keyword">if</span> (index &lt; list.<span class="hljs-property">length</span>) {\n      <span class="hljs-title function_">requestIdleCallback</span>(run);\n    }\n  }\n  <span class="hljs-title function_">run</span>();\n}\n</code></pre>\n<ol start="3">\n<li>虚拟滚动：只渲染可视区域 DOM（海量表格/列表必备）</li>\n<li>减少强制同步布局：避免循环内 <code>offsetHeight</code> + 修改 DOM，触发多次重排</li>\n</ol>\n<h3>✅ 3. 网络层面优化</h3>\n<ol>\n<li>HTTP/2 / HTTP/3：多路复用，同域名不再限制 6 个连接（服务端必须支持）</li>\n<li>静态资源 CDN 域名拆分（但不要过多，DNS 损耗）</li>\n<li>资源预加载、预连接 <code>&lt;link rel=&quot;preconnect&quot;&gt;</code></li>\n<li>分片上传 + 断点续传：大文件拆分，并发上传分片 + 失败重试</li>\n</ol>\n<h3>✅ 4. 兜底：错误重试、熔断降级</h3>\n<p>高并发下大量接口失败，需要策略：</p>\n<ol>\n<li>指数退避重试：失败后不要立刻重试，延迟递增</li>\n<li>熔断：连续多次失败，直接拒绝新请求，一段时间后放行</li>\n<li>降级：接口并发异常时，使用缓存/默认数据，保证页面可用</li>\n</ol>\n<p>简易熔断器思路：记录失败次数，达到阈值开启熔断窗口</p>\n<h2>四、常见误区</h2>\n<ol>\n<li>❌ <code>Promise.all</code> 直接丢上 20 个请求 → 瞬间打爆浏览器连接池</li>\n<li>❌ 用 setTimeout 简单排队，无法精准控制并发上限</li>\n<li>❌ Web Worker 用来操作 DOM（不支持）</li>\n<li>❌ 并发越大越快：超过浏览器连接上限后，性能反而下降</li>\n</ol>\n<h2>五、生产落地选型建议</h2>\n<ol>\n<li>简单场景：手写上面 <code>ConcurrentPool</code> 并发控制器</li>\n<li>React/Vue 项目：<code>p-limit</code> + axios 拦截器封装全局并发控制</li>\n<li>超大文件上传：分片 + 并发池 + 断点续传 + Worker 计算 md5</li>\n<li>海量数据渲染：虚拟列表 + 任务分片</li>\n<li>实时消息高并发渲染：WebSocket 消息队列缓冲，节流批量更新 DOM</li>\n</ol>\n<h2>六、延伸：监控与定位高并发问题</h2>\n<ol>\n<li>Chrome DevTools -&gt; Network：看请求是否大量 pending（并发排队）</li>\n<li>Performance：主线程长任务（红色长条）定位阻塞</li>\n<li>监控：请求耗时、并发数量、失败率、内存快照（memory）排查泄漏</li>\n</ol>\n<h2>七、如果你需要，我可以继续提供：</h2>\n<ol>\n<li>带 <strong>熔断、重试、超时、Abort 取消</strong>   完整版并发调度器</li>\n<li>axios 全局封装，自动限制接口最大并发</li>\n<li>WebWorker 大数据处理完整示例</li>\n<li>文件分片上传高并发完整代码</li>\n<li>前端限流、熔断完整工具类</li>\n</ol>\n<p>你是遇到了 <strong>批量接口并发卡顿</strong>  ，还是 <strong>大数据渲染页面卡死</strong>   的业务场景？我可以针对性给可直接上线的代码。</p>\n</div>'</script></body></html>
