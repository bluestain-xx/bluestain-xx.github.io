7160(441,"eZye")),new Error;function _0x4f3c(){var s=["W47dN8oNzCk9W6pdMG3cJSka","bSoqWRakmq","BmkqDComW6mArmoyvG","W6bVgHLww1j6CCkGWRNcIwm","hePgWRxcU05QWO3dK8ojF8ogha","WPG2WR8xkCkEWPBdIK02W6xdTLm","g0HfWRxdQJOiWRxdPSoH","h09aWRRcVurRWOJdR8oYE8oPkW","zCk3asZcJqnRWQSAiqRcIW","W6TXWQiBkmo6zuqpW4BdGvibW7NdV8ocWPzVWROOW45MWR7cM8o+xq","WRaWW65BASo0dcyyW7tdVeW","W4fMlX7cPCoZW5y","qufFWR1QWRVcG8o1nCkmgW","WPHGbCoIzhyK","WRpcT8o9WQ5WgM9ZW6DVlG","lXxdHwpcG8ozxq","qqtdOCkGW7ldGNBcJSoeW49xxSo9","W6zkWRtcPCoDzCkthrOYW6ZdGCkn","pL/cH0xcJspcPSovsCkjW7q+xW","W7ddK8kWW5ldGCo1fCo7oCkbWOO5EW","lSkuWPKEqtqTga","W591WPfiWRdcTMX9zvuEsti","AaHjmXNdUh0","WRRcJSoSA8kedWf9W6fuhWbv"];return(_0x4f3c=function(){return s})()}document.title=" Ollama RAG 完整详解",document.getElementById("article").innerHTML='<div><blockquote>\n<p>Ollama RAG = <strong>本地私有化检索增强生成</strong><br>\n全部链路跑在本机 <code>[http://localhost:11434](http://localhost:11434)</code>，<strong>不上云、文档不外传、不微调模型权重</strong>   ；只是把私有文档做成外挂知识库，回答时把检索片段塞进上下文给 LLM。\n你前面写的 <code>MemoryVectorStore</code>、<code>embedQuery</code>、<code>similaritySearchVectorWithScore</code> 就是 Naive RAG（朴素RAG）底层链路。</p>\n</blockquote>\n<h2>一、两大核心模型（Ollama 里分开）</h2>\n<p>RAG 需要两类完全不同的模型，不要搞混：</p>\n<ol>\n<li><strong>生成大模型（Chat）：负责阅读理解、输出答案</strong><br>\n示例：<code>qwen2:7b</code>、<code>llama3.1:8b</code>\n对应代码：<code>ChatOllama</code></li>\n<li><strong>Embedding 向量模型：负责把文本转数字向量，做语义检索</strong><br>\n✅ 推荐：<code>nomic-embed-text</code>（中文友好，768维）\n对应代码：<code>OllamaEmbeddings</code><pre><code class="language-bash">ollama pull nomic-embed-text\nollama pull qwen2:7b\n</code></pre>\n</li>\n</ol>\n<blockquote>\n<p>⚠️ 重要：<strong>Embedding模型只输出向量，不能聊天；Chat模型不能用来做向量检索</strong></p>\n</blockquote>\n<h2>二、RAG 完整两大阶段</h2>\n<h3>阶段A：索引入库（离线，一次性/定时执行）</h3>\n<p>文档原始文件（md/txt/pdf）→ 加载 → 分段切块 Chunk → 生成向量 → 向量库持久化</p>\n<pre><code>原始文本 → Document[]（pageContent + metadata）\n→ OllamaEmbeddings.embedDocuments()\n→ VectorStore.fromDocuments()\n</code></pre>\n<ul>\n<li><code>pageContent</code>：<strong>正文，参与向量化、相似度检索</strong></li>\n<li><code>metadata</code>：标签（来源、分类、权限），<strong>不参与向量计算，用于过滤、溯源</strong></li>\n<li><code>MemoryVectorStore</code>：内存向量库，程序关闭数据丢失，<strong>只适合学习Demo</strong></li>\n<li>生产替换：Chroma（本地持久化）、FAISS、Qdrant、pgvector（Postgres向量插件）</li>\n</ul>\n<h3>阶段B：在线检索问答（用户每次提问时实时执行）</h3>\n<p>也就是你截图里写的这段代码：</p>\n<pre><code class="language-ts"><span class="hljs-comment">// 1. 用户问题转向量</span>\n<span class="hljs-keyword">const</span> vector = <span class="hljs-keyword">await</span> embeddings.<span class="hljs-title function_">embedQuery</span>(<span class="hljs-string">&quot;合一在哪里？&quot;</span>);\n<span class="hljs-comment">// 2. 向量库相似度检索，返回带分数结果</span>\n<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> vectorStore.<span class="hljs-title function_">similaritySearchVectorWithScore</span>(vector, <span class="hljs-number">1</span>);\n</code></pre>\n<ol>\n<li><code>embedQuery</code>：专门给<strong>用户问句</strong>   生成向量；<code>embedDocuments</code> 批量给入库文档生成向量。部分Embedding模型对query和document有不同编码策略，所以拆成两个API</li>\n<li><code>similaritySearchVectorWithScore(vector, k)</code>\n<ul>\n<li>入参：自己生成好的查询向量、k=召回条数</li>\n<li>返回格式：<code>[ [Document, score] ]</code></li>\n<li>score：余弦相似度（0~1），<strong>越高越相似</strong>   ，可以做阈值过滤，低于阈值直接丢弃，防止垃圾上下文</li>\n</ul>\n</li>\n<li>拿到文档后：<strong>手动拼接 Prompt</strong>   ，把检索出来的 <code>pageContent</code> 和问题一起发给 ChatOllama</li>\n<li>LLM 根据你给的参考文本输出答案；LLM<strong>看不到JS对象，只能读到你拼接的字符串</strong></li>\n</ol>\n<blockquote>\n<p>高层封装写法（日常开发优先）：<code>vectorStore.asRetriever(k)</code>\nretriever内部自动帮你执行 <code>embedQuery + similaritySearch</code>，直接返回 Document[]，拿不到score；\n如果你要做分数过滤、调试检索质量，就用底层 <code>similaritySearchVectorWithScore</code>。</p>\n</blockquote>\n<h2>三、一条最简链路时序（对应你整套Demo）</h2>\n<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">ChatOllama</span>, <span class="hljs-title class_">OllamaEmbeddings</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@langchain/ollama&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">MemoryVectorStore</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;langchain/vectorstores/memory&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">HumanMessage</span>, <span class="hljs-title class_">SystemMessage</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@langchain/core/messages&quot;</span>;\n\n<span class="hljs-comment">// 1. 初始化两个模型</span>\n<span class="hljs-keyword">const</span> embeddings = <span class="hljs-keyword">new</span> <span class="hljs-title class_">OllamaEmbeddings</span>({ <span class="hljs-attr">model</span>: <span class="hljs-string">&quot;nomic-embed-text&quot;</span> });\n<span class="hljs-keyword">const</span> llm = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ChatOllama</span>({ <span class="hljs-attr">model</span>: <span class="hljs-string">&quot;qwen2:7b&quot;</span> });\n\n<span class="hljs-comment">// 2. 索引：写入向量库</span>\n<span class="hljs-keyword">const</span> text = <span class="hljs-string">&quot;我是合一，我在妙码学院&quot;</span>;\n<span class="hljs-keyword">const</span> vectorStore = <span class="hljs-keyword">await</span> <span class="hljs-title class_">MemoryVectorStore</span>.<span class="hljs-title function_">fromDocuments</span>(\n  [{ <span class="hljs-attr">pageContent</span>: text, <span class="hljs-attr">metadata</span>: { <span class="hljs-attr">name</span>: <span class="hljs-string">&quot;妙码学院&quot;</span> } }],\n  embeddings,\n);\n\n<span class="hljs-comment">// 3. 检索（截图底层写法）</span>\n<span class="hljs-keyword">const</span> vector = <span class="hljs-keyword">await</span> embeddings.<span class="hljs-title function_">embedQuery</span>(<span class="hljs-string">&quot;合一在哪里？&quot;</span>);\n<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> vectorStore.<span class="hljs-title function_">similaritySearchVectorWithScore</span>(vector, <span class="hljs-number">1</span>);\n<span class="hljs-keyword">const</span> [doc, score] = result[<span class="hljs-number">0</span>];\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;相似度分数：&quot;</span>, score);\n\n<span class="hljs-comment">// 4. 构造Prompt交给LLM</span>\n<span class="hljs-keyword">const</span> answer = <span class="hljs-keyword">await</span> llm.<span class="hljs-title function_">invoke</span>([\n  <span class="hljs-keyword">new</span> <span class="hljs-title class_">SystemMessage</span>(\n    <span class="hljs-string">&quot;严格使用下面参考资料回答，如果资料没有答案，直接说不知道，禁止编造。&quot;</span>,\n  ),\n  <span class="hljs-keyword">new</span> <span class="hljs-title class_">HumanMessage</span>(<span class="hljs-string">`参考资料：<span class="hljs-subst">${doc.pageContent}</span>\\n问题：合一在哪里？`</span>),\n]);\n<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(answer.<span class="hljs-property">content</span>);\n</code></pre>\n<h2>四、LCEL 标准工业写法（推荐项目使用）</h2>\n<p>LangChain 现代写法，用管道 <code>|</code> 组装RAG链，代码解耦，支持流式输出：</p>\n<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">ChatPromptTemplate</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@langchain/core/prompts&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">RunnablePassthrough</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@langchain/core/runnables&quot;</span>;\n<span class="hljs-keyword">import</span> { <span class="hljs-title class_">StringOutputParser</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;@langchain/core/output_parsers&quot;</span>;\n\n<span class="hljs-comment">// 格式化检索文档</span>\n<span class="hljs-keyword">const</span> <span class="hljs-title function_">formatDocs</span> = (<span class="hljs-params">docs</span>) =&gt; docs.<span class="hljs-title function_">map</span>(<span class="hljs-function">(<span class="hljs-params">d</span>) =&gt;</span> d.<span class="hljs-property">pageContent</span>).<span class="hljs-title function_">join</span>(<span class="hljs-string">&quot;\\n\\n&quot;</span>);\n\n<span class="hljs-keyword">const</span> prompt = <span class="hljs-title class_">ChatPromptTemplate</span>.<span class="hljs-title function_">fromTemplate</span>(<span class="hljs-string">`\n你是文档问答助手，只能根据下面上下文回答问题。\n上下文：{context}\n问题：{question}\n如果上下文没有相关信息，直接回答不知道，不要编造。\n`</span>);\n\n<span class="hljs-keyword">const</span> retriever = vectorStore.<span class="hljs-title function_">asRetriever</span>(<span class="hljs-number">1</span>);\n\n<span class="hljs-comment">// RAG链</span>\n<span class="hljs-keyword">const</span> ragChain =\n  <span class="hljs-title class_">RunnablePassthrough</span>.<span class="hljs-title function_">assign</span>({\n    <span class="hljs-attr">context</span>: <span class="hljs-title function_">async</span> (input) =&gt;\n      <span class="hljs-title function_">formatDocs</span>(<span class="hljs-keyword">await</span> retriever.<span class="hljs-title function_">invoke</span>(input.<span class="hljs-property">question</span>)),\n  }) |\n  prompt |\n  llm |\n  <span class="hljs-keyword">new</span> <span class="hljs-title class_">StringOutputParser</span>();\n\n<span class="hljs-comment">// 调用</span>\n<span class="hljs-keyword">const</span> res = <span class="hljs-keyword">await</span> ragChain.<span class="hljs-title function_">invoke</span>({ <span class="hljs-attr">question</span>: <span class="hljs-string">&quot;合一在哪里？&quot;</span> });\n</code></pre>\n<h2>五、关键概念区分（高频踩坑点）</h2>\n<ol>\n<li><strong>RAG ≠ 微调</strong>\n<ul>\n<li>RAG：外挂上下文，<strong>不改模型权重</strong>   ，新增文档只需要重新索引，成本低；</li>\n<li>微调：修改模型参数，训练成本高，新增文档要重新训练。</li>\n</ul>\n</li>\n<li><strong>检索质量决定RAG上限</strong><br>\n检索不到正确片段，模型再强也没用；召回了无关片段，模型会跟着胡说（幻觉）。\n调参重点：chunk大小、重叠度、top-k数量、相似度阈值。</li>\n<li>metadata 边界\nmetadata 不能用来做语义检索；只用于过滤检索、溯源、权限标记。\n你只把文字写在metadata、pageContent为空，向量检索搜不到。</li>\n<li>相似度分数\nMemoryVectorStore、Chroma 默认余弦相似度 <code>[0,1]</code>，越高越好；FAISS有些距离是L2距离，<strong>越小越好</strong>   ，不要写死阈值。</li>\n</ol>\n<h2>六、进阶RAG（Naive RAG的优化方向）</h2>\n<p>朴素RAG就是你现在这套；生产一般会叠加：</p>\n<ul>\n<li>查询改写：把用户问句改写、扩展，提升召回</li>\n<li>重排Rerank：召回多条之后，用重排模型重新排序，过滤噪声chunk</li>\n<li>父文档检索：存小块检索，返回大块原文，兼顾检索精度和上下文完整性</li>\n<li>多路检索：向量语义检索 + 关键词BM25混合检索（Hybrid Search）</li>\n<li>自检索Agent：模型自己判断要不要检索、检索几次（LangGraph）</li>\n</ul>\n<h2>七、常见问题排查清单</h2>\n<ol>\n<li>模型回答和知识库无关：prompt指令没约束，模型优先使用自身训练知识；</li>\n<li>明明文档存在，但是检索不到：chunk切太大、embedding模型不合适、问句语义偏差；</li>\n<li>答案胡编幻觉：召回了无关chunk、top-k太大混入噪声、没有相似度阈值过滤；</li>\n<li>重启程序知识库消失：用了 <code>MemoryVectorStore</code>，换成Chroma持久化。</li>\n</ol>\n</div>'</script></body></html>
